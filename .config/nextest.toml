# cargo-nextest configuration.
#
# The LSP e2e suite runs in one parallel pool (see .github/workflows/rust-lsp-e2e.yml).
# Two kinds of tests there are resource-hungry in a way that makes them starve
# their neighbours:
#
#   * semantic_tokens_reference_client::large_file_* — ~5200-line semantic-token
#     latency/refresh benchmarks that pin the CPU for tens of seconds and wait
#     on a real diagnostics/token-refresh round trip, and
#   * edit_tracking_stress::* — latency-sensitive stress tests that drive a burst
#     of incremental edits and then wait for the server's (guaranteed) final
#     diagnostics publish.
#
# Running these concurrently makes the whole suite slower for no benefit — each
# pins the CPU for tens of seconds — so they get a single-slot group and never
# run alongside each other; the hundreds of light tests still parallelise fully.
#
# This is a *scheduling* optimisation only. It is deliberately no longer load
# bearing for correctness: issue #1082 removed the tests' dependence on winning
# a wall-clock race, so they pass at default parallelism on a contended machine
# with or without this grouping (and with plain `cargo test`, which does not
# read this file at all). Their barriers now wait on explicit progress signals
# from the server and scale with measured machine capacity, and their genuine
# latency guarantees are asserted relative to that capacity rather than against
# an absolute — see the module docs in
# `rust/tcl-lsp-server/tests/e2e/semantic_tokens_reference_client.rs` and
# `rust/tcl-lsp-server/tests/e2e/common/mod.rs`. A timeout here is therefore a
# real signal again, not "the known CPU-starvation flake".
# The former `heavy-lsp-e2e = { max-threads = 1 }` group is gone: measured
# 2026-08-13 (this branch), the full lsp-e2e suite passes 1,949/1,949 with the
# group removed and runs 133 s (24 %) faster — the serial floor was the cost.
# The grouping stopped being load-bearing after issue #1082 (see the history
# above); the heaviest members are now `#[ignore]`d into the manual tier
# instead, which removes the contention at the source rather than scheduling
# around it.
[test-groups]
# Corpus sweeps already parallelise internally; cap how many run concurrently
# under `--run-ignored` so N sweeps don't each spawn a full rayon pool and
# thrash the box during `make test-exhaustive`.  Inert in normal runs — every
# member is #[ignore]d.
manual-corpus = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'binary(/_corpus$/) | binary(/differential_incremental/)'
test-group = 'manual-corpus'

# Smoke tier (`make smoke` / `make smoke-p P=<crate>`).
#
# The fast, per-module sanity check developers and agents run locally right
# after `cargo build`/`cargo check` — NOT a replacement for CI's deep suites.
# A test is "smoke" by naming convention, not by crate: a unit-test fn named
# `smoke_*` (or nested under `mod smoke`), or an integration binary named
# `smoke` / `*_smoke` (tcl-lsp-server's existing convention). Toolchains
# without nextest use scripts/dev/smoke-targets.tsv to invoke only the owning
# Cargo targets; scripts/dev/test-smoke-targets.sh prevents that list drifting.
#
# `default-filter` scopes what `--profile smoke` runs with no -E on the
# command line; a caller's -E still narrows further.
[profile.smoke]
default-filter = 'test(/(::|^)smoke/) | binary(/(^|_)smoke$/)'
# A smoke run is a quick green/red signal, not an exhaustive failure report.
fail-fast = true
status-level = "fail"
final-status-level = "flaky"

# Exhaustive / manual-only tier (`make test-exhaustive`).
#
# Never runs automatically.  Settings for the #[ignore]d corpus / fuzz /
# privileged tests (see docs/design/contracts/test-tiers-and-ci-gates.md)
# when a human explicitly
# opts in — this profile does not by itself run ignored tests; `make
# test-exhaustive` passes --run-ignored ignored-only explicitly.
[profile.exhaustive]
fail-fast = false
# Corpus sweeps carry internal watchdogs up to 10 minutes (e.g. tcl-spectcl's
# spec_corpus sweep); give nextest's own timeout headroom past them.
slow-timeout = { period = "60s", terminate-after = 15 }
