# Standalone workspace (empty [workspace] table) so this spike does NOT join the
# root tcl-lsp workspace -- it deliberately uses `unsafe` for the C ABI surface,
# which the root workspace forbids, and it builds for wasm32-wasip1 only.
[workspace]

[package]
name = "tcl-ext-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "Spike: compile an unmodified C Tcl extension to WASM against a minimal Rust runtime"

[[bin]]
name = "tcl_ext_spike"
path = "src/main.rs"

# No dependencies: build.rs shells out to clang directly, so `cargo build` needs
# no network access to crates.io.

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
