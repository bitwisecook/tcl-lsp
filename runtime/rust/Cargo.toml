# Rust port of the Tcl WASM runtime (Track 1 of the rust-runtime-port effort).
#
# Standalone crate, deliberately EXCLUDED from the root workspace
# (`/Cargo.toml`'s `exclude` list), for two reasons:
#
#   1. The obj/shared-memory layer is inherently `unsafe` (raw pointers over
#      one linear memory — see docs/design/runtime/c-extension-abi.md §9). The
#      root workspace sets `unsafe_code = "forbid"`; this crate must opt out,
#      so it does not inherit `[workspace.lints]`.
#   2. It eventually builds for wasm32 as a cdylib exporting `memory` + the
#      `Tcl_*` / `tcl_*` symbols. Keeping it out of `cargo test --workspace`
#      (which CI runs) means the Rust LSP/compiler workstream cannot regress
#      because of runtime-port churn. This mirrors the `editors/zed` exclusion.
#
# Gate: `make runtime-rust-test` runs the native `cargo test` here. The leak
# round-trip test is the T1.1 acceptance (zero residual under the alloc/free
# counters).
[package]
name = "tcl-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/bitwisecook/tcl-lsp"
description = "Rust port of the Tcl WASM runtime support library + interpreter fallback"
publish = false

[features]
# Embed the Tcl 9 standard library (`init.tcl`, `tcltest`, the package indices)
# in the binary and seed it into the WASM in-memory filesystem, so a
# self-contained `wasm32-wasip1` module bootstraps the real stdlib (`source`,
# `package require`) with no host filesystem. Off by default: only the
# standalone WASM build needs the ~250 KB of embedded Tcl.
wasm_stdlib = []

[dependencies]
tcl-lexer = { path = "../../rust/tcl-lexer" }
tcl-syntax = { path = "../../rust/tcl-syntax" }
# The shared portable command logic (string/… helpers over ValueOps). This
# crate implements `ValueOps` for `*mut TclObj` (see src/value_ops.rs) and
# adapts the helpers in its command handlers.
tcl-cmd-core = { path = "../../rust/tcl-cmd-core" }
# The Family-B interp-state contract (the role traits this runtime satisfies
# over its `*mut TclObj` value model, alongside the bytecode VM's `Rc<Obj>`).
tcl-runtime-api = { path = "../../rust/tcl-runtime-api" }
# The capability seam: the `Host` trait surface (filesystem/clock/env/stdio/…)
# this runtime reaches platform facilities through. Wasm32-clean (traits only,
# no syscalls), so it is an unconditional dependency on every target.
tcl-platform = { path = "../../rust/tcl-platform" }
# The pure-Rust Tcl 9 ARE engine — drives `regexp`/`regsub`/`lsearch -regexp`/
# `switch -regexp`. Replaces the C Henry-Spencer engine formerly compiled in by
# build.rs: it is safe Rust and wasm32-clean (no FFI), so regular expressions
# now work on every target (they were stubbed out on wasm before). The
# `cmd-core` feature provides the `RegexEngine` adapter the command layer uses;
# the C-ABI shim in `src/regex_capi.rs` re-exports the same engine to C.
tcl-regex = { path = "../../rust/tcl-regex", features = ["cmd-core"] }

# The std-backed `NativeHost` — the full-capability `Host` for native builds.
# It calls `std::fs`/`std::env`/`std::process`/`std::time`, so it is **not**
# wasm32-clean and must stay off the wasm targets (which use `WasiHost`/
# `BrowserHost` instead). Target-gated so a wasm32 build never pulls std I/O in.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tcl-host-native = { path = "../../rust/tcl-host-native" }

[lib]
name = "tcl_runtime"
# rlib for `cargo test`; cdylib/staticlib for the eventual whole-program link
# against compiled user code + C extensions (Track 3).
crate-type = ["rlib", "cdylib", "staticlib"]

[lints.rust]
# This crate is the one place raw-pointer `unsafe` over the shared linear
# memory is required and reviewed (§9). It does NOT inherit the workspace
# `unsafe_code = "forbid"` (it is not a workspace member).
unsafe_op_in_unsafe_fn = "warn"
