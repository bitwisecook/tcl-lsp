id = "tcl-lsp"
name = "Tcl LSP"
version = "2.2.2"
schema_version = 1
authors = ["tcl-lsp contributors"]
description = "Tcl, iRules, iApps, and TMSH language-server support via tcl-lsp"
repository = "https://github.com/bitwisecook/tcl-lsp"

[grammars.tcl]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-tcl"
rev = "8f11ac7206a54ed11210491cee1e0657e2962c47"

[language_servers.tcl-lsp]
name = "tcl-lsp"
languages = ["Tcl", "iRules", "iApps", "APL", "TMSH", "Expect"]

# Bridge Zed's language *names* to the `languageId` strings the server
# recognises in `dialect_from_language_id` / `dialect_for_open`. Without this
# Zed derives the id from the lowercased language name (e.g. `iRules` → `irules`),
# which the server does not recognise, so every non-Tcl buffer silently falls
# back to the default `tcl8.6` dialect. The right-hand ids match the VS Code
# extension's contributions (`tcl-irule`, `tcl-iapp`, `tcl-apl`, `tcl-bigip`,
# `tcl-expect`).
#
# `TMSH` maps to `tcl-bigip`, not to the `f5-tmsh` profile's `tcl-tmsh`, and
# that is deliberate: this language is backed by the *BIG-IP configuration*
# grammar (`grammars/tree-sitter-bigip`, with `languages/tmsh/injections.scm`
# re-parsing an `ltm rule` body as Tcl), which is the `f5-bigip` language, not
# the Tcl-script dialect the dialect catalog attaches to `.tmsh`. Routing this
# language to `tcl-tmsh` would analyse config files as tmsh scripts. Splitting
# it — a `BIG-IP` language on `.scf` plus a Tcl-grammar `tmsh` language on
# `.tmsh` — is the real fix and needs the query generator to grow a target, so
# the mapping stays as-is for now.
[language_servers.tcl-lsp.language_ids]
"Tcl" = "tcl"
"iRules" = "tcl-irule"
"iApps" = "tcl-iapp"
"APL" = "tcl-apl"
"TMSH" = "tcl-bigip"
"Expect" = "tcl-expect"

# The APL and BIG-IP grammars live in this repo (`grammars/tree-sitter-*`).
# Zed fetches a grammar from a git repository at a rev, so they are referenced
# from here by commit rather than vendored into the extension directory. Bump
# `rev` whenever either grammar changes — Zed caches by commit, so a stale rev
# silently keeps serving the old parser.
[grammars.apl]
repository = "https://github.com/bitwisecook/tcl-lsp"
rev = "21b44f1a0542a92d22a6564b0e68e1912ab95ed3"
path = "grammars/tree-sitter-apl"

[grammars.bigip]
repository = "https://github.com/bitwisecook/tcl-lsp"
rev = "21b44f1a0542a92d22a6564b0e68e1912ab95ed3"
path = "grammars/tree-sitter-bigip"
