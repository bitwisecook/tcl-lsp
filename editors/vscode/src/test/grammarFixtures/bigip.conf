# Marked-up grammar fixture for a BIG-IP config. Assertion lines are `#`
# comments, so this stays a valid config. See #903.
#
# A token at column 0 is asserted from column 1 — the `#` occupies column 0.

ltm pool /Common/api_pool {
#^^ keyword.control.bigip
#   ^^^^ keyword.other.bigip
#         ^^^^^^ entity.name.namespace.partition.bigip
#                ^^^^^^^^ entity.name.type.bigip
    members {
#   ^^^^^^^ variable.other.property.bigip
        /Common/10.0.0.1:80 {
#        ^^^^^^ entity.name.namespace.partition.bigip
#               ^^^^^^^^ constant.numeric.ip-address.bigip
#                        ^^ constant.numeric.port.bigip
        }
    }
# `monitor` takes an EXPRESSION, not just a reference: `default` / `none` /
# `M1 and M2` / `min N of { … }`. A plain `monitor <ref>` rule paints `min` as
# the monitor object. The server types the whole expression — the keywords and
# the count included — as `monitor`, so this does too (#905 review).
    monitor min 1 of { /Common/http_mon /Common/https_mon }
#   ^^^^^^^ variable.other.property.bigip
#           ^^^ entity.name.type.monitor.bigip
#               ^ entity.name.type.monitor.bigip
#                 ^^ entity.name.type.monitor.bigip
#                       ^^^^^^ entity.name.namespace.partition.bigip
#                              ^^^^^^^^ entity.name.type.monitor.bigip
#                                               ^^^^^^^^^ entity.name.type.monitor.bigip
}

ltm pool /Common/web_pool {
    monitor default
#   ^^^^^^^ variable.other.property.bigip
#           ^^^^^^^ entity.name.type.monitor.bigip
    monitor /Common/http_mon
#            ^^^^^^ entity.name.namespace.partition.bigip
#                   ^^^^^^^^ entity.name.type.monitor.bigip
}

# A property NAME is a `property` to the server, not a keyword — painting it
# `keyword.other` made it flip colour the moment semantic tokens arrived.
ltm virtual /Common/vs1 {
    pool /Common/api_pool
#   ^^^^ variable.other.property.bigip
#        ^^^^^^^^^^^^^^^^ entity.name.type.pool.bigip
    destination /Common/192.0.2.10:443
#                ^^^^^^ entity.name.namespace.partition.bigip
#                       ^^^^^^^^^^ constant.numeric.ip-address.bigip
#                                  ^^^ constant.numeric.port.bigip
    vlans { /Common/internal }
#   ^^^^^ variable.other.property.bigip
}

ltm rule /Common/my_rule {
#   ^^^^ keyword.control.bigip
when HTTP_REQUEST {
#^^^ keyword.control.tcl
    if { [HTTP::uri] starts_with "/api" } {
#   ^^ keyword.control.tcl
        pool /Common/api_pool
    }
}
}
