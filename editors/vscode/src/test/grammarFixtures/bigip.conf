# Marked-up grammar fixture for a BIG-IP config. Assertion lines are `#`
# comments, so this stays a valid config. See #903.

ltm pool /Common/api_pool {
#^^ keyword.control.bigip
#   ^^^^ keyword.other.bigip
#         ^^^^^^ entity.name.namespace.partition.bigip
#                ^^^^^^^^ entity.name.type.bigip
    members {
        /Common/10.0.0.1:80 {
#        ^^^^^^ entity.name.namespace.partition.bigip
#               ^^^^^^^^ constant.numeric.ip-address.bigip
#                        ^^ constant.numeric.port.bigip
        }
    }
    monitor /Common/http
#   ^^^^^^^ keyword.other.bigip
#           ^^^^^^^^^^^^ entity.name.type.monitor.bigip
}

ltm rule /Common/my_rule {
#   ^^^^ keyword.control.bigip
when HTTP_REQUEST {
#^^^ keyword.control.tcl
    if { [HTTP::uri] starts_with "/api" } {
#   ^^ keyword.control.tcl
        pool /Common/api_pool
    }
}
}
