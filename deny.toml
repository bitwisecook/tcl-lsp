# cargo-deny configuration.
#
# Run with `make rust-deny` (or `cargo deny --all-features check` directly).
# The four checks below run in order; any one failing fails the whole audit.

[graph]
# Audit all targets the workspace can build for.  Adding a platform here
# pulls its target-specific dependency graph into the audit.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "wasm32-unknown-unknown" },
    { triple = "wasm32-wasip1" },
    { triple = "wasm32-wasip2" },
]
all-features = true

# --------------------------------------------------------------------
# 1. Security advisories (RustSec) — block anything with a known CVE.
# --------------------------------------------------------------------
[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # RUSTSEC-2023-0071 — Marvin timing side-channel in the `rsa` crate. No
    # fixed version exists (a constant-time rewrite is still in progress). It is
    # pulled only transitively, via `russh`'s RSA host-key support in the
    # `f5-cli` / `tcl-mcp` SSH fetch transport. The attack requires an adversary
    # to observe the timing of an RSA *private-key* operation over the network;
    # our SSH transport is a password-authenticated client that performs no RSA
    # private-key signing, so the leak is not reachable here. Revisit when the
    # `rsa` crate ships a constant-time release.
    "RUSTSEC-2023-0071",
]

# --------------------------------------------------------------------
# 2. License policy.  The workspace itself is AGPL-3.0-or-later, so
#    dependencies can be more permissive but not actively incompatible.
# --------------------------------------------------------------------
[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
    # The workspace itself is AGPL — internal crates land here.
    "AGPL-3.0-or-later",
    # The Zed marketplace extension is distributed separately under GPLv3.
    "GPL-3.0-or-later",
    # OpenSSL is sometimes pulled in transitively (LibreSSL flavour ok).
    "OpenSSL",
    # `tower-lsp-server`'s `ls-types` pulls `borrow-or-share` under MIT-0
    # (MIT No Attribution) — a strictly more permissive MIT.
    "MIT-0",
    # `ureq`'s `webpki-roots` ships the Mozilla CA set under the permissive
    # Community Data License Agreement (data, not code).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
exceptions = []

# Some crates ship an SPDX expression we can't auto-evaluate (e.g.
# `ring` uses ISC AND MIT AND OpenSSL).  List clarifications here if
# they come up — leaving empty until an audit surfaces one.
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# --------------------------------------------------------------------
# 3. Banned / required crates and duplicate-version policy.
# --------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates are referenced by `path` with no version, which
# `wildcards = "deny"` would otherwise reject — only published wildcard versions
# are a real hazard.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Crates we never want to see (security history, abandoned, replaced).
deny = []

# Crates that are intentionally allowed to appear multiple times.
# pyo3 / tokio / etc. ecosystems frequently pull in old + new of the
# same crate; bump to warn-only for now and only `deny` when the
# divergence becomes actionable.
skip = []
skip-tree = []

# --------------------------------------------------------------------
# 4. Source allowlist — block crates from unexpected registries / git
#    refs.  crates.io is the only allowed source for now.
# --------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
