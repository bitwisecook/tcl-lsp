# Workspace manifest for the Rust side of tcl-lsp.
#
# This is the first step of an incremental Python-to-Rust migration. See
# `docs/rust-rewrite.md` for the chunking strategy and the
# "binding layer owns Python compatibility" rule.
#
# Layout:
#
#   rust/tcl-lexer/     Pure Rust lexer crate (no pyo3 dependency).
#                       Uses borrowed `&str`, `thiserror`, iterators, enums.
#                       Reusable by any downstream Rust consumer.
#
#   rust/tcl-lsp-core/   Pure Rust LSP feature providers (folding, symbols,
#                        diagnostics projection). No pyo3 dependency.
#                        The eventual native LSP server links against this.
#
#   rust/tcl-bigip/      Faithful port of the F5 BIG-IP object model + config
#                        parser (dialects/f5/bigip). Value types, 169 model
#                        structs, the parse_bigip_conf driver + dispatch, and
#                        a canonical-JSON bridge the f5 command consumes via
#                        PyO3. No pyo3 dependency itself.
#
#   rust/tcl-lsp-server/ Native LSP server binary built on tower-lsp.
#                        Links tcl-lsp-core / tcl-compiler / tcl-registry.
#                        No pyo3 dependency.
#
# `editors/zed/` is a pre-existing standalone cdylib targeting wasm32-wasip2;
# it is intentionally excluded from this workspace so it continues to build
# with its own resolver and lockfile.

[workspace]
resolver = "2"
members = [
    "rust/tcl-version",
    "rust/tcl-core-types",
    "rust/tcl-dialect",
    "rust/tcl-test-support",
    "rust/tcl-lexer",
    "rust/tcl-syntax",
    "rust/tcl-platform",
    "rust/tcl-userdirs",
    "rust/tcl-host-native",
    "rust/tcl-cmd-core",
    "rust/tcl-bytecode",
    "rust/tcl-runtime-api",
    "rust/tcl-registry",
    "rust/tcl-spectcl",
    "rust/tcl-sslictcl",
    "rust/tcl-regex",
    "rust/tcl-compiler",
    "rust/tcl-diagram",
    "rust/tcl-vm",
    "rust/tcl-vm-cli",
    "rust/tcl-engine-api",
    "rust/tcl-engine-tclvm",
    "rust/tcl-spec-hooks",
    "rust/tcl-cshim",
    "rust/bpf-tcl-ir",
    "rust/bpf-tcl-codegen",
    "rust/bpf-tcl",
    "rust/tcl-bigip",
    "rust/tcl-bigip-io",
    "rust/tcl-bigip-query",
    "rust/bigip-report-gen/rust",
    "rust/tcl-f5mku",
    "rust/tcl-irules",
    "rust/tcl-lsp-core",
    "rust/tcl-lsp-db",
    "rust/tcl-lsp-server",
    "rust/tcl-explorer",
    "rust/tcl-spec-studio",
    "rust/tcl-cli-support",
    "rust/tcl-cli",
    "rust/tcl-pkg",
    "rust/tcl-sandbox",
    "rust/tcl-mcp",
    "rust/f5-cli",
    "rust/f5-xc",
    "rust/tcl-fuzz",
    "rust/tcl-irule-test",
    "rust/tcl-debugger",
    "rust/xtask",
]
exclude = [
    "editors/zed",
    # PyO3 bindings for the BIG-IP query engine (built with maturin, not cargo).
    # Excluded for the same reason as `editors/zed`: PyO3's generated glue trips
    # the workspace `unsafe_code = "forbid"` lint, and the cdylib links
    # libpython, which the rest of the workspace must not require. See
    # `rust/bigip-report-gen/python/` and the `f5report` Python package it backs.
    "rust/bigip-report-gen/python",
    # wasm32 build of the query engine for the report's in-browser console.
    # Excluded for the same reasons as bigip-query-py: wasm-bindgen glue needs
    # `unsafe`, and it targets wasm32 with its own lockfile.
    "rust/bigip-query-wasm",
    # wasm32 build of the BIG-IP report generator (upload a UCS/SCF → standalone
    # HTML report, entirely in-browser). Excluded for the same reasons as
    # bigip-query-wasm: wasm-bindgen glue needs `unsafe`, targets wasm32.
    "rust/bigip-report-gen/wasm",
    # The compiler-explorer WASM facade is a cdylib for wasm32-unknown-unknown;
    # wasm-bindgen's generated glue needs `unsafe`, which the workspace
    # `unsafe_code = "forbid"` lint bans. Built via `make explorer-wasm`.
    "rust/tcl-explorer-wasm",
    # The command-registry spec studio's WASM facade is a cdylib for
    # wasm32-unknown-unknown; wasm-bindgen's generated glue needs `unsafe`,
    # which the workspace `unsafe_code = "forbid"` lint bans. Built via
    # `make spec-studio-wasm`; see the Makefile.
    "rust/tcl-spec-studio-wasm",
    # The browser transport for the real LSP server — a cdylib for
    # wasm32-unknown-unknown that drives `LspService<Backend>` over
    # `postMessage` from a Web Worker, the way `main.rs` drives it over stdio.
    # wasm-bindgen's generated glue needs `unsafe`, which the workspace
    # `unsafe_code = "forbid"` lint bans. Built via `make lsp-server-wasm`.
    "rust/tcl-lsp-server-wasm",
    # The WASI transport for the real LSP server — a wasm32-wasip1 command that
    # drives the same `LspService<Backend>` over Content-Length-framed stdio,
    # for hosts like `@vscode/wasm-wasi-lsp`. Excluded for the same reasons as
    # the browser transport: its `poll_oneoff` readiness wait needs one `unsafe`
    # call, which the workspace `unsafe_code = "forbid"` lint bans, and it
    # targets wasm32 with its own lockfile. Built via `make lsp-server-wasi`.
    "rust/tcl-lsp-server-wasi",
    # The Rust runtime port (runtime/rust/) is a standalone crate: it requires
    # raw-pointer `unsafe` over the shared linear memory (c-extension-abi.md §9),
    # so it cannot inherit the workspace `unsafe_code = "forbid"` lint, and it
    # eventually targets wasm32 as a cdylib. Kept out of `cargo test --workspace`
    # so the LSP/compiler workstream cannot regress on runtime-port churn.
    # Gated separately via `make runtime-rust-test`.
    "runtime/rust",
    # CI gate that compiles the vendored tree-sitter-tcl grammar (C) and
    # validates the generated Zed highlight queries against it. Standalone (its
    # own [workspace] + tree-sitter dep) so the grammar's C build and
    # tree-sitter never enter the workspace graph / cargo-deny / clippy.
    # Gated separately via `make zed-query-check`.
    "rust/zed-query-check",
    # The bytecode VM built as a wasm32-unknown-unknown cdylib — the VM+compiler
    # statically linked, exporting an `eval` entry that runs Tcl (incl.
    # coroutines) with no imports/WASI. This is the primary wasm compile target.
    # Excluded like the other wasm32 cdylibs: the C-ABI export
    # shims need `unsafe` (banned by the workspace `unsafe_code = "forbid"`), and
    # it targets wasm32 with its own profile. Built via `make tcl-vm-wasm`.
    "rust/tcl-vm-wasm",
]

[workspace.package]
publish = false
version = "0.1.0"
edition = "2024"
# 2024 is the current Rust edition (editions ship ~every 3 years: 2015 / 2018 /
# 2021 / 2024). MSRV tracks the toolchain the workspace is built and tested
# against — the floating `stable` pinned by rust-toolchain.toml — so it bumps
# whenever stable does. Current stable is 1.98.0, released 2026-08-18.
# (≥ 1.85 was already required for salsa 0.28 / tcl-lsp-db and the runtime/rust
# port's is_none_or.)
#
# Because CI resolves `stable` at run time, a new release can start failing
# pr-gate's `cargo clippy -D warnings` on untouched code the day it lands: 1.98
# widened `redundant_closure_for_method_calls`. `rustup update` before
# debugging a clippy failure you cannot reproduce locally.
rust-version = "1.98"
license = "AGPL-3.0-or-later"
repository = "https://github.com/bitwisecook/tcl-lsp"
authors = ["tcl-lsp contributors"]

[workspace.dependencies]
# Non-cryptographic FxHash maps/sets (rustc's hasher). Used in the
# per-keystroke HOT analysis/fixpoint/per-request paths in tcl-compiler,
# tcl-registry, and tcl-lsp-core to avoid the default SipHash cost. See
# PR #693 / AQ §D1 (O10).
rustc-hash = "2"

# Serialization shared by data-driven subsystems.  Individual crates select
# only the features they need.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# xxHash (XXH3) — the "xxhash-class" non-cryptographic digest the SpecTcl
# compiled-pack cache keys on (docs/design/spec-packs.md). Zero dependencies,
# no_std; chosen over the already-present FxHash because this digest keys
# *file contents* on disk, where FxHash's short-key-tuned quality is not
# good enough, and over the already-present sha2 because the whole point of
# the cache is to beat a 4ms parse.
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[workspace.lints.rust]
unsafe_code = "forbid"
# The #1657 taskdump evidence hook is gated on cfgs set only by local evidence
# builds (RUSTFLAGS="--cfg tokio_unstable --cfg tokio_taskdump"); declared so
# ordinary builds do not warn on the gate.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)", "cfg(tokio_taskdump)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Not useful in this codebase:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

# CI-only server build for the VS Code extension suite: release-grade
# optimisation without thin LTO / single codegen unit, which cost ~3 minutes
# of link time per CI run for a binary that only needs to be functionally
# fast, not shipping-grade.  Shipping binaries (build-server-matrix, local
# `make rust-server`) stay on the real release profile above.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16

# Test builds keep only line tables (panic backtraces still resolve), not full
# debuginfo — this roughly halves compile+link time and shrinks the nextest
# archive that CI ships between the build and partitioned-test jobs.
[profile.test]
debug = "line-tables-only"

# Decompression and crypto are 20-50x slower unoptimised, and the UCS-archive
# tests (tcl-bigip-io, bigip-report-gen) gunzip + KDF real fixtures on every
# run — measured ~157 s of dev-profile test time spent inside these three
# crates' hot loops.  Optimising just them barely moves compile time.
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
