# Workspace manifest for the Rust side of tcl-lsp.
#
# This is the first step of an incremental Python-to-Rust migration. See
# `docs/rust-rewrite.md` for the chunking strategy and the
# "binding layer owns Python compatibility" rule.
#
# Layout:
#
#   rust/tcl-lexer/     Pure Rust lexer crate (no pyo3 dependency).
#                       Uses borrowed `&str`, `thiserror`, iterators, enums.
#                       Reusable by any downstream Rust consumer.
#
#   rust/tcl-lsp-core/   Pure Rust LSP feature providers (folding, symbols,
#                        diagnostics projection). No pyo3 dependency.
#                        The eventual native LSP server links against this.
#
#   rust/tcl-bigip/      Faithful port of the F5 BIG-IP object model + config
#                        parser (dialects/f5/bigip). Value types, 169 model
#                        structs, the parse_bigip_conf driver + dispatch, and
#                        a canonical-JSON bridge the f5 command consumes via
#                        PyO3. No pyo3 dependency itself.
#
#   rust/tcl-lsp-server/ Native LSP server binary built on tower-lsp.
#                        Links tcl-lsp-core / tcl-compiler / tcl-registry.
#                        No pyo3 dependency.
#
# `editors/zed/` is a pre-existing standalone cdylib targeting wasm32-wasip2;
# it is intentionally excluded from this workspace so it continues to build
# with its own resolver and lockfile.

[workspace]
resolver = "2"
members = [
    "rust/compiler/tcl-core-types",
    "rust/compiler/tcl-lexer",
    "rust/compiler/tcl-syntax",
    "rust/runtime/tcl-platform",
    "rust/runtime/tcl-host-native",
    "rust/registry/tcl-cmd-core",
    "rust/compiler/tcl-bytecode",
    "rust/runtime/tcl-runtime-api",
    "rust/registry/tcl-registry",
    "rust/compiler/tcl-regex",
    "rust/compiler/tcl-compiler",
    "rust/compiler/tcl-diagram",
    "rust/runtime/tcl-vm",
    "rust/runtime/tcl-vm-cli",
    "rust/runtime/bpf-tcl-ir",
    "rust/runtime/bpf-tcl-codegen",
    "rust/runtime/bpf-tcl",
    "rust/bigip/tcl-bigip",
    "rust/bigip/tcl-bigip-io",
    "rust/bigip/tcl-bigip-query",
    "rust/bigip/report/rust",
    "rust/bigip/tcl-f5mku",
    "rust/registry/tcl-irules",
    "rust/lsp/tcl-lsp-core",
    "rust/lsp/tcl-lsp-db",
    "rust/lsp/tcl-lsp-server",
    "rust/tools/tcl-explorer",
    "rust/tools/tcl-cli-support",
    "rust/tools/tcl-cli",
    "rust/tools/tcl-pkg",
    "rust/runtime/tcl-sandbox",
    "rust/tools/tcl-mcp",
    "rust/tools/f5-cli",
    "rust/bigip/f5-xc",
    "rust/tools/tcl-fuzz",
    "rust/tools/tcl-irule-test",
    "rust/tools/tcl-debugger",
    "rust/xtask",
]
exclude = [
    "editors/zed",
    # PyO3 bindings for the BIG-IP query engine (built with maturin, not cargo).
    # Excluded for the same reason as `editors/zed`: PyO3's generated glue trips
    # the workspace `unsafe_code = "forbid"` lint, and the cdylib links
    # libpython, which the rest of the workspace must not require. See
    # `rust/bigip-report/py/` and the `f5report` Python package it backs.
    "rust/bigip/report/py",
    # wasm32 build of the query engine for the report's in-browser console.
    # Excluded for the same reasons as bigip-query-py: wasm-bindgen glue needs
    # `unsafe`, and it targets wasm32 with its own lockfile.
    "rust/wasm/bigip-query-wasm",
    # wasm32 build of the BIG-IP report generator (upload a UCS/SCF → standalone
    # HTML report, entirely in-browser). Excluded for the same reasons as
    # bigip-query-wasm: wasm-bindgen glue needs `unsafe`, targets wasm32.
    "rust/wasm/bigip-report-wasm",
    # The compiler-explorer WASM facade is a cdylib for wasm32-unknown-unknown;
    # wasm-bindgen's generated glue needs `unsafe`, which the workspace
    # `unsafe_code = "forbid"` lint bans. Built via `make explorer-wasm`.
    "rust/wasm/tcl-explorer-wasm",
    # The Rust runtime port (runtime/rust/) is a standalone crate: it requires
    # raw-pointer `unsafe` over the shared linear memory (c-extension-abi.md §9),
    # so it cannot inherit the workspace `unsafe_code = "forbid"` lint, and it
    # eventually targets wasm32 as a cdylib. Kept out of `cargo test --workspace`
    # so the LSP/compiler workstream cannot regress on runtime-port churn.
    # Gated separately via `make runtime-rust-test`. See
    # docs/design/runtime/rust-runtime-port.md (T1.1).
    "runtime/rust",
]

[workspace.package]
publish = false
version = "0.1.0"
edition = "2024"
# 2024 is the current Rust edition (editions ship ~every 3 years: 2015 / 2018 /
# 2021 / 2024). MSRV tracks the toolchain the workspace is built/tested against
# (rustc 1.96); ≥ 1.85 was already required for salsa 0.26 / tcl-lsp-db and the
# runtime/rust port's is_none_or.
rust-version = "1.96"
license = "AGPL-3.0-or-later"
repository = "https://github.com/bitwisecook/tcl-lsp"
authors = ["tcl-lsp contributors"]

[workspace.dependencies]
# Non-cryptographic FxHash maps/sets (rustc's hasher). Used in the
# per-keystroke HOT analysis/fixpoint/per-request paths in tcl-compiler,
# tcl-registry, and tcl-lsp-core to avoid the default SipHash cost. See
# PR #693 / AQ §D1 (O10).
rustc-hash = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Not useful in this codebase:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

# Test builds keep only line tables (panic backtraces still resolve), not full
# debuginfo — this roughly halves compile+link time and shrinks the nextest
# archive that CI ships between the build and partitioned-test jobs.
[profile.test]
debug = "line-tables-only"
