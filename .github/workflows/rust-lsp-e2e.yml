name: rust-lsp-e2e

# Native-server lsp_e2e status board for the `rust` branch during the
# Python→Rust rewrite.
#
# Split out from `rust-gate.yml` (the cargo checks) deliberately: this surface
# builds a release `tcl-lsp-server` and drives the backend-neutral lsp_e2e
# Python suite against it (TCL_LSP_SERVER_KIND=rust) — a different, slower
# surface than `cargo test`, so it reports as its own independent check rather
# than being coupled to the cargo checks.  `make test-rust` runs both locally;
# CI keeps them separate.
#
# INFORMATIONAL, not a merge gate (the rust server is still being brought to
# parity); deliberately NOT a required status check.  `main`'s pipeline is
# ci.yml; this lives on `rust` only.

on:
  pull_request:
    branches: [rust]
  push:
    branches: [rust]

concurrency:
  group: rust-lsp-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lsp-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-build

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Build only the server binary the suite drives (release, matching
      # `make rust-server`).
      - name: Build native tcl-lsp-server
        run: make rust-server

      - name: lsp_e2e against the native Rust server
        env:
          TCL_LSP_SERVER_KIND: rust
          TCL_LSP_SERVER_BIN: ${{ github.workspace }}/target/release/tcl-lsp-server
        run: uv run --extra dev pytest tests/lsp_e2e/ -q -p no:cacheprovider
