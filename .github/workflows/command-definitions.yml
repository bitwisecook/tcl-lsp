name: Command definitions

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [work]
  pull_request:
    paths:
      - 'rust/**'
      - 'specs/**'
      - 'docs/work/name-handling/handover/oo-dispatch-probe/definitions/**'
      - 'scripts/dev/**'
      - '.github/workflows/command-definitions.yml'

permissions:
  contents: read

jobs:
  command-definition-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_TEST_OPT_LEVEL: 1
      TCL_LSP_TCL_BIN_DIR: ${{ runner.temp }}/definition-tcl-bin
      TCL_LSP_JIM_ROOT: ${{ runner.temp }}/definition-jim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
      - name: Install X11 headers and virtual display
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxss-dev libxrender-dev libxft-dev libharfbuzz-dev xvfb xauth
      - name: Cache pinned references
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tmp/tcl*
            tmp/tk*
            ${{ runner.temp }}/definition-jim
          key: ${{ runner.os }}-definition-oracles-${{ hashFiles('rust/tcl-dialect/data/reference-toolchains.tsv', 'rust/tcl-test-support/jim-reference.txt', 'scripts/dev/run-definition-oracles.sh') }}
      - name: Check the command definition matrix
        run: bash scripts/dev/run-definition-oracles.sh
      - name: Upload definition and usage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: command-definition-oracles
          path: tmp/command-definitions/**/*.tsv
          if-no-files-found: ignore
