name: CodeQL

# Static-analysis for the languages whose source ships in this repo and
# runs on user machines: Python (the BIG-IP report generator and its
# `.pyz`, plus the Sublime Text plugin — the LSP server itself is Rust
# now) and TypeScript (VS Code extension).  CodeQL's `actions` query pack
# also lints the workflows themselves, catching expression-injection and
# similar mistakes before they reach rust.
#
# Rust (editors/zed) is intentionally excluded.  CodeQL Rust support is
# still maturing, and the extension cross-compiles to `wasm32-wasip2`
# (a target the CodeQL build-mode `manual`/`autobuild` paths don't
# capture cleanly).  The extension itself is ~100 lines of glue around
# `zed_extension_api`, with a small attack surface; the cost-benefit
# of fighting CodeQL Rust's wasm-target handling isn't there yet.
# Revisit when CodeQL Rust supports `build-mode: none` GA.
#
# Triggers:
#   - schedule: the weekly scan is the cadence we rely on.  It re-analyses
#     trunk and picks up newly-published advisories against dependencies
#     that haven't otherwise changed.  CodeQL is intentionally NOT part of
#     the release process: releases are tag-only (see `scripts/release/tag.sh`)
#     and the release skill (`.claude/skills/release/SKILL.md`) no longer
#     gates on a per-commit CodeQL run.
#   - workflow_dispatch: lets a maintainer force a re-run on the current
#     HEAD between weekly scans (e.g. after landing a security fix).
on:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write   # upload SARIF to the Security tab
      packages: read           # CodeQL reads container packages metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality
          # py/ineffectual-statement flags every ``...`` as a statement with no
          # effect.  ``...`` is the idiomatic stub body (PEP 8 / typeshed) and
          # the repo uses it in ~220 ``if TYPE_CHECKING:`` mixin forward-decls;
          # the rule is a recommendation-severity style check that is pure noise
          # here, so exclude it rather than contort idiomatic stubs into ``pass``.
          config: |
            query-filters:
              - exclude:
                  id: py/ineffectual-statement

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:${{ matrix.language }}
