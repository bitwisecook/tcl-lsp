name: CI

on:
  push:
    branches: [rust]
    tags: ["v*"]
  pull_request:
    branches: [rust]
  # Manual escape hatch: if a PR's initial `pull_request: opened` webhook
  # is ever dropped by GitHub (rare, but has happened — no runs show up
  # for the branch at all, not even a queued/pending one), this lets a
  # maintainer kick off the same CI graph from the Actions tab instead of
  # having to push a throwaway commit just to re-send the event.
  #
  # NOTE: workflow_dispatch lets you pick any ref, tags included. Release and
  # publish jobs are gated on `startsWith(github.ref, 'refs/tags/v')`; the one
  # branch exception is an explicit read-only native-build proof that uploads
  # only one-day workflow artifacts. Dispatching against a `v*` tag re-runs
  # create-release and the marketplace publishes. Dispatch against a branch
  # unless you mean that.
  workflow_dispatch:
    inputs:
      rust_tests_runner:
        description: Runner for the broad Rust suite
        required: true
        default: tank
        type: choice
        options:
          - tank
          - hosted
      native_release_build_proof:
        description: Build the feature-isolated native release matrix without publishing
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.native_release_build_proof && !startsWith(github.ref, 'refs/tags/v') && 'native-release-proof' || 'ordinary' }}-${{ github.ref }}
  cancel-in-progress: true

# The repo's own build-hygiene contract (scripts/dev/agent-build-env.sh):
# incremental compilation off (useless for one-shot CI builds, bloats the
# Swatinem cache), and no debuginfo for dev-profile DEPENDENCY rlibs — the
# root Cargo.toml's [profile.test] line-tables-only only covers test targets.
# Measured: a full --all-features --tests target dir shrinks >3x (30 GB+ →
# 9.4 GB), with correspondingly faster cache save/restore and link steps.
# Harmless for the release/ci-profile build jobs (release is non-incremental
# by default and doesn't read CARGO_PROFILE_DEV_DEBUG).
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

# Least-privilege default for every job: read-only.  Jobs that need to
# write to the repo (releases, artefact uploads, attestations) escalate
# explicitly in their own `permissions:` block.  A compromised step in
# `pr-gate` / `test-ext` therefore cannot push commits or
# create releases even if the repo-level default is "Read and write".
permissions:
  contents: read

jobs:
  # Preflight facts.  Every expensive job step-skips on these outputs; the jobs
  # themselves always run and report success, so required status checks and the
  # tag-triggered release graph stay unbroken (GitHub's success() propagates a
  # skipped ancestor through the needs graph, so job-level skips are banned —
  # step-level only).
  #
  #   prerelease     — does this ref belong to the pre-release (odd-minor 2.x,
  #                    "rust") line?  scripts/release/prerelease.sh is the
  #                    single source of truth, so the test gate, the GitHub
  #                    Release, and the Marketplace publish all agree on the
  #                    channel from the tag alone.
  #   already_green  — this exact code already passed this workflow, verified
  #                    against the Actions API.  Fail-safe: any API error, no
  #                    match, or a match older than 24 h → false → full run.
  #                    True in exactly these shapes:
  #                      * a v* tag whose commit has a green push run on
  #                        rust — the release flow (make release-tag) tags
  #                        an already-green tip, so the tag-time re-test was
  #                        pure repetition (measured: v2.1.18 re-ran the
  #                        identical 20-job surface on the same SHA 74 minutes
  #                        after it went green);
  #                      * a v* tag or push to rust whose commit has exactly
  #                        one merged PR association onto rust, whose PR head
  #                        has the identical Git tree, and whose PR run is
  #                        green within 24 h. The release-tag fallback covers
  #                        the race where the rust push run has not completed
  #                        yet.
  #                    The 24 h bound stops the skip compounding into stale
  #                    territory: the floating `stable` toolchain and the
  #                    advisory database both move under an unchanged tree, so
  #                    last week's green must not stand in for today's.
  #                    cargo-deny ignores this output entirely — the
  #                    supply-chain audit re-runs at every release point
  #                    because a new advisory can arrive against an unchanged
  #                    dependency tree, and it costs under a minute.
  #   python_changed / ext_changed / docs_only — changed-path facts for this
  #                    event (fail-safe: detection failure, a >300-file
  #                    compare, or a tag ref → everything counts as changed),
  #                    so jobs whose input surface didn't change stop
  #                    re-testing it on every PR. Python includes the complete
  #                    locked local dependency closure of its native engine.
  #   lsp_wasm_changed — a wasm LSP transport (browser or WASI) or one of the
  #                    transitive local dependencies they share changed.  This
  #                    keeps the two expensive real wasm builds and their
  #                    scripted LSP sessions targeted, while failing safe when
  #                    path detection is ambiguous.  Both transports sit on the
  #                    same `tcl-lsp-server` closure, so one flag gates both.
  #   wasm_cc_changed — a wasm32-unknown-unknown crate or the shared compiler
  #                    bootstrap changed. It gates the macOS-only proof that a
  #                    clean stock runner provisions a capable C compiler.
  #   spectcl_compat_changed — SpecTcl or its TclVM/compiler/registry/runtime
  #                    and exact-reference-toolchain closure changed. Runs the
  #                    non-vacuous 15+3+4+2+1 compatibility lane.
  #   runtime_rust_changed — the standalone `runtime/rust` crate, its Tcl 9
  #                    smoke corpus, or one of the path dependencies its own
  #                    cargo workspace resolves changed, so
  #                    `runtime-rust-tests` must execute that crate's suite.
  #                    `runtime/rust` is NOT a member of
  #                    the root workspace: `cargo test --workspace` never runs
  #                    those tests, and `wasm-real-link` builds and links the
  #                    crate without running a single one of them, so before
  #                    this flag existed a standalone-runtime semantic
  #                    regression could land with every partition green.
  #                    The closure lives in
  #                    scripts/dev/runtime-rust-path.sh and is gated against
  #                    the committed lockfile by
  #                    scripts/dev/test-runtime-rust-paths.sh, so it cannot
  #                    silently narrow.
  #   web_frontends_changed — the shared BIG-IP report front-end or the spec
  #                    studio web app changed, so `web-frontends` must install
  #                    and check them.  Those two npm roots are NOT covered by
  #                    `ext_changed`'s jobs, which only ever install
  #                    `editors/vscode`; until this flag existed nothing on a
  #                    pull request resolved their dependency trees at all, and
  #                    the only workflow that does (github-pages.yml) runs on
  #                    push to `rust`, never on a PR.  A broken bump therefore
  #                    merged green and took the Pages deploy down afterwards.
  #   runner_policy_changed — the self-hosted runner policy, dependency-update
  #                    policy, or the scheduling contract test changed. Such
  #                    PRs prove themselves on an isolated GitHub-hosted runner;
  #                    an unreviewed policy edit must not execute new dependency
  #                    code on, overload, or strand the protected host.
  #   rust_tests_changed — the committed root Rust-test closure (nextest plus
  #                    the full workspace doctest command) or one of its
  #                    build/test inputs changed. Missing/ambiguous changed-file
  #                    data fails closed to true.
  #   lsp_e2e_changed — the committed `tcl-lsp-server --all-features`
  #                    archive closure or a direct e2e fixture changed. The
  #                    required aggregate still runs; only archive production,
  #                    partition execution, and proof transfer step-skip when
  #                    the closure is demonstrably unaffected.
  channel:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # query prior workflow runs for already_green
      pull-requests: read # resolve a squash commit back to its PR head
    outputs:
      prerelease: ${{ steps.detect.outputs.prerelease }}
      already_green: ${{ steps.green.outputs.already_green }}
      python_changed: ${{ steps.paths.outputs.python_changed }}
      ext_changed: ${{ steps.paths.outputs.ext_changed }}
      lsp_wasm_changed: ${{ steps.paths.outputs.lsp_wasm_changed }}
      wasm_cc_changed: ${{ steps.paths.outputs.wasm_cc_changed }}
      spectcl_compat_changed: ${{ steps.paths.outputs.spectcl_compat_changed }}
      runtime_rust_changed: ${{ steps.paths.outputs.runtime_rust_changed }}
      web_frontends_changed: ${{ steps.paths.outputs.web_frontends_changed }}
      runner_policy_changed: ${{ steps.paths.outputs.runner_policy_changed }}
      rust_tests_runner: ${{ steps.rust-runner.outputs.runner }}
      rust_tests_changed: ${{ steps.paths.outputs.rust_tests_changed }}
      lsp_e2e_changed: ${{ steps.paths.outputs.lsp_e2e_changed }}
      docs_only: ${{ steps.paths.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Depth 2 so a two-parent merge commit's PR parent resolves locally.
          # Squash PR heads are resolved through the API below.
          fetch-depth: 2
      - name: Detect release channel from the ref
        id: detect
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            prerelease="$(bash scripts/release/prerelease.sh "$tag")"
          else
            prerelease="false"
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "channel: $GITHUB_REF -> prerelease=$prerelease"

      - name: Check whether this exact code is already green
        id: green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Green-result reuse is only for a protected-branch merge push or a
          # release tag. A pull request must not execute its checkout's helper
          # to decide whether its own required tests run.
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo 'already_green=false' >> "$GITHUB_OUTPUT"
            echo 'already_green=false (pull requests cannot reuse results)'
          else
            # The helper is covered by scripts/dev/test-already-green.sh and
            # fails closed on every local Git, API, and schema error.
            bash scripts/dev/already-green.sh
          fi

      - name: Classify changed paths
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          ok=true
          files=""
          changed_paths=scripts/dev/changed-paths.sh
          rust_tests_path=scripts/dev/rust-tests-path.sh
          lsp_e2e_path=scripts/dev/lsp-e2e-path.sh
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # The PR checkout is deliberately not trusted to decide whether
            # its own root tests run. Read the parser and closure from the
            # exact base commit; any shallow/missing object or missing helper
            # fails closed below. The merge checkout has both parents at
            # fetch-depth 2.
            trusted="$RUNNER_TEMP/root-rust-test-classifier"
            mkdir -p "$trusted"
            if [[ ${#BASE_SHA} -ne 40 || "$BASE_SHA" == *[!0-9a-f]* ]]; then
              ok=false
            fi
            if [[ "$ok" == "true" ]]; then
              for path in \
                scripts/dev/changed-paths.sh \
                scripts/dev/python-ci-path.sh \
                scripts/dev/python-engine-package-paths.txt \
                scripts/dev/rust-tests-path.sh \
                scripts/dev/rust-tests-package-paths.txt \
                scripts/dev/rust-tests-input-paths.txt \
                scripts/dev/lsp-e2e-path.sh \
                scripts/dev/lsp-e2e-package-paths.txt \
                scripts/dev/lsp-e2e-input-paths.txt; do
                if ! git show "$BASE_SHA:$path" >"$trusted/${path##*/}"; then
                  ok=false
                  break
                fi
              done
            fi
            if [[ "$ok" == "true" ]]; then
              chmod +x "$trusted/changed-paths.sh" "$trusted/python-ci-path.sh" "$trusted/rust-tests-path.sh" "$trusted/lsp-e2e-path.sh"
              changed_paths="$trusted/changed-paths.sh"
              python_ci_path="$trusted/python-ci-path.sh"
              rust_tests_path="$trusted/rust-tests-path.sh"
              lsp_e2e_path="$trusted/lsp-e2e-path.sh"
              export TCL_LSP_PYTHON_ENGINE_PACKAGE_MANIFEST="$trusted/python-engine-package-paths.txt"
              export TCL_LSP_RUST_TESTS_PACKAGE_MANIFEST="$trusted/rust-tests-package-paths.txt"
              export TCL_LSP_RUST_TESTS_INPUT_MANIFEST="$trusted/rust-tests-input-paths.txt"
              export TCL_LSP_E2E_PACKAGE_MANIFEST="$trusted/lsp-e2e-package-paths.txt"
              export TCL_LSP_E2E_INPUT_MANIFEST="$trusted/lsp-e2e-input-paths.txt"
            fi
          fi
          python_ci_path=${python_ci_path:-scripts/dev/python-ci-path.sh}
          if [[ "$ok" == "true" ]] && files="$("$changed_paths" "$GITHUB_EVENT_NAME" "$GITHUB_REPOSITORY" "$PR_NUMBER" "$BEFORE" "$GITHUB_SHA" "$GITHUB_REF")"; then
            :
          else
            ok=false
          fi

          python_changed=false
          ext_changed=false
          lsp_wasm_changed=false
          wasm_cc_changed=false
          spectcl_compat_changed=false
          runtime_rust_changed=false
          web_frontends_changed=false
          runner_policy_changed=false
          rust_tests_changed=false
          lsp_e2e_changed=false
          docs_only=true
          if [ "$ok" = "true" ]; then
            while IFS= read -r f; do
              if "$python_ci_path" "$f"; then
                python_changed=true
              else
                status=$?
                if [ "$status" -ne 1 ]; then
                  ok=false
                  break
                fi
              fi
              case "$f" in
                editors/vscode/* | scripts/dev/json-no-duplicate-keys.mjs | scripts/dev/test-vscode-test-partitions.sh | scripts/dev/verify-vscode-test-partitions.mjs | scripts/dev/verify-vscode-test-results.mjs | rust/* | grammars/* | ai/* | Cargo.toml | Cargo.lock | rust-toolchain.toml | Makefile | .github/workflows/ci.yml)
                  ext_changed=true ;;
              esac
              case "$f" in
                rust/f5-xc/* | rust/tcl-bigip/* | rust/tcl-bytecode/* | rust/tcl-cmd-core/* | rust/tcl-compiler/* | rust/tcl-core-types/* | rust/tcl-diagram/* | rust/tcl-dialect/* | rust/tcl-engine-api/* | rust/tcl-engine-tclvm/* | rust/tcl-explorer/* | rust/tcl-host-native/* | rust/tcl-irules/* | rust/tcl-lexer/* | rust/tcl-lsp-core/* | rust/tcl-lsp-db/* | rust/tcl-lsp-server/* | rust/tcl-lsp-server-wasm/* | rust/tcl-lsp-server-wasi/* | rust/tcl-platform/* | rust/tcl-regex/* | rust/tcl-registry/* | rust/tcl-runtime-api/* | rust/tcl-spec-hooks/* | rust/tcl-spectcl/* | rust/tcl-sslictcl/* | rust/tcl-syntax/* | rust/tcl-userdirs/* | rust/tcl-version/* | rust/tcl-vm/* | .cargo/config.toml | scripts/verify-wasm-externref.mjs | Cargo.toml | Cargo.lock | rust-toolchain.toml | Makefile | .github/workflows/ci.yml)
                  lsp_wasm_changed=true ;;
              esac
              case "$f" in
                rust/tcl-explorer-wasm/* | rust/tcl-vm-wasm/* | rust/tcl-spec-studio-wasm/* | rust/tcl-lsp-server-wasm/* | rust/bigip-query-wasm/* | rust/bigip-report-gen/wasm/* | scripts/dev/ensure-test-deps.sh | scripts/dev/wasm-cc-env.sh | scripts/dev/test-wasm-cc-env.sh | scripts/dev/prepare-homebrew-ci.sh | scripts/dev/test-prepare-homebrew-ci.sh | Cargo.toml | Cargo.lock | rust-toolchain.toml | Makefile | .github/workflows/ci.yml)
                  wasm_cc_changed=true ;;
              esac
              case "$f" in
                rust/bigip-report-gen/frontend/* | rust/tcl-spec-studio/web/* | Makefile | .github/workflows/ci.yml)
                  web_frontends_changed=true ;;
              esac
              case "$f" in
                .github/workflows/ci.yml | .github/dependabot.yml | scripts/dev/changed-paths.sh | scripts/dev/rust-tests-path.sh | scripts/dev/rust-tests-input-paths.txt | scripts/dev/rust-tests-package-paths.txt | scripts/dev/rust-test-binary-shard.sh | scripts/dev/rust-test-binary-shards.tsv | scripts/dev/verify-nextest-binary-shards.py | scripts/dev/test-nextest-binary-shards.sh | scripts/dev/select-rust-tests-runner.sh | scripts/dev/persistent-cargo-target.sh | scripts/dev/test-rust-tests-paths.sh | scripts/dev/test-rust-tests-runner.sh | scripts/dev/test-persistent-cargo-target.sh)
                  runner_policy_changed=true ;;
              esac
              if "$rust_tests_path" "$f"; then
                rust_tests_changed=true
              else
                status=$?
                if [ "$status" -ne 1 ]; then
                  ok=false
                  break
                fi
              fi
              if "$lsp_e2e_path" "$f"; then
                lsp_e2e_changed=true
              else
                status=$?
                if [ "$status" -ne 1 ]; then
                  ok=false
                  break
                fi
              fi
              if scripts/dev/spectcl-compat-path.sh "$f"; then
                spectcl_compat_changed=true
              else
                status=$?
                if [ "$status" -ne 1 ]; then
                  ok=false
                  break
                fi
              fi
              if scripts/dev/runtime-rust-path.sh "$f"; then
                runtime_rust_changed=true
              else
                status=$?
                if [ "$status" -ne 1 ]; then
                  ok=false
                  break
                fi
              fi
              case "$f" in
                docs/* | *.md | .claude/* | .gitignore | LICENSE) ;;
                *) docs_only=false ;;
              esac
            done <<<"$files"
            # Some apparent documentation inputs are executable or consumed by
            # root tests. The audited closure is authoritative over the broad
            # docs-only shape check for those paths.
            if [ "$rust_tests_changed" = "true" ]; then
              docs_only=false
            fi
          fi
          if [ "$ok" != "true" ]; then
            python_changed=true
            ext_changed=true
            lsp_wasm_changed=true
            wasm_cc_changed=true
            spectcl_compat_changed=true
            runtime_rust_changed=true
            web_frontends_changed=true
            runner_policy_changed=true
            rust_tests_changed=true
            lsp_e2e_changed=true
            docs_only=false
          fi
          {
            echo "python_changed=$python_changed"
            echo "ext_changed=$ext_changed"
            echo "lsp_wasm_changed=$lsp_wasm_changed"
            echo "wasm_cc_changed=$wasm_cc_changed"
            echo "spectcl_compat_changed=$spectcl_compat_changed"
            echo "runtime_rust_changed=$runtime_rust_changed"
            echo "web_frontends_changed=$web_frontends_changed"
            echo "runner_policy_changed=$runner_policy_changed"
            echo "rust_tests_changed=$rust_tests_changed"
            echo "lsp_e2e_changed=$lsp_e2e_changed"
            echo "docs_only=$docs_only"
          } >>"$GITHUB_OUTPUT"
          echo "python_changed=$python_changed ext_changed=$ext_changed lsp_wasm_changed=$lsp_wasm_changed wasm_cc_changed=$wasm_cc_changed spectcl_compat_changed=$spectcl_compat_changed runtime_rust_changed=$runtime_rust_changed web_frontends_changed=$web_frontends_changed runner_policy_changed=$runner_policy_changed rust_tests_changed=$rust_tests_changed lsp_e2e_changed=$lsp_e2e_changed docs_only=$docs_only"

      - name: Select the broad Rust test runner
        id: rust-runner
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          RUNNER_POLICY_CHANGED: ${{ steps.paths.outputs.runner_policy_changed }}
          DISPATCH_RUNNER: ${{ inputs.rust_tests_runner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$EVENT_NAME" == pull_request && ("$PR_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" || "$PR_AUTHOR" == 'dependabot[bot]' || "$RUNNER_POLICY_CHANGED" == true) ]]; then
            runner=hosted
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            runner="$DISPATCH_RUNNER"
          else
            runner="$(scripts/dev/select-rust-tests-runner.sh "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          fi
          case "$runner" in
            tank | hosted) ;;
            *) echo "::error::invalid broad Rust runner: $runner"; exit 1 ;;
          esac
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "broad Rust runner: $runner"

  # Fast PR gate. Runs on every PR and every push. The Rust work is an
  # independent worker after `channel`, so it overlaps SpecTcl and front-end
  # prerequisites instead of waiting behind them. The stable `pr-gate` status
  # below remains the required aggregate context.
  rust-check:
    # There is deliberately no job-level path or tag skip here. The worker
    # must report a real result for every graph shape; only its unchanged,
    # pre-release, and already-green work is step-gated below.
    needs: [channel]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # rust-toolchain.toml pins the channel (stable); the action installs it
      # plus fmt/clippy and wires up Swatinem cache.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Run fast CI gate (format + Clippy + generated-file drift)
        # Preserve the prior step-level semantics exactly: pre-release tags
        # and already-green tags report success without repeating this work.
        # Already-green merge pushes still run to warm the base-branch cache.
        if: needs.channel.outputs.prerelease != 'true' && !(startsWith(github.ref, 'refs/tags/') && needs.channel.outputs.already_green == 'true')
        run: make rust-check

  # `pr-gate` is the required status on `rust`. It must run even when a needed
  # job failed: Actions otherwise skips a dependent job, and a skipped required
  # check would not propagate the SpecTcl or front-end failure. Keep all four
  # results explicit so the aggregate can never become a vacuous success.
  pr-gate:
    if: ${{ always() }}
    needs: [channel, rust-check, spectcl-compat, web-frontends]
    runs-on: ubuntu-26.04
    steps:
      - name: Propagate prerequisite gate failures
        env:
          CHANNEL_RESULT: ${{ needs.channel.result }}
          RUST_CHECK_RESULT: ${{ needs.rust-check.result }}
          SPECTCL_COMPAT_RESULT: ${{ needs.spectcl-compat.result }}
          WEB_FRONTENDS_RESULT: ${{ needs.web-frontends.result }}
        run: |
          if [ "$CHANNEL_RESULT" != success ] || [ "$RUST_CHECK_RESULT" != success ] \
            || [ "$SPECTCL_COMPAT_RESULT" != success ] || [ "$WEB_FRONTENDS_RESULT" != success ]; then
            echo "channel=$CHANNEL_RESULT rust-check=$RUST_CHECK_RESULT spectcl-compat=$SPECTCL_COMPAT_RESULT web-frontends=$WEB_FRONTENDS_RESULT" >&2
            exit 1
          fi

  # Apple clang deliberately omits the WebAssembly backend. Exercise the
  # complete standalone-crate gate on a stock macOS runner whenever its owned
  # compiler/bootstrap surface changes: ensure-rust-deps must install wasi-sdk,
  # select it through CC_wasm32_unknown_unknown, and prove it with a real C
  # compile before ring or another cc-rs consumer starts. This job has no
  # dependants and is not a release gate, so a job-level path skip is safe and
  # avoids allocating a macOS runner for unrelated changes.
  macos-wasm-check:
    if: ${{ github.event_name == 'pull_request' && needs.channel.outputs.wasm_cc_changed == 'true' }}
    needs: [channel]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The hosted image can retain the unused, untrusted aws/tap. The Rust
      # setup action installs bash through Homebrew, which inspects configured
      # taps and emits an annotation before doing any Rust work.
      - name: Remove unused runner Homebrew tap
        run: scripts/dev/prepare-homebrew-ci.sh

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          components: clippy, rustfmt
          cache-key: macos-wasm-check
          cache-workspaces: |
            .
            editors/zed
            rust/tcl-explorer-wasm
            rust/tcl-vm-wasm
            rust/tcl-spec-studio-wasm
            rust/tcl-lsp-server-wasm

      - name: Provision and exercise the macOS WASM compiler
        run: make check-rust

  # Build the native tcl-lsp-server release binary ONCE and share it via
  # artifact with every job that just needs to *run* it rather than build it
  # (currently test-ext).  The `--release` profile (opt-level 3, thin LTO, one
  # codegen unit) is the slow part of test-ext (~3 of its ~6 minutes) — a
  # dedicated, minimal job that does nothing but build + upload lets test-ext
  # skip that compile entirely instead of duplicating it inline.  Always runs
  # (no channel skip): test-ext's own *consumption* step is still
  # channel-skipped for pre-release tags, same as before.
  #
  # Deliberately NOT shared with lsp-e2e: that job builds `tcl-lsp-server` in
  # cargo's default debug profile (via `CARGO_BIN_EXE_tcl-lsp-server`, resolved
  # at compile time) and runs fully in parallel with everything else today.
  # It would still have to compile its own debug e2e test binaries regardless
  # of which server binary they exec, so depending on this job would only add
  # this build's wall-clock to lsp-e2e's critical path for no compile-time
  # saved — a real slowdown in exchange for release-profile-only coverage,
  # not a speed win, so left alone.
  build-tcl-lsp-server:
    needs: [channel]
    runs-on: ubuntu-26.04
    env:
      # This build exists only so test-ext can RUN the server; skip it when
      # test-ext's own run step will skip (nothing extension-facing changed,
      # or the tag's SHA is already green).  Same condition as test-ext's
      # steps — keep the two in sync.
      RUN_EXT: ${{ (needs.channel.outputs.ext_changed == 'true' || startsWith(github.ref, 'refs/tags/')) && needs.channel.outputs.already_green != 'true' && needs.channel.outputs.prerelease != 'true' }}
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Rust
        if: env.RUN_EXT == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          cache-key: build-tcl-lsp-server

      # rust-cache deliberately drops workspace artefacts before save. Keep
      # their compiler outputs reusable without making cache availability part
      # of the extension gate's correctness.
      - name: Set up sccache
        id: sccache
        if: env.RUN_EXT == 'true'
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Enable sccache when available
        if: env.RUN_EXT == 'true'
        env:
          SCCACHE_SETUP_OUTCOME: ${{ steps.sccache.outcome }}
        run: |
          if [[ "$SCCACHE_SETUP_OUTCOME" == success ]] \
              && command -v sccache >/dev/null 2>&1 \
              && sccache --version >/dev/null 2>&1; then
            echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"
          else
            echo '::warning::sccache is unavailable; continuing with uncached compilation'
          fi

      # The `ci` profile (root Cargo.toml) is release-grade opt-level with thin
      # LTO and codegen-units=1 relaxed — measured, the full `--release`
      # profile spent ~3 of test-ext's ~6 minutes on the final crate + link
      # alone, for a binary whose only job is functional extension testing.
      # Shipping binaries (build-server-matrix) keep the real release profile.
      - name: Build tcl-lsp-server (ci profile)
        if: env.RUN_EXT == 'true'
        run: cargo build -p tcl-lsp-server --profile ci

      - name: Upload tcl-lsp-server binary
        if: env.RUN_EXT == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tcl-lsp-server-release
          path: target/ci/tcl-lsp-server
          if-no-files-found: error
          retention-days: 1

      - name: Report sccache statistics
        if: always() && env.RUN_EXT == 'true'
        continue-on-error: true
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          else
            echo '::warning::sccache statistics unavailable; compilation ran uncached'
          fi

  # VS Code extension tests: Node.js + xvfb driving the VS Code test host
  # against the native server.  A distinct, heavier stack than the cargo
  # surfaces, so it reports as its own status check and runs concurrently with
  # them.  Runs on every PR and push, so it can serve as a required check.
  test-ext-partition:
    # Steps are gated, the job is not (see the channel job header): the whole
    # suite step-skips on pre-release tags, on already-green tags, and when
    # nothing extension-facing changed (`ext_changed`), while the job still
    # reports success so the release graph and required checks stay unbroken.
    needs: [channel, build-tcl-lsp-server]
    strategy:
      fail-fast: false
      matrix:
        partition:
          - { index: 1, id: one }
          - { index: 2, id: two }
          - { index: 3, id: three }
    runs-on: ubuntu-26.04
    env:
      # Keep in sync with build-tcl-lsp-server's RUN_EXT — this job consumes
      # the artifact that job only uploads under the same condition.
      RUN_EXT: ${{ (needs.channel.outputs.ext_changed == 'true' || startsWith(github.ref, 'refs/tags/')) && needs.channel.outputs.already_green != 'true' && needs.channel.outputs.prerelease != 'true' }}
      TCL_LSP_TEST_PARTITION: ${{ matrix.partition.index }}/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # `make test-ext` still needs `cargo` for `xtask-gen-zed-queries` /
      # `zed-query-check` (generated Zed asset drift), even though the
      # `tcl-lsp-server` binary itself now comes from build-tcl-lsp-server.
      #
      # That cargo work is small when cached and expensive when not (measured:
      # `cargo xtask gen-zed-queries --check` is ~0s warm, ~157s cold), and this
      # job sits on the workflow's critical path — `build-tcl-lsp-server` ->
      # `test-ext` finishes after every other branch.  It was also the only
      # cargo job here without an explicit `cache-key`, so it shared the default
      # with whatever else did and could lose its cache to a collision.  Key it
      # per job like the rest, so the critical path is not the one running on
      # the least reliable cache.
      - name: Set up Rust
        if: env.RUN_EXT == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          cache-key: test-ext

      - name: Set up Node.js
        if: env.RUN_EXT == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Pin the npm CLI via the `packageManager` field in
      # editors/vscode/package.json. Corepack downloads and activates the
      # pinned npm so `npm ci` runs the same version locally and in CI.
      - name: Enable Corepack (pin npm via packageManager)
        if: env.RUN_EXT == 'true'
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          # `corepack enable` alone only shims pnpm/yarn; npm must be named
          # explicitly (`corepack enable npm`) or the shim isn't created and
          # the npm bundled with setup-node wins. Assert the pin is live so a
          # silent regression fails loudly instead of using the wrong npm.
          corepack enable npm
          cd editors/vscode
          active="$(npm --version)"
          echo "Active npm: $active (pinned via packageManager)"
          case "$active" in
            12.*) ;;
            *) echo "::error::expected npm 12 from packageManager pin, got $active"; exit 1 ;;
          esac

      # `package-lock.json` is committed, so installs are pinned by hash.
      # Cache the npm metadata directory keyed on the lockfile so the
      # cache invalidates whenever the resolved dependency tree changes.
      - name: Cache npm registry
        if: env.RUN_EXT == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('editors/vscode/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install npm dependencies
        if: env.RUN_EXT == 'true'
        run: |
          cd editors/vscode
          npm ci
          # `make test-ext` calls the ordinary compile target later. Record
          # that this exact package/lock pair is already installed so it does
          # not immediately run a second `npm install` in the same job.
          mkdir -p ../../build/stamps
          touch ../../build/stamps/npm-install

      - name: Verify VS Code test partitions
        if: env.RUN_EXT == 'true'
        run: make check-vscode-test-partitions

      # `@vscode/test-electron` downloads a full VS Code build on every run and
      # nothing cached it, so the extension-test step paid that download each
      # time — on the critical path (`build-tcl-lsp-server` -> `test-ext` is the
      # last branch to finish, and its 275s step runs suites that report
      # "14 passing (3s)": the cost is almost entirely fetch + host startup, not
      # testing).
      #
      # The key carries the RESOLVED stable version, queried from the same
      # endpoint test-electron itself uses.  Keying on anything coarser (a date
      # window, say) is broken: `actions/cache` entries are immutable, so when a
      # new stable ships mid-window test-electron downloads it, the save is
      # skipped because the key already exists, and every remaining run in that
      # window re-downloads — the cache silently stops working exactly when VS
      # Code releases.  Version-keying rotates on release, stores the new build
      # once, and hits thereafter, while still tracking the stable channel
      # rather than pinning it.
      #
      # If the endpoint cannot be reached the key falls back to a date stamp:
      # that only costs a download, whereas failing the step would take the
      # whole critical path down over a cache.
      - name: Resolve VS Code stable version
        if: env.RUN_EXT == 'true'
        id: vscode-version
        run: |
          set -uo pipefail
          ver=""
          if curl -fsSL --max-time 20 -o /tmp/vscode-stable.json \
               https://update.code.visualstudio.com/api/update/linux-x64/stable/latest; then
            ver=$(python3 -c 'import json; print(json.load(open("/tmp/vscode-stable.json"))["name"])' 2>/dev/null || true)
          fi
          if [ -z "$ver" ]; then
            ver="unresolved-$(date -u +%Y-%m-%d)"
            echo "::warning::could not resolve VS Code stable version; using $ver"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "VS Code stable resolves to: $ver"

      - name: Cache VS Code test download
        if: env.RUN_EXT == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: editors/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('editors/vscode/package-lock.json') }}-${{ steps.vscode-version.outputs.version }}

      - name: Lint TypeScript
        if: env.RUN_EXT == 'true'
        run: cd editors/vscode && npm run lint

      - name: Copy canonical AI data
        if: env.RUN_EXT == 'true'
        run: make copy-canonical

      - name: Compile TypeScript
        if: env.RUN_EXT == 'true'
        run: cd editors/vscode && npx tsc -p ./

      # Replaces the `make rust-server` build `make test-ext` would otherwise
      # run inline: build-tcl-lsp-server already built this exact binary, so
      # fetch it instead of compiling a second copy.
      - name: Download tcl-lsp-server binary
        if: env.RUN_EXT == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tcl-lsp-server-release
          path: target/release

      - name: Make tcl-lsp-server binary executable
        if: env.RUN_EXT == 'true'
        run: chmod +x target/release/tcl-lsp-server

      - name: Run extension tests
        if: env.RUN_EXT == 'true'
        # Pre-set so `make test-ext` honours it and skips its own
        # `make rust-server` build (see the Makefile recipe's comment).
        env:
          TCL_LSP_SERVER_BIN: ${{ github.workspace }}/target/release/tcl-lsp-server
        run: make test-ext-partition

      - name: Upload single-root partition metadata
        if: always() && env.RUN_EXT == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-test-partition-${{ matrix.partition.id }}
          path: editors/vscode/.vscode-test/mocha-result.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # The unchanged multi-folder suite remains a distinct producer.
  test-ext-multi-folder:
    # Steps are gated, the job is not (see the channel job header): the whole
    # suite step-skips on pre-release tags, on already-green tags, and when
    # nothing extension-facing changed (`ext_changed`), while the job still
    # reports success so the release graph and required checks stay unbroken.
    needs: [channel, build-tcl-lsp-server]
    runs-on: ubuntu-26.04
    env:
      # Keep in sync with build-tcl-lsp-server's RUN_EXT — this job consumes
