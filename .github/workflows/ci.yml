name: CI

on:
  push:
    branches: [rust]
    tags: ["v*"]
  pull_request:
    branches: [rust]
  # Manual escape hatch: if a PR's initial `pull_request: opened` webhook
  # is ever dropped by GitHub (rare, but has happened — no runs show up
  # for the branch at all, not even a queued/pending one), this lets a
  # maintainer kick off the same CI graph from the Actions tab instead of
  # having to push a throwaway commit just to re-send the event.
  #
  # NOTE: workflow_dispatch lets you pick any ref, tags included, and every
  # release/publish job is gated on `startsWith(github.ref, 'refs/tags/v')`.
  # Dispatching against a `v*` tag therefore re-runs create-release and the
  # marketplace publishes. Dispatch against a branch unless you mean that.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The repo's own build-hygiene contract (scripts/dev/agent-build-env.sh):
# incremental compilation off (useless for one-shot CI builds, bloats the
# Swatinem cache), and no debuginfo for dev-profile DEPENDENCY rlibs — the
# root Cargo.toml's [profile.test] line-tables-only only covers test targets.
# Measured: a full --all-features --tests target dir shrinks >3x (30 GB+ →
# 9.4 GB), with correspondingly faster cache save/restore and link steps.
# Harmless for the release/ci-profile build jobs (release is non-incremental
# by default and doesn't read CARGO_PROFILE_DEV_DEBUG).
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

# Least-privilege default for every job: read-only.  Jobs that need to
# write to the repo (releases, artefact uploads, attestations) escalate
# explicitly in their own `permissions:` block.  A compromised step in
# `pr-gate` / `test-ext` therefore cannot push commits or
# create releases even if the repo-level default is "Read and write".
permissions:
  contents: read

jobs:
  # Preflight facts.  Every expensive job step-skips on these outputs; the jobs
  # themselves always run and report success, so required status checks and the
  # tag-triggered release graph stay unbroken (GitHub's success() propagates a
  # skipped ancestor through the needs graph, so job-level skips are banned —
  # step-level only).
  #
  #   prerelease     — does this ref belong to the pre-release (odd-minor 2.x,
  #                    "rust") line?  scripts/release/prerelease.sh is the
  #                    single source of truth, so the test gate, the GitHub
  #                    Release, and the Marketplace publish all agree on the
  #                    channel from the tag alone.
  #   already_green  — this exact code already passed this workflow, verified
  #                    against the Actions API.  Fail-safe: any API error, no
  #                    match, or a match older than 24 h → false → full run.
  #                    True in exactly two shapes:
  #                      * a v* tag whose commit has a green push run on
  #                        rust — the release flow (make release-tag) tags
  #                        an already-green tip, so the tag-time re-test was
  #                        pure repetition (measured: v2.1.18 re-ran the
  #                        identical 20-job surface on the same SHA 74 minutes
  #                        after it went green);
  #                      * a push to rust of a merge commit whose tree is
  #                        byte-identical to a PR head with a green PR run —
  #                        what the merge button produces when the PR was up to
  #                        date with the base.  Tree equality is the guarantee
  #                        that matters: identical tree ⇒ identical inputs ⇒
  #                        identical verdict, and a merge that DID pick up new
  #                        base-branch commits gets a different tree and a full
  #                        re-test — exactly the case where re-testing has
  #                        value.
  #                    The 24 h bound stops the skip compounding into stale
  #                    territory: the floating `stable` toolchain and the
  #                    advisory database both move under an unchanged tree, so
  #                    last week's green must not stand in for today's.
  #                    cargo-deny ignores this output entirely — the
  #                    supply-chain audit re-runs at every release point
  #                    because a new advisory can arrive against an unchanged
  #                    dependency tree, and it costs under a minute.
  #   python_changed / ext_changed / docs_only — changed-path facts for this
  #                    event (fail-safe: detection failure, a >300-file
  #                    compare, or a tag ref → everything counts as changed),
  #                    so jobs whose input surface didn't change stop
  #                    re-testing it on every PR.
  #   lsp_wasm_changed — a wasm LSP transport (browser or WASI) or one of the
  #                    transitive local dependencies they share changed.  This
  #                    keeps the two expensive real wasm builds and their
  #                    scripted LSP sessions targeted, while failing safe when
  #                    path detection is ambiguous.  Both transports sit on the
  #                    same `tcl-lsp-server` closure, so one flag gates both.
  #   spectcl_compat_changed — SpecTcl or its TclVM/compiler/registry/runtime
  #                    and exact-reference-toolchain closure changed. Runs the
  #                    non-vacuous 15+3+4+2+1 compatibility lane.
  #   runtime_rust_changed — the standalone `runtime/rust` crate or one of the
  #                    path dependencies its own cargo workspace resolves
  #                    changed, so `runtime-rust-tests` must execute that
  #                    crate's unit suite.  `runtime/rust` is NOT a member of
  #                    the root workspace: `cargo test --workspace` never runs
  #                    those tests, and `wasm-real-link` builds and links the
  #                    crate without running a single one of them, so before
  #                    this flag existed a standalone-runtime semantic
  #                    regression could land with every partition green
  #                    (issue #1768).  The closure lives in
  #                    scripts/dev/runtime-rust-path.sh and is gated against
  #                    the committed lockfile by
  #                    scripts/dev/test-runtime-rust-paths.sh, so it cannot
  #                    silently narrow.
  channel:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # query prior workflow runs for already_green
    outputs:
      prerelease: ${{ steps.detect.outputs.prerelease }}
      already_green: ${{ steps.green.outputs.already_green }}
      python_changed: ${{ steps.paths.outputs.python_changed }}
      ext_changed: ${{ steps.paths.outputs.ext_changed }}
      lsp_wasm_changed: ${{ steps.paths.outputs.lsp_wasm_changed }}
      spectcl_compat_changed: ${{ steps.paths.outputs.spectcl_compat_changed }}
      runtime_rust_changed: ${{ steps.paths.outputs.runtime_rust_changed }}
      docs_only: ${{ steps.paths.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Depth 2 so a merge commit's parents resolve for the tree
          # comparison in the already-green check.
          fetch-depth: 2
      - name: Detect release channel from the ref
        id: detect
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            prerelease="$(bash scripts/release/prerelease.sh "$tag")"
          else
            prerelease="false"
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "channel: $GITHUB_REF -> prerelease=$prerelease"

      - name: Check whether this exact code is already green
        id: green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          already=false
          cutoff="$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')"
          api="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Tag: does this exact SHA have a green push run on rust?
            n="$(gh api "$api?head_sha=$GITHUB_SHA&event=push&status=success&per_page=20" \
                  --jq "[.workflow_runs[] | select(.head_branch==\"rust\" and .updated_at > \"$cutoff\")] | length" \
                  2>/dev/null || echo 0)"
            [ "${n:-0}" -gt 0 ] && already=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # Merge push: does a PR head with the identical tree have a green
            # PR run?  HEAD^2 only exists on a 2-parent merge commit; squash
            # and direct pushes fall through to a full run.
            pr_head="$(git rev-parse -q --verify HEAD^2 || true)"
            if [ -n "$pr_head" ] &&
              [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$pr_head^{tree}")" ]; then
              n="$(gh api "$api?head_sha=$pr_head&event=pull_request&status=success&per_page=20" \
                    --jq "[.workflow_runs[] | select(.updated_at > \"$cutoff\")] | length" \
                    2>/dev/null || echo 0)"
              [ "${n:-0}" -gt 0 ] && already=true
            fi
          fi
          echo "already_green=$already" >> "$GITHUB_OUTPUT"
          echo "already_green=$already (ref=$GITHUB_REF sha=$GITHUB_SHA)"

      - name: Classify changed paths
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          ok=true
          files=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              --paginate --jq '.[].filename' 2>/dev/null)" || ok=false
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" != refs/tags/* &&
            -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            # The compare API caps the file list at 300; a full list means
            # "could be anything", not "exactly 300 files changed".
            files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" \
              --jq '.files[].filename' 2>/dev/null)" || ok=false
            [ "$(printf '%s\n' "$files" | wc -l)" -ge 300 ] && ok=false
          else
            ok=false # tags, dispatch, branch creation: everything counts as changed
          fi
          [ -z "$files" ] && ok=false

          python_changed=false
          ext_changed=false
          lsp_wasm_changed=false
          spectcl_compat_changed=false
          runtime_rust_changed=false
          docs_only=true
          if [ "$ok" = "true" ]; then
            while IFS= read -r f; do
              case "$f" in
                *.py | *.pyi | typings/* | rust/bigip-report-gen/python/* | ruff.toml | pyrightconfig.json | Makefile | .github/workflows/ci.yml)
                  python_changed=true ;;
              esac
              case "$f" in
                editors/vscode/* | rust/* | grammars/* | ai/* | Cargo.toml | Cargo.lock | rust-toolchain.toml | Makefile | .github/workflows/ci.yml)
                  ext_changed=true ;;
              esac
              case "$f" in
                rust/f5-xc/* | rust/tcl-bigip/* | rust/tcl-bytecode/* | rust/tcl-cmd-core/* | rust/tcl-compiler/* | rust/tcl-core-types/* | rust/tcl-diagram/* | rust/tcl-dialect/* | rust/tcl-engine-api/* | rust/tcl-engine-tclvm/* | rust/tcl-explorer/* | rust/tcl-host-native/* | rust/tcl-irules/* | rust/tcl-lexer/* | rust/tcl-lsp-core/* | rust/tcl-lsp-db/* | rust/tcl-lsp-server/* | rust/tcl-lsp-server-wasm/* | rust/tcl-lsp-server-wasi/* | rust/tcl-platform/* | rust/tcl-regex/* | rust/tcl-registry/* | rust/tcl-runtime-api/* | rust/tcl-spec-hooks/* | rust/tcl-spectcl/* | rust/tcl-sslictcl/* | rust/tcl-syntax/* | rust/tcl-userdirs/* | rust/tcl-version/* | rust/tcl-vm/* | .cargo/config.toml | scripts/verify-wasm-externref.mjs | Cargo.toml | Cargo.lock | rust-toolchain.toml | Makefile | .github/workflows/ci.yml)
                  lsp_wasm_changed=true ;;
              esac
              if scripts/dev/spectcl-compat-path.sh "$f"; then
                spectcl_compat_changed=true
              else
                status=$?
                if [ "$status" -ne 1 ]; then
                  ok=false
                  break
                fi
              fi
              if scripts/dev/runtime-rust-path.sh "$f"; then
                runtime_rust_changed=true
              else
                status=$?
                if [ "$status" -ne 1 ]; then
                  ok=false
                  break
                fi
              fi
              case "$f" in
                docs/* | *.md | .claude/* | .gitignore | LICENSE) ;;
                *) docs_only=false ;;
              esac
            done <<<"$files"
          fi
          if [ "$ok" != "true" ]; then
            python_changed=true
            ext_changed=true
            lsp_wasm_changed=true
            spectcl_compat_changed=true
            runtime_rust_changed=true
            docs_only=false
          fi
          {
            echo "python_changed=$python_changed"
            echo "ext_changed=$ext_changed"
            echo "lsp_wasm_changed=$lsp_wasm_changed"
            echo "spectcl_compat_changed=$spectcl_compat_changed"
            echo "runtime_rust_changed=$runtime_rust_changed"
            echo "docs_only=$docs_only"
          } >>"$GITHUB_OUTPUT"
          echo "python_changed=$python_changed ext_changed=$ext_changed lsp_wasm_changed=$lsp_wasm_changed spectcl_compat_changed=$spectcl_compat_changed runtime_rust_changed=$runtime_rust_changed docs_only=$docs_only"

  # Fast PR gate.  Runs on every PR and every push.  Covers the Rust fast
  # checks through the central `make rust-check` contract: root and standalone
  # crate formatting/Clippy plus generated-file drift gates. The test surface
  # runs
  # concurrently in `rust-tests`, `rust-tests-heavy`, `lsp-e2e`, `cargo-deny`,
  # `test-ext` and `python` — all on every PR and push.  See AGENTS.md for the
  # local gates (`make check-all`, plus the heavier suites) agents must run
  # before pushing / opening a PR.
  pr-gate:
    # Rust-side fast gate (fmt / clippy / generated-file drift).  For
    # pre-release (odd-minor 2.x) tags the gate WORK is skipped at the step
    # level (below), but the job still runs and reports success.  This is
    # deliberate: skipping the whole job would transitively skip create-release
    # and every build/publish job (GitHub's success() propagates a skipped
    # ancestor through the needs graph).  Those tags are cut from `rust` and
    # gated by the cargo jobs instead.  Runs in full for PRs, rust pushes,
    # stable tags.
    # `pr-gate` is already a required status on `rust`. Run even when a needed
    # job failed, then fail explicitly below: Actions otherwise skips a job
    # whose dependency failed, and a skipped required check does not propagate
    # the SpecTcl failure as a red `pr-gate` verdict.
    if: ${{ always() }}
    needs: [channel, spectcl-compat]
    runs-on: ubuntu-26.04
    steps:
      - name: Propagate prerequisite gate failures
        env:
          CHANNEL_RESULT: ${{ needs.channel.result }}
          SPECTCL_COMPAT_RESULT: ${{ needs.spectcl-compat.result }}
        run: |
          if [ "$CHANNEL_RESULT" != success ] || [ "$SPECTCL_COMPAT_RESULT" != success ]; then
            echo "channel=$CHANNEL_RESULT spectcl-compat=$SPECTCL_COMPAT_RESULT" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # rust-toolchain.toml pins the channel (stable); the action installs it
      # plus fmt/clippy and wires up Swatinem cache.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Run fast CI gate (format + Clippy + generated-file drift)
        # Skipped for pre-release (rust-line) tags and for tags whose SHA is
        # already green; job still succeeds so the release graph stays
        # unbroken.  Deliberately NOT skipped on already-green merge pushes:
        # this job's clippy cache is the base-branch fallback every PR run
        # restores from, so pushes to rust keep it warm.
        if: needs.channel.outputs.prerelease != 'true' && !(startsWith(github.ref, 'refs/tags/') && needs.channel.outputs.already_green == 'true')
        run: make rust-check

  # Build the native tcl-lsp-server release binary ONCE and share it via
  # artifact with every job that just needs to *run* it rather than build it
  # (currently test-ext).  The `--release` profile (opt-level 3, thin LTO, one
  # codegen unit) is the slow part of test-ext (~3 of its ~6 minutes) — a
  # dedicated, minimal job that does nothing but build + upload lets test-ext
  # skip that compile entirely instead of duplicating it inline.  Always runs
  # (no channel skip): test-ext's own *consumption* step is still
  # channel-skipped for pre-release tags, same as before.
  #
  # Deliberately NOT shared with lsp-e2e: that job builds `tcl-lsp-server` in
  # cargo's default debug profile (via `CARGO_BIN_EXE_tcl-lsp-server`, resolved
  # at compile time) and runs fully in parallel with everything else today.
  # It would still have to compile its own debug e2e test binaries regardless
  # of which server binary they exec, so depending on this job would only add
  # this build's wall-clock to lsp-e2e's critical path for no compile-time
  # saved — a real slowdown in exchange for release-profile-only coverage,
  # not a speed win, so left alone.
  build-tcl-lsp-server:
    needs: [channel]
    runs-on: ubuntu-26.04
    env:
      # This build exists only so test-ext can RUN the server; skip it when
      # test-ext's own run step will skip (nothing extension-facing changed,
      # or the tag's SHA is already green).  Same condition as test-ext's
      # steps — keep the two in sync.
      RUN_EXT: ${{ (needs.channel.outputs.ext_changed == 'true' || startsWith(github.ref, 'refs/tags/')) && needs.channel.outputs.already_green != 'true' && needs.channel.outputs.prerelease != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Rust
        if: env.RUN_EXT == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache-key: build-tcl-lsp-server

      # The `ci` profile (root Cargo.toml) is release-grade opt-level with thin
      # LTO and codegen-units=1 relaxed — measured, the full `--release`
      # profile spent ~3 of test-ext's ~6 minutes on the final crate + link
      # alone, for a binary whose only job is functional extension testing.
      # Shipping binaries (build-server-matrix) keep the real release profile.
      - name: Build tcl-lsp-server (ci profile)
        if: env.RUN_EXT == 'true'
        run: cargo build -p tcl-lsp-server --profile ci

      - name: Upload tcl-lsp-server binary
        if: env.RUN_EXT == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tcl-lsp-server-release
          path: target/ci/tcl-lsp-server
          if-no-files-found: error
          retention-days: 1

  # VS Code extension tests: Node.js + xvfb driving the VS Code test host
  # against the native server.  A distinct, heavier stack than the cargo
  # surfaces, so it reports as its own status check and runs concurrently with
  # them.  Runs on every PR and push, so it can serve as a required check.
  test-ext:
    # Steps are gated, the job is not (see the channel job header): the whole
    # suite step-skips on pre-release tags, on already-green tags, and when
    # nothing extension-facing changed (`ext_changed`), while the job still
    # reports success so the release graph and required checks stay unbroken.
    needs: [channel, build-tcl-lsp-server]
    runs-on: ubuntu-26.04
    env:
      # Keep in sync with build-tcl-lsp-server's RUN_EXT — this job consumes
      # the artifact that job only uploads under the same condition.
      RUN_EXT: ${{ (needs.channel.outputs.ext_changed == 'true' || startsWith(github.ref, 'refs/tags/')) && needs.channel.outputs.already_green != 'true' && needs.channel.outputs.prerelease != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # `make test-ext` still needs `cargo` for `xtask-gen-zed-queries` /
      # `zed-query-check` (generated Zed asset drift), even though the
      # `tcl-lsp-server` binary itself now comes from build-tcl-lsp-server.
      #
      # That cargo work is small when cached and expensive when not (measured:
      # `cargo xtask gen-zed-queries --check` is ~0s warm, ~157s cold), and this
      # job sits on the workflow's critical path — `build-tcl-lsp-server` ->
      # `test-ext` finishes after every other branch.  It was also the only
      # cargo job here without an explicit `cache-key`, so it shared the default
      # with whatever else did and could lose its cache to a collision.  Key it
      # per job like the rest, so the critical path is not the one running on
      # the least reliable cache.
      - name: Set up Rust
        if: env.RUN_EXT == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache-key: test-ext

      - name: Set up Node.js
        if: env.RUN_EXT == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Pin the npm CLI via the `packageManager` field in
      # editors/vscode/package.json. Corepack downloads and activates the
      # pinned npm so `npm ci` runs the same version locally and in CI.
      - name: Enable Corepack (pin npm via packageManager)
        if: env.RUN_EXT == 'true'
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          # `corepack enable` alone only shims pnpm/yarn; npm must be named
          # explicitly (`corepack enable npm`) or the shim isn't created and
          # the npm bundled with setup-node wins. Assert the pin is live so a
          # silent regression fails loudly instead of using the wrong npm.
          corepack enable npm
          cd editors/vscode
          active="$(npm --version)"
          echo "Active npm: $active (pinned via packageManager)"
          case "$active" in
            12.*) ;;
            *) echo "::error::expected npm 12 from packageManager pin, got $active"; exit 1 ;;
          esac

      # `package-lock.json` is committed, so installs are pinned by hash.
      # Cache the npm metadata directory keyed on the lockfile so the
      # cache invalidates whenever the resolved dependency tree changes.
      - name: Cache npm registry
        if: env.RUN_EXT == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('editors/vscode/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install npm dependencies
        if: env.RUN_EXT == 'true'
        run: cd editors/vscode && npm ci

      # `@vscode/test-electron` downloads a full VS Code build on every run and
      # nothing cached it, so the extension-test step paid that download each
      # time — on the critical path (`build-tcl-lsp-server` -> `test-ext` is the
      # last branch to finish, and its 275s step runs suites that report
      # "14 passing (3s)": the cost is almost entirely fetch + host startup, not
      # testing).
      #
      # The key carries the RESOLVED stable version, queried from the same
      # endpoint test-electron itself uses.  Keying on anything coarser (a date
      # window, say) is broken: `actions/cache` entries are immutable, so when a
      # new stable ships mid-window test-electron downloads it, the save is
      # skipped because the key already exists, and every remaining run in that
      # window re-downloads — the cache silently stops working exactly when VS
      # Code releases.  Version-keying rotates on release, stores the new build
      # once, and hits thereafter, while still tracking the stable channel
      # rather than pinning it.
      #
      # If the endpoint cannot be reached the key falls back to a date stamp:
      # that only costs a download, whereas failing the step would take the
      # whole critical path down over a cache.
      - name: Resolve VS Code stable version
        if: env.RUN_EXT == 'true'
        id: vscode-version
        run: |
          set -uo pipefail
          ver=$(curl -fsSL --max-time 20 \
            https://update.code.visualstudio.com/api/update/linux-x64/stable/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])' 2>/dev/null || true)
          if [ -z "$ver" ]; then
            ver="unresolved-$(date -u +%Y-%m-%d)"
            echo "::warning::could not resolve VS Code stable version; using $ver"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "VS Code stable resolves to: $ver"

      - name: Cache VS Code test download
        if: env.RUN_EXT == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: editors/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('editors/vscode/package-lock.json') }}-${{ steps.vscode-version.outputs.version }}

      - name: Lint TypeScript
        if: env.RUN_EXT == 'true'
        run: cd editors/vscode && npm run lint

      - name: Copy canonical AI data
        if: env.RUN_EXT == 'true'
        run: make copy-canonical

      - name: Compile TypeScript
        if: env.RUN_EXT == 'true'
        run: cd editors/vscode && npx tsc -p ./

      # Replaces the `make rust-server` build `make test-ext` would otherwise
      # run inline: build-tcl-lsp-server already built this exact binary, so
      # fetch it instead of compiling a second copy.
      - name: Download tcl-lsp-server binary
        if: env.RUN_EXT == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tcl-lsp-server-release
          path: target/release

      - name: Make tcl-lsp-server binary executable
        if: env.RUN_EXT == 'true'
        run: chmod +x target/release/tcl-lsp-server

      - name: Run extension tests
        if: env.RUN_EXT == 'true'
        # Pre-set so `make test-ext` honours it and skips its own
        # `make rust-server` build (see the Makefile recipe's comment).
        env:
          TCL_LSP_SERVER_BIN: ${{ github.workspace }}/target/release/tcl-lsp-server
        run: make test-ext

  # The same extension in a BROWSER extension host — vscode.dev / github.dev.
  #
  # `test-ext` above cannot cover this: it runs the `main` entry point against
  # the native binary, while the web host loads the `browser` entry point and
  # the wasm language server in a Web Worker.  Everything that only exists on
  # that path — the manifest's `browser` field, the staged `dist/web` worker
  # assets, the worker's own asset resolution under a cross-origin blob shim,
  # the JSON-RPC string/object adapter, the document selector's scheme filter —
  # is invisible to the desktop suite, and each of those failed silently rather
  # than loudly when it was wrong.
  #
  # Gated on BOTH path facts because it consumes both surfaces: the extension
  # (`ext_changed`) and the browser language server (`lsp_wasm_changed`).  Step-
  # level like every other skip here, so the job still reports success and the
  # release `needs:` graph stays intact.
  test-ext-web:
    needs: [channel]
    runs-on: ubuntu-26.04
    env:
      RUN_EXT_WEB: ${{ (needs.channel.outputs.ext_changed == 'true' || needs.channel.outputs.lsp_wasm_changed == 'true' || startsWith(github.ref, 'refs/tags/')) && needs.channel.outputs.already_green != 'true' && needs.channel.outputs.prerelease != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # The browser server is built here rather than fetched from the
      # `lsp-server-wasm` job: that job step-skips on its own narrower path
      # filter, so depending on its artefact would make this suite skip
      # whenever only `editors/vscode/**` changed — exactly when it is most
      # worth running.  Its own cache key keeps the release/LTO link warm.
      - name: Set up Rust
        if: env.RUN_EXT_WEB == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          cache-key: test-ext-web
          cache-workspaces: rust/tcl-lsp-server-wasm

      - name: Install wasm-bindgen CLI
        if: env.RUN_EXT_WEB == 'true'
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: wasm-bindgen-cli@0.2.127

      - name: Set up Node.js
        if: env.RUN_EXT_WEB == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable Corepack (pin npm via packageManager)
        if: env.RUN_EXT_WEB == 'true'
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable npm
          cd editors/vscode
          active="$(npm --version)"
          echo "Active npm: $active (pinned via packageManager)"
          case "$active" in
            12.*) ;;
            *) echo "::error::expected npm 12 from packageManager pin, got $active"; exit 1 ;;
          esac

      - name: Cache npm registry
        if: env.RUN_EXT_WEB == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('editors/vscode/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # `@vscode/test-web` depends on `@playwright/browser-chromium`, so `npm
      # ci` installs the browser it drives; there is no separate download step.
      # (A sandbox with Playwright pre-installed elsewhere sets
      # PLAYWRIGHT_BROWSERS_PATH instead — see INSTALL-editors.md.)
      - name: Install npm dependencies
        if: env.RUN_EXT_WEB == 'true'
        run: cd editors/vscode && npm ci

      # `@vscode/test-web` downloads a VS Code *web* build on every run, the way
      # `@vscode/test-electron` downloads a desktop one in `test-ext`. Key on
      # the resolved commit from the same endpoint test-web itself uses: a
      # coarser key (a date window) is actively broken, because cache entries
      # are immutable, so a build that ships mid-window is downloaded but never
      # saved and every remaining run re-downloads. Falling back to a date stamp
      # when the endpoint is unreachable only costs a download.
      - name: Resolve the VS Code web build
        if: env.RUN_EXT_WEB == 'true'
        id: vscode-web-version
        run: |
          set -uo pipefail
          ver=$(curl -fsSL --max-time 20 \
            https://update.code.visualstudio.com/api/update/web-standalone/insider/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' 2>/dev/null || true)
          if [ -z "$ver" ]; then
            ver="unresolved-$(date -u +%Y-%m-%d)"
            echo "::warning::could not resolve the VS Code web build; using $ver"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "VS Code web (insider) resolves to: $ver"

      - name: Cache the VS Code web download
        if: env.RUN_EXT_WEB == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: editors/vscode/.vscode-test-web
          key: vscode-test-web-${{ runner.os }}-${{ steps.vscode-web-version.outputs.version }}

      - name: Build the browser language server
        if: env.RUN_EXT_WEB == 'true'
        run: make lsp-server-wasm

      # `npm run compile` stages `dist/web` best-effort, so a build that never
      # produced the worker assets would reach the browser as a runtime error
      # instead of a build failure. Here they must exist: `--require` says so.
      - name: Stage the browser assets (must exist)
        if: env.RUN_EXT_WEB == 'true'
        run: cd editors/vscode && node scripts/copy-web-assets.cjs --require

      # `pretest:web` runs `npm run compile` (both bundles + the staged
      # `dist/web` assets) and bundles the web test module for the browser.
      # Headless Chromium needs no X server, so no xvfb here.
      - name: Run the web extension-host smoke test
        if: env.RUN_EXT_WEB == 'true'
        run: cd editors/vscode && npm run test:web

  # Rust product gate.  ci.yml triggers on `rust`, so one
  # pipeline covers them.  Runs on every PR and push, because nothing else
  # exercises the Rust product on a PR.
  #
  # `cargo test --workspace --all-features --no-fail-fast`, Swatinem cache,
  # toolchain resolved from rust-toolchain.toml.
  #
  # The Rust/WASM surface is split across SIX concurrent jobs so the CPU-bound
  # suites don't serialise behind each other.  Wall-clock is the max of the
  # six, not their sum.  The first four are required status checks on `rust`:
  #
  #   rust-tests        workspace minus the VM-sim heavies and tcl-lsp-server,
  #                     plus ALL workspace doctests (cheap; nextest can't run
  #                     doctests, so they live here once rather than in each job)
  #   rust-tests-heavy  the VM-sim heavies (`tcl-irule-test`, `f5-cli`) plus
  #                     `tcl-fuzz`'s plumbing unit tests (excluded from
  #                     rust-tests so wasmtime/cranelift stay out of the main
  #                     partition's build graph; fuzz campaigns themselves are
  #                     manual-only, never CI).  Measured 2026-08-13: ~44 s
  #                     total.  Kept split for concurrency, not because it is
  #                     still the long pole.
  #   lsp-e2e           the native lsp_e2e suite: spawns the real tcl-lsp-server
  #                     via CARGO_BIN_EXE_tcl-lsp-server and drives LSP JSON-RPC
  #                     over stdio (rust/tcl-lsp-server/tests/*_e2e.rs)
  #   cargo-deny        supply-chain audit, isolated so a denial is attributable
  #                     independently of the test surface
  #   wasm-real-link    the real whole-program WASM link, with the only CI
  #                     install of wasmtime / wasm32-wasip1 / wasi-sdk /
  #                     libtommath and `TCL_REQUIRE_WASM_LINK=1` so a missing
  #                     one fails instead of skipping (issue #1542).  NOT yet
  #                     wired into `create-release`'s `needs`, deliberately: it
  #                     downloads a wasi-sdk release asset, and a transient
  #                     404/timeout there must not be able to block a release.
  #                     Promote it (and to a required check) once it has proved
  #                     stable over a few weeks.  `tcl-compiler` is in
  #                     `rust-tests`' workspace run too, so `wasm_real_link.rs`
  #                     also executes there — without the toolchain, where it
  #                     skips loudly by naming what is missing.
  #   lsp-server-wasm   the real wasm-bindgen LSP server, driven through a
  #                     scripted JSON-RPC session under Node.  Path-filtered
  #                     to the browser server's local dependency closure.
  #   lsp-server-wasi   the real wasm32-wasip1 LSP server, driven through
  #                     scripted Content-Length-framed sessions under the
  #                     wasmtime CLI.  Same path filter — the two transports
  #                     share their whole dependency closure — but its own job,
  #                     because it is the only place the wasip1 arm of
  #                     `tcl_lsp_server::rt` is actually EXECUTED rather than
  #                     type-checked.  On a v* tag it is ALSO a release
  #                     producer: it builds the module unconditionally and hands
  #                     `build-vsix` the `wasi-module` artifact, which that job
  #                     stages into the universal VSIX and signs onto the
  #                     Release — the same producer/attacher split
  #                     `build-server-matrix` uses.
  #
  # nextest runs every test binary's tests in ONE global parallel pool, so the
  # VM-sim suites overlap instead of running one binary at a time — a large
  # wall-clock win over `cargo test`, which runs test binaries serially.
  #
  # `tcl-lsp-server` is excluded from rust-tests because lsp-e2e runs that crate
  # in full.  The crate declares no [features], so dropping it from the
  # `--all-features` workspace run costs no coverage.
  rust-tests:
    # Historically the longest pole (155s on the 16-core self-hosted box when
    # healthy — a 2026-08 regression to 16 min turned out to be two oversized
    # `tcl-compiler` per_item tests, since fixed; if this job blows past ~5
    # min again, suspect a runaway test before suspecting the box or the
    # cache).  No longer the longest pole: `lsp-e2e` now is (~390s vs ~150s
    # here).  Note that neither is the workflow's critical path — the
    # `build-tcl-lsp-server` -> `test-ext` chain is, finishing 40-80s after
    # `lsp-e2e` does, so shortening the test jobs cuts cost and the local
    # `make test-rust` loop rather than PR turnaround.
    #
    # It is the ONLY job routed to the self-hosted runner, and that
    # is deliberate: the box has one runner instance, so anything sent there
    # executes serially and queues behind this job.
    #
    # Untrusted code must never reach the self-hosted runner, so PRs from forks
    # stay on GitHub-hosted; everything else (push, dispatch, and PRs from
    # branches in this repo, which only collaborators can create) goes to `tank`.
    needs: [channel]
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'tank' || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Must install `stable` explicitly rather than lean on the runner's
      # preinstalled rustup: the image ships a pinned stable (e.g. 1.96.1) and
      # `rust-toolchain.toml`'s `channel = "stable"` resolves to *that*, not to
      # the newest release.  Cargo then refuses the workspace's `rust-version`.
      # The action installs the current stable and wires up the Swatinem cache
      # (keyed per job, so the concurrent cargo jobs don't race on save).
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache-key: rust-tests

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: nextest

      # The real-tclsh conformance binaries fail closed when no manifest-pinned
      # interpreter is available. Provision the shared Tcl 9.0 gold-standard
      # lane through the same tool entry point SpecTcl uses; distro Tcl and a
      # stale system tclsh9.0 must never decide which oracle CI exercises.
      - name: Install exact Tcl 9.0 reference interpreter
        if: needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.already_green != 'true'
        env:
          TCL_LSP_TCL_BIN_DIR: ${{ runner.temp }}/tcl-reference-bin
        run: |
          make ensure-tcl90-reference
          . scripts/dev/tcl-reference-toolchains.sh
          tcl_reference_load_toolchains "$PWD"
          tclsh="$(tcl_reference_resolve_tclsh 9.0)"
          printf 'TCL_LSP_TCLSH90=%s\n' "$tclsh" >> "$GITHUB_ENV"

      # --no-fail-fast: report every failure, not just the first.
      # Skipped entirely for docs-only changes and already-green tags;
      # downgraded to a cache-warming build (--no-run) on an already-green
      # merge push, because PR runs restore this job's cache from the base
      # branch — see the channel job header for the full contract.  --no-run
      # drops --no-fail-fast rather than adding to it: nextest 0.9.143 rejects
      # `--no-run --no-fail-fast` outright ("the argument '--no-run' cannot be
      # used with '--no-fail-fast'"), and the flag is meaningless anyway when
      # no tests are executed.
      - name: cargo nextest run (workspace minus VM-sim heavies and lsp-e2e)
        if: needs.channel.outputs.docs_only != 'true' && !(startsWith(github.ref, 'refs/tags/') && needs.channel.outputs.already_green == 'true')
        env:
          ALREADY_GREEN: ${{ needs.channel.outputs.already_green }}
        run: |
          extra="--no-fail-fast"
          if [ "$ALREADY_GREEN" = "true" ]; then
            echo "tree already green on its PR run — building test binaries (cache warmth) without re-running them"
            extra="--no-run"
          fi
          cargo nextest run $extra --workspace --exclude tcl-irule-test --exclude f5-cli --exclude tcl-lsp-server --exclude tcl-fuzz --all-features

      # nextest does not run doctests; run them for the WHOLE workspace (incl.
      # the crates excluded above — doctests are cheap) so the other jobs need
      # not duplicate them.  Deps are already built, so this is compile + run.
      - name: cargo test --doc
        if: needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.already_green != 'true'
        run: cargo test --workspace --all-features --doc --no-fail-fast

  # Fail-closed SpecTcl compatibility on every PR that changes its TclVM,
  # compiler, registry, runtime, pack, or exact-reference-toolchain closure.
  # The Make target installs/resolves the manifest-pinned Tcl 9.0 oracle and
  # runs the 15+3+4+2 internal cases plus the one real-C-Tcl parse case.
  spectcl-compat:
    needs: [channel]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Rust
        if: needs.channel.outputs.spectcl_compat_changed == 'true' && needs.channel.outputs.already_green != 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache-key: spectcl-compat

      - name: Run exact SpecTcl 1.x + 2.0 + real-Tcl compatibility gate
        if: needs.channel.outputs.spectcl_compat_changed == 'true' && needs.channel.outputs.already_green != 'true'
        run: make test-spectcl-compat

  # The heavy VM-simulation suites, split out to run concurrently with
  # `rust-tests` (see that job's header).  Doctests are covered there.
  rust-tests-heavy:
    # Deliberately hosted.  The self-hosted box has a single runner, so jobs
    # sent there execute serially; measured, moving this job as well pushed the
    # critical path from 239s to 253s.  See `rust-tests` for the full reasoning.
    needs: [channel]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          # This job builds only the heavy crates + their deps, so it gets its
          # own cache rather than racing rust-tests on save.
          cache-key: rust-tests-heavy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: nextest

      # Same skip/downgrade contract as rust-tests — see the channel job header.
      # tcl-fuzz lives here, not in rust-tests: its wasmtime/cranelift
      # dependency chain (~40 crates, cranelift-codegen alone an 81 MB rlib)
      # would otherwise sit in the main partition's build graph.  Only the
      # fuzzer's own fast plumbing unit tests run — fuzz CAMPAIGNS are
      # manual-only (`make fuzz`), never CI.
      - name: cargo nextest run (VM-sim heavies + tcl-fuzz plumbing)
        if: needs.channel.outputs.docs_only != 'true' && !(startsWith(github.ref, 'refs/tags/') && needs.channel.outputs.already_green == 'true')
        env:
          ALREADY_GREEN: ${{ needs.channel.outputs.already_green }}
        run: |
          extra="--no-fail-fast"
          if [ "$ALREADY_GREEN" = "true" ]; then
            echo "tree already green on its PR run — building test binaries (cache warmth) without re-running them"
            extra="--no-run"
          fi
          cargo nextest run $extra -p tcl-irule-test -p f5-cli -p tcl-fuzz --all-features

  # The standalone `runtime/rust` unit suite (issue #1768).
  #
  # `runtime/rust` is its own cargo workspace, deliberately excluded from the
  # root one (it needs `unsafe` over the shared linear memory, and its churn
  # must not gate the LSP/compiler workstream).  The cost of that exclusion is
  # that `cargo test --workspace --all-features` in `rust-tests` never runs a
  # single test in it, and `wasm-real-link` compiles and LINKS the crate
  # without executing its tests either.  `pr-gate` only formats and clippies
  # it.  So until this job existed, a standalone-runtime semantic regression
  # could land with every required check green — which is exactly how the
  # #1750 error-stack work would have added and changed many runtime tests
  # that CI never ran.
  #
  # This is an ADDITIONAL semantic gate, not a replacement: `wasm-real-link`
  # remains the real-link check, and this job never links anything.
  #
  # The step-level skip keys on `runtime_rust_changed` (see the channel job
  # header): the crate plus the path-dependency closure its own lockfile
  # resolves.  The job itself always runs and reports, per the redundancy
  # contract in AGENTS.md.
  runtime-rust-tests:
    needs: [channel]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Rust
        if: needs.channel.outputs.runtime_rust_changed == 'true' && needs.channel.outputs.already_green != 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          # A separate cargo workspace with its own lockfile and its own
          # target dir, so it keeps its own cache rather than racing the root
          # workspace jobs on save.
          cache-key: runtime-rust-tests

      # libtommath, for the same reason `wasm-real-link` fetches it: without
      # the source `runtime/rust`'s build script prints a `cargo:warning` and
      # builds with the bignum backend DISABLED, which un-registers `expr` and
      # the `::tcl::mathfunc`/`mathop` ensembles.  The suite would still be
      # green while covering far less than it appears to (issue #1542's shape).
      # `make runtime-rust-test` passes the directory explicitly.
      - name: Fetch the Tcl 9.0.4 source (libtommath)
        if: needs.channel.outputs.runtime_rust_changed == 'true' && needs.channel.outputs.already_green != 'true'
        run: |
          set -euo pipefail
          .claude/skills/fetch-tcl-source/fetch_tcl_source.sh 9.0
          test -f tmp/tcl9.0.4/libtommath/tommath.h

      # The shared make target, so a contributor reproducing a failure runs
      # the identical locked command CI ran.
      - name: make runtime-rust-test (standalone runtime unit suite)
        if: needs.channel.outputs.runtime_rust_changed == 'true' && needs.channel.outputs.already_green != 'true'
        run: make runtime-rust-test

  # The real whole-program WASM link (`tcl-compiler`'s `wasm_real_link.rs`):
  # an emitted module linked against the real `runtime/rust` compiled to
  # `wasm32-wasip1`, composed and executed by the wasmtime CLI.
  #
  # Its own job because it is the ONLY job that installs this toolchain, and
  # because before it existed the suite was permanently vacuous: every one of
  # those tests skipped-and-passed when the toolchain was absent, and no CI job
  # installed the wasmtime CLI, the `wasm32-wasip1` target, or wasi-sdk.  Eight
  # green tests, zero real links, for the whole life of the file (issue #1542).
  # `TCL_REQUIRE_WASM_LINK=1` is what makes this job meaningful: with it set, a
  # missing dimension of the toolchain is a hard failure instead of a skip, so
  # the job cannot silently revert to reporting green for nothing.
  #
  # The Tcl 9.0.4 source is fetched for libtommath: `runtime/rust`'s build
  # script degrades *silently* to a bignum-less runtime without it, and the
  # link then fails with a missing-output diff that reads like a codegen
  # regression rather than a missing dependency.
  wasm-real-link:
    # Deliberately hosted -- see `rust-tests-heavy`.
    needs: [channel]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          # The wasm32 std is a job-specific dependency, so this job keeps its
          # own cache rather than racing the other cargo jobs on save.  The
          # reserved runtime builds into `target/tcl_reserved_runtime` inside
          # the checkout, so this cache covers it too.
          target: wasm32-wasip1
          cache-key: wasm-real-link

      # Pinned to an exact version: the whole point of this job is a
      # reproducible link, and an unpinned `wasmtime` would let the runtime
      # under test drift without a commit.
      - name: Install the wasmtime CLI
        if: needs.channel.outputs.docs_only != 'true'
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: wasmtime@47.0.3

      # wasi-sdk supplies the `clang` that compiles libtommath's C sources to
      # wasm objects.  The test finds it at the default /opt/wasi-sdk, so no
      # env var is needed.  The tarball is pinned by version AND verified
      # against a recorded sha256 before it is unpacked: this step runs
      # `sudo tar` over a download from a third-party release, so "pinned by
      # tag" alone is not enough — a retagged or substituted asset would be
      # unpacked with root privileges.  Regenerate with `sha256sum` when
      # bumping WASI_SDK_RELEASE.
      - name: Install wasi-sdk
        if: needs.channel.outputs.docs_only != 'true'
        env:
          WASI_SDK_VERSION: '33'
          WASI_SDK_RELEASE: '33.0'
          WASI_SDK_SHA256: '0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce'
        run: |
          set -euo pipefail
          asset="wasi-sdk-${WASI_SDK_RELEASE}-x86_64-linux.tar.gz"
          url="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/${asset}"
          curl -fsSL --retry 3 -o /tmp/wasi-sdk.tar.gz "$url"
          echo "${WASI_SDK_SHA256}  /tmp/wasi-sdk.tar.gz" | sha256sum --check --strict -
          sudo mkdir -p /opt/wasi-sdk
          sudo tar -xzf /tmp/wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
          test -x /opt/wasi-sdk/bin/clang

      # libtommath.  Fetched through the same helper contributors use, so CI
      # and a developer checkout resolve the identical tree.
      - name: Fetch the Tcl 9.0.4 source (libtommath)
        if: needs.channel.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          .claude/skills/fetch-tcl-source/fetch_tcl_source.sh 9.0
          test -f tmp/tcl9.0.4/libtommath/tommath.h

      # Same skip/downgrade contract as rust-tests — see the channel job header.
      # No `--no-run` downgrade: the point of this job is that the link really
      # executes, and building the test binary without running it would be
      # exactly the vacuity #1542 is about.
      # `wasm_tiers` rides the same gate: its sample-oracle tests return early
      # when the toolchain is absent, so anywhere but here they pass without
      # linking a single sample — the vacuity this job exists to prevent.
      - name: cargo test --test wasm_real_link --test wasm_tiers (toolchain required)
        if: needs.channel.outputs.docs_only != 'true' && !(startsWith(github.ref, 'refs/tags/') && needs.channel.outputs.already_green == 'true')
        env:
          TCL_REQUIRE_WASM_LINK: '1'
        run: cargo test -p tcl-compiler --test wasm_real_link --test wasm_tiers -- --test-threads=1

      # The language server's wasip1 arm (rt.rs `mod wasi`) has no in-tree
      # consumer until the WASI transport crate lands, so nothing else in CI
      # would catch a lib.rs/rt.rs change breaking it.  This job already
      # carries the wasm32-wasip1 toolchain and cache, making the check ~free
      # here; it is a compile gate only — the transport crate brings the
      # run-time coverage.
      - name: cargo check -p tcl-lsp-server (wasm32-wasip1)
        if: needs.channel.outputs.docs_only != 'true' && !(startsWith(github.ref, 'refs/tags/') && needs.channel.outputs.already_green == 'true')
        run: cargo check -p tcl-lsp-server --lib --target wasm32-wasip1

  # The real browser LSP server: release-link the wasm-bindgen facade, verify
  # the produced module, then drive a scripted JSON-RPC session under Node.
  # This is intentionally distinct from `wasm-real-link`, which exercises the
  # compiler's WASI runtime rather than the browser language server.  Before
  # this job, browser-only regressions first appeared after merge in the Pages
  # deployment (#1662).
  lsp-server-wasm:
    needs: [channel]
    runs-on: ubuntu-26.04
    env:
      # Keep the expensive release/LTO link targeted to the browser server's
      # local dependency closure.  An ambiguous path classification is true;
      # already-green merge pushes and tags carry forward their PR/push result.
      RUN_LSP_WASM: ${{ needs.channel.outputs.lsp_wasm_changed == 'true' && needs.channel.outputs.already_green != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Rust
        if: env.RUN_LSP_WASM == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          cache-key: lsp-server-wasm
          cache-workspaces: rust/tcl-lsp-server-wasm

      - name: Install wasm-bindgen CLI
        if: env.RUN_LSP_WASM == 'true'
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: wasm-bindgen-cli@0.2.127

      - name: Set up Node.js
        if: env.RUN_LSP_WASM == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Build and exercise the browser LSP server
        if: env.RUN_LSP_WASM == 'true'
        run: make lsp-server-wasm-test

  # The real WASI LSP server: release-link the wasm32-wasip1 command, optimise
  # it, then drive scripted JSON-RPC sessions against it under the wasmtime CLI.
  # Sibling of `lsp-server-wasm` and gated by the same path filter — the two
  # transports share the whole `tcl-lsp-server` dependency closure — but a
  # separate job so a browser regression and a WASI regression are separately
  # attributable, and because this one needs a different toolchain (wasip1
  # target + wasmtime, no wasm-bindgen).
  #
  # It is also the only thing in CI that RUNS the wasip1 arm of
  # `tcl_lsp_server::rt`.  The `wasm-real-link` job's `cargo check
  # --target wasm32-wasip1` step is a compile gate; the driver properties that
  # arm's doc comments describe — never parking the runtime empty, keeping
  # timers alive while blocked on stdin — only fail at run time, and only here.
  #
  # On a `v*` tag this job is ALSO the release's producer of the module, and it
  # follows `build-server-matrix`'s pattern exactly: build, upload a plain
  # workflow artifact, and let a job that depends on `create-release` attach it
  # to the Release.  `build-vsix` is that job — it downloads `wasi-module` to
  # stage into the universal package, and signs the bare module onto the
  # Release while it is there.  Doing the `gh release upload` here instead
  # would race `create-release`, which this job deliberately does not depend on
  # (a skipped `needs` ancestor skips its dependants, and `create-release` is
  # tag-only — depending on it would kill this job's PR coverage).
  #
  # Hence `RELEASE_WASI` below, independent of the path/already-green gate: a
  # tag whose SHA already went green step-skips the *test*, but the release
  # still needs the artefact.
  #
  # Still not in `create-release`'s `needs`, and now for a better reason than
  # the old carve-out's: `build-vsix` depends on it directly, which is where the
  # module is consumed, while `create-release` only opens the Release.  The
  # wasmtime download that carve-out worried about is gated on `RUN_LSP_WASI`
  # alone — the release path needs only the wasip1 target and binaryen, so a
  # transient wasmtime 404 still cannot fail a tag build.
  lsp-server-wasi:
    needs: [channel]
    runs-on: ubuntu-26.04
    env:
      # Same gate as `lsp-server-wasm`: keep the expensive release/LTO link
      # targeted to the dependency closure the two transports share.  An
      # ambiguous path classification is true; already-green merge pushes and
      # tags carry forward their PR/push result.
      RUN_LSP_WASI: ${{ needs.channel.outputs.lsp_wasm_changed == 'true' && needs.channel.outputs.already_green != 'true' }}
      # A tag must produce the module whatever the test gate decided.
      RELEASE_WASI: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Rust
        if: env.RUN_LSP_WASI == 'true' || env.RELEASE_WASI == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          target: wasm32-wasip1
          cache-key: lsp-server-wasi
          cache-workspaces: rust/tcl-lsp-server-wasi

      # Pinned to the same exact version `wasm-real-link` uses: the driver's
      # readiness wait depends on the host honouring a `poll_oneoff` `fd_read`
      # subscription on stdin, so the runtime under test must not drift without
      # a commit.  Only the scripted sessions need it, so the release path
      # (RELEASE_WASI without RUN_LSP_WASI) never downloads it.
      - name: Install the wasmtime CLI
        if: env.RUN_LSP_WASI == 'true'
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: wasmtime@47.0.3

      # binaryen supplies `wasm-opt`, which build-wasi.sh runs (safely — this
      # module has no wasm-bindgen externref table to mis-rebind).  The script
      # degrades with a note when it is missing, so installing it here is what
      # keeps the optimised module the thing CI actually exercises — and, on a
      # tag, the thing it ships.
      - name: Install binaryen
        if: env.RUN_LSP_WASI == 'true' || env.RELEASE_WASI == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binaryen

      - name: Set up Node.js
        if: env.RUN_LSP_WASI == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Build and exercise the WASI LSP server
        if: env.RUN_LSP_WASI == 'true'
        run: make lsp-server-wasi-test

      # The link only, for a tag whose test surface step-skipped as already
      # green.  `lsp-server-wasi-test` above already produced `dist/` when it
      # ran, so this is the else-branch, not a second build.
      - name: Build the WASI LSP server (release artefact)
        if: env.RELEASE_WASI == 'true' && env.RUN_LSP_WASI != 'true'
        run: make lsp-server-wasi

      # Same handoff shape as `build-server-matrix`'s `server-bins-*`: a plain,
      # short-lived workflow artifact for the downstream packaging job.  The
      # Release asset (attested + SBOM'd) is attached by `build-vsix`, which is
      # the one that can be sure `create-release` has already run.
      - name: Upload the WASI module
        if: env.RELEASE_WASI == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasi-module
          path: rust/tcl-lsp-server-wasi/dist/tcl-lsp-server-wasi.wasm
          if-no-files-found: error
          retention-days: 1

  # Native-server lsp_e2e suite.  Its own job (hence its own status check)
  # because it is a distinct, heavier surface: it builds the `tcl-lsp-server`
  # binary and drives the end-to-end LSP suite against it over stdio JSON-RPC.
  # Fully native — the Rust port of the former Python `tests/lsp_e2e/` pytest
  # suite, so no Python and no uv.  Also covers the crate's `*_smoke.rs` tests.
  lsp-e2e:
    # Deliberately hosted -- see `rust-tests-heavy`.
    needs: [channel]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache-key: lsp-e2e

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: nextest

      # The integration tests spawn the real `tcl-lsp-server` binary via
      # `CARGO_BIN_EXE_tcl-lsp-server` (cargo builds it as a test dependency)
      # and talk LSP JSON-RPC to it over stdio.  nextest runs them in one
      # parallel pool (no serial-per-binary penalty).
      # Same skip/downgrade contract as rust-tests — see the channel job header.
      - name: lsp_e2e against the native Rust server
        if: needs.channel.outputs.docs_only != 'true' && !(startsWith(github.ref, 'refs/tags/') && needs.channel.outputs.already_green == 'true')
        env:
          ALREADY_GREEN: ${{ needs.channel.outputs.already_green }}
        run: |
          extra="--no-fail-fast"
          if [ "$ALREADY_GREEN" = "true" ]; then
            echo "tree already green on its PR run — building test binaries (cache warmth) without re-running them"
            extra="--no-run"
          fi
          cargo nextest run $extra -p tcl-lsp-server

  # Supply-chain audit (advisories / licenses / bans / sources) via the
  # committed deny.toml.  Its own job so a denial is attributable independently
  # of the cargo test surface, and so it runs concurrently with it.  Action
  # defaults already match the `make rust-deny` invocation: `command: check`,
  # `arguments: --all-features`, `manifest-path: ./Cargo.toml` — deny.toml and
  # the workspace manifest both live at the repo root.
  #
  # Deliberately exempt from the channel job's already_green / changed-path
  # skips: a new advisory can be published against an unchanged dependency
  # tree, so "this SHA already passed" does not carry the audit's verdict
  # forward the way it carries a test verdict.  It costs under a minute.
  cargo-deny:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # Python gate: ruff (format + lint) and two type checkers (ty, pyright) over
  # every tracked .py file.  Runs concurrently with the cargo jobs.
  #
  # `make typecheck-py` builds a venv that installs the f5report package, which
  # maturin-compiles the native `_engine` extension — so the checkers resolve
  # every import for real rather than suppressing `unresolved-import`.  That is
  # why this job needs a Rust toolchain.  The Sublime host APIs (`sublime`,
  # `sublime_plugin`, `LSP.plugin`) exist only inside the editor process and are
  # declared by hand-written stubs under typings/.
  #
  # Tool versions are pinned in the Makefile so a new ruff/ty/pyright release
  # cannot change a gate's verdict between a local run and CI.
  python:
    needs: [channel]
    runs-on: ubuntu-26.04
    env:
      # Only 30 .py files exist in the repo (the product is the Rust
      # workspace); a pure-Rust PR shouldn't pay for ruff + two type checkers
      # + a maturin build.  Tags run in full unless their SHA is already
      # green.  Steps skip, the job still reports success — see the channel
      # job header.
      RUN_PY: ${{ (needs.channel.outputs.python_changed == 'true' || startsWith(github.ref, 'refs/tags/')) && needs.channel.outputs.already_green != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # `make lint-py` / `typecheck-py` derive their file list from
      # `git ls-files '*.py'`, so the checkout must be a real git repo (it is).

      # Needed by maturin to build the native `_engine` extension module.
      - name: Set up Rust
        if: env.RUN_PY == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache-key: python-engine

      # The venv build maturin-compiles the native `_engine` in release mode
      # (~4 min); `make py-venv` skips the reinstall when its content stamp
      # matches, so restoring the venv turns ty + pyright into a ~10 s step.
      # The system python version is part of the key: a restored venv built
      # against a different interpreter would fail confusingly, not loudly.
      - name: Compute venv cache key
        if: env.RUN_PY == 'true'
        id: pykey
        run: echo "pyver=$(python3 -V | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache typecheck venv
        if: env.RUN_PY == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv-typecheck
          key: ${{ runner.os }}-venv-typecheck-${{ steps.pykey.outputs.pyver }}-${{ hashFiles('rust/bigip-report-gen/python/**') }}

      # Pinned installer rather than a floating action, so the uv that resolves
      # the pinned tool versions is itself pinned.
      - name: Install uv
        if: env.RUN_PY == 'true'
        env:
          UV_VERSION: "0.11.28"
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify uv version
        if: env.RUN_PY == 'true'
        run: |
          actual="$(uv --version | awk '{print $2}')"
          echo "uv $actual"
          [ "$actual" = "0.11.28" ] || { echo "::error::expected uv 0.11.28, got $actual"; exit 1; }

      - name: ruff (format --check + check)
        if: env.RUN_PY == 'true'
        run: make lint-py

      - name: ty + pyright
        if: env.RUN_PY == 'true'
        run: make typecheck-py

  # Release: create (or verify) the GitHub Release so each build job
  # can upload its artifact independently — no single slow or failing
  # build blocks the others.
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    # Gated on the fast gate (pr-gate) AND the whole cargo test surface.  Any
    # of those jobs may have step-skipped its work when the channel job proved
    # this exact SHA already went green on rust within 24 h (see the
    # channel job header) — the jobs still report success, so the graph holds,
    # and the verdict they carry forward is the prior run's real one.  A tag
    # whose SHA was never tested (or whose green is stale) runs everything
    # here in full.  cargo-deny always runs regardless.
    needs:
      [channel, pr-gate, rust-tests, rust-tests-heavy, spectcl-compat, lsp-server-wasm, lsp-e2e, cargo-deny, python]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # gh release upload
      id-token: write        # OIDC for sigstore-backed attestations
      attestations: write    # actions/attest-build-provenance writes here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Body lives in scripts/release/github_release.sh: idempotent create,
        # requires curated RELEASE_NOTES.md, and marks odd-minor 2.x tags as
        # GitHub pre-releases (scripts/release/prerelease.sh).
        run: bash scripts/release/github_release.sh

      - name: Stamp + upload installer script to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          sha="$(git rev-parse --short HEAD)"
          # Replace the @@INSTALLER_VERSION_*@@ placeholders so a user
          # running --version on the published asset sees the actual
          # release. The in-tree script on rust stays unstamped so
          # contributors don't see misleading version strings locally.
          tmp="$(mktemp)"
          sed \
            -e "s/@@INSTALLER_VERSION_TAG@@/${tag}/" \
            -e "s/@@INSTALLER_VERSION_SHA@@/(${sha})/" \
            scripts/install/install.sh > "$tmp"
          # Sanity-check that both placeholders were actually replaced
          # before we upload — failing loudly here beats publishing a
          # script that reports itself as "dev (unstamped)".
          if grep -q '@@INSTALLER_VERSION_' "$tmp"; then
              echo "ERROR: installer placeholder was not stamped" >&2
              grep '@@INSTALLER_VERSION_' "$tmp" >&2
              exit 1
          fi
          install -m 0755 "$tmp" install.sh
          rm -f "$tmp"

      - name: Attest installer script build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "install.sh"

      - name: Upload installer script to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release upload "$tag" install.sh --clobber

  # ---------------------------------------------------------------------
  # build-server-matrix — compile the four native programs for every supported
  # platform. Linux x86_64 and aarch64 build natively inside UBI 8 to retain a
  # GLIBC_2.28 ABI floor; RISC-V uses an Ubuntu 22.04 container's glibc 2.35
  # cross sysroot because EL8 did not ship a RISC-V architecture. No Zig or
  # separately downloaded libc is involved. Each leg smoke-tests its binary
  # and uploads it preserving `target/<triple>/release/`. build-vsix downloads
  # them all and packages both the untargeted universal VSIX and six
  # platform-targeted VSIXes.
  #
  # Per the no-marketplace-tokens invariant this uses only GitHub's built-in
  # token — nothing is published to a marketplace here.
  #
  # The triple→bundle-dir mapping lives in the Makefile (SERVER_TARGET_MAP);
  # keep the matrix below and that map in sync (7 triples total).
  build-server-matrix:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release]
    strategy:
      fail-fast: false
      # One job per target triple (not per OS): the old 3-leg matrix built up
      # to 12 binaries serially on one runner (4 bins x 3 Linux triples), so
      # the whole release waited on the slowest leg.  Per-triple legs make the
      # wall-clock the slowest SINGLE triple's 4 builds, at the cost of extra
      # (parallel, cheap) runners.  Keep this list and the Makefile's
      # SERVER_TARGET_MAP in sync (7 triples total).
      matrix:
        include:
          - os: macos-latest
            id: darwin-arm64
            target: aarch64-apple-darwin
          - os: macos-latest
            id: darwin-x64
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            id: linux-x64
            target: x86_64-unknown-linux-gnu
            ubi8: true
            glibc_max: "2.28"
          - os: ubuntu-24.04-arm
            id: linux-arm64
            target: aarch64-unknown-linux-gnu
            ubi8: true
            glibc_max: "2.28"
          - os: ubuntu-24.04
            id: linux-riscv64
            target: riscv64gc-unknown-linux-gnu
            riscv_glibc: true
            glibc_max: "2.35"
          - os: windows-latest
            id: win32-x64
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            id: win32-arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable

      # Use the runner's architecture-matched UBI image, so x86_64 and aarch64
      # both link against the maintained EL8 glibc 2.28 ABI without a cross
      # sysroot. The Rust installation is supplied by the pinned setup action;
      # only the distro C toolchain lives in the container. aarch64 overrides
      # the local-development cross-linker from .cargo/config.toml with native
      # `gcc`/`ar`.
      - name: Build GNU/Linux binaries against glibc 2.28
        if: matrix.ubi8
        env:
          TARGET: ${{ matrix.target }}
          TCL_LSP_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Git rejects the root-owned container's bind-mounted checkout as a
          # dubious directory. Stamp provenance explicitly instead of letting
          # tcl-version silently fall back to an empty commit.
          export GIT_HASH="${GITHUB_SHA:0:8}"
          docker run --rm \
            --env TARGET \
            --env TCL_LSP_VERSION \
            --env GIT_HASH \
            --env CARGO_HOME=/cargo \
            --env RUSTUP_HOME=/rustup \
            --volume "$GITHUB_WORKSPACE:/work" \
            --volume "$HOME/.cargo:/cargo" \
            --volume "$HOME/.rustup:/rustup" \
            --workdir /work \
            registry.access.redhat.com/ubi8/ubi-minimal:8.10 \
            /bin/bash -lc '
              set -euo pipefail
              microdnf install -y binutils cmake gcc gcc-c++ git make perl pkgconf-pkg-config
              microdnf clean all
              export PATH="/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
              if [[ "$TARGET" == aarch64-unknown-linux-gnu ]]; then
                export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=gcc
                export CC_aarch64_unknown_linux_gnu=gcc
                export AR_aarch64_unknown_linux_gnu=ar
              fi
              rustup target add "$TARGET"
              cargo build -p tcl-lsp-server --release --target "$TARGET"
              cargo build -p tcl-mcp --release --target "$TARGET"
              cargo build -p tcl-cli --release --target "$TARGET"
              cargo build -p f5-cli --release --target "$TARGET"
              expected="${TCL_LSP_VERSION#v}+g$GIT_HASH"
              scripts/verify-native-versions.sh \
                "$expected" "target/$TARGET/release"
            '

      # Ubuntu 22.04 is the oldest still-supported mainstream RISC-V distro and
      # ships a complete glibc 2.35 cross toolchain. Keep it inside a container
      # rather than pinning the outer GitHub runner to an aging image. The QEMU
      # handshake runs in the same container so it uses that matching sysroot.
      - name: Build RISC-V GNU/Linux binaries against glibc 2.35
        if: matrix.riscv_glibc
        env:
          TARGET: ${{ matrix.target }}
          TCL_LSP_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_HASH="${GITHUB_SHA:0:8}"
          docker run --rm \
            --env TARGET \
            --env TCL_LSP_VERSION \
            --env GIT_HASH \
            --env CARGO_HOME=/cargo \
            --env RUSTUP_HOME=/rustup \
            --env DEBIAN_FRONTEND=noninteractive \
            --volume "$GITHUB_WORKSPACE:/work" \
            --volume "$HOME/.cargo:/cargo" \
            --volume "$HOME/.rustup:/rustup" \
            --workdir /work \
            docker.io/library/ubuntu:22.04 \
            /bin/bash -lc '
              set -euo pipefail
              apt-get update
              # Both libc development packages are recommendations rather than
              # dependencies of the GCC packages, so name them explicitly when
              # suppressing recommended packages.
              apt-get install -y --no-install-recommends \
                ca-certificates cmake gcc gcc-riscv64-linux-gnu git libc6-dev \
                libc6-dev-riscv64-cross make perl pkg-config qemu-user
              rm -rf /var/lib/apt/lists/*
              export PATH="/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
              test -f "$(gcc -print-file-name=Scrt1.o)"
              test -f "$(riscv64-linux-gnu-gcc -print-file-name=Scrt1.o)"
              rustup target add "$TARGET"
              cargo build -p tcl-lsp-server --release --target "$TARGET"
              cargo build -p tcl-mcp --release --target "$TARGET"
              cargo build -p tcl-cli --release --target "$TARGET"
              cargo build -p f5-cli --release --target "$TARGET"
              expected="${TCL_LSP_VERSION#v}+g$GIT_HASH"
              scripts/verify-native-versions.sh \
                "$expected" "target/$TARGET/release" \
                qemu-riscv64 -L /usr/riscv64-linux-gnu
              scripts/verify-glibc-baseline.sh 2.35 \
                "target/$TARGET/release/tcl-lsp-server" \
                "target/$TARGET/release/tcl-mcp" \
                "target/$TARGET/release/tcl" \
                "target/$TARGET/release/f5-query"
              make server-cross-test
            '

      # Stamp the release version into every user-facing binary. The
      # tcl-version crate prefers this over `git describe`; without it a tag
      # build would still be correct, but this avoids depending on the checkout
      # having tags fetched.
      - name: Cross-compile native binaries (server + mcp + CLIs)
        if: matrix.ubi8 != true && matrix.riscv_glibc != true
        env:
          TCL_LSP_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          t="${{ matrix.target }}"
          echo "==> $t"
          rustup target add "$t"
          cargo build -p tcl-lsp-server --release --target "$t"
          cargo build -p tcl-mcp --release --target "$t"
          cargo build -p tcl-cli --release --target "$t"
          cargo build -p f5-cli --release --target "$t"

      - name: Verify GNU/Linux glibc ABI ceiling
        if: matrix.glibc_max
        shell: bash
        run: |
          set -euo pipefail
          t="${{ matrix.target }}"
          scripts/verify-glibc-baseline.sh "${{ matrix.glibc_max }}" \
            "target/$t/release/tcl-lsp-server" \
            "target/$t/release/tcl-mcp" \
            "target/$t/release/tcl" \
            "target/$t/release/f5-query"

      # scripts/test-cross-server.sh tests whatever is already built and skips
      # absent triples loudly, so each per-triple leg smoke-tests just its own
      # binary (natively or under QEMU where runnable).
      - name: Smoke-test built binaries
        if: matrix.riscv_glibc != true
        shell: bash
        run: make server-cross-test

      - name: Upload server binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Per-triple artifact; downstream consumers merge `server-bins-*`
          # so the per-triple split is invisible to them.
          name: server-bins-${{ matrix.id }}
          # Common ancestor of all matched files is `target/`, so the artifact
          # stores `<triple>/release/<exe>` — build-vsix restores tcl-lsp-server
          # under `target/`; the tcl-mcp / tcl / f5-query binaries ride along for
          # publish-native-binaries to attach as standalone release assets.
          path: |
            target/*/release/tcl-lsp-server
            target/*/release/tcl-lsp-server.exe
            target/*/release/tcl-mcp
            target/*/release/tcl-mcp.exe
            target/*/release/tcl
            target/*/release/tcl.exe
            target/*/release/f5-query
            target/*/release/f5-query.exe
          if-no-files-found: error
          retention-days: 1

  # The per-architecture ELF gates above catch ABI drift at the producer. This
  # fan-in repeats them over the uploaded release bytes, then starts the exact
  # x86_64 server across a compact matrix of maintained glibc distributions.
  # WASI/browser-WASM artefacts are produced by separate jobs and intentionally
  # do not participate in a host-libc contract.
  linux-release-portability:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release, build-server-matrix]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Download server-matrix binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: server-bins-*
          path: target
          merge-multiple: true

      - name: Verify Linux release ABI ceilings
        shell: bash
        run: |
          set -euo pipefail
          # upload-artifact intentionally normalises file modes. Restore the
          # executable bit before both the ELF gate and the distro handshake.
          chmod +x \
            target/{x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,riscv64gc-unknown-linux-gnu}/release/{tcl-lsp-server,tcl-mcp,tcl,f5-query}
          for triple in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            scripts/verify-glibc-baseline.sh 2.28 \
              "target/$triple/release/tcl-lsp-server" \
              "target/$triple/release/tcl-mcp" \
              "target/$triple/release/tcl" \
              "target/$triple/release/f5-query"
          done
          scripts/verify-glibc-baseline.sh 2.35 \
            target/riscv64gc-unknown-linux-gnu/release/tcl-lsp-server \
            target/riscv64gc-unknown-linux-gnu/release/tcl-mcp \
            target/riscv64gc-unknown-linux-gnu/release/tcl \
            target/riscv64gc-unknown-linux-gnu/release/f5-query

      - name: Test the release server across supported Linux distributions
        env:
          CONTAINER_ENGINE: docker
        run: scripts/test-linux-distro-compat.sh target/x86_64-unknown-linux-gnu/release/tcl-lsp-server

  # Publish the standalone native binaries as per-triple release assets
  # (`<name>-<triple>[.exe]` for tcl-lsp-server, tcl-mcp, tcl, f5-query), so
  # `install.sh` fetches a prebuilt binary for the host platform.
  #
  # `tcl-lsp-server` MUST be in that list.  A Zed extension is a single
  # cross-platform WASM module and cannot embed a per-platform binary, so
  # editors/zed resolves `tcl-lsp-server-<triple>[.exe]` from this release at
  # runtime, pinned to its own tag.  Drop it and every Zed install has no server
  # (issue #826).  The VSIX takes its copy from the build-server-matrix
  # artifacts, not from here.
  #
  # publish-checksums then sums + signs whatever is attached, so these assets are
  # covered automatically.
  publish-native-binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release, build-server-matrix, linux-release-portability]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # gh release upload
    steps:
      - name: Download server-matrix binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: server-bins-*
          path: server-bins
          merge-multiple: true

      - name: Stage + upload native per-triple assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, so `gh` can't infer the repo from git —
          # give it explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          mkdir -p out
          shopt -s nullglob
          # download-artifact restores `<triple>/release/<name>[.exe]`.
          for name in tcl-lsp-server tcl-mcp tcl f5-query; do
            for bin in server-bins/*/release/"$name" server-bins/*/release/"$name".exe; do
              triple="$(printf '%s\n' "$bin" | sed -E 's#.*/([^/]+)/release/.*#\1#')"
              case "$bin" in *.exe) ext=".exe" ;; *) ext="" ;; esac
              cp "$bin" "out/${name}-${triple}${ext}"
              echo "staged out/${name}-${triple}${ext}"
            done
          done
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "error: no native binaries found in server-bins" >&2
            exit 1
          fi
          gh release upload "$tag" out/* --clobber

  # Build: the untargeted universal VSIX (bundles every native server
  # binary) plus six platform-targeted VSIXes, one per vsce --target
  # platform, so the Marketplace serves each client only its own binary.
  build-vsix:
    if: startsWith(github.ref, 'refs/tags/v')
    # test-ext / test-ext-web run as no-op-successes for pre-release tags
    # (their test steps are step-skipped), so they never skip this job's needs.
    #
    # `test-ext-web` is in this list because every VSIX flavour now carries the
    # browser language server (`dist/web`) and a manifest that declares
    # `browser` — which is what makes the Marketplace advertise web support. It
    # is the only job that proves that half works, so a VSIX must not be built
    # and signed without it.
    #
    # `lsp-server-wasi` is in it because the UNIVERSAL package carries the WASI
    # language server (`server/wasm/`) — the fallback rung for an architecture
    # none of the seven cross-compiled triples covers. That job builds and signs
    # the module; this one downloads its `wasi-module` artifact rather than
    # re-linking wasm32-wasip1 here, the same way it takes the native binaries
    # from `build-server-matrix` instead of cross-compiling them itself.
    needs: [create-release, test-ext, test-ext-web, build-server-matrix, linux-release-portability, lsp-server-wasi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # gh release upload
      id-token: write        # OIDC for sigstore-backed attestations
      attestations: write    # actions/attest-build-provenance writes here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default `fetch-depth: 1` + `fetch-tags` based on whether we're on a
          # tag ref (`git describe --tags` consumers need tags reachable from
          # HEAD; tag refs already have the tag at HEAD so don't re-fetch).
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # `make package-vsix` / `make claude-skills` shell out to `cargo xtask`, so
      # this job needs a toolchain. The runner image ships a pinned stable
      # (1.96.1) and `rust-toolchain.toml`'s `channel = "stable"` resolves to
      # *that*, not to the newest release, so cargo refuses the workspace's
      # `rust-version`. Install the current stable explicitly.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache-key: build-vsix

      # The VSIX embeds the spec studio, whose real LSP worker is built from
      # Rust to wasm32 and post-processed with the version matching its lockfile.
      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: wasm-bindgen-cli@0.2.127

      # No Python setup: the VSIX bundles native binaries and the build
      # (compile + filter-readme + vsce) is Node-only.

      - name: Download native server binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: server-bins-*
          path: target
          merge-multiple: true

      # Restored to the path the Makefile's `$(LSP_SERVER_WASI_MODULE)` names.
      # That rule is a FILE target whose prerequisites are the crate's own
      # sources, and this download runs after the checkout — `download-artifact`
      # extracts with `unzip-stream`, which does not restore the zip's stored
      # mtimes, so the module lands newer than every prerequisite.  It is used
      # as-is and nothing here re-links wasm32-wasip1.
      - name: Download the WASI language server module
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasi-module
          path: rust/tcl-lsp-server-wasi/dist

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Pin the npm CLI via the `packageManager` field in
      # editors/vscode/package.json. Corepack downloads and activates the
      # pinned npm so `npm ci` runs the same version locally and in CI.
      - name: Enable Corepack (pin npm via packageManager)
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          # `corepack enable` alone only shims pnpm/yarn; npm must be named
          # explicitly (`corepack enable npm`) or the shim isn't created and
          # the npm bundled with setup-node wins. Assert the pin is live so a
          # silent regression fails loudly instead of using the wrong npm.
          corepack enable npm
          cd editors/vscode
          active="$(npm --version)"
          echo "Active npm: $active (pinned via packageManager)"
          case "$active" in
            12.*) ;;
            *) echo "::error::expected npm 12 from packageManager pin, got $active"; exit 1 ;;
          esac

      # `package-lock.json` is committed, so installs are pinned by hash.
      # Cache the npm metadata directory keyed on the lockfile so the
      # cache invalidates whenever the resolved dependency tree changes.
      - name: Cache npm registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('editors/vscode/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install npm dependencies
        run: cd editors/vscode && npm ci

      # Bundle all seven native binaries into one untargeted "universal"
      # VSIX — the Marketplace's fallback for any client with no dedicated
      # targeted package below (namely riscv64 Linux — vsce has no --target
      # string for it), and the artefact for a manual "Install from VSIX"
      # side-load.  It also stages the WASI module downloaded above, which is
      # what makes the universal package work on an architecture with no native
      # binary at all; `verify-vsix` asserts both halves.
      - name: Build and verify universal VSIX
        run: make package-vsix BUNDLED_TARGETS="$(make -s print-server-targets-all)"

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/tcl-lsp-vscode-*-universal.vsix"
          artefact-name: vsix-universal

      # The bare module as a Release asset too, so an editor that is not VS Code
      # can fetch it and run it under wasmtime (INSTALL-editors.md).  Attached
      # from here rather than from the job that built it: this one depends on
      # `create-release`, so the Release object provably exists.  The artefact
      # name differs from the `wasi-module` upload above only because two
      # workflow artifacts in one run may not share a name.
      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "rust/tcl-lsp-server-wasi/dist/tcl-lsp-server-wasi.wasm"
          artefact-name: wasi-module-signed

      # Six small, single-binary VSIXes, one per vsce --target platform
      # (win32/linux/darwin x x64/arm64), so the Marketplace serves each
      # client only its own binary instead of the universal VSIX above. See
      # package-vsix-targets in the Makefile.
      - name: Build and verify platform-targeted VSIXes
        run: make package-vsix-targets

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/tcl-lsp-vscode-*-win32-x64.vsix"
          artefact-name: vsix-win32-x64

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/tcl-lsp-vscode-*-win32-arm64.vsix"
          artefact-name: vsix-win32-arm64

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/tcl-lsp-vscode-*-linux-x64.vsix"
          artefact-name: vsix-linux-x64

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/tcl-lsp-vscode-*-linux-arm64.vsix"
          artefact-name: vsix-linux-arm64

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/tcl-lsp-vscode-*-darwin-x64.vsix"
          artefact-name: vsix-darwin-x64

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/tcl-lsp-vscode-*-darwin-arm64.vsix"
          artefact-name: vsix-darwin-arm64

  # ---------------------------------------------------------------------
  # build-claude-skills packages the Claude Code skills bundle, then attests
  # and uploads it. The skills drive the native MCP server, so nothing here
  # builds or ships the retired AI zipapp any more.
  # ---------------------------------------------------------------------
  build-claude-skills:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default `fetch-depth: 1` + `fetch-tags` based on whether we're on a
          # tag ref (`git describe --tags` consumers need tags reachable from
          # HEAD; tag refs already have the tag at HEAD so don't re-fetch).
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # `make package-vsix` / `make claude-skills` shell out to `cargo xtask`, so
      # this job needs a toolchain. The runner image ships a pinned stable
      # (1.96.1) and `rust-toolchain.toml`'s `channel = "stable"` resolves to
      # *that*, not to the newest release, so cargo refuses the workspace's
      # `rust-version`. Install the current stable explicitly.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache-key: build-claude-skills


      - name: Build Claude skills zip (native, MCP-driven — no Python)
        run: make claude-skills

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/tcl-lsp-claude-skills-*.zip"
          artefact-name: claude-skills

  # Build: JetBrains plugin
  # Universal plugin: bundles every SERVER_TARGETS_JETBRAINS platform (all
  # seven SERVER_TARGET_MAP triples except riscv64 Linux, which no official
  # JetBrains IDE build targets). Reuses build-server-matrix's cross-compiled
  # binaries rather than cross-compiling again — same source build-vsix uses.
  build-jetbrains:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release, build-server-matrix, linux-release-portability]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # gh release upload
      id-token: write        # OIDC for sigstore-backed attestations
      attestations: write    # actions/attest-build-provenance writes here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default `fetch-depth: 1` + `fetch-tags` based on whether we're on a
          # tag ref (`git describe --tags` consumers need tags reachable from
          # HEAD; tag refs already have the tag at HEAD so don't re-fetch).
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Download native server binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: server-bins-*
          path: target
          merge-multiple: true

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache-key: build-jetbrains

      # The JetBrains plugin embeds the same spec studio as the VSIX. Keep the
      # CLI pinned to the wasm-bindgen crate version in the standalone lockfile.
      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: wasm-bindgen-cli@0.2.127

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            editors/jetbrains/*.gradle*
            editors/jetbrains/gradle/wrapper/gradle-wrapper.properties

      - name: Build JetBrains plugin (universal — every platform except riscv64)
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: make build-editor-jetbrains JB_BUNDLED_TARGETS="$(make -s print-server-targets-jetbrains)"

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/tcl-lsp-jetbrains-*.zip"
          artefact-name: jetbrains-plugin

  # Build: Sublime Text package
  build-sublime:
    if: startsWith(github.ref, 'refs/tags/v')
    # build-server-matrix is needed for its *digests*, not its binaries: the
    # package ships no server, but it pins the SHA-256 of each one this
    # release will carry so plugin.py verifies its download against a digest
    # that travelled inside the package rather than one served from the same
    # release as the binary.
    needs: [create-release, build-server-matrix, linux-release-portability]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # gh release upload
      id-token: write        # OIDC for sigstore-backed attestations
      attestations: write    # actions/attest-build-provenance writes here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default `fetch-depth: 1` + `fetch-tags` based on whether we're on a
          # tag ref (`git describe --tags` consumers need tags reachable from
          # HEAD; tag refs already have the tag at HEAD so don't re-fetch).
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # Restores `<triple>/release/tcl-lsp-server[.exe]` — the same bytes
      # publish-native-binaries attaches to the release, so hashing them here
      # pins exactly what the plugin will later download.
      - name: Download server-matrix binaries (for their digests)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: server-bins-*
          path: server-bins
          merge-multiple: true

      # The Sublime package is pure resources — no Rust toolchain, no Python
      # beyond the runner's preinstalled stdlib for the zip smoke-test.  It
      # ships one artefact for every platform and `plugin.py` downloads the
      # `tcl-lsp-server-<triple>` asset published by publish-native-binaries
      # for the host, so the server MUST stay out of this package.
      - name: Build Sublime Text package
        run: make build-editor-sublime SERVER_BINS_DIR=server-bins

      - name: Smoke-test Sublime package
        run: |
          python3 -c "
          import zipfile, json
          zf = zipfile.ZipFile('build/TclLsp.sublime-package')
          names = zf.namelist()
          assert not any(n.startswith('server/') for n in names), 'bundles a server'
          assert 'Tcl.sublime-syntax' in names, 'missing Tcl syntax'
          assert 'iRule.sublime-syntax' in names, 'missing iRule syntax'
          assert 'plugin.py' in names, 'missing plugin'
          assert 'LSP-Tcl.sublime-settings' in names, 'missing LSP settings'
          assert '.python-version' in names, 'missing plugin_host selector'
          assert any(n.startswith('specs/') for n in names), 'missing spec packs'
          manifest = json.loads(zf.read('server_version.json'))
          version = manifest['version']
          tag = '${{ github.ref_name }}'
          assert version == tag[1:], f'server_version {version} != tag {tag}'
          # A released package must pin the digest of every server it can
          # download; without the pins plugin.py silently degrades to the
          # release's own SHA256SUMS, which is integrity only.
          pins = manifest.get('servers') or {}
          for triple in ('x86_64-unknown-linux-gnu', 'aarch64-unknown-linux-gnu',
                         'x86_64-apple-darwin', 'aarch64-apple-darwin',
                         'x86_64-pc-windows-msvc', 'aarch64-pc-windows-msvc'):
              assert len(pins.get(triple, '')) == 64, f'no server pin for {triple}'
          print(f'OK: {len(names)} entries, server version {version}, {len(pins)} pins')
          "

      # Package Control has no pre-release channel, and — unlike the VS Code
      # Marketplace — it ignores GitHub's `prerelease` flag: its GitHub client
      # skips only *drafts*, then takes the newest release carrying an asset
      # that matches the channel entry's exact name.  So the odd-minor
      # pre-release line is kept off the channel by NAME: only a stable tag
      # publishes `TclLsp.sublime-package`.  Pre-release testers still get a
      # package, under a name the channel never resolves (rename it to
      # `TclLsp.sublime-package` to install it by hand).
      - name: Name the package for its release channel
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$(bash scripts/release/prerelease.sh "$tag")" = "true" ]; then
            mv build/TclLsp.sublime-package build/TclLsp-prerelease.sublime-package
            echo "pre-release tag $tag -> TclLsp-prerelease.sublime-package (off the Package Control channel)"
          else
            echo "stable tag $tag -> TclLsp.sublime-package (what Package Control resolves)"
          fi

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/TclLsp*.sublime-package"
          artefact-name: sublime-package

  # Build: Zed extension
  build-zed:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # gh release upload
      id-token: write        # OIDC for sigstore-backed attestations
      attestations: write    # actions/attest-build-provenance writes here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default `fetch-depth: 1` + `fetch-tags` based on whether we're on a
          # tag ref (`git describe --tags` consumers need tags reachable from
          # HEAD; tag refs already have the tag at HEAD so don't re-fetch).
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # `make build-editor-zed` bundles the native tcl-lsp-server + tcl-mcp
      # binaries and builds the Zed WASM extension — Rust only, no Python.
      - name: Set up Rust
        # actions-rust-lang/setup-rust-toolchain wraps swatinem/rust-cache
        # so we get cargo registry / target caching for free — meaningful
        # speedup vs the bare dtolnay/rust-toolchain action.
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          target: wasm32-wasip2
          components: clippy, rustfmt

      - name: Build Zed extension
        run: make build-editor-zed

      - name: Smoke-test Zed archive
        run: |
          python3 -c "
          import zipfile, glob
          path = glob.glob('build/tcl-lsp-zed-*.zip')[0]
          zf = zipfile.ZipFile(path)
          names = zf.namelist()
          assert 'extension.toml' in names, 'missing extension.toml'
          assert 'extension.wasm' in names, 'missing extension.wasm'
          assert any('languages/tcl/config.toml' in n for n in names), 'missing Tcl language config'
          assert any('snippets/tcl.json' in n for n in names), 'missing snippets'
          print(f'OK: {len(names)} entries')
          "

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/tcl-lsp-zed-*.zip"
          artefact-name: zed-extension

  # Publish: aggregate SHA256SUMS over every artefact attached to the
  # release, plus an optional cosign keyless signature. The installer
  # verifies downloaded artefacts against this file.
  publish-checksums:
    # Decoupled from the peripheral build jobs: this step downloads and sums
    # *whatever* is attached to the release, so a peripheral build that fails
    # (e.g. a zipapp profile, an editor package) must not block it — and must
    # not block the Marketplace publish that depends on it.  It runs once all
    # builds have settled (success or failure — `!cancelled()` lets the `if`
    # evaluate despite a failed/​skipped need) but only requires the CORE to have
    # succeeded: create-release (the release object) and build-vsix (the artifact
    # the Marketplace publish ships).  The peripheral builds stay in `needs` for
    # ordering only.
    if: >-
      !cancelled()
      && startsWith(github.ref, 'refs/tags/v')
      && needs.create-release.result == 'success'
      && needs.build-vsix.result == 'success'
    needs: [create-release, build-vsix, build-claude-skills, build-jetbrains, build-sublime, build-zed, publish-native-binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # gh release upload
      id-token: write   # cosign keyless OIDC signing
    steps:
      - name: Determine tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Download every release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          # Pull every asset currently attached to the release; this
          # gives a single SUMS covering whatever was uploaded by the
          # 12 build jobs (or by future ones, without further edits).
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir dist \
            --clobber

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          # Sort for deterministic ordering. Exclude any pre-existing
          # SHA256SUMS{,.cosign.bundle} so a rerun doesn't hash itself.
          find . -maxdepth 1 -type f \
            ! -name SHA256SUMS \
            ! -name 'SHA256SUMS.*' \
            -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs -r sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" dist/SHA256SUMS \
            --repo "${{ github.repository }}" --clobber

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin the cosign binary itself, not just the installer action.
          # Without this, the installer downloads "latest" cosign — which
          # is itself a moving target.  Bump in lockstep with the action.
          cosign-release: 'v2.6.3'

      - name: Sign SHA256SUMS (keyless OIDC)
        working-directory: dist
        run: |
          cosign sign-blob --yes \
            --bundle SHA256SUMS.cosign.bundle \
            SHA256SUMS

      - name: Upload SHA256SUMS.cosign.bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" dist/SHA256SUMS.cosign.bundle \
            --repo "${{ github.repository }}" --clobber

  # VS Code Marketplace publish.  The publish token (VSCE_PAT) is an
  # Environment secret on `marketplace-vscode` — a protected Environment
  # (required reviewer + a v*-tag-only deployment policy).  Per the
  # AGENTS.md invariant, a publish secret may live in CI only when it is
  # stored this way: reachable solely by a job that targets the protected
  # Environment, which PAUSES for manual approval and can never run on a
  # non-tag ref.  (The keyless OIDC -> Azure Entra path was rolled back
  # after it proved unreliable against the VS Code Marketplace; the PAT is
  # the supported mechanism, matching the stable channel from `rust`.)  Hardening
  # choices preserved from the keyless design:
  #   * VSCE_PAT is scoped to the publish step's `env:` only, so the
  #     freshly-fetched npm code in `npm ci` never runs with the token in
  #     its environment.
  #   * the .vsix is pulled from the GitHub Release (which persists) and
  #     checksum-verified against the cosign-signed SHA256SUMS — not from a
  #     workflow artifact, which cleanup-*-artifacts could delete while this
  #     job sits waiting for approval.
  #
  # Gated off until PUBLISH_VSIX_MARKETPLACE is set (a non-secret flag
  # variable), so forks/clones without the secret never reach the gate.
  # Nothing depends on this job, so its approval wait never blocks cleanup.
  publish-vsix-marketplace:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_VSIX_MARKETPLACE == 'true'
    needs: [build-vsix, publish-checksums]
    runs-on: ubuntu-24.04
    environment: marketplace-vscode
    permissions:
      contents: read # gh release download
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable Corepack (pin npm via packageManager)
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: corepack enable npm

      - name: Install vsce from the committed lockfile
        run: cd editors/vscode && npm ci

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'

      - name: Download the released VSIX and verify against the signed SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          mkdir -p dist && cd dist
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.vsix' --pattern 'SHA256SUMS' \
            --pattern 'SHA256SUMS.cosign.bundle' --clobber
          # Verify SHA256SUMS is the manifest publish-checksums actually signed
          # (keyless OIDC) BEFORE trusting any hash in it.  The Release stays
          # mutable while this job waits for approval, so an actor with
          # release-write could otherwise swap the .vsix AND SHA256SUMS as a
          # self-consistent pair and pass a bare `sha256sum -c`.  Pinning the
          # cosign identity to this repo's ci.yml on a v* tag makes that swap
          # detectable.
          cosign verify-blob \
            --bundle SHA256SUMS.cosign.bundle \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/bitwisecook/tcl-lsp/\.github/workflows/ci\.yml@refs/tags/v' \
            SHA256SUMS
          # --ignore-missing: SHA256SUMS lists every release asset; we only
          # fetched the .vsix, so verify just that one (others are skipped).
          sha256sum -c --ignore-missing SHA256SUMS

      - name: Publish to VS Code Marketplace
        # Body lives in scripts/release/vsce_publish.sh: runs only the local
        # vsce binary and adds --pre-release for odd-minor 2.x tags
        # (scripts/release/prerelease.sh is the single source of truth).
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bash scripts/release/vsce_publish.sh

  # Open VSX (open-vsx.org) publish — what code-server / openvscode-server /
  # Gitpod / Theia installs use.  Mirrors publish-vsix-marketplace exactly:
  # the publish token (OVSX_PAT) is an Environment secret on the protected
  # `marketplace-openvsx` Environment (required reviewer + a v*-tag-only
  # deployment policy).  Per the AGENTS.md invariant, a publish secret may
  # live in CI only when it is stored this way: reachable solely by a job
  # that targets the protected Environment, which PAUSES for manual approval
  # and can never run on a non-tag ref.  Hardening carried over from the
  # VS Code job:
  #   * OVSX_PAT is scoped to the publish step's `env:` only, so the
  #     freshly-fetched npm code in `npm ci` never runs with the token in
  #     its environment.
  #   * the .vsix is pulled from the GitHub Release (which persists) and
  #     checksum-verified against the cosign-signed SHA256SUMS — not from a
  #     workflow artifact, which cleanup-*-artifacts could delete while this
  #     job sits waiting for approval.
  #
  # Gated off until PUBLISH_VSIX_OPENVSX is set (a non-secret flag
  # variable), so forks/clones without the secret never reach the gate.
  # Nothing depends on this job, so its approval wait never blocks cleanup.
  publish-vsix-openvsx:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_VSIX_OPENVSX == 'true'
    needs: [build-vsix, publish-checksums]
    runs-on: ubuntu-24.04
    environment: marketplace-openvsx
    permissions:
      contents: read # gh release download
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable Corepack (pin npm via packageManager)
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: corepack enable npm

      - name: Install ovsx from the committed lockfile
        run: cd editors/vscode && npm ci

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'

      - name: Download the released VSIX and verify against the signed SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          mkdir -p dist && cd dist
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.vsix' --pattern 'SHA256SUMS' \
            --pattern 'SHA256SUMS.cosign.bundle' --clobber
          # Verify SHA256SUMS is the manifest publish-checksums actually signed
          # (keyless OIDC) BEFORE trusting any hash in it.  The Release stays
          # mutable while this job waits for approval, so an actor with
          # release-write could otherwise swap the .vsix AND SHA256SUMS as a
          # self-consistent pair and pass a bare `sha256sum -c`.  Pinning the
          # cosign identity to this repo's ci.yml on a v* tag makes that swap
          # detectable.
          cosign verify-blob \
            --bundle SHA256SUMS.cosign.bundle \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/bitwisecook/tcl-lsp/\.github/workflows/ci\.yml@refs/tags/v' \
            SHA256SUMS
          # --ignore-missing: SHA256SUMS lists every release asset; we only
          # fetched the .vsix, so verify just that one (others are skipped).
          sha256sum -c --ignore-missing SHA256SUMS

      - name: Publish to Open VSX
        # Body lives in scripts/release/ovsx_publish.sh: runs only the local
        # ovsx binary.  The channel isn't chosen here — ovsx ignores
        # --pre-release for an already-packaged VSIX, so it rides in the
        # VSIX manifest instead, baked in by `vsce package` at build time
        # (scripts/release/prerelease.sh is still the single source of
        # truth for that manifest flag).
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: bash scripts/release/ovsx_publish.sh

  # JetBrains Marketplace publish.  Mirrors publish-vsix-marketplace exactly:
  # the publish token (JETBRAINS_TOKEN) is an Environment secret on the
  # protected `marketplace-jetbrains` Environment (required reviewer + a
  # v*-tag-only deployment policy), so — per the AGENTS.md invariant — it is
  # reachable solely by a job that PAUSES for manual approval and can never
  # run on a non-tag ref.  Hardening carried over from the VS Code job:
  #   * JETBRAINS_TOKEN is scoped to the publish step's `env:` only.
  #   * the plugin .zip is pulled from the GitHub Release (which persists) and
  #     checksum-verified against the cosign-signed SHA256SUMS — not from a
  #     workflow artifact, which cleanup-*-artifacts could delete while this
  #     job sits waiting for approval.
  #
  # Gated off until PUBLISH_JETBRAINS_MARKETPLACE is set (a non-secret flag
  # variable), so forks/clones without the secret never reach the gate.
  # Nothing depends on this job, so its approval wait never blocks cleanup.
  publish-jetbrains-marketplace:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_JETBRAINS_MARKETPLACE == 'true'
    needs: [build-jetbrains, publish-checksums]
    runs-on: ubuntu-24.04
    environment: marketplace-jetbrains
    permissions:
      contents: read # gh release download
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'

      - name: Download the released plugin zip and verify against the signed SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          mkdir -p dist && cd dist
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'tcl-lsp-jetbrains-*.zip' --pattern 'SHA256SUMS' \
            --pattern 'SHA256SUMS.cosign.bundle' --clobber
          # Verify SHA256SUMS is the manifest publish-checksums actually signed
          # (keyless OIDC) BEFORE trusting any hash in it.  The Release stays
          # mutable while this job waits for approval, so an actor with
          # release-write could otherwise swap the .zip AND SHA256SUMS as a
          # self-consistent pair and pass a bare `sha256sum -c`.  Pinning the
          # cosign identity to this repo's ci.yml on a v* tag makes that swap
          # detectable.
          cosign verify-blob \
            --bundle SHA256SUMS.cosign.bundle \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/bitwisecook/tcl-lsp/\.github/workflows/ci\.yml@refs/tags/v' \
            SHA256SUMS
          # --ignore-missing: SHA256SUMS lists every release asset; we only
          # fetched the .zip, so verify just that one (others are skipped).
          sha256sum -c --ignore-missing SHA256SUMS

      - name: Publish to JetBrains Marketplace
        # Body lives in scripts/release/jetbrains_publish.sh: uploads the
        # verified zip via the Marketplace API and picks the "eap" channel for
        # odd-minor 2.x tags (scripts/release/prerelease.sh is the single
        # source of truth).
        env:
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
        run: bash scripts/release/jetbrains_publish.sh

  # Cleanup: delete workflow artifacts for all releases except the 3 most recent
  cleanup-old-artifacts:
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [build-vsix, build-claude-skills, build-jetbrains, build-sublime, build-zed, publish-checksums]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete artifacts outside the 3 most recent releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Get the 3 most recent non-draft release tags
          mapfile -t keep_tags < <(
            gh release list --repo "$REPO" --json tagName,isDraft,createdAt \
              | jq -r '[.[] | select(.isDraft==false)] | sort_by(.createdAt) | reverse | .[:3] | .[].tagName'
          )
          echo "Retaining artifacts for: ${keep_tags[*]}"

          # Always keep the current run (it may still be in_progress in the API)
          keep_runs=("${{ github.run_id }}")
          echo "  keeping run ${{ github.run_id }} (current)"

          # Resolve each tag to its most recent completed CI run
          for tag in "${keep_tags[@]}"; do
            run_id=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=push&branch=$tag&per_page=10" \
              | jq -r '[.workflow_runs[] | select(.status=="completed")] | first | .id // empty')
            if [[ -n "$run_id" && "$run_id" != "${{ github.run_id }}" ]]; then
              keep_runs+=("$run_id")
              echo "  keeping run $run_id for $tag"
            fi
          done

          # Page through all artifacts; delete those not from a kept run
          page=1
          while :; do
            payload=$(gh api "repos/$REPO/actions/artifacts?per_page=100&page=$page")
            count=$(jq '.artifacts | length' <<< "$payload")
            [[ "$count" -eq 0 ]] && break
            while IFS=$'\t' read -r art_id run_id; do
              if printf '%s\n' "${keep_runs[@]}" | grep -qx "$run_id"; then
                echo "  keeping artifact $art_id (run $run_id)"
              else
                echo "  deleting artifact $art_id (run $run_id)"
                gh api --method DELETE "repos/$REPO/actions/artifacts/$art_id"
              fi
            done < <(jq -r '.artifacts[] | [.id | tostring, .workflow_run.id | tostring] | @tsv' <<< "$payload")
            (( page++ ))
          done

  # Cleanup: delete all non-release artifacts (runs only during releases)
  cleanup-untagged-artifacts:
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [build-vsix, build-claude-skills, build-jetbrains, build-sublime, build-zed, publish-checksums]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete all artifacts not from the 3 most recent releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Find the 3 most recent release run IDs to protect
          keep_runs=()
          while IFS= read -r tag; do
            run_id=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=push&branch=$tag&per_page=5" \
              | jq -r '[.workflow_runs[] | select(.status=="completed")] | first | .id // empty')
            if [[ -n "$run_id" ]]; then
              keep_runs+=("$run_id")
              echo "  protecting release run $run_id ($tag)"
            fi
          done < <(
            gh release list --repo "$REPO" --json tagName,isDraft,createdAt \
              | jq -r '[.[] | select(.isDraft==false)] | sort_by(.createdAt) | reverse | .[:3] | .[].tagName'
          )

          # Delete everything else
          page=1
          while :; do
            payload=$(gh api "repos/$REPO/actions/artifacts?per_page=100&page=$page")
            count=$(jq '.artifacts | length' <<< "$payload")
            [[ "$count" -eq 0 ]] && break
            while IFS=$'\t' read -r art_id run_id; do
              if printf '%s\n' "${keep_runs[@]}" | grep -qx "$run_id"; then
                echo "  keeping artifact $art_id (release run $run_id)"
              else
                echo "  deleting artifact $art_id (run $run_id)"
                gh api --method DELETE "repos/$REPO/actions/artifacts/$art_id"
              fi
            done < <(jq -r '.artifacts[] | [.id | tostring, .workflow_run.id | tostring] | @tsv' <<< "$payload")
            (( page++ ))
          done
