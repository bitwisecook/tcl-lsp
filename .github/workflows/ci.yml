name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for every job: read-only.  Jobs that need to
# write to the repo (releases, artefact uploads, attestations) escalate
# explicitly in their own `permissions:` block.  A compromised step in
# `pr-gate` / `test-py` / `test-ext` therefore cannot push commits or
# create releases even if the repo-level default is "Read and write".
permissions:
  contents: read

jobs:
  # Fast PR gate (target wall-clock < 20s).  Runs on every PR and every push.
  # Covers: lint + typecheck + structural invariants + a tightly scoped pytest
  # subset that exercises the LSP server end-to-end.  Everything else is the
  # responsibility of `make test-slow` locally (enforced by the pre-push
  # hook installed via `make install-hooks`).  See AGENTS.md for the rule
  # that agents must run test-slow before opening a PR.
  pr-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # `make build-info` (a dep of ci-fast) shells out to `git describe
          # --tags`, which needs the full history.
          fetch-depth: 0

      - name: Log commit info
        # `github.head_ref` is the PR source branch and is attacker-controlled
        # on forked-PR runs — interpolating it directly into `run:` is the
        # classic GitHub Actions expression-injection vector.  Pipe every
        # workflow-context value through `env:` so the shell sees a plain
        # variable, not template-expanded source.
        env:
          GH_SHA: ${{ github.sha }}
          GH_EVENT: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
          GH_HEAD_REF: ${{ github.head_ref }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          echo "::group::Commit info"
          echo "github.sha        = $GH_SHA"
          echo "github.event_name = $GH_EVENT"
          echo "github.ref        = $GH_REF"
          echo "github.head_ref   = $GH_HEAD_REF"
          echo "github.run_id     = $GH_RUN_ID"
          echo "checked-out HEAD  = $(git rev-parse HEAD)"
          echo "::endgroup::"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          # v6's cache keys on uv.lock by default and works correctly
          # (the v4 lockfile-glob bug is fixed).  Trims a few seconds off
          # the gate on warm runs.
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Sync Python environment
        run: uv sync --extra dev

      # Note: no wasmtime CLI setup here — the Python tests in ci-fast
      # use the `wasmtime` Python package (already a uv dep) for any
      # wasm execution, and `make test-zig` (which needs the CLI) is a
      # test-slow target that runs locally, not in CI.  If a CI job for
      # `test-zig` is ever added, the optimal action is
      # `bytecodealliance/actions/wasmtime/setup@v1`.
      - name: Run fast CI gate (make ci-fast)
        run: make ci-fast

  # Backstop: full Python test suite — runs only on push to main and on tags.
  # PRs are gated by pr-gate; this job catches anything pr-gate missed once
  # the change has merged, so a regression is loud but doesn't block PRs.
  test-py:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10"]
      fail-fast: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log commit info
        # See pr-gate for why these go through `env:` rather than direct
        # `${{ github.* }}` interpolation in the run script.
        env:
          GH_SHA: ${{ github.sha }}
          GH_EVENT: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
          GH_HEAD_REF: ${{ github.head_ref }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          echo "::group::Commit info"
          echo "github.sha        = $GH_SHA"
          echo "github.event_name = $GH_EVENT"
          echo "github.ref        = $GH_REF"
          echo "github.head_ref   = $GH_HEAD_REF"
          echo "github.run_id     = $GH_RUN_ID"
          echo "checked-out HEAD  = $(git rev-parse HEAD)"
          echo
          git log -1 --pretty=fuller HEAD || true
          echo "::endgroup::"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Zig (needed for runtime auto-build)
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          # Explicit: setup-zig defaults to use-cache=true, but be loud
          # about it so a future bump can't silently flip the default.
          # Caches both the zig toolchain download and the zig-cache dir
          # keyed on build.zig{,.zon} when present.
          use-cache: true

      - name: Fetch Tcl regex engine sources (runtime/zig/vendor/tcl-regex)
        run: bash scripts/fetch_tcl_regex.sh

      - name: Sync Python environment
        run: uv sync --extra dev

      - name: Run Python tests
        run: >-
          uv run --extra dev pytest tests/ -q
          -m "not slow"
          --ignore-glob='*/test_vm_*_test.py'
          --ignore=tests/test_optimiser_coverage.py
          --ignore=tests/test_optimiser_vm_equivalence.py
          --ignore=tests/test_irule_test_framework.py
          --ignore=tests/test_real_world_examples.py
          --ignore=tests/test_bigip_parser.py
          --ignore=tests/test_bigip_validator.py
          -k 'not TestUnusedIruleProcs and not TestMockStubsIntegration and not test_generated_command_hover_marks_refinement_status and not test_generated_irules_hover_marks_refinement_status and not test_cookbook_tcp_collect_has_no_warnings'
  # Backstop: VS Code extension tests — runs only on push to main and on tags.
  # PRs are gated by pr-gate; locally this is covered by `make test-slow`.
  test-ext:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log commit info
        # See pr-gate for why these go through `env:` rather than direct
        # `${{ github.* }}` interpolation in the run script.
        env:
          GH_SHA: ${{ github.sha }}
          GH_EVENT: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
          GH_HEAD_REF: ${{ github.head_ref }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          echo "::group::Commit info"
          echo "github.sha        = $GH_SHA"
          echo "github.event_name = $GH_EVENT"
          echo "github.ref        = $GH_REF"
          echo "github.head_ref   = $GH_HEAD_REF"
          echo "github.run_id     = $GH_RUN_ID"
          echo "checked-out HEAD  = $(git rev-parse HEAD)"
          echo
          git log -1 --pretty=fuller HEAD || true
          echo "::endgroup::"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Sync Python environment
        run: uv sync --extra dev

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"

      # The repo doesn't commit `package-lock.json`, so setup-node's
      # built-in `cache: 'npm'` (which needs a lockfile) won't work.
      # Cache the npm metadata directory instead so `npm install` skips
      # the network for tarballs it already has.  Key on package.json so
      # the cache invalidates whenever declared deps change.
      - name: Cache npm registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('editors/vscode/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install npm dependencies
        run: cd editors/vscode && npm install

      - name: Lint TypeScript
        run: cd editors/vscode && npm run lint

      - name: Copy canonical AI data
        run: make copy-canonical

      - name: Compile TypeScript
        run: cd editors/vscode && npx tsc -p ./

      - name: Run extension tests
        run: make test-ext

  # Release: create (or verify) the GitHub Release so each build job
  # can upload its artifact independently — no single slow or failing
  # build blocks the others.
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pr-gate, test-py]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # gh release upload
      id-token: write        # OIDC for sigstore-backed attestations
      attestations: write    # actions/attest-build-provenance writes here
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            if [ -f RELEASE_NOTES.md ]; then
              gh release create "$tag" \
                --title "$tag" \
                --notes-file RELEASE_NOTES.md
            else
              gh release create "$tag" \
                --title "$tag" \
                --generate-notes
            fi
          fi

      - name: Stamp + upload installer script to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          sha="$(git rev-parse --short HEAD)"
          # Replace the @@INSTALLER_VERSION_*@@ placeholders so a user
          # running --version on the published asset sees the actual
          # release. The in-tree script on main stays unstamped so
          # contributors don't see misleading version strings locally.
          tmp="$(mktemp)"
          sed \
            -e "s/@@INSTALLER_VERSION_TAG@@/${tag}/" \
            -e "s/@@INSTALLER_VERSION_SHA@@/(${sha})/" \
            scripts/install.sh > "$tmp"
          # Sanity-check that both placeholders were actually replaced
          # before we upload — failing loudly here beats publishing a
          # script that reports itself as "dev (unstamped)".
          if grep -q '@@INSTALLER_VERSION_' "$tmp"; then
              echo "ERROR: installer placeholder was not stamped" >&2
              grep '@@INSTALLER_VERSION_' "$tmp" >&2
              exit 1
          fi
          install -m 0755 "$tmp" install.sh
          rm -f "$tmp"
          gh release upload "$tag" install.sh --clobber

  # Build: VSIX package
  build-vsix:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release, test-ext]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # gh release upload
      id-token: write        # OIDC for sigstore-backed attestations
      attestations: write    # actions/attest-build-provenance writes here
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"

      # The repo doesn't commit `package-lock.json`, so setup-node's
      # built-in `cache: 'npm'` (which needs a lockfile) won't work.
      # Cache the npm metadata directory instead so `npm install` skips
      # the network for tarballs it already has.  Key on package.json so
      # the cache invalidates whenever declared deps change.
      - name: Cache npm registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('editors/vscode/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Sync Python environment
        run: uv sync --extra dev

      - name: Install npm dependencies
        run: cd editors/vscode && npm install

      - name: Build and verify VSIX
        run: make package-vsix

      # SLSA build provenance: binds every artefact to the workflow run
      # and source commit that produced it.  Verifiable post-hoc with
      # `gh attestation verify --owner bitwisecook <file>`.  Complements
      # the cosign-signed SHA256SUMS (which proves the *set* of files is
      # what we published) with per-file proof of build provenance.
      - name: Attest VSIX build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "build/*.vsix"

      - name: Upload VSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vsix
          path: "build/*.vsix"
          retention-days: 7

      - name: Upload VSIX to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release upload "$tag" build/*.vsix --clobber

  # Build: CLI zipapp
  build-zipapp-cli:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # gh release upload
      id-token: write        # OIDC for sigstore-backed attestations
      attestations: write    # actions/attest-build-provenance writes here
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Sync Python environment
        run: uv sync --extra dev

      - name: Build CLI zipapp
        run: make zipapp-cli

      - name: Smoke-test CLI zipapp
        run: python3 build/tcl-lsp-explorer-cli-*.pyz --help

      - name: Attest CLI zipapp build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "build/tcl-lsp-explorer-cli-*.pyz"

      - name: Upload CLI zipapp
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zipapp-cli
          path: "build/tcl-lsp-explorer-cli-*.pyz"
          retention-days: 7

      - name: Upload CLI zipapp to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release upload "$tag" build/tcl-lsp-explorer-cli-*.pyz --clobber

  # Build: F5 BIG-IP CLI zipapp
  build-zipapp-f5:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # gh release upload
      id-token: write        # OIDC for sigstore-backed attestations
      attestations: write    # actions/attest-build-provenance writes here
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Sync Python environment
        run: uv sync --extra dev

      - name: Build F5 BIG-IP zipapp
        run: make zipapp-f5

      - name: Smoke-test F5 BIG-IP zipapp
        run: |
          python3 build/f5-*.pyz --help
          python3 build/f5-*.pyz cleanup samples/bigip/bigip.conf
          python3 build/f5-*.pyz cleanup --json samples/bigip/bigip.conf > /tmp/cleanup.json
          python3 -c "import json; data = json.load(open('/tmp/cleanup.json')); assert 'candidates' in data, data; assert 'tmshScript' in data, data"
          # event-info / event-order are iRules-only verbs; they moved from
          # `tcl` to `f5 irule` in PR #387 when the irule binary alias was
          # dropped.
          python3 build/f5-*.pyz irule event-info HTTP_REQUEST --json
          # Bundled shell-completion scripts must round-trip through the zipapp
          # and parse cleanly under the corresponding shell where available.
          python3 build/f5-*.pyz completion bash > /tmp/f5.bash
          python3 build/f5-*.pyz completion fish > /tmp/f5.fish
          python3 build/f5-*.pyz completion zsh  > /tmp/_f5
          bash -n /tmp/f5.bash
          # zsh and fish aren't installed in CI; rely on the bash syntax
          # check plus the static unit tests for those scripts.

      - name: Attest F5 zipapp build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "build/f5-*.pyz"

      - name: Upload F5 zipapp
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zipapp-f5
          path: "build/f5-*.pyz"
          retention-days: 7

      - name: Upload F5 zipapp to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release upload "$tag" build/f5-*.pyz --clobber

  # Build: unified Tcl tools zipapp
  build-zipapp-tcl:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # gh release upload
      id-token: write        # OIDC for sigstore-backed attestations
      attestations: write    # actions/attest-build-provenance writes here
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Sync Python environment
        run: uv sync --extra dev

      - name: Build unified Tcl zipapp
        run: make zipapp-tcl

      - name: Smoke-test unified Tcl zipapp
        run: |
          python3 build/tcl-*.pyz --help
          python3 build/tcl-*.pyz format samples/for_screenshots/ai-scene.irul
          python3 build/tcl-*.pyz lint --source "set x 1"
          python3 build/tcl-*.pyz symbols samples/for_screenshots/ai-scene.irul --json
          python3 build/tcl-*.pyz callgraph samples/for_screenshots/ai-scene.irul --json
          python3 build/tcl-*.pyz command-info HTTP::uri --dialect f5-irules --json
          python3 build/tcl-*.pyz find-legacy samples/for_screenshots/ai-scene.irul --json
          python3 build/tcl-*.pyz highlight samples/for_screenshots/ai-scene.irul --no-colour
          python3 build/tcl-*.pyz diff samples/for_screenshots/ai-scene.irul samples/for_screenshots/ai-scene.irul --show ast --json
          python3 build/tcl-*.pyz help taint --dialect f5-irules

      - name: Attest unified Tcl zipapp build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "build/tcl-*.pyz"

      - name: Upload unified Tcl zipapp
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zipapp-tcl
          path: "build/tcl-*.pyz"
          retention-days: 7

      - name: Upload unified Tcl zipapp to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release upload "$tag" build/tcl-*.pyz --clobber

  # Build: GUI zipapp — CDN variant (tagged releases only)
  build-zipapp-gui:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # gh release upload
      id-token: write        # OIDC for sigstore-backed attestations
      attestations: write    # actions/attest-build-provenance writes here
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Sync Python environment
        run: uv sync --extra dev

      - name: Build CDN GUI zipapp
        run: make zipapp-gui-cdn

      - name: Smoke-test CDN GUI zipapp
        run: |
          python3 -c "
          import zipfile, glob
          path = glob.glob('build/tcl-lsp-explorer-gui-cdn-*.pyz')[0]
          zf = zipfile.ZipFile(path)
          names = zf.namelist()
          assert 'static/index.html' in names, 'missing index.html'
          assert 'static/worker.js' in names, 'missing worker.js'
          assert not any('pyodide' in n for n in names), 'should not bundle pyodide'
          print(f'OK: {len(names)} entries (CDN variant)')
          "

      - name: Attest CDN GUI zipapp build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "build/tcl-lsp-explorer-gui-cdn-*.pyz"

      - name: Upload CDN GUI zipapp
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zipapp-gui-cdn
          path: "build/tcl-lsp-explorer-gui-cdn-*.pyz"
          retention-days: 7

      - name: Upload CDN GUI zipapp to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
