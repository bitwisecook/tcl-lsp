        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-test-multi-folder
          path: editors/vscode/.vscode-test/mocha-result-multifolder.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Stable required status: all three single-root partitions and the unchanged
  # multi-folder producer must pass, and their metadata must prove exact once.
  test-ext:
    if: ${{ always() }}
    needs: [channel, test-ext-partition, test-ext-multi-folder]
    runs-on: ubuntu-26.04
    env:
      RUN_EXT: ${{ (needs.channel.outputs.ext_changed == 'true' || startsWith(github.ref, 'refs/tags/')) && needs.channel.outputs.already_green != 'true' && needs.channel.outputs.prerelease != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Propagate extension prerequisite failures
        env:
          CHANNEL: ${{ needs.channel.result }}
          PARTITIONS: ${{ needs.test-ext-partition.result }}
          MULTI: ${{ needs.test-ext-multi-folder.result }}
        run: |
          if [ "$CHANNEL" != success ] || { [ "$RUN_EXT" = true ] && { [ "$PARTITIONS" != success ] || [ "$MULTI" != success ]; }; }; then
            echo "channel=$CHANNEL partitions=$PARTITIONS multi=$MULTI" >&2
            exit 1
          fi
      - name: Download extension test metadata
        if: env.RUN_EXT == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vscode-test-*
          path: ${{ runner.temp }}/vscode-test-results
          merge-multiple: false
      - name: Verify extension test exact-once metadata
        if: env.RUN_EXT == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/vscode-test-results/partition-1" "$RUNNER_TEMP/vscode-test-results/partition-2" "$RUNNER_TEMP/vscode-test-results/partition-3" "$RUNNER_TEMP/vscode-test-results/multi-folder"
          for pair in '1 one' '2 two' '3 three'; do set -- $pair; mv "$RUNNER_TEMP/vscode-test-results/vscode-test-partition-$2/mocha-result.json" "$RUNNER_TEMP/vscode-test-results/partition-$1/"; done
          mv "$RUNNER_TEMP/vscode-test-results/vscode-test-multi-folder/mocha-result-multifolder.json" "$RUNNER_TEMP/vscode-test-results/multi-folder/"
          node scripts/dev/verify-vscode-test-results.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/vscode-test-results"

  # The same extension in a BROWSER extension host — vscode.dev / github.dev.
  #
  # `test-ext` above cannot cover this: it runs the `main` entry point against
  # the native binary, while the web host loads the `browser` entry point and
  # the wasm language server in a Web Worker.  Everything that only exists on
  # that path — the manifest's `browser` field, the staged `dist/web` worker
  # assets, the worker's own asset resolution under a cross-origin blob shim,
  # the JSON-RPC string/object adapter, the document selector's scheme filter —
  # is invisible to the desktop suite, and each of those failed silently rather
  # than loudly when it was wrong.
  #
  # Gated on BOTH path facts because it consumes both surfaces: the extension
  # (`ext_changed`) and the browser language server (`lsp_wasm_changed`).  Step-
  # level like every other skip here, so the job still reports success and the
  # release `needs:` graph stays intact.
  test-ext-web:
    needs: [channel]
    runs-on: ubuntu-26.04
    env:
      RUN_EXT_WEB: ${{ (needs.channel.outputs.ext_changed == 'true' || needs.channel.outputs.lsp_wasm_changed == 'true' || startsWith(github.ref, 'refs/tags/')) && needs.channel.outputs.already_green != 'true' && needs.channel.outputs.prerelease != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # The browser server is built here rather than fetched from the
      # `lsp-server-wasm` job: that job step-skips on its own narrower path
      # filter, so depending on its artefact would make this suite skip
      # whenever only `editors/vscode/**` changed — exactly when it is most
      # worth running.  Its own cache key keeps the release/LTO link warm.
      - name: Set up Rust
        if: env.RUN_EXT_WEB == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          cache-key: test-ext-web
          cache-workspaces: rust/tcl-lsp-server-wasm

      - name: Install wasm-bindgen CLI
        if: env.RUN_EXT_WEB == 'true'
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: wasm-bindgen-cli@0.2.128

      - name: Set up Node.js
        if: env.RUN_EXT_WEB == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable Corepack (pin npm via packageManager)
        if: env.RUN_EXT_WEB == 'true'
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable npm
          cd editors/vscode
          active="$(npm --version)"
          echo "Active npm: $active (pinned via packageManager)"
          case "$active" in
            12.*) ;;
            *) echo "::error::expected npm 12 from packageManager pin, got $active"; exit 1 ;;
          esac

      - name: Cache npm registry
        if: env.RUN_EXT_WEB == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('editors/vscode/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # `@vscode/test-web` depends on `@playwright/browser-chromium`, but npm's
      # install script is not a reliable browser provisioner on hosted runners.
      # Install the exact lockfile-resolved Chromium revision explicitly so a
      # Playwright update cannot leave test-web pointing at a missing binary.
      - name: Install npm dependencies
        if: env.RUN_EXT_WEB == 'true'
        run: |
          cd editors/vscode
          npm ci
          npx playwright install --with-deps chromium

      # `@vscode/test-web` downloads a VS Code *web* build on every run, the way
      # `@vscode/test-electron` downloads a desktop one in `test-ext`. Key on
      # the resolved commit from the same endpoint test-web itself uses: a
      # coarser key (a date window) is actively broken, because cache entries
      # are immutable, so a build that ships mid-window is downloaded but never
      # saved and every remaining run re-downloads. Falling back to a date stamp
      # when the endpoint is unreachable only costs a download.
      - name: Resolve the VS Code web build
        if: env.RUN_EXT_WEB == 'true'
        id: vscode-web-version
        run: |
          set -uo pipefail
          ver=""
          if curl -fsSL --max-time 20 -o /tmp/vscode-web.json \
               https://update.code.visualstudio.com/api/update/web-standalone/insider/latest; then
            ver=$(python3 -c 'import json; print(json.load(open("/tmp/vscode-web.json"))["version"])' 2>/dev/null || true)
          fi
          if [ -z "$ver" ]; then
            ver="unresolved-$(date -u +%Y-%m-%d)"
            echo "::warning::could not resolve the VS Code web build; using $ver"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "VS Code web (insider) resolves to: $ver"

      - name: Cache the VS Code web download
        if: env.RUN_EXT_WEB == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: editors/vscode/.vscode-test-web
          key: vscode-test-web-${{ runner.os }}-${{ steps.vscode-web-version.outputs.version }}

      - name: Build the browser language server
        if: env.RUN_EXT_WEB == 'true'
        run: make lsp-server-wasm

      # `npm run compile` stages `dist/web` best-effort, so a build that never
      # produced the worker assets would reach the browser as a runtime error
      # instead of a build failure. Here they must exist: `--require` says so.
      - name: Stage the browser assets (must exist)
        if: env.RUN_EXT_WEB == 'true'
        run: cd editors/vscode && node scripts/copy-web-assets.cjs --require

      # `pretest:web` runs `npm run compile` (both bundles + the staged
      # `dist/web` assets) and bundles the web test module for the browser.
      # Headless Chromium needs no X server, so no xvfb here.
      - name: Run the web extension-host smoke test
        if: env.RUN_EXT_WEB == 'true'
        timeout-minutes: 10
        run: cd editors/vscode && npm run test:web

  # Rust product gate.  ci.yml triggers on `rust`, so one
  # pipeline covers them.  Runs on every PR and push, because nothing else
  # exercises the Rust product on a PR.
  #
  # `cargo test --workspace --all-features --no-fail-fast`, Swatinem cache,
  # toolchain resolved from rust-toolchain.toml.
  #
  # The Rust/WASM surface is split across concurrent jobs so the CPU-bound
  # suites don't serialise behind each other. The first five required status
  # checks on `rust` are:
  #
  #   rust-tests-shard   five binary-aware consumers of the workspace suite
  #                     (minus VM-sim heavies and tcl-lsp-server)
  #   rust-tests-doctest all workspace doctests, independently concurrent with
  #                     the direct nextest consumers
  #   rust-tests-heavy  the VM-sim heavies (`tcl-irule-test`, `f5-cli`) plus
  #                     `tcl-fuzz`'s plumbing unit tests (excluded from
  #                     rust-tests-shard so wasmtime/cranelift stay out of the main
  #                     partition's build graph; fuzz campaigns themselves are
  #                     manual-only, never CI).  Measured 2026-08-13: ~44 s
  #                     total.  Kept split for concurrency, not because it is
  #                     still the long pole.
  #   lsp-e2e           the native lsp_e2e suite: spawns the real tcl-lsp-server
  #                     via nextest's archived runtime path and drives LSP JSON-RPC
  #                     over stdio (rust/tcl-lsp-server/tests/*_e2e.rs)
  #   cargo-deny        supply-chain audit, isolated so a denial is attributable
  #                     independently of the test surface
  #   wasm-real-link    the real whole-program WASM link, with the only CI
  #                     install of wasmtime / wasm32-wasip1 / wasi-sdk /
  #                     libtommath and `TCL_REQUIRE_WASM_LINK=1` so a missing
  #                     one fails instead of skipping.  NOT yet
  #                     wired into `create-release`'s `needs`, deliberately: it
  #                     downloads a wasi-sdk release asset, and a transient
  #                     404/timeout there must not be able to block a release.
  #                     Promote it (and to a required check) once it has proved
  #                     stable over a few weeks.  `tcl-compiler` is in
  #                     `rust-tests-shard`'s workspace run too, so `wasm_real_link.rs`
  #                     also executes there — without the toolchain, where it
  #                     skips loudly by naming what is missing.
  #   lsp-server-wasm   the real wasm-bindgen LSP server, driven through a
  #                     scripted JSON-RPC session under Node.  Path-filtered
  #                     to the browser server's local dependency closure.
  #   lsp-server-wasi   the real wasm32-wasip1 LSP server, driven through
  #                     scripted Content-Length-framed sessions under the
  #                     wasmtime CLI.  Same path filter — the two transports
  #                     share their whole dependency closure — but its own job,
  #                     because it is the only place the wasip1 arm of
  #                     `tcl_lsp_server::rt` is actually EXECUTED rather than
  #                     type-checked.  On a v* tag it is ALSO a release
  #                     producer: it builds the module unconditionally and hands
  #                     `build-vsix` the `wasi-module` artifact, which that job
  #                     stages into the universal VSIX and signs onto the
  #                     Release — the same producer/attacher split
  #                     `build-server-matrix` uses.
  #
  # Each nextest consumer keeps the exact whole-workspace/all-features resolver
  # graph, links every lib/bin unit harness, and links only its assigned
  # integration-test targets. Measured: direct hash shards spent 3m34–3m51
  # compiling/linking all 319 binaries before each 3m30–4m26 test partition.
  # A local exact-tree prototype linked/listed the 50 common unit harnesses
  # in 1m47 on a cold target and added 64 assigned integration targets in
  # 7.46s; its 4,568-test shard executed in 94.8s. The committed binary map
  # came from that measurement's complete timings. The aggregate checks it
  # against locked Cargo metadata and proves that every non-ignored testcase is
  # selected exactly once, so target drift or a bad filter fails closed.
  #
  # `tcl-lsp-server` is excluded from rust-tests-shard because lsp-e2e runs that crate
  # in full.  The crate declares no [features], so dropping it from the
  # `--all-features` workspace run costs no coverage.
  rust-tests-shard:
    name: rust-tests-shard (${{ matrix.shard }})
    # Unaffected changes and already-green tags retain the aggregate status
    # without allocating five test runners.
    if: ${{ needs.channel.outputs.rust_tests_changed == 'true' && !(startsWith(github.ref, 'refs/tags/') && needs.channel.outputs.already_green == 'true') }}
    # Typically ~155s on the 16-core self-hosted box when healthy; if this
    # job blows past ~5 min, suspect a runaway test before suspecting the box
    # or the cache. Not the workflow's critical path: the three archived
    # `lsp-e2e` consumers overlap their test pools instead of one unsharded
    # run carrying the full suite, and the `build-tcl-lsp-server` ->
    # `test-ext` chain finishes 40-80s after `lsp-e2e` does, so shortening
    # the test jobs cuts cost and the local `make test-rust` loop rather than
    # PR turnaround.
    #
    # It is the ONLY job routed to the self-hosted runner, and that is
    # deliberate.  `tank` is one physical host but may have multiple runner
    # registrations; the job-level concurrency group is therefore the source
    # of truth that keeps these CPU- and memory-heavy suites serial on that
    # host.  `cancel-in-progress: false` protects the running job, while
    # `queue: max` retains every pending job (the default one-pending-job queue
    # silently displaces an older pending run when another one arrives).  Fork
    # PRs and PRs changing this runner policy use a run-specific group because
    # they execute on separate GitHub-hosted machines and must retain their
    # normal parallelism. The latter also makes runner and dependency-policy
    # changes fail safely: a broken policy edit cannot strand the protected host
    # or execute newly selected dependency code there.
    #
    # Untrusted code must never reach the self-hosted runner, so PRs from forks
    # and Dependabot stay on GitHub-hosted. Trusted PRs and pushes prefer `tank`
    # while its logical lane is idle, then spill onto hosted capacity when
    # another run is already occupying that lane. A manual dispatch remains an
    # explicit override, and runner-policy changes prove themselves on hosted
    # capacity.
    needs: [channel]
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "1/5"
            id: "1-5"
            tank_capable: true
          - shard: "2/5"
            id: "2-5"
            tank_capable: false
          - shard: "3/5"
            id: "3-5"
            tank_capable: false
          - shard: "4/5"
            id: "4-5"
            tank_capable: false
          - shard: "5/5"
            id: "5-5"
            tank_capable: false
    runs-on: ${{ matrix.tank_capable && needs.channel.outputs.rust_tests_runner == 'tank' && !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]' || needs.channel.outputs.runner_policy_changed == 'true')) && 'tank' || 'ubuntu-26.04' }}
    # The action starts the sccache server during setup, so the backend must be
    # configured at job scope rather than only on the later Cargo steps.
    # Self-hosted Tank has several runner registrations on one host. Their
    # default CARGO_HOME/RUSTUP_HOME point below each registration directory,
    # and Swatinem/rust-cache hashes those values, fragmenting an otherwise
    # identical cache. Keep dependency/tool homes stable for Tank and hosted
    # overflow jobs alike. The runner image contract is that /home/runner is
    # owned and writable by the runner account; the preflight below proves it
    # on every registration before setup writes there. Hosted jobs keep the
    # workspace-local Cargo target. Tank sets its validated per-registration
    # target only after Rust/cache setup has completed.
    env:
      CARGO_HOME: /home/runner/.cargo
      RUSTUP_HOME: /home/runner/.rustup
      SCCACHE_GHA_ENABLED: "true"
      RUNNER_MODE: ${{ matrix.tank_capable && needs.channel.outputs.rust_tests_runner == 'tank' && !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]' || needs.channel.outputs.runner_policy_changed == 'true')) && 'tank' || 'hosted' }}
    concurrency:
      group: rust-tests-${{ matrix.tank_capable && needs.channel.outputs.rust_tests_runner == 'tank' && !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]' || needs.channel.outputs.runner_policy_changed == 'true')) && 'tank' || format('hosted-{0}-{1}', github.run_id, matrix.shard) }}
      queue: max
      cancel-in-progress: false
    steps:
      # The channel job-level condition skips this matrix for unrelated
      # changes and already-green tags; the stable rust-tests aggregate keeps
      # the required status context in those no-op cases.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Verify canonical Rust homes
        if: needs.channel.outputs.rust_tests_changed == 'true' && (needs.channel.outputs.already_green != 'true' || matrix.shard == '1/5')
        shell: bash
        run: |
          set -euo pipefail
          root=/home/runner
          test -d "$root" && test -w "$root" && test ! -L "$root"
          test "$(readlink -f "$root")" = "$root"
          test "$(stat -c %u "$root")" = "$(id -u)"
          for dir in "$CARGO_HOME" "$RUSTUP_HOME"; do
            mkdir -p "$dir"
            test ! -L "$dir" && test -w "$dir"
            test "$(stat -c %u "$dir")" = "$(id -u)"
            probe=$(mktemp "$dir/.tcl-lsp-write-probe.XXXXXX")
            rm -f "$probe"
          done

      # Must install `stable` explicitly rather than lean on the runner's
      # preinstalled rustup: the image ships a pinned stable (e.g. 1.96.1) and
      # `rust-toolchain.toml`'s `channel = "stable"` resolves to *that*, not to
      # the newest release.  Cargo then refuses the workspace's `rust-version`.
      # The action installs the current stable and wires up the Swatinem cache
      # (keyed per job, so the concurrent cargo jobs don't race on save).
      - name: Set up Rust
        if: needs.channel.outputs.rust_tests_changed == 'true' && (needs.channel.outputs.already_green != 'true' || matrix.shard == '1/5')
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          cache-key: rust-tests-v2
          # Swatinem's target archive is hundreds of MB and competes with the
          # per-object sccache backend for the repository cache quota. Cargo
          # rebuilds absent targets safely; registry/tool caches and sccache
          # remain enabled for dependency and compiler reuse.
          cache-targets: false

      # rust-cache restores dependency artefacts, but intentionally removes
      # workspace crates before saving. sccache remains source-aware, but the
      # pinned v0.17 Rust backend does not provide a proven cross-checkout-root
      # remapping here; measure cross-registration hits rather than assuming
      # that registrations with different absolute workspace paths share them.
      - name: Set up sccache
        id: sccache
        if: needs.channel.outputs.rust_tests_changed == 'true' && (needs.channel.outputs.already_green != 'true' || matrix.shard == '1/5')
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          # The resilient reporting step below owns degradation warnings.
          disable_annotations: true

      # Compiler caching is an optimisation, never a condition of correctness.
      # Do not export the wrapper until both action setup and the installed
      # binary have succeeded; Cargo then falls back to rustc automatically.
      - name: Enable sccache when available
        if: needs.channel.outputs.rust_tests_changed == 'true' && (needs.channel.outputs.already_green != 'true' || matrix.shard == '1/5')
        shell: bash
        env:
          SCCACHE_SETUP_OUTCOME: ${{ steps.sccache.outcome }}
        run: |
          if [[ "$SCCACHE_SETUP_OUTCOME" == success ]] \
              && command -v sccache >/dev/null 2>&1 \
              && sccache --version >/dev/null 2>&1; then
            echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"
          else
            echo '::warning::sccache is unavailable; continuing with uncached compilation'
          fi

      # Tank is serialised by the job-level concurrency group, so this target
      # is safe to retain per runner registration.  Hosted overflow never
      # touches the root and keeps Cargo's ordinary ephemeral target.
      - name: Prepare persistent Tank Cargo target
        if: needs.channel.outputs.rust_tests_changed == 'true' && (needs.channel.outputs.already_green != 'true' || matrix.shard == '1/5') && env.RUNNER_MODE == 'tank'
        shell: bash
        run: |
          registration="${TCL_LSP_TANK_REGISTRATION_ID:-${RUNNER_NAME:-}}"
          target=$(bash scripts/dev/persistent-cargo-target.sh prepare tank "$GITHUB_REPOSITORY" "$GITHUB_WORKSPACE" "$registration")
          printf 'CARGO_TARGET_DIR=%s\n' "$target" >> "$GITHUB_ENV"

      - name: Install cargo-nextest
        if: needs.channel.outputs.rust_tests_changed == 'true' && (needs.channel.outputs.already_green != 'true' || matrix.shard == '1/5')
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: nextest@0.9.143

      # The real-tclsh conformance binaries fail closed when no manifest-pinned
      # interpreter is available. Provision the shared Tcl 9.0 gold-standard
      # lane through the same tool entry point SpecTcl uses; distro Tcl and a
      # stale system tclsh9.0 must never decide which oracle CI exercises.
      - name: Install exact Tcl 9.0 reference interpreter
        if: needs.channel.outputs.rust_tests_changed == 'true' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.already_green != 'true'
        env:
          TCL_LSP_TCL_BIN_DIR: ${{ runner.temp }}/tcl-reference-bin
        run: |
          make ensure-tcl90-reference
          . scripts/dev/tcl-reference-toolchains.sh
          tcl_reference_load_toolchains "$PWD"
          tclsh="$(tcl_reference_resolve_tclsh 9.0)"
          printf 'TCL_LSP_TCLSH90=%s\n' "$tclsh" >> "$GITHUB_ENV"

      # --no-fail-fast: report every failure, not just the first.
      # Skipped entirely for docs-only changes and already-green tags;
      # downgraded to a cache-warming build (--no-run) on an already-green
      # merge push, because PR runs restore this job's cache from the base
      # branch — see the channel job header for the full contract.  --no-run
      # drops --no-fail-fast rather than adding to it: nextest 0.9.143 rejects
      # `--no-run --no-fail-fast` outright ("the argument '--no-run' cannot be
      # used with '--no-fail-fast'"), and the flag is meaningless anyway when
      # no tests are executed.
      - name: cargo nextest run (binary-aware workspace shard)
        if: needs.channel.outputs.rust_tests_changed == 'true' && needs.channel.outputs.docs_only != 'true' && !(startsWith(github.ref, 'refs/tags/') && needs.channel.outputs.already_green == 'true') && (needs.channel.outputs.already_green != 'true' || matrix.shard == '1/5')
        env:
          ALREADY_GREEN: ${{ needs.channel.outputs.already_green }}
          RUST_TESTS_RUNNER: ${{ env.RUNNER_MODE }}
          SHARD: ${{ matrix.shard }}
        run: |
          extra="--no-fail-fast"
          if [ "$ALREADY_GREEN" = "true" ]; then
            echo "tree already green on its PR run — building test binaries (cache warmth) without re-running them"
            if [ "$RUST_TESTS_RUNNER" = tank ]; then
              bash scripts/dev/persistent-cargo-target.sh with-lock "$CARGO_TARGET_DIR" cargo nextest run --no-run --workspace --exclude tcl-irule-test --exclude f5-cli --exclude tcl-lsp-server --exclude tcl-fuzz --all-features
            else
              cargo nextest run --no-run --workspace --exclude tcl-irule-test --exclude f5-cli --exclude tcl-lsp-server --exclude tcl-fuzz --all-features
            fi
            exit 0
          fi
          if [ "$RUST_TESTS_RUNNER" = tank ]; then
            bash scripts/dev/persistent-cargo-target.sh with-lock "$CARGO_TARGET_DIR" bash scripts/dev/rust-test-binary-shard.sh run "$SHARD" $extra
          else
            bash scripts/dev/rust-test-binary-shard.sh run "$SHARD" $extra
          fi

      - name: Record selected shard listing
        if: needs.channel.outputs.rust_tests_changed == 'true' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.already_green != 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          shard_file=$(printf '%s' "$SHARD" | tr '/' '-')
          bash scripts/dev/rust-test-binary-shard.sh list "$SHARD" --message-format json > "$RUNNER_TEMP/rust-tests-$shard_file.json"
          if [ "$SHARD" = "1/5" ]; then
            cargo metadata --no-deps --locked --format-version 1 > "$RUNNER_TEMP/rust-tests-metadata.json"
          fi

      - name: Upload selected shard listing
        if: always() && needs.channel.outputs.rust_tests_changed == 'true' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.already_green != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-tests-listing-${{ matrix.id }}
          path: ${{ runner.temp }}/rust-tests-${{ matrix.id }}.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: Upload authoritative Cargo metadata
        if: always() && matrix.shard == '1/5' && needs.channel.outputs.rust_tests_changed == 'true' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.already_green != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-tests-metadata
          path: ${{ runner.temp }}/rust-tests-metadata.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
      # Setup is intentionally skipped when the root Rust-test closure is
      # unaffected, so sccache is unavailable on those required no-op runs.
      - name: Report sccache statistics
        if: always() && needs.channel.outputs.rust_tests_changed == 'true' && (needs.channel.outputs.already_green != 'true' || matrix.shard == '1/5')
        shell: bash
        run: |
          if ! command -v sccache >/dev/null 2>&1; then
            echo '::warning::sccache statistics unavailable; compilation ran uncached'
            exit 0
          fi
          set +e
          stats=$(sccache --show-stats 2>&1)
          status=$?
          set -e
          printf '%s\n' "$stats"
          if [[ "$status" -ne 0 ]]; then
            echo "::warning::sccache statistics failed with status $status"
            exit 0
          fi
          write_errors=$(printf '%s\n' "$stats" | awk '$1 == "Cache" && $2 == "write" && $3 == "errors" { print $NF; exit }')
          if [[ -n "$write_errors" && "$write_errors" != 0 ]]; then
            echo "::warning::sccache reported $write_errors cache write errors"
          fi

      # Keep final target telemetry independent from test correctness.  This
      # runs after every Tank attempt, including failed Cargo commands.
      - name: Report final Tank Cargo target
        if: always() && needs.channel.outputs.rust_tests_changed == 'true' && env.RUNNER_MODE == 'tank'
        continue-on-error: true
        shell: bash
        run: |
          if [ -n "${CARGO_TARGET_DIR:-}" ]; then
            bash scripts/dev/persistent-cargo-target.sh report "$CARGO_TARGET_DIR"
          else
            echo '::warning::persistent Cargo target was not prepared; final telemetry unavailable'
          fi

  # nextest does not run doctests. Keep the whole-workspace doctest command
  # separate from the CPU-bound binary shards, so its build does not extend the
  # slowest shard's wall time. This job is deliberately hosted: Tank capacity
  # is reserved for shard 1, and doctests do not need its persistent target.
  # It remains a step-gated job so the stable aggregate context is preserved
  # for unrelated changes, docs-only changes, and already-green revisions.
  rust-tests-doctest:
    # Match the shard matrix's job-level no-op rules. The stable aggregate is
    # the required context and accepts this skipped result only when the
    # channel facts prove that no test command was required.
    if: ${{ needs.channel.outputs.rust_tests_changed == 'true' && !(startsWith(github.ref, 'refs/tags/') && needs.channel.outputs.already_green == 'true') }}
    needs: [channel]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Rust
        if: needs.channel.outputs.rust_tests_changed == 'true' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.already_green != 'true'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          cache-key: rust-tests-doctest-v1
          cache-targets: false

      # The whole workspace includes crates intentionally omitted from the
      # direct nextest selection. Doctests are a separate semantic surface,
      # not a cache-warming duplicate of a nextest shard.
      - name: cargo test --doc
        if: needs.channel.outputs.rust_tests_changed == 'true' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.already_green != 'true'
        run: cargo test --workspace --all-features --doc --no-fail-fast

  # Stable required status context. Locked Cargo metadata must agree with the
  # committed binary map, every non-ignored testcase must be selected by
  # exactly one listing, every shard must pass, and the independent
  # whole-workspace doctest job must pass.
  rust-tests:
    if: ${{ always() }}
    needs: [channel, rust-tests-shard, rust-tests-doctest]
    runs-on: ubuntu-26.04
    steps:
      - name: Require all Rust test shards
        env:
          CHANNEL_RESULT: ${{ needs.channel.result }}
          SHARDS_RESULT: ${{ needs.rust-tests-shard.result }}
          DOCTEST_RESULT: ${{ needs.rust-tests-doctest.result }}
          RUST_TESTS_CHANGED: ${{ needs.channel.outputs.rust_tests_changed }}
          ALREADY_GREEN: ${{ needs.channel.outputs.already_green }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          echo "channel=$CHANNEL_RESULT shards=$SHARDS_RESULT doctests=$DOCTEST_RESULT rust_tests_changed=$RUST_TESTS_CHANGED already_green=$ALREADY_GREEN is_tag=$IS_TAG"
          test "$CHANNEL_RESULT" = success
          if [ "$SHARDS_RESULT" = success ] && [ "$DOCTEST_RESULT" = success ]; then
            exit 0
          fi
          if [ "$SHARDS_RESULT" = skipped ] && [ "$DOCTEST_RESULT" = skipped ] && {
            [ "$RUST_TESTS_CHANGED" != true ] ||
            { [ "$IS_TAG" = true ] && [ "$ALREADY_GREEN" = true ]; };
          }; then
            echo 'Rust test shards and doctests were intentionally skipped by the channel decision'
            exit 0
          fi
          echo '::error::Rust test shards or doctests did not complete successfully'
          exit 1

      - name: Check out verifier
        if: needs.channel.result == 'success' && needs.channel.outputs.rust_tests_changed == 'true' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.already_green != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Download shard listings
        if: needs.channel.result == 'success' && needs.channel.outputs.rust_tests_changed == 'true' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.already_green != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rust-tests-*
          merge-multiple: true
          path: ${{ runner.temp }}/rust-tests-listings

      - name: Verify complete five-way binary selection
        if: needs.channel.result == 'success' && needs.channel.outputs.rust_tests_changed == 'true' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.already_green != 'true'
        run: |
          python3 scripts/dev/verify-nextest-binary-shards.py --partition-count 5 \
            "$RUNNER_TEMP/rust-tests-listings/rust-tests-metadata.json" \
            scripts/dev/rust-test-binary-shards.tsv \
            "$RUNNER_TEMP/rust-tests-listings/rust-tests-1-5.json" \
            "$RUNNER_TEMP/rust-tests-listings/rust-tests-2-5.json" \
            "$RUNNER_TEMP/rust-tests-listings/rust-tests-3-5.json" \
            "$RUNNER_TEMP/rust-tests-listings/rust-tests-4-5.json" \
            "$RUNNER_TEMP/rust-tests-listings/rust-tests-5-5.json"

  # Fail-closed SpecTcl compatibility on every PR that changes its TclVM,
  # compiler, registry, runtime, pack, or exact-reference-toolchain closure.
  # The Make target installs/resolves the manifest-pinned Tcl 9.0 oracle and
  # runs the 15+3+4+2 internal cases plus the one real-C-Tcl parse case.
  spectcl-compat:
    needs: [channel]
    runs-on: ubuntu-26.04
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Resolve the exact Tcl 9.0 cache identity
        if: needs.channel.outputs.spectcl_compat_changed == 'true' && needs.channel.outputs.already_green != 'true'
        id: tcl-oracle
        shell: bash
        run: |
          set -euo pipefail
          . scripts/dev/tcl-reference-toolchains.sh
          tcl_reference_load_toolchains "$PWD"
          patchlevel="$(tcl_reference_patchlevel 9.0)"
          echo "path=tmp/tcl${patchlevel}" >> "$GITHUB_OUTPUT"
          echo "key=spectcl-tcl90-ubuntu-26.04-x64-${{ hashFiles('rust/tcl-dialect/data/reference-toolchains.tsv', '.claude/skills/fetch-tcl-source/fetch_tcl_source.sh', 'scripts/dev/ensure-test-deps.sh', 'scripts/dev/tcl-reference-toolchains.sh') }}" >> "$GITHUB_OUTPUT"

      # The static Tcl shell is only about 23 MB with its source tree, but a
      # cold runner otherwise fetches, configures and builds it on every gate.
      # Restore and save are separate so a failed bootstrap cannot publish a
      # partial tree. The Make target below still probes the exact patchlevel
      # and repairs a missing or unusable binary before any test can run.
      - name: Restore the exact Tcl 9.0 source and build tree
        if: needs.channel.outputs.spectcl_compat_changed == 'true' && needs.channel.outputs.already_green != 'true'
        id: tcl-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.tcl-oracle.outputs.path }}
          key: ${{ steps.tcl-oracle.outputs.key }}

      - name: Set up Rust
        if: needs.channel.outputs.spectcl_compat_changed == 'true' && needs.channel.outputs.already_green != 'true'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          cache-key: spectcl-compat

      - name: Set up sccache
        id: sccache
        if: needs.channel.outputs.spectcl_compat_changed == 'true' && needs.channel.outputs.already_green != 'true'
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Enable sccache when available
        if: needs.channel.outputs.spectcl_compat_changed == 'true' && needs.channel.outputs.already_green != 'true'
        shell: bash
        env:
          SCCACHE_SETUP_OUTCOME: ${{ steps.sccache.outcome }}
        run: |
          if [[ "$SCCACHE_SETUP_OUTCOME" == success ]] \
              && command -v sccache >/dev/null 2>&1 \
              && sccache --version >/dev/null 2>&1; then
            echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"
          else
            echo '::warning::sccache is unavailable; continuing with uncached compilation'
          fi

      - name: Run exact SpecTcl 1.x + 2.0 + real-Tcl compatibility gate
        if: needs.channel.outputs.spectcl_compat_changed == 'true' && needs.channel.outputs.already_green != 'true'
        run: make test-spectcl-compat

      - name: Save the validated Tcl 9.0 source and build tree
        if: needs.channel.outputs.spectcl_compat_changed == 'true' && needs.channel.outputs.already_green != 'true' && success() && steps.tcl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.tcl-oracle.outputs.path }}
          key: ${{ steps.tcl-oracle.outputs.key }}

      - name: Report sccache statistics
        if: always() && needs.channel.outputs.spectcl_compat_changed == 'true' && needs.channel.outputs.already_green != 'true'
        continue-on-error: true
        shell: bash
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || true
          fi

  # The heavy VM-simulation suites, split out to run concurrently with
  # `rust-tests-shard` (see that job's header). Doctests are covered there.
  rust-tests-heavy:
    # Deliberately hosted.  The self-hosted box has a single runner, so jobs
    # sent there execute serially; measured, moving this job as well pushed the
    # critical path from 239s to 253s. See `rust-tests-shard` for the full reasoning.
    needs: [channel]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          # This job builds only the heavy crates + their deps, so it gets its
          # own cache rather than racing rust-tests-shard on save.
          cache-key: rust-tests-heavy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: nextest@0.9.143

      # Same skip/downgrade contract as rust-tests-shard — see the channel job header.
      # tcl-fuzz lives here, not in rust-tests-shard: its wasmtime/cranelift
      # dependency chain (~40 crates, cranelift-codegen alone an 81 MB rlib)
      # would otherwise sit in the main partition's build graph.  Only the
      # fuzzer's own fast plumbing unit tests run — fuzz CAMPAIGNS are
      # manual-only (`make fuzz`), never CI.
      - name: cargo nextest run (VM-sim heavies + tcl-fuzz plumbing)
        if: needs.channel.outputs.docs_only != 'true' && !(startsWith(github.ref, 'refs/tags/') && needs.channel.outputs.already_green == 'true')
        env:
          ALREADY_GREEN: ${{ needs.channel.outputs.already_green }}
        run: |
          extra="--no-fail-fast"
          if [ "$ALREADY_GREEN" = "true" ]; then
            echo "tree already green on its PR run — building test binaries (cache warmth) without re-running them"
            extra="--no-run"
          fi
          cargo nextest run $extra -p tcl-irule-test -p f5-cli -p tcl-fuzz --all-features

  # The standalone `runtime/rust` unit suite.
  #
  # `runtime/rust` is its own cargo workspace, deliberately excluded from the
  # root one (it needs `unsafe` over the shared linear memory, and its churn
  # must not gate the LSP/compiler workstream).  The cost of that exclusion is
  # that `cargo test --workspace --all-features` in `rust-tests` never runs a
  # single test in it, and `wasm-real-link` compiles and LINKS the crate
  # without executing its tests either.  `pr-gate` only formats and clippies
  # it.  Without this job, a standalone-runtime semantic regression could
  # land with every required check green, since a large body of runtime
  # tests could be added and changed without CI ever running them.
  #
  # This is an ADDITIONAL semantic gate, not a replacement: `wasm-real-link`
  # remains the real-link check, and this job never links anything.
  #
  # It also runs the mirror-image config: `make runtime-rust-test-no-tommath`,
  # BEFORE the libtommath fetch step below, so the source tree genuinely does
  # not exist yet — no hiding trick needed on this runner. Every job here
  # fetches the Tcl 9.0.4 source before touching `runtime/rust`, so the
  # degraded fallback build.rs takes when that source is absent (no bignum
  # tower, and `expr`/`if`/the `mathfunc`/`mathop` ensembles un-registered)
  # had never once been compiled in CI, let alone tested — despite two real
  # bugs recently found in exactly that fallback by hand (a `read_double` that
  # widened every bignum to infinity, and an `incr` that bypassed the
  # read-trace chokepoint). Same step-level skip and shared make target as the
  # tommath-enabled run below, so this doesn't cost a second job or a second
  # checkout.
  #
  # The step-level skip keys on `runtime_rust_changed` (see the channel job
  # header): the crate, its external Tcl 9 smoke corpus, plus the path-dependency
  # closure its own lockfile resolves. The job itself always runs and reports,
  # per the redundancy contract in AGENTS.md.
  runtime-rust-tests:
    needs: [channel]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Rust
        if: needs.channel.outputs.runtime_rust_changed == 'true' && needs.channel.outputs.already_green != 'true'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          # A separate cargo workspace with its own lockfile and its own
          # target dir, so it keeps its own cache rather than racing the root
          # workspace jobs on save.
          cache-key: runtime-rust-tests

      # The no-bignum fallback config, run BEFORE the fetch step below so
      # libtommath's source tree genuinely is not present on this runner —
      # the natural way to exercise the degraded build, no hide-and-restore
      # dance required. See `runtime-rust-test-no-tommath` in the Makefile for
      # why this configuration is worth gating and how it forces absence on a
      # checkout where the tree WAS already fetched.
      - name: make runtime-rust-test-no-tommath (standalone runtime, no libtommath)
        if: needs.channel.outputs.runtime_rust_changed == 'true' && needs.channel.outputs.already_green != 'true'
        run: make runtime-rust-test-no-tommath

      # libtommath, for the same reason `wasm-real-link` fetches it: without
      # the source `runtime/rust`'s build script prints a `cargo:warning` and
      # builds with the bignum backend DISABLED, which un-registers `expr` and
      # the `::tcl::mathfunc`/`mathop` ensembles.  The suite would still be
      # green while covering far less than it appears to.
      # `make runtime-rust-test` passes the directory explicitly.
      - name: Fetch the Tcl 9.0.4 source (libtommath)
        if: needs.channel.outputs.runtime_rust_changed == 'true' && needs.channel.outputs.already_green != 'true'
        run: |
          set -euo pipefail
          .claude/skills/fetch-tcl-source/fetch_tcl_source.sh 9.0
          test -f tmp/tcl9.0.4/libtommath/tommath.h

      # The shared make target, so a contributor reproducing a failure runs
      # the identical locked command CI ran.
      - name: make runtime-rust-test (standalone runtime unit suite)
        if: needs.channel.outputs.runtime_rust_changed == 'true' && needs.channel.outputs.already_green != 'true'
        run: make runtime-rust-test

  # The real whole-program WASM link (`tcl-compiler`'s `wasm_real_link.rs`):
  # an emitted module linked against the real `runtime/rust` compiled to
  # `wasm32-wasip1`, composed and executed by the wasmtime CLI.
  #
  # Its own job because it is the ONLY job that installs this toolchain, and
  # because before it existed the suite was permanently vacuous: every one of
  # those tests skipped-and-passed when the toolchain was absent, and no CI job
  # installed the wasmtime CLI, the `wasm32-wasip1` target, or wasi-sdk.  Eight
  # green tests, zero real links, for the whole life of the file.
  # `TCL_REQUIRE_WASM_LINK=1` is what makes this job meaningful: with it set, a
  # missing dimension of the toolchain is a hard failure instead of a skip, so
  # the job cannot silently revert to reporting green for nothing.
  #
  # The Tcl 9.0.4 source is fetched for libtommath: `runtime/rust`'s build
  # script degrades *silently* to a bignum-less runtime without it, and the
  # link then fails with a missing-output diff that reads like a codegen
  # regression rather than a missing dependency.
  wasm-real-link:
    # Deliberately hosted -- see `rust-tests-heavy`.
    needs: [channel]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          # The wasm32 std is a job-specific dependency, so this job keeps its
          # own cache rather than racing the other cargo jobs on save.  The
          # reserved runtime builds into `target/tcl_reserved_runtime` inside
          # the checkout, so this cache covers it too.
          target: wasm32-wasip1
          cache-key: wasm-real-link

      # Pinned to an exact version: the whole point of this job is a
      # reproducible link, and an unpinned `wasmtime` would let the runtime
      # under test drift without a commit.
      - name: Install the wasmtime CLI
        if: needs.channel.outputs.docs_only != 'true'
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: wasmtime@48.0.1

      # wasi-sdk supplies the `clang` that compiles libtommath's C sources to
      # wasm objects.  The test finds it at the default /opt/wasi-sdk, so no
      # env var is needed.  The tarball is pinned by version AND verified
      # against a recorded sha256 before it is unpacked: this step runs
      # `sudo tar` over a download from a third-party release, so "pinned by
      # tag" alone is not enough — a retagged or substituted asset would be
      # unpacked with root privileges.  Regenerate with `sha256sum` when
      # bumping WASI_SDK_RELEASE.
      - name: Install wasi-sdk
        if: needs.channel.outputs.docs_only != 'true'
        env:
          WASI_SDK_VERSION: '34'
          WASI_SDK_RELEASE: '34.0'
          WASI_SDK_SHA256: 'b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4'
        run: |
          set -euo pipefail
          asset="wasi-sdk-${WASI_SDK_RELEASE}-x86_64-linux.tar.gz"
          url="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/${asset}"
          curl -fsSL --retry 3 -o /tmp/wasi-sdk.tar.gz "$url"
          echo "${WASI_SDK_SHA256}  /tmp/wasi-sdk.tar.gz" | sha256sum --check --strict -
          sudo mkdir -p /opt/wasi-sdk
          sudo tar -xzf /tmp/wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
          test -x /opt/wasi-sdk/bin/clang

      # libtommath.  Fetched through the same helper contributors use, so CI
      # and a developer checkout resolve the identical tree.
      - name: Fetch the Tcl 9.0.4 source (libtommath)
        if: needs.channel.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          .claude/skills/fetch-tcl-source/fetch_tcl_source.sh 9.0
          test -f tmp/tcl9.0.4/libtommath/tommath.h

      # Same skip/downgrade contract as rust-tests — see the channel job header.
      # No `--no-run` downgrade: the point of this job is that the link really
      # executes, and building the test binary without running it would be
      # exactly the vacuity this job exists to prevent.
      # `wasm_tiers` rides the same gate: its sample-oracle tests return early
      # when the toolchain is absent, so anywhere but here they pass without
      # linking a single sample — the vacuity this job exists to prevent.
      - name: cargo test --test wasm_real_link --test wasm_tiers (toolchain required)
        if: needs.channel.outputs.docs_only != 'true' && !(startsWith(github.ref, 'refs/tags/') && needs.channel.outputs.already_green == 'true')
        env:
          TCL_REQUIRE_WASM_LINK: '1'
        run: cargo test -p tcl-compiler --test wasm_real_link --test wasm_tiers -- --test-threads=1

      # The language server's wasip1 arm (rt.rs `mod wasi`) has no in-tree
      # consumer until the WASI transport crate lands, so nothing else in CI
      # would catch a lib.rs/rt.rs change breaking it.  This job already
      # carries the wasm32-wasip1 toolchain and cache, making the check ~free
      # here; it is a compile gate only — the transport crate brings the
      # run-time coverage.
      - name: cargo check -p tcl-lsp-server (wasm32-wasip1)
        if: needs.channel.outputs.docs_only != 'true' && !(startsWith(github.ref, 'refs/tags/') && needs.channel.outputs.already_green == 'true')
        run: cargo check -p tcl-lsp-server --lib --target wasm32-wasip1

  # The real browser LSP server: release-link the wasm-bindgen facade, verify
  # the produced module, then drive a scripted JSON-RPC session under Node.
  # This is intentionally distinct from `wasm-real-link`, which exercises the
  # compiler's WASI runtime rather than the browser language server.  Without
  # this job, browser-only regressions would surface only after merge, in the
  # Pages deployment.
  lsp-server-wasm:
    needs: [channel]
    runs-on: ubuntu-26.04
    env:
      # Keep the expensive release/LTO link targeted to the browser server's
      # local dependency closure.  An ambiguous path classification is true;
      # already-green merge pushes and tags carry forward their PR/push result.
      RUN_LSP_WASM: ${{ needs.channel.outputs.lsp_wasm_changed == 'true' && needs.channel.outputs.already_green != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Rust
        if: env.RUN_LSP_WASM == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          cache-key: lsp-server-wasm
          cache-workspaces: rust/tcl-lsp-server-wasm

      - name: Install wasm-bindgen CLI
        if: env.RUN_LSP_WASM == 'true'
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: wasm-bindgen-cli@0.2.128

      - name: Set up Node.js
        if: env.RUN_LSP_WASM == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Build and exercise the browser LSP server
        if: env.RUN_LSP_WASM == 'true'
        run: make lsp-server-wasm-test

  # The real WASI LSP server: release-link the wasm32-wasip1 command, optimise
  # it, then drive scripted JSON-RPC sessions against it under the wasmtime CLI.
  # Sibling of `lsp-server-wasm` and gated by the same path filter — the two
  # transports share the whole `tcl-lsp-server` dependency closure — but a
  # separate job so a browser regression and a WASI regression are separately
  # attributable, and because this one needs a different toolchain (wasip1
  # target + wasmtime, no wasm-bindgen).
  #
  # It is also the only thing in CI that RUNS the wasip1 arm of
  # `tcl_lsp_server::rt`.  The `wasm-real-link` job's `cargo check
  # --target wasm32-wasip1` step is a compile gate; the driver properties that
  # arm's doc comments describe — never parking the runtime empty, keeping
  # timers alive while blocked on stdin — only fail at run time, and only here.
  #
  # On a `v*` tag this job is ALSO the release's producer of the module, and it
  # follows `build-server-matrix`'s pattern exactly: build, upload a plain
  # workflow artifact, and let a job that depends on `create-release` attach it
  # to the Release.  `build-vsix` is that job — it downloads `wasi-module` to
  # stage into the universal package, and signs the bare module onto the
  # Release while it is there.  Doing the `gh release upload` here instead
  # would race `create-release`, which this job deliberately does not depend on
  # (a skipped `needs` ancestor skips its dependants, and `create-release` is
  # tag-only — depending on it would kill this job's PR coverage).
  #
  # Hence `RELEASE_WASI` below, independent of the path/already-green gate: a
  # tag whose SHA already went green step-skips the *test*, but the release
  # still needs the artefact.
  #
  # Still not in `create-release`'s `needs`, and now for a better reason than
  # the old carve-out's: `build-vsix` depends on it directly, which is where the
  # module is consumed, while `create-release` only opens the Release.  The
  # wasmtime download that carve-out worried about is gated on `RUN_LSP_WASI`
  # alone — the release path needs only the wasip1 target and binaryen, so a
  # transient wasmtime 404 still cannot fail a tag build.
  lsp-server-wasi:
    needs: [channel]
    runs-on: ubuntu-26.04
    env:
      # Same gate as `lsp-server-wasm`: keep the expensive release/LTO link
      # targeted to the dependency closure the two transports share.  An
      # ambiguous path classification is true; already-green merge pushes and
      # tags carry forward their PR/push result.
      RUN_LSP_WASI: ${{ needs.channel.outputs.lsp_wasm_changed == 'true' && needs.channel.outputs.already_green != 'true' }}
      # A tag must produce the module whatever the test gate decided.
      RELEASE_WASI: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Rust
        if: env.RUN_LSP_WASI == 'true' || env.RELEASE_WASI == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          target: wasm32-wasip1
          cache-key: lsp-server-wasi
          cache-workspaces: rust/tcl-lsp-server-wasi

      # Pinned to the same exact version `wasm-real-link` uses: the driver's
      # readiness wait depends on the host honouring a `poll_oneoff` `fd_read`
      # subscription on stdin, so the runtime under test must not drift without
      # a commit.  Only the scripted sessions need it, so the release path
      # (RELEASE_WASI without RUN_LSP_WASI) never downloads it.
      - name: Install the wasmtime CLI
        if: env.RUN_LSP_WASI == 'true'
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: wasmtime@48.0.1

      # binaryen supplies `wasm-opt`, which build-wasi.sh runs (safely — this
      # module has no wasm-bindgen externref table to mis-rebind).  The script
      # degrades with a note when it is missing, so installing it here is what
      # keeps the optimised module the thing CI actually exercises — and, on a
      # tag, the thing it ships.
      - name: Install binaryen
        if: env.RUN_LSP_WASI == 'true' || env.RELEASE_WASI == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binaryen

      - name: Set up Node.js
        if: env.RUN_LSP_WASI == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Build and exercise the WASI LSP server
        if: env.RUN_LSP_WASI == 'true'
        env:
          # Functional PR coverage may use thin LTO. A tag can execute this
          # same functional step, but must produce the fat-LTO release module.
          CARGO_PROFILE_RELEASE_LTO: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'thin' }}
        run: make lsp-server-wasi-test

      # The link only, for a tag whose test surface step-skipped as already
      # green.  `lsp-server-wasi-test` above already produced `dist/` when it
      # ran, so this is the else-branch, not a second build.
      - name: Build the WASI LSP server (release artefact)
        if: env.RELEASE_WASI == 'true' && env.RUN_LSP_WASI != 'true'
        env:
          # Keep the shipped module on the canonical fat-LTO profile even if a
          # runner has exported a different Cargo profile override.
          CARGO_PROFILE_RELEASE_LTO: true
        run: make lsp-server-wasi

      # Same handoff shape as `build-server-matrix`'s `server-bins-*`: a plain,
      # short-lived workflow artifact for the downstream packaging job.  The
      # Release asset (attested + SBOM'd) is attached by `build-vsix`, which is
      # the one that can be sure `create-release` has already run.
      - name: Upload the WASI module
        if: env.RELEASE_WASI == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasi-module
          path: rust/tcl-lsp-server-wasi/dist/tcl-lsp-server-wasi.wasm
          if-no-files-found: error
          retention-days: 1

  # Native-server lsp_e2e suite. The required lsp-e2e aggregate preserves its
  # status context while one hosted producer builds and archives the suite and
  # three execution-only hosted jobs consume it in parallel.
  # Fully native — the Rust port of the former Python `tests/lsp_e2e/` pytest
  # suite, so no Python and no uv. Together they cover the crate's full test
  # surface, including `*_smoke.rs` tests.
  lsp-e2e:
    # Preserve the required lsp-e2e status context while the matrix below
    # provides three independently reported, deterministic partitions.
    if: ${{ always() }}
    needs: [channel, lsp-e2e-archive, lsp-e2e-partition]
    runs-on: ubuntu-26.04
    steps:
      - name: Require all lsp-e2e partitions
        env:
          CHANNEL_RESULT: ${{ needs.channel.result }}
          ARCHIVE_RESULT: ${{ needs.lsp-e2e-archive.result }}
          PARTITIONS_RESULT: ${{ needs.lsp-e2e-partition.result }}
        run: |
          echo "channel=$CHANNEL_RESULT archive=$ARCHIVE_RESULT partitions=$PARTITIONS_RESULT"
          if [ "$CHANNEL_RESULT" != "success" ] || [ "$ARCHIVE_RESULT" != "success" ] || [ "$PARTITIONS_RESULT" != "success" ]; then
            echo "::error::lsp-e2e prerequisites did not pass"
            exit 1
          fi

      - name: Check out verifier for transferred normal-path results
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && needs.channel.outputs.already_green != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Download producer proof metadata
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && needs.channel.outputs.already_green != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lsp-e2e-proof
          path: ${{ runner.temp }}/lsp-e2e-aggregate/producer

      - name: Download partition 1 metadata
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && needs.channel.outputs.already_green != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lsp-e2e-result-1-3
          path: ${{ runner.temp }}/lsp-e2e-aggregate/first

      - name: Download partition 2 metadata
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && needs.channel.outputs.already_green != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lsp-e2e-result-2-3
          path: ${{ runner.temp }}/lsp-e2e-aggregate/second

      - name: Download partition 3 metadata
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && needs.channel.outputs.already_green != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lsp-e2e-result-3-3
          path: ${{ runner.temp }}/lsp-e2e-aggregate/third

      - name: Validate transferred lsp-e2e results
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && needs.channel.outputs.already_green != 'true'
        run: |
          set -euo pipefail
          python3 scripts/dev/verify-nextest-partitions.py --verify-results \
            "$RUNNER_TEMP/lsp-e2e-aggregate/producer" \
            "$RUNNER_TEMP/lsp-e2e-aggregate/first" \
            "$RUNNER_TEMP/lsp-e2e-aggregate/second" \
            "$RUNNER_TEMP/lsp-e2e-aggregate/third"

  lsp-e2e-archive:
    name: lsp-e2e archive
    if: ${{ always() }}
    needs: [channel]
    runs-on: ubuntu-26.04
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Skip lsp-e2e archive where no test is required
        if: needs.channel.result != 'success' || needs.channel.outputs.docs_only == 'true' || needs.channel.outputs.lsp_e2e_changed != 'true' || (startsWith(github.ref, 'refs/tags/') && needs.channel.outputs.already_green == 'true')
        run: echo "unaffected archive closure, documentation-only, already-green tag, or unavailable channel — lsp-e2e archive is not required"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Normal archive production and an already-green merge-push cache warm
        # both need a checkout. Only an already-green tag skips all build work.
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && !(startsWith(github.ref, 'refs/tags/') && needs.channel.outputs.already_green == 'true')
        with:
          fetch-depth: 1

      - name: Set up Rust
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && !(startsWith(github.ref, 'refs/tags/') && needs.channel.outputs.already_green == 'true')
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          cache-key: lsp-e2e

      - name: Set up sccache
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && !(startsWith(github.ref, 'refs/tags/') && needs.channel.outputs.already_green == 'true')
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Install cargo-nextest
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && !(startsWith(github.ref, 'refs/tags/') && needs.channel.outputs.already_green == 'true')
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          # Archive/list/execute must use the exact same nextest format.
          tool: nextest@0.9.143

      - name: Warm already-green merge push once
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && needs.channel.outputs.already_green == 'true' && !startsWith(github.ref, 'refs/tags/')
        run: cargo nextest run --no-run -p tcl-lsp-server

      - name: Build and archive lsp_e2e once
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && needs.channel.outputs.already_green != 'true'
        env:
          ARCHIVE: ${{ runner.temp }}/lsp-e2e.tar.zst
          ARTIFACT_DIR: ${{ runner.temp }}/lsp-e2e-archive-artifact
          PROOF_DIR: ${{ runner.temp }}/lsp-e2e-proof-artifact
        run: |
          set -euo pipefail
          start=$(date +%s)
          cargo nextest archive -p tcl-lsp-server --all-features --archive-file "$ARCHIVE" 2>&1 | tee "$RUNNER_TEMP/lsp-e2e-archive.log"
          test -s "$ARCHIVE" || { echo "::error::nextest archive was not created"; exit 1; }
          mkdir -p "$ARTIFACT_DIR"
          cp "$ARCHIVE" "$ARTIFACT_DIR/lsp-e2e.tar.zst"
          mkdir -p "$PROOF_DIR"
          (cd "$PROOF_DIR" && sha256sum "$ARCHIVE" | sed 's#  .*/#  #' > archive.sha256)
          cargo nextest --version | tee "$PROOF_DIR/nextest-version.txt"
          end=$(date +%s)
          bytes=$(stat -c '%s' "$ARCHIVE")
          seconds=$((end - start))
          echo "lsp_e2e_archive_bytes=$bytes lsp_e2e_archive_seconds=$seconds"
          {
            echo "### lsp-e2e archive telemetry"
            echo "- archive bytes: $bytes"
            echo "- archive seconds: $seconds"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify hash-partition coverage
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && needs.channel.outputs.already_green != 'true'
        env:
          ARCHIVE: ${{ runner.temp }}/lsp-e2e.tar.zst
        run: |
          set -euo pipefail
          listing_dir="$RUNNER_TEMP/lsp-e2e-listings"
          mkdir -p "$listing_dir"
          cargo nextest list --archive-file "$ARCHIVE" --workspace-remap "$GITHUB_WORKSPACE" --message-format json > "$listing_dir/all.json"
          cargo nextest list --archive-file "$ARCHIVE" --workspace-remap "$GITHUB_WORKSPACE" --partition hash:1/3 --message-format json > "$listing_dir/1-3.json"
          cargo nextest list --archive-file "$ARCHIVE" --workspace-remap "$GITHUB_WORKSPACE" --partition hash:2/3 --message-format json > "$listing_dir/2-3.json"
          cargo nextest list --archive-file "$ARCHIVE" --workspace-remap "$GITHUB_WORKSPACE" --partition hash:3/3 --message-format json > "$listing_dir/3-3.json"
          scripts/dev/verify-nextest-partitions.py \
            "$listing_dir/all.json" "$listing_dir/1-3.json" "$listing_dir/2-3.json" "$listing_dir/3-3.json"

      - name: Record archive proof and listing metadata
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && needs.channel.outputs.already_green != 'true'
        env:
          PROOF_DIR: ${{ runner.temp }}/lsp-e2e-proof-artifact
          LISTING_DIR: ${{ runner.temp }}/lsp-e2e-listings
        run: |
          set -euo pipefail
          workspace_sha=$(git rev-parse HEAD)
          archive_sha=$(awk '{print $1}' "$PROOF_DIR/archive.sha256")
          nextest_version=$(cat "$PROOF_DIR/nextest-version.txt")
          all_sha=$(sha256sum "$LISTING_DIR/all.json" | awk '{print $1}')
          first_sha=$(sha256sum "$LISTING_DIR/1-3.json" | awk '{print $1}')
          second_sha=$(sha256sum "$LISTING_DIR/2-3.json" | awk '{print $1}')
          third_sha=$(sha256sum "$LISTING_DIR/3-3.json" | awk '{print $1}')
          cp "$LISTING_DIR/all.json" "$PROOF_DIR/all.json"
          cp "$LISTING_DIR/1-3.json" "$PROOF_DIR/1-3.json"
          cp "$LISTING_DIR/2-3.json" "$PROOF_DIR/2-3.json"
          cp "$LISTING_DIR/3-3.json" "$PROOF_DIR/3-3.json"
          python3 - "$PROOF_DIR/producer-metadata.json" "$workspace_sha" "$nextest_version" "$archive_sha" "$all_sha" "$first_sha" "$second_sha" "$third_sha" <<'PY'
          import json
          import sys

          output, workspace_sha, nextest_version, archive_sha, all_sha, first_sha, second_sha, third_sha = sys.argv[1:]
          metadata = {
              "schema": 1,
              "kind": "producer",
              "workspace_sha": workspace_sha,
              "nextest_version": nextest_version,
              "package": "tcl-lsp-server",
              "filter": "default",
              "partition": "all",
              "partition_count": 3,
              "shard_count": 3,
              "result": "success",
              "archive_sha256": archive_sha,
              "listings": {"all.json": all_sha, "1-3.json": first_sha, "2-3.json": second_sha, "3-3.json": third_sha},
          }
          with open(output, "w", encoding="utf-8") as stream:
              json.dump(metadata, stream, sort_keys=True)
              stream.write("\n")
          PY

      - name: Upload lsp-e2e archive
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && needs.channel.outputs.already_green != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lsp-e2e-archive
          path: ${{ runner.temp }}/lsp-e2e-archive-artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload lsp-e2e proof
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && needs.channel.outputs.already_green != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lsp-e2e-proof
          path: ${{ runner.temp }}/lsp-e2e-proof-artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  lsp-e2e-partition:
    name: lsp-e2e-partition (${{ matrix.partition }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: "1/3"
            artifact: 1-3
          - partition: "2/3"
            artifact: 2-3
          - partition: "3/3"
            artifact: 3-3
    # Deliberately hosted -- see `rust-tests-heavy`.
    # Matrix contexts are not individually required; the aggregate above is.
    needs: [channel, lsp-e2e-archive]
    runs-on: ubuntu-26.04
    steps:
      - name: Prepare result metadata directory
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && needs.channel.outputs.already_green != 'true'
        env:
          RESULT_DIR: ${{ runner.temp }}/lsp-e2e-result
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_DIR"
          printf '%s\n' '{"rust-suites":{}}' > "$RESULT_DIR/selected.json"

      - name: Skip lsp-e2e execution where no test is required
        if: needs.channel.result != 'success' || needs.channel.outputs.docs_only == 'true' || needs.channel.outputs.lsp_e2e_changed != 'true' || needs.channel.outputs.already_green == 'true'
        run: echo "lsp-e2e execution is not required for this channel result or unaffected archive closure"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && needs.channel.outputs.already_green != 'true'
        with:
          fetch-depth: 1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && needs.channel.outputs.already_green != 'true'
        with:
          toolchain: stable
          cache-key: lsp-e2e

      - name: Install cargo-nextest
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && needs.channel.outputs.already_green != 'true'
        with:
          # Keep the machine-readable partition proof and the runner on the
          # same nextest format/version.
          tool: nextest@0.9.143

      # The integration tests spawn the real `tcl-lsp-server` binary via
      # nextest's runtime `NEXTEST_BIN_EXE_tcl-lsp-server` path (the archive
      # carries it as a non-test binary dependency; plain Cargo keeps the
      # compile-time fallback) and talk LSP JSON-RPC to it over stdio. nextest runs
      # one global parallel pool per partition; hash partitioning changes
      # selection only, with no test mask or feature change.
      # Same skip/downgrade contract as rust-tests — see the channel job header.
      - name: Download lsp-e2e archive
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && needs.channel.outputs.already_green != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lsp-e2e-archive
          path: ${{ runner.temp }}/lsp-e2e-archive

      - name: Download lsp-e2e proof
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && needs.channel.outputs.already_green != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lsp-e2e-proof
          path: ${{ runner.temp }}/lsp-e2e-proof

      - name: Require lsp-e2e archive and report transfer size
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && needs.channel.outputs.already_green != 'true'
        env:
          ARCHIVE: ${{ runner.temp }}/lsp-e2e-archive/lsp-e2e.tar.zst
        run: |
          set -euo pipefail
          test -s "$ARCHIVE" || { echo "::error::lsp-e2e archive artifact is missing or empty: $ARCHIVE"; exit 1; }
          bytes=$(stat -c '%s' "$ARCHIVE")
          echo "lsp_e2e_archive_download_bytes=$bytes"

      - name: Verify archive digest and nextest version
        id: archive_verify
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && needs.channel.outputs.already_green != 'true'
        env:
          ARCHIVE: ${{ runner.temp }}/lsp-e2e-archive/lsp-e2e.tar.zst
          PROOF_DIR: ${{ runner.temp }}/lsp-e2e-proof
        run: |
          set -euo pipefail
          expected_archive_sha=$(awk '{print $1}' "$PROOF_DIR/archive.sha256")
          printf '%s  %s\n' "$expected_archive_sha" "$ARCHIVE" | sha256sum --status --check
          expected=$(cat "$PROOF_DIR/nextest-version.txt")
          actual=$(cargo nextest --version)
          [ "$actual" = "$expected" ] || { echo "::error::nextest version mismatch: expected '$expected', got '$actual'"; exit 1; }

      - name: Record selected partition listing
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && needs.channel.outputs.already_green != 'true'
        env:
          ARCHIVE: ${{ runner.temp }}/lsp-e2e-archive/lsp-e2e.tar.zst
          RESULT_DIR: ${{ runner.temp }}/lsp-e2e-result
          PARTITION: ${{ matrix.partition }}
        run: |
          set -euo pipefail
          cargo nextest list --archive-file "$ARCHIVE" --workspace-remap "$GITHUB_WORKSPACE" --partition "hash:$PARTITION" --message-format json > "$RESULT_DIR/selected.json"

      - name: lsp_e2e partition ${{ matrix.partition }} against the native Rust server
        id: tests
        continue-on-error: true
        if: needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && needs.channel.outputs.already_green != 'true'
        env:
          ARCHIVE: ${{ runner.temp }}/lsp-e2e-archive/lsp-e2e.tar.zst
          PARTITION: ${{ matrix.partition }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          cargo nextest run --archive-file "$ARCHIVE" --workspace-remap "$GITHUB_WORKSPACE" --no-fail-fast --partition "hash:$PARTITION"
          end=$(date +%s)
          seconds=$((end - start))
          echo "lsp_e2e_partition=${PARTITION} lsp_e2e_partition_seconds=$seconds"
          {
            echo "### lsp-e2e partition telemetry ($PARTITION)"
            echo "- execution seconds: $seconds"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record partition result metadata
        if: ${{ always() && needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && needs.channel.outputs.already_green != 'true' }}
        env:
          ARCHIVE: ${{ runner.temp }}/lsp-e2e-archive/lsp-e2e.tar.zst
          RESULT_DIR: ${{ runner.temp }}/lsp-e2e-result
          PARTITION: ${{ matrix.partition }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          ARCHIVE_VERIFIED: ${{ steps.archive_verify.outcome }}
        run: |
          set -euo pipefail
          archive_sha=""
          listing_sha=""
          test -f "$ARCHIVE" && archive_sha=$(sha256sum "$ARCHIVE" | awk '{print $1}') || true
          test -f "$RESULT_DIR/selected.json" && listing_sha=$(sha256sum "$RESULT_DIR/selected.json" | awk '{print $1}') || true
          nextest_version=$(cargo nextest --version 2>/dev/null || true)
          workspace_sha=$(git rev-parse HEAD 2>/dev/null || printf '%s' "$GITHUB_SHA")
          python3 - "$RESULT_DIR/result-metadata.json" "$workspace_sha" "$nextest_version" "$archive_sha" "$listing_sha" "$PARTITION" "$TEST_OUTCOME" "$ARCHIVE_VERIFIED" <<'PY'
          import json
          import sys

          output, workspace_sha, nextest_version, archive_sha, listing_sha, partition, result, archive_verified = sys.argv[1:]
          metadata = {
              "schema": 1,
              "kind": "consumer",
              "workspace_sha": workspace_sha,
              "nextest_version": nextest_version,
              "package": "tcl-lsp-server",
              "filter": "default",
              "partition": f"hash:{partition}",
              "partition_count": 3,
              "shard_count": 3,
              "result": result,
              "archive_sha256": archive_sha,
              "selected_listing_sha256": listing_sha,
              "archive_verified": archive_verified == "success",
          }
          with open(output, "w", encoding="utf-8") as stream:
              json.dump(metadata, stream, sort_keys=True)
              stream.write("\n")
          PY

      - name: Upload partition listing and result metadata
        if: ${{ always() && needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && needs.channel.outputs.already_green != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lsp-e2e-result-${{ matrix.artifact }}
          path: ${{ runner.temp }}/lsp-e2e-result
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Fail if lsp-e2e partition failed
        if: ${{ always() && needs.channel.result == 'success' && needs.channel.outputs.docs_only != 'true' && needs.channel.outputs.lsp_e2e_changed == 'true' && needs.channel.outputs.already_green != 'true' && steps.tests.outcome != 'success' }}
        run: exit 1

  # Supply-chain audit (advisories / licenses / bans / sources) via the
  # committed deny.toml.  Its own job so a denial is attributable independently
  # of the cargo test surface, and so it runs concurrently with it.  Audit every
  # tracked lockfile: the root workspace excludes independently resolved WASM,
  # WASI, runtime, editor, and extension Cargo roots.
  #
  # Deliberately exempt from the channel job's already_green / changed-path
  # skips: a new advisory can be published against an unchanged dependency
  # tree, so "this SHA already passed" does not carry the audit's verdict
  # forward the way it carries a test verdict.  It costs under a minute.
  cargo-deny:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install cargo-deny
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny check (all locked workspaces)
        run: bash scripts/dev/cargo-deny-all.sh

  # Python gate: ruff (format + lint) and two type checkers (ty, pyright) over
  # every tracked .py file.  Runs concurrently with the cargo jobs.
  #
  # `make typecheck-py` builds a venv that installs the f5report package, which
  # maturin-compiles the native `_engine` extension — so the checkers resolve
  # every import for real rather than suppressing `unresolved-import`.  That is
  # why this job needs a Rust toolchain.  The Sublime host APIs (`sublime`,
  # `sublime_plugin`, `LSP.plugin`) exist only inside the editor process and are
  # declared by hand-written stubs under typings/.
  #
  # Tool versions are pinned in the Makefile so a new ruff/ty/pyright release
  # cannot change a gate's verdict between a local run and CI.
  python:
    needs: [channel]
    runs-on: ubuntu-26.04
    env:
      # Only 30 .py files exist in the repo (the product is the Rust
      # workspace); a pure-Rust PR shouldn't pay for ruff + two type checkers
      # + a maturin build.  Tags run in full unless their SHA is already
      # green.  Steps skip, the job still reports success — see the channel
      # job header.
      RUN_PY: ${{ (needs.channel.outputs.python_changed == 'true' || startsWith(github.ref, 'refs/tags/')) && needs.channel.outputs.already_green != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # `make lint-py` / `typecheck-py` derive their file list from
      # `git ls-files '*.py'`, so the checkout must be a real git repo (it is).

      # Needed by maturin to build the native `_engine` extension module.
      - name: Set up Rust
        if: env.RUN_PY == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          cache-key: python-engine

      # The venv build maturin-compiles the native `_engine` in release mode
      # (~4 min); `make py-venv` skips the reinstall when its content stamp
      # matches, so restoring the venv turns ty + pyright into a ~10 s step.
      # The system python version is part of the key: a restored venv built
      # against a different interpreter would fail confusingly, not loudly.
      - name: Compute venv cache key
        if: env.RUN_PY == 'true'
        id: pykey
        run: |
          echo "pyver=$(python3 -V | tr ' ' '-')" >> "$GITHUB_OUTPUT"
          engine=$(make --no-print-directory python-engine-source-hash)
          echo "engine=$engine" >> "$GITHUB_OUTPUT"

      - name: Cache typecheck venv
        if: env.RUN_PY == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv-typecheck
          key: ${{ runner.os }}-venv-typecheck-${{ steps.pykey.outputs.pyver }}-${{ steps.pykey.outputs.engine }}

      # Pinned installer rather than a floating action, so the uv that resolves
      # the pinned tool versions is itself pinned.  The installer is fetched to
      # a file and checked against its digest before it runs — a version tag
      # alone still trusts whatever astral.sh serves under it.  If Astral
      # regenerates the script this fails loudly; re-pin with
      # `curl -fsSL https://astral.sh/uv/<version>/install.sh | sha256sum`.
      - name: Install uv
        if: env.RUN_PY == 'true'
        env:
          UV_VERSION: "0.12.10"
          UV_INSTALLER_SHA256: "a3196b75f697a1adaa5e4af34ffba7629c710931ab1dac33bab59ecf228080bb"
        run: |
          set -euo pipefail
          curl -LsSf --max-time 120 -o /tmp/uv-installer.sh \
            "https://astral.sh/uv/${UV_VERSION}/install.sh"
          echo "${UV_INSTALLER_SHA256}  /tmp/uv-installer.sh" | sha256sum -c -
          sh /tmp/uv-installer.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify uv version
        if: env.RUN_PY == 'true'
        run: |
          actual="$(uv --version | awk '{print $2}')"
          echo "uv $actual"
          [ "$actual" = "0.12.10" ] || { echo "::error::expected uv 0.12.10, got $actual"; exit 1; }

      - name: ruff (format --check + check)
        if: env.RUN_PY == 'true'
        run: make lint-py

      - name: ty + pyright
        if: env.RUN_PY == 'true'
        run: make typecheck-py

      - name: Native engine binding tests
        if: env.RUN_PY == 'true'
        run: make test-py-engine

  # The two npm roots that are NOT `editors/vscode`.  Nothing else on a pull
  # request installs them: every `npm ci` in this workflow is in
  # `editors/vscode`, and the only workflow that resolves these two trees
  # (github-pages.yml) triggers on push to `rust` and on tags, never on a PR.
  # Without this job, a dependency bump that cannot resolve passes the whole
  # gate and only breaks afterwards, on the deploy.
  #
  # Node only: no Rust, no wasm, no browser, so it is cheap enough to be a
  # release prerequisite as well as a PR gate.
  web-frontends:
    needs: [channel]
    runs-on: ubuntu-26.04
    env:
      # Steps skip, the job still reports success — see the channel job header.
      RUN_WEB_FRONTENDS: ${{ (needs.channel.outputs.web_frontends_changed == 'true' || startsWith(github.ref, 'refs/tags/')) && needs.channel.outputs.already_green != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node
        if: env.RUN_WEB_FRONTENDS == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Both front-end package.json files pin the npm CLI through
      # `packageManager`, and this job's entire value is how npm resolves a
      # peer range — so it has to be the pinned npm and not whatever
      # setup-node bundled. Same shim + assertion as `test-ext`.
      - name: Enable Corepack (pin npm via packageManager)
        if: env.RUN_WEB_FRONTENDS == 'true'
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          # `corepack enable` alone only shims pnpm/yarn; npm must be named
          # explicitly or the shim isn't created and the bundled npm wins.
          corepack enable npm
          cd rust/bigip-report-gen/frontend
          active="$(npm --version)"
          echo "Active npm: $active (pinned via packageManager)"
          case "$active" in
            12.*) ;;
            *) echo "::error::expected npm 12 from packageManager pin, got $active"; exit 1 ;;
          esac

      # Keyed on both lockfiles: the cache invalidates whenever either
      # resolved tree changes, which is the only time a re-resolve costs
      # anything.
      - name: Cache npm registry
        if: env.RUN_WEB_FRONTENDS == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-frontends-${{ hashFiles('rust/bigip-report-gen/frontend/package-lock.json', 'rust/tcl-spec-studio/web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-frontends-

      # `npm ci` and not the Make stamps' `npm install`, because only `npm ci`
      # reliably rejects the committed pair.  On a cold tree — which is what a
      # runner always has — `npm install` can resolve a peer-violating
      # package.json/lockfile combination and exit 0, leaving a broken tree
      # behind; `npm ci` on the same pair fails ERESOLVE. That is the failure
      # this job exists to catch, so it has to be the strict command.
      #
      # Then record the stamps, exactly as the `test-ext` job does, so the Make
      # targets below consume this install instead of immediately running a
      # second one.
      - name: Install both front-end dependency trees
        if: env.RUN_WEB_FRONTENDS == 'true'
        run: |
          mkdir -p build/stamps
          (cd rust/bigip-report-gen/frontend && npm ci)
          touch build/stamps/report-npm-install
          (cd rust/tcl-spec-studio/web && npm ci)
          touch build/stamps/spec-studio-npm-install

      # `check-report-assets` and not just typecheck+lint: `frontend/dist/*.js`
      # is committed and `include_str!`d into the report binary by
      # rust/bigip-report-gen/rust/src/render.rs, so a PR that edits the
      # TypeScript without rebuilding the bundles would otherwise stay green
      # and ship the old front-end in a native release.
      - name: Shared report front-end (typecheck + lint + asset drift)
        if: env.RUN_WEB_FRONTENDS == 'true'
        run: make typecheck-report-ts lint-report-ts check-report-assets

      # `spec-studio-assets` builds the production bundle. `spec-studio-test`
      # alone does not: `build.mjs --tests` bundles the unit tests and then
      # `process.exit(0)`s, so the controller, native-editor, Monaco, grammar
      # and asset paths never execute and a break there would surface only in
      # the post-merge Pages build.
      - name: Spec studio front-end (typecheck + lint + build + unit tests)
        if: env.RUN_WEB_FRONTENDS == 'true'
        run: make typecheck-spec-studio-ts lint-spec-studio-ts spec-studio-assets spec-studio-test

  # Release: create (or verify) the GitHub Release so each build job
  # can upload its artifact independently — no single slow or failing
  # build blocks the others.
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    # Gated on the fast gate (pr-gate) AND the whole cargo test surface.  Any
    # of those jobs may have step-skipped its work when the channel job proved
    # this exact SHA already went green on rust within 24 h (see the
    # channel job header) — the jobs still report success, so the graph holds,
    # and the verdict they carry forward is the prior run's real one.  A tag
    # whose SHA was never tested (or whose green is stale) runs everything
    # here in full.  cargo-deny always runs regardless.
    needs:
      [channel, pr-gate, rust-tests, rust-tests-heavy, spectcl-compat, lsp-server-wasm, lsp-e2e, cargo-deny, python, web-frontends]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # gh release upload
      id-token: write        # OIDC for sigstore-backed attestations
      attestations: write    # actions/attest-build-provenance writes here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Body lives in scripts/release/github_release.sh: idempotent create,
        # requires curated RELEASE_NOTES.md, and marks odd-minor 2.x tags as
        # GitHub pre-releases (scripts/release/prerelease.sh).
        run: bash scripts/release/github_release.sh

      - name: Stamp + upload installer script to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          sha="$(git rev-parse --short HEAD)"
          # Replace the @@INSTALLER_VERSION_*@@ placeholders so a user
          # running --version on the published asset sees the actual
          # release. The in-tree script on rust stays unstamped so
          # contributors don't see misleading version strings locally.
          tmp="$(mktemp)"
          sed \
            -e "s/@@INSTALLER_VERSION_TAG@@/${tag}/" \
            -e "s/@@INSTALLER_VERSION_SHA@@/(${sha})/" \
            scripts/install/install.sh > "$tmp"
          # Sanity-check that both placeholders were actually replaced
          # before we upload — failing loudly here beats publishing a
          # script that reports itself as "dev (unstamped)".
          if grep -q '@@INSTALLER_VERSION_' "$tmp"; then
              echo "ERROR: installer placeholder was not stamped" >&2
              grep '@@INSTALLER_VERSION_' "$tmp" >&2
              exit 1
          fi
          install -m 0755 "$tmp" install.sh
          rm -f "$tmp"

      - name: Attest installer script build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "install.sh"

      - name: Upload installer script to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release upload "$tag" install.sh --clobber

  # ---------------------------------------------------------------------
  # build-server-matrix — compile each native program independently for every
  # supported platform. Linux x86_64 and aarch64 build natively inside UBI 8
  # to retain a
  # GLIBC_2.28 ABI floor; RISC-V uses an Ubuntu 22.04 container's glibc 2.35
  # cross sysroot because EL8 did not ship a RISC-V architecture. No Zig or
  # separately downloaded libc is involved. Each leg smoke-tests its binary
  # and uploads it preserving `target/<triple>/release/`. build-vsix downloads
  # them all and packages both the untargeted universal VSIX and six
  # platform-targeted VSIXes.
  #
  # Per the no-marketplace-tokens invariant this uses only GitHub's built-in
  # token — nothing is published to a marketplace here.
  #
  # The triple→bundle-dir mapping lives in the Makefile (SERVER_TARGET_MAP);
  # keep the matrix below and that map in sync (7 triples total).
  # This producer is deliberately independent of `create-release`: it only
  # uploads short-lived workflow artefacts and can overlap the release gates.
  # Every consumer that attaches these bytes to a Release keeps its explicit
  # `create-release` plus test/portability dependencies below.
  build-server-matrix:
    name: native ${{ matrix.platform.id }} / ${{ matrix.program.id }}
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.native_release_build_proof)
    needs: [channel]
    strategy:
      fail-fast: false
      # Cargo unions dependency features across roots in one invocation. Keep
      # one program per job so release bytes retain their independently-built
      # feature graphs, while the runner matrix removes the old four-command
      # serial critical path. Keep the platform list and the Makefile's
      # SERVER_TARGET_MAP in sync (7 triples total), and keep all four programs.
      matrix:
        platform:
          - os: macos-latest
            id: darwin-arm64
            target: aarch64-apple-darwin
          - os: macos-latest
            id: darwin-x64
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            id: linux-x64
            target: x86_64-unknown-linux-gnu
            ubi8: true
            glibc_max: "2.28"
          - os: ubuntu-24.04-arm
            id: linux-arm64
            target: aarch64-unknown-linux-gnu
            ubi8: true
            glibc_max: "2.28"
          - os: ubuntu-24.04
            id: linux-riscv64
            target: riscv64gc-unknown-linux-gnu
            riscv_glibc: true
            glibc_max: "2.35"
          - os: windows-latest
            id: win32-x64
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            id: win32-arm64
            target: aarch64-pc-windows-msvc
        program:
          - package: tcl-lsp-server
            binary: tcl-lsp-server
            id: server
          - package: tcl-mcp
            binary: tcl-mcp
            id: mcp
          - package: tcl-cli
            binary: tcl
            id: tcl
          - package: f5-cli
            binary: f5-query
            id: f5
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # Both Darwin legs share the hosted image's Homebrew state. Remove only
      # the unused aws/tap before Rust setup invokes `brew install bash`; never
      # trust the tap or weaken Homebrew's trust policy.
      - name: Remove unused runner Homebrew tap
        if: runner.os == 'macOS'
        run: scripts/dev/prepare-homebrew-ci.sh

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          # Keep registry caching, but never restore compiled target trees here.
          # A host-built build script can require a newer glibc than UBI 8 and
          # cannot safely cross the host/container or platform matrix boundary.
          cache-targets: false

      # Use the runner's architecture-matched UBI image, so x86_64 and aarch64
      # both link against the maintained EL8 glibc 2.28 ABI without a cross
      # sysroot. The Rust installation is supplied by the pinned setup action;
      # only the distro C toolchain lives in the container. aarch64 overrides
      # the local-development cross-linker from .cargo/config.toml with native
      # `gcc`/`ar`.
      - name: Build GNU/Linux program against glibc 2.28
        if: matrix.platform.ubi8
        env:
          TARGET: ${{ matrix.platform.target }}
          PACKAGE: ${{ matrix.program.package }}
          BINARY: ${{ matrix.program.binary }}
          TCL_LSP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0-proof' }}
        shell: bash
        run: |
          set -euo pipefail
          # Git rejects the root-owned container's bind-mounted checkout as a
          # dubious directory. Stamp provenance explicitly instead of letting
          # tcl-version silently fall back to an empty commit.
          export GIT_HASH="${GITHUB_SHA:0:8}"
          docker run --rm \
            --env TARGET \
            --env PACKAGE \
            --env BINARY \
            --env TCL_LSP_VERSION \
            --env GIT_HASH \
            --env CARGO_HOME=/cargo \
            --env RUSTUP_HOME=/rustup \
            --volume "$GITHUB_WORKSPACE:/work" \
            --volume "$HOME/.cargo:/cargo" \
            --volume "$HOME/.rustup:/rustup" \
            --workdir /work \
            registry.access.redhat.com/ubi8/ubi-minimal:8.10 \
            /bin/bash -lc '
              set -euo pipefail
              microdnf install -y binutils cmake gcc gcc-c++ git make perl pkgconf-pkg-config
              microdnf clean all
              export PATH="/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
              if [[ "$TARGET" == aarch64-unknown-linux-gnu ]]; then
                export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=gcc
                export CC_aarch64_unknown_linux_gnu=gcc
                export AR_aarch64_unknown_linux_gnu=ar
              fi
              rustup target add "$TARGET"
              cargo build -p "$PACKAGE" --release --target "$TARGET"
              expected="${TCL_LSP_VERSION#v}+g$GIT_HASH"
              TCL_LSP_RELEASE_BINARIES="$BINARY" scripts/verify-native-versions.sh \
                "$expected" "target/$TARGET/release"
            '

      # Ubuntu 22.04 is the oldest still-supported mainstream RISC-V distro and
      # ships a complete glibc 2.35 cross toolchain. Keep it inside a container
      # rather than pinning the outer GitHub runner to an aging image. The QEMU
      # handshake runs in the same container so it uses that matching sysroot.
      - name: Build RISC-V GNU/Linux program against glibc 2.35
        if: matrix.platform.riscv_glibc
        env:
          TARGET: ${{ matrix.platform.target }}
          PACKAGE: ${{ matrix.program.package }}
          BINARY: ${{ matrix.program.binary }}
          TCL_LSP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0-proof' }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_HASH="${GITHUB_SHA:0:8}"
          docker run --rm \
            --env TARGET \
            --env PACKAGE \
            --env BINARY \
            --env TCL_LSP_VERSION \
            --env GIT_HASH \
            --env CARGO_HOME=/cargo \
            --env RUSTUP_HOME=/rustup \
            --env DEBIAN_FRONTEND=noninteractive \
            --volume "$GITHUB_WORKSPACE:/work" \
            --volume "$HOME/.cargo:/cargo" \
            --volume "$HOME/.rustup:/rustup" \
            --workdir /work \
            docker.io/library/ubuntu:22.04 \
            /bin/bash -lc '
              set -euo pipefail
              apt-get update
              # Both libc development packages are recommendations rather than
              # dependencies of the GCC packages, so name them explicitly when
              # suppressing recommended packages.
              apt-get install -y --no-install-recommends \
                ca-certificates cmake gcc gcc-riscv64-linux-gnu git libc6-dev \
                libc6-dev-riscv64-cross make perl pkg-config qemu-user
              rm -rf /var/lib/apt/lists/*
              export PATH="/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
              test -f "$(gcc -print-file-name=Scrt1.o)"
              test -f "$(riscv64-linux-gnu-gcc -print-file-name=Scrt1.o)"
              rustup target add "$TARGET"
              cargo build -p "$PACKAGE" --release --target "$TARGET"
              expected="${TCL_LSP_VERSION#v}+g$GIT_HASH"
              TCL_LSP_RELEASE_BINARIES="$BINARY" scripts/verify-native-versions.sh \
                "$expected" "target/$TARGET/release" \
                qemu-riscv64 -L /usr/riscv64-linux-gnu
              if [[ "$BINARY" == tcl-lsp-server ]]; then
                make server-cross-test
              fi
            '

      # Stamp the release version into every user-facing binary. The
      # tcl-version crate prefers this over `git describe`; without it a tag
      # build would still be correct, but this avoids depending on the checkout
      # having tags fetched.
      - name: Cross-compile native program
        if: matrix.platform.ubi8 != true && matrix.platform.riscv_glibc != true
        env:
          TCL_LSP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0-proof' }}
        shell: bash
        run: |
          set -euo pipefail
          t="${{ matrix.platform.target }}"
          echo "==> $t / ${{ matrix.program.package }}"
          rustup target add "$t"
          cargo build -p "${{ matrix.program.package }}" --release --target "$t"

      - name: Verify native program version
        if: >-
          matrix.platform.ubi8 != true && matrix.platform.riscv_glibc != true &&
          ((runner.arch == 'X64' && startsWith(matrix.platform.target, 'x86_64-')) ||
          (runner.arch == 'ARM64' && startsWith(matrix.platform.target, 'aarch64-')))
        env:
          BINARY: ${{ matrix.program.binary }}
          TARGET: ${{ matrix.platform.target }}
          TCL_LSP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0-proof' }}
        shell: bash
        run: |
          set -euo pipefail
          expected="${TCL_LSP_VERSION#v}+g${GITHUB_SHA:0:8}"
          TCL_LSP_RELEASE_BINARIES="$BINARY" scripts/verify-native-versions.sh \
            "$expected" "target/$TARGET/release"

      - name: Verify GNU/Linux glibc ABI ceiling
        if: matrix.platform.glibc_max
        shell: bash
        run: |
          set -euo pipefail
          t="${{ matrix.platform.target }}"
          scripts/verify-glibc-baseline.sh "${{ matrix.platform.glibc_max }}" \
            "target/$t/release/${{ matrix.program.binary }}"

      # scripts/test-cross-server.sh tests whatever is already built and skips
      # absent triples loudly, so each per-triple leg smoke-tests just its own
      # binary (natively or under QEMU where runnable).
      - name: Smoke-test built binaries
        if: matrix.program.id == 'server' && matrix.platform.riscv_glibc != true
        shell: bash
        run: make server-cross-test

      - name: Upload server binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Per-triple/program artifacts have disjoint filenames; downstream
          # consumers merge `server-bins-*` into the original directory shape.
          name: server-bins-${{ matrix.platform.id }}-${{ matrix.program.id }}
          # Common ancestor of all matched files is `target/`, so the artifact
          # stores `<triple>/release/<exe>` — build-vsix restores tcl-lsp-server
          # under `target/`; the four independent jobs merge before packaging.
          path: |
            target/*/release/${{ matrix.program.binary }}
            target/*/release/${{ matrix.program.binary }}.exe
          if-no-files-found: error
          retention-days: 1

  # The per-architecture ELF gates above catch ABI drift at the producer. This
  # fan-in repeats them over the uploaded release bytes, then starts the exact
  # x86_64 server across a compact matrix of maintained glibc distributions.
  # WASI/browser-WASM artefacts are produced by separate jobs and intentionally
  # do not participate in a host-libc contract.
  linux-release-portability:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release, build-server-matrix]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Download server-matrix binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: server-bins-*
          path: target
          merge-multiple: true

      - name: Verify Linux release ABI ceilings
        shell: bash
        run: |
          set -euo pipefail
          # upload-artifact intentionally normalises file modes. Restore the
          # executable bit before both the ELF gate and the distro handshake.
          chmod +x \
            target/{x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,riscv64gc-unknown-linux-gnu}/release/{tcl-lsp-server,tcl-mcp,tcl,f5-query}
          for triple in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            scripts/verify-glibc-baseline.sh 2.28 \
              "target/$triple/release/tcl-lsp-server" \
              "target/$triple/release/tcl-mcp" \
              "target/$triple/release/tcl" \
              "target/$triple/release/f5-query"
          done
          scripts/verify-glibc-baseline.sh 2.35 \
            target/riscv64gc-unknown-linux-gnu/release/tcl-lsp-server \
            target/riscv64gc-unknown-linux-gnu/release/tcl-mcp \
            target/riscv64gc-unknown-linux-gnu/release/tcl \
            target/riscv64gc-unknown-linux-gnu/release/f5-query

      - name: Test the release server across supported Linux distributions
        env:
          CONTAINER_ENGINE: docker
        run: scripts/test-linux-distro-compat.sh target/x86_64-unknown-linux-gnu/release/tcl-lsp-server

  # Publish the standalone native binaries as per-triple release assets
  # (`<name>-<triple>[.exe]` for tcl-lsp-server, tcl-mcp, tcl, f5-query), so
  # `install.sh` fetches a prebuilt binary for the host platform.
  #
  # `tcl-lsp-server` MUST be in that list.  A Zed extension is a single
  # cross-platform WASM module and cannot embed a per-platform binary, so
  # editors/zed resolves `tcl-lsp-server-<triple>[.exe]` from this release at
  # runtime, pinned to its own tag.  Drop it and every Zed install has no
  # server.  The VSIX takes its copy from the build-server-matrix artifacts,
  # not from here.
  #
  # publish-checksums then sums + signs whatever is attached, so these assets are
  # covered automatically.
  publish-native-binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release, build-server-matrix, linux-release-portability]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # gh release upload
    steps:
      - name: Download server-matrix binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: server-bins-*
          path: server-bins
          merge-multiple: true

      - name: Stage + upload native per-triple assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, so `gh` can't infer the repo from git —
          # give it explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          mkdir -p out
          shopt -s nullglob
          # download-artifact restores `<triple>/release/<name>[.exe]`.
          for name in tcl-lsp-server tcl-mcp tcl f5-query; do
            for bin in server-bins/*/release/"$name" server-bins/*/release/"$name".exe; do
              triple="$(printf '%s\n' "$bin" | sed -E 's#.*/([^/]+)/release/.*#\1#')"
              case "$bin" in *.exe) ext=".exe" ;; *) ext="" ;; esac
              cp "$bin" "out/${name}-${triple}${ext}"
              echo "staged out/${name}-${triple}${ext}"
            done
          done
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "error: no native binaries found in server-bins" >&2
            exit 1
          fi
          gh release upload "$tag" out/* --clobber

  # Build: the untargeted universal VSIX (bundles every native server
  # binary) plus six platform-targeted VSIXes, one per vsce --target
  # platform, so the Marketplace serves each client only its own binary.
  build-vsix:
    if: startsWith(github.ref, 'refs/tags/v')
    # test-ext / test-ext-web run as no-op-successes for pre-release tags
    # (their test steps are step-skipped), so they never skip this job's needs.
    #
    # `test-ext-web` is in this list because every VSIX flavour now carries the
    # browser language server (`dist/web`) and a manifest that declares
    # `browser` — which is what makes the Marketplace advertise web support. It
    # is the only job that proves that half works, so a VSIX must not be built
    # and signed without it.
    #
    # `lsp-server-wasi` is in it because the UNIVERSAL package carries the WASI
    # language server (`server/wasm/`) — the fallback rung for an architecture
    # none of the seven cross-compiled triples covers. That job builds and signs
    # the module; this one downloads its `wasi-module` artifact rather than
    # re-linking wasm32-wasip1 here, the same way it takes the native binaries
    # from `build-server-matrix` instead of cross-compiling them itself.
    needs: [create-release, test-ext, test-ext-web, build-server-matrix, linux-release-portability, lsp-server-wasi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # gh release upload
      id-token: write        # OIDC for sigstore-backed attestations
      attestations: write    # actions/attest-build-provenance writes here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default `fetch-depth: 1` + `fetch-tags` based on whether we're on a
          # tag ref (`git describe --tags` consumers need tags reachable from
          # HEAD; tag refs already have the tag at HEAD so don't re-fetch).
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # `make package-vsix-all` / `make claude-skills` shell out to `cargo xtask`, so
      # this job needs a toolchain. The runner image ships a pinned stable
      # (1.96.1) and `rust-toolchain.toml`'s `channel = "stable"` resolves to
      # *that*, not to the newest release, so cargo refuses the workspace's
      # `rust-version`. Install the current stable explicitly.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          cache-key: build-vsix

      # The VSIX embeds the spec studio, whose real LSP worker is built from
      # Rust to wasm32 and post-processed with the version matching its lockfile.
      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: wasm-bindgen-cli@0.2.128

      # No Python setup: the VSIX bundles native binaries and the build
      # (compile + filter-readme + vsce) is Node-only.

      - name: Download native server binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: server-bins-*
          path: target
          merge-multiple: true

      # Restored to the path the Makefile's `$(LSP_SERVER_WASI_MODULE)` names.
      # That rule is a FILE target whose prerequisites are the crate's own
      # sources, and this download runs after the checkout — `download-artifact`
      # extracts with `unzip-stream`, which does not restore the zip's stored
      # mtimes, so the module lands newer than every prerequisite.  It is used
      # as-is and nothing here re-links wasm32-wasip1.
      - name: Download the WASI language server module
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasi-module
          path: rust/tcl-lsp-server-wasi/dist

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Pin the npm CLI via the `packageManager` field in
      # editors/vscode/package.json. Corepack downloads and activates the
      # pinned npm so `npm ci` runs the same version locally and in CI.
      - name: Enable Corepack (pin npm via packageManager)
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          # `corepack enable` alone only shims pnpm/yarn; npm must be named
          # explicitly (`corepack enable npm`) or the shim isn't created and
          # the npm bundled with setup-node wins. Assert the pin is live so a
          # silent regression fails loudly instead of using the wrong npm.
          corepack enable npm
          cd editors/vscode
          active="$(npm --version)"
          echo "Active npm: $active (pinned via packageManager)"
          case "$active" in
            12.*) ;;
            *) echo "::error::expected npm 12 from packageManager pin, got $active"; exit 1 ;;
          esac

      # `package-lock.json` is committed, so installs are pinned by hash.
      # Cache the npm metadata directory keyed on the lockfile so the
      # cache invalidates whenever the resolved dependency tree changes.
      - name: Cache npm registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('editors/vscode/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install npm dependencies
        run: |
          cd editors/vscode
          npm ci
          # The packaging targets use the same Makefile dependency stamp.
          mkdir -p ../../build/stamps
          touch ../../build/stamps/npm-install

      # Package the universal fallback and all six platform-targeted VSIXes in
      # one locked session. It builds the shared Studio/browser payload once,
      # rechecks it before each archive, and compares that payload across all
      # seven archives before any artefact is signed or uploaded.
      - name: Build and verify all VSIXes
        run: make package-vsix-all BUNDLED_TARGETS="$(make -s print-server-targets-all)"

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/tcl-lsp-vscode-*-universal.vsix"
          artefact-name: vsix-universal

      # The bare module as a Release asset too, so an editor that is not VS Code
      # can fetch it and run it under wasmtime (INSTALL-editors.md).  Attached
      # from here rather than from the job that built it: this one depends on
      # `create-release`, so the Release object provably exists.  The artefact
      # name differs from the `wasi-module` upload above only because two
      # workflow artifacts in one run may not share a name.
      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "rust/tcl-lsp-server-wasi/dist/tcl-lsp-server-wasi.wasm"
          artefact-name: wasi-module-signed

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/tcl-lsp-vscode-*-win32-x64.vsix"
          artefact-name: vsix-win32-x64

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/tcl-lsp-vscode-*-win32-arm64.vsix"
          artefact-name: vsix-win32-arm64

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/tcl-lsp-vscode-*-linux-x64.vsix"
          artefact-name: vsix-linux-x64

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/tcl-lsp-vscode-*-linux-arm64.vsix"
          artefact-name: vsix-linux-arm64

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/tcl-lsp-vscode-*-darwin-x64.vsix"
          artefact-name: vsix-darwin-x64

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/tcl-lsp-vscode-*-darwin-arm64.vsix"
          artefact-name: vsix-darwin-arm64

  # ---------------------------------------------------------------------
  # build-claude-skills packages the Claude Code skills bundle, then attests
  # and uploads it. The skills drive the native MCP server, so the bundle
  # carries no interpreter payload.
  # ---------------------------------------------------------------------
  build-claude-skills:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default `fetch-depth: 1` + `fetch-tags` based on whether we're on a
          # tag ref (`git describe --tags` consumers need tags reachable from
          # HEAD; tag refs already have the tag at HEAD so don't re-fetch).
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # `make package-vsix` / `make claude-skills` shell out to `cargo xtask`, so
      # this job needs a toolchain. The runner image ships a pinned stable
      # (1.96.1) and `rust-toolchain.toml`'s `channel = "stable"` resolves to
      # *that*, not to the newest release, so cargo refuses the workspace's
      # `rust-version`. Install the current stable explicitly.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          cache-key: build-claude-skills


      - name: Build Claude skills zip (native, MCP-driven — no Python)
        run: make claude-skills

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/tcl-lsp-claude-skills-*.zip"
          artefact-name: claude-skills

  # Build: JetBrains plugin
  # Universal plugin: bundles every SERVER_TARGETS_JETBRAINS platform (all
  # seven SERVER_TARGET_MAP triples except riscv64 Linux, which no official
  # JetBrains IDE build targets). Reuses build-server-matrix's cross-compiled
  # binaries rather than cross-compiling again — same source build-vsix uses.
  build-jetbrains:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release, build-server-matrix, linux-release-portability]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # gh release upload
      id-token: write        # OIDC for sigstore-backed attestations
      attestations: write    # actions/attest-build-provenance writes here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default `fetch-depth: 1` + `fetch-tags` based on whether we're on a
          # tag ref (`git describe --tags` consumers need tags reachable from
          # HEAD; tag refs already have the tag at HEAD so don't re-fetch).
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Download native server binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: server-bins-*
          path: target
          merge-multiple: true

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          cache-key: build-jetbrains

      # The JetBrains plugin embeds the same spec studio as the VSIX. Keep the
      # CLI pinned to the wasm-bindgen crate version in the standalone lockfile.
      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: wasm-bindgen-cli@0.2.128

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            editors/jetbrains/*.gradle*
            editors/jetbrains/gradle/wrapper/gradle-wrapper.properties

      # The plugin bundles the spec studio and the compiler explorer webview,
      # both of which are built from the TypeScript sources. Without a pinned
      # Node this job used whatever the runner image happened to ship, and the
      # compiler explorer extraction silently no-opped.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable Corepack (pin npm via packageManager)
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: corepack enable npm

      # The plugin's Kotlin suite runs nowhere else — it needs the IntelliJ
      # SDK this job already downloads to build against.
      - name: Test JetBrains plugin
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: make test-jetbrains

      - name: Build JetBrains plugin (universal — every platform except riscv64)
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: make build-editor-jetbrains JB_BUNDLED_TARGETS="$(make -s print-server-targets-jetbrains)"

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/tcl-lsp-jetbrains-*.zip"
          artefact-name: jetbrains-plugin

  # Build: Sublime Text package
  build-sublime:
    if: startsWith(github.ref, 'refs/tags/v')
    # build-server-matrix is needed for its *digests*, not its binaries: the
    # package ships no server, but it pins the SHA-256 of each one this
    # release will carry so plugin.py verifies its download against a digest
    # that travelled inside the package rather than one served from the same
    # release as the binary.
    needs: [create-release, build-server-matrix, linux-release-portability]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # gh release upload
      id-token: write        # OIDC for sigstore-backed attestations
      attestations: write    # actions/attest-build-provenance writes here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default `fetch-depth: 1` + `fetch-tags` based on whether we're on a
          # tag ref (`git describe --tags` consumers need tags reachable from
          # HEAD; tag refs already have the tag at HEAD so don't re-fetch).
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # Restores `<triple>/release/tcl-lsp-server[.exe]` — the same bytes
      # publish-native-binaries attaches to the release, so hashing them here
      # pins exactly what the plugin will later download.
      - name: Download server-matrix binaries (for their digests)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: server-bins-*
          path: server-bins
          merge-multiple: true

      # The Sublime package is pure resources — no Rust toolchain, no Python
      # beyond the runner's preinstalled stdlib for the zip smoke-test.  It
      # ships one artefact for every platform and `plugin.py` downloads the
      # `tcl-lsp-server-<triple>` asset published by publish-native-binaries
      # for the host, so the server MUST stay out of this package.
      - name: Build Sublime Text package
        run: make build-editor-sublime SERVER_BINS_DIR=server-bins

      - name: Smoke-test Sublime package
        run: |
          python3 -c "
          import zipfile, json
          zf = zipfile.ZipFile('build/LSP-Tcl.sublime-package')
          names = zf.namelist()
          assert not any(n.startswith('server/') for n in names), 'bundles a server'
          assert not any(n.startswith('specs/') for n in names), 'bundles spec packs'
          assert not any(n.endswith('.sublime-keymap') for n in names), 'bundles key bindings'
          assert not any(n.endswith('.sublime-syntax') for n in names), 'bundles a syntax'
          assert not any(n.endswith('.sublime-snippet') for n in names), 'bundles snippets'
          assert not any(n.endswith('.sublime-completions') for n in names), 'bundles completions'
          assert 'Context.sublime-menu' not in names, 'bundles a context menu'
          assert 'Default.sublime-commands' in names, 'missing settings palette entry'
          assert 'plugin.py' in names, 'missing plugin'
          assert 'LSP-Tcl.sublime-settings' in names, 'missing LSP settings'
          assert '.python-version' in names, 'missing plugin_host selector'
          manifest = json.loads(zf.read('server_version.json'))
          version = manifest['version']
          tag = '${{ github.ref_name }}'
          assert version == tag[1:], f'server_version {version} != tag {tag}'
          # A released package must pin the digest of every server it can
          # download; without the pins plugin.py silently degrades to the
          # release's own SHA256SUMS, which is integrity only.
          pins = manifest.get('servers') or {}
          for triple in ('x86_64-unknown-linux-gnu', 'aarch64-unknown-linux-gnu',
                         'x86_64-apple-darwin', 'aarch64-apple-darwin',
                         'x86_64-pc-windows-msvc', 'aarch64-pc-windows-msvc'):
              assert len(pins.get(triple, '')) == 64, f'no server pin for {triple}'
          print(f'OK: {len(names)} entries, server version {version}, {len(pins)} pins')
          "

      # Package Control has no pre-release channel, and — unlike the VS Code
      # Marketplace — it ignores GitHub's `prerelease` flag: its GitHub client
      # skips only *drafts*, then takes the newest release carrying an asset
      # that matches the channel entry's exact name.  So the odd-minor
      # pre-release line is kept off the channel by NAME: only a stable tag
      # publishes `LSP-Tcl.sublime-package`. Pre-release testers still get a
      # package, under a name the channel never resolves (rename it to
      # `LSP-Tcl.sublime-package` to install it by hand).
      - name: Name the package for its release channel
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$(bash scripts/release/prerelease.sh "$tag")" = "true" ]; then
            mv build/LSP-Tcl.sublime-package build/LSP-Tcl-prerelease.sublime-package
            echo "pre-release tag $tag -> LSP-Tcl-prerelease.sublime-package (off the Package Control channel)"
          else
            echo "stable tag $tag -> LSP-Tcl.sublime-package (what Package Control resolves)"
          fi

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/LSP-Tcl*.sublime-package"
          artefact-name: sublime-package

  # Build: Zed extension
  build-zed:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # gh release upload
      id-token: write        # OIDC for sigstore-backed attestations
      attestations: write    # actions/attest-build-provenance writes here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default `fetch-depth: 1` + `fetch-tags` based on whether we're on a
          # tag ref (`git describe --tags` consumers need tags reachable from
          # HEAD; tag refs already have the tag at HEAD so don't re-fetch).
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # `make build-editor-zed` builds the Zed WASM helper. The native language
      # server is downloaded for the user's platform on first use.
      - name: Set up Rust
        # actions-rust-lang/setup-rust-toolchain wraps swatinem/rust-cache
        # so we get cargo registry / target caching for free — meaningful
        # speedup vs the bare dtolnay/rust-toolchain action.
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          target: wasm32-wasip2
          components: clippy, rustfmt

      - name: Build Zed extension
        run: make build-editor-zed

      - name: Smoke-test Zed archive
        run: |
          python3 -c "
          import zipfile, glob
          path = glob.glob('build/tcl-lsp-zed-*.zip')[0]
          zf = zipfile.ZipFile(path)
          names = zf.namelist()
          assert 'extension.toml' in names, 'missing extension.toml'
          assert 'extension.wasm' in names, 'missing extension.wasm'
          assert 'LICENSE' in names, 'missing Zed extension license'
          assert any('languages/tcl/config.toml' in n for n in names), 'missing Tcl language config'
          assert not any(n.startswith('snippets/') for n in names), 'bundles snippets'
          print(f'OK: {len(names)} entries')
          "

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/tcl-lsp-zed-*.zip"
          artefact-name: zed-extension

  # Publish: aggregate SHA256SUMS over every artefact attached to the
  # release, plus an optional cosign keyless signature. The installer
  # verifies downloaded artefacts against this file.
  publish-checksums:
    # Decoupled from the peripheral build jobs: this step downloads and sums
    # *whatever* is attached to the release, so a peripheral build that fails
    # (e.g. the Zed or Claude-skills package) must not block it — and must
    # not block the Marketplace publish that depends on it.  It runs once all
    # builds have settled (success or failure — `!cancelled()` lets the `if`
    # evaluate despite a failed/​skipped need) but only requires the CORE to have
    # succeeded: create-release (the release object) and build-vsix (the artifact
    # the Marketplace publish ships).  The peripheral builds stay in `needs` for
    # ordering only.
    if: >-
      !cancelled()
      && startsWith(github.ref, 'refs/tags/v')
      && needs.create-release.result == 'success'
      && needs.build-vsix.result == 'success'
    needs: [create-release, build-vsix, build-claude-skills, build-jetbrains, build-sublime, build-zed, publish-native-binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # gh release upload
      id-token: write   # cosign keyless OIDC signing
    steps:
      - name: Determine tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Download every release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          # Pull every asset currently attached to the release; this
          # gives a single SUMS covering whatever was uploaded by the
          # 12 build jobs (or by future ones, without further edits).
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir dist \
            --clobber

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          # Sort for deterministic ordering. Exclude any pre-existing
          # SHA256SUMS{,.cosign.bundle} so a rerun doesn't hash itself.
          find . -maxdepth 1 -type f \
            ! -name SHA256SUMS \
            ! -name 'SHA256SUMS.*' \
            -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs -r sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" dist/SHA256SUMS \
            --repo "${{ github.repository }}" --clobber

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin the cosign binary itself, not just the installer action.
          # Without this, the installer downloads "latest" cosign — which
          # is itself a moving target.  Bump in lockstep with the action.
          cosign-release: 'v2.6.3'

      - name: Sign SHA256SUMS (keyless OIDC)
        working-directory: dist
        run: |
          cosign sign-blob --yes \
            --bundle SHA256SUMS.cosign.bundle \
            SHA256SUMS

      - name: Upload SHA256SUMS.cosign.bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" dist/SHA256SUMS.cosign.bundle \
            --repo "${{ github.repository }}" --clobber

  # VS Code Marketplace publish.  The publish token (VSCE_PAT) is an
  # Environment secret on `marketplace-vscode` — a protected Environment
  # (required reviewer + a v*-tag-only deployment policy).  Per the
  # AGENTS.md invariant, a publish secret may live in CI only when it is
  # stored this way: reachable solely by a job that targets the protected
  # Environment, which PAUSES for manual approval and can never run on a
  # non-tag ref.  The PAT is the mechanism the VS Code Marketplace supports,
  # matching the stable channel from `rust`.  Hardening choices:
  #   * VSCE_PAT is scoped to the publish step's `env:` only, so the
  #     freshly-fetched npm code in `npm ci` never runs with the token in
  #     its environment.
  #   * the .vsix is pulled from the GitHub Release (which persists) and
  #     checksum-verified against the cosign-signed SHA256SUMS — not from a
  #     workflow artifact, which cleanup-*-artifacts could delete while this
  #     job sits waiting for approval.
  #
  # Gated off until PUBLISH_VSIX_MARKETPLACE is set (a non-secret flag
  # variable), so forks/clones without the secret never reach the gate.
  # Nothing depends on this job, so its approval wait never blocks cleanup.
  publish-vsix-marketplace:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_VSIX_MARKETPLACE == 'true'
    needs: [build-vsix, publish-checksums]
    runs-on: ubuntu-24.04
    environment: marketplace-vscode
    permissions:
      contents: read # gh release download
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable Corepack (pin npm via packageManager)
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: corepack enable npm

      - name: Install vsce from the committed lockfile
        run: cd editors/vscode && npm ci

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'

      - name: Download the released VSIX and verify against the signed SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          mkdir -p dist && cd dist
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.vsix' --pattern 'SHA256SUMS' \
            --pattern 'SHA256SUMS.cosign.bundle' --clobber
          # Verify SHA256SUMS is the manifest publish-checksums actually signed
          # (keyless OIDC) BEFORE trusting any hash in it.  The Release stays
          # mutable while this job waits for approval, so an actor with
          # release-write could otherwise swap the .vsix AND SHA256SUMS as a
          # self-consistent pair and pass a bare `sha256sum -c`.  Pinning the
          # cosign identity to this repo's ci.yml on a v* tag makes that swap
          # detectable.
          cosign verify-blob \
            --bundle SHA256SUMS.cosign.bundle \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/bitwisecook/tcl-lsp/\.github/workflows/ci\.yml@refs/tags/v' \
            SHA256SUMS
          # --ignore-missing: SHA256SUMS lists every release asset; we only
          # fetched the .vsix, so verify just that one (others are skipped).
          sha256sum -c --ignore-missing SHA256SUMS

      - name: Publish to VS Code Marketplace
        # Body lives in scripts/release/vsce_publish.sh: runs only the local
        # vsce binary and adds --pre-release for odd-minor 2.x tags
        # (scripts/release/prerelease.sh is the single source of truth).
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bash scripts/release/vsce_publish.sh

  # Open VSX (open-vsx.org) publish — what code-server / openvscode-server /
  # Gitpod / Theia installs use.  Mirrors publish-vsix-marketplace exactly:
  # the publish token (OVSX_PAT) is an Environment secret on the protected
  # `marketplace-openvsx` Environment (required reviewer + a v*-tag-only
  # deployment policy).  Per the AGENTS.md invariant, a publish secret may
  # live in CI only when it is stored this way: reachable solely by a job
  # that targets the protected Environment, which PAUSES for manual approval
  # and can never run on a non-tag ref.  Hardening carried over from the
  # VS Code job:
  #   * OVSX_PAT is scoped to the publish step's `env:` only, so the
  #     freshly-fetched npm code in `npm ci` never runs with the token in
  #     its environment.
  #   * the .vsix is pulled from the GitHub Release (which persists) and
  #     checksum-verified against the cosign-signed SHA256SUMS — not from a
  #     workflow artifact, which cleanup-*-artifacts could delete while this
  #     job sits waiting for approval.
  #
  # Gated off until PUBLISH_VSIX_OPENVSX is set (a non-secret flag
  # variable), so forks/clones without the secret never reach the gate.
  # Nothing depends on this job, so its approval wait never blocks cleanup.
  publish-vsix-openvsx:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_VSIX_OPENVSX == 'true'
    needs: [build-vsix, publish-checksums]
    runs-on: ubuntu-24.04
    environment: marketplace-openvsx
    permissions:
      contents: read # gh release download
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable Corepack (pin npm via packageManager)
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: corepack enable npm

      - name: Install ovsx from the committed lockfile
        run: cd editors/vscode && npm ci

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'

      - name: Download the released VSIX and verify against the signed SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          mkdir -p dist && cd dist
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.vsix' --pattern 'SHA256SUMS' \
            --pattern 'SHA256SUMS.cosign.bundle' --clobber
          # Verify SHA256SUMS is the manifest publish-checksums actually signed
          # (keyless OIDC) BEFORE trusting any hash in it.  The Release stays
          # mutable while this job waits for approval, so an actor with
          # release-write could otherwise swap the .vsix AND SHA256SUMS as a
          # self-consistent pair and pass a bare `sha256sum -c`.  Pinning the
          # cosign identity to this repo's ci.yml on a v* tag makes that swap
          # detectable.
          cosign verify-blob \
            --bundle SHA256SUMS.cosign.bundle \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/bitwisecook/tcl-lsp/\.github/workflows/ci\.yml@refs/tags/v' \
            SHA256SUMS
          # --ignore-missing: SHA256SUMS lists every release asset; we only
          # fetched the .vsix, so verify just that one (others are skipped).
          sha256sum -c --ignore-missing SHA256SUMS

      - name: Publish to Open VSX
        # Body lives in scripts/release/ovsx_publish.sh: runs only the local
        # ovsx binary.  The channel isn't chosen here — ovsx ignores
        # --pre-release for an already-packaged VSIX, so it rides in the
        # VSIX manifest instead, baked in by `vsce package` at build time
        # (scripts/release/prerelease.sh is still the single source of
        # truth for that manifest flag).
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: bash scripts/release/ovsx_publish.sh

  # JetBrains Marketplace publish.  Mirrors publish-vsix-marketplace exactly:
  # the publish token (JETBRAINS_TOKEN) is an Environment secret on the
  # protected `marketplace-jetbrains` Environment (required reviewer + a
  # v*-tag-only deployment policy), so — per the AGENTS.md invariant — it is
  # reachable solely by a job that PAUSES for manual approval and can never
  # run on a non-tag ref.  Hardening carried over from the VS Code job:
  #   * JETBRAINS_TOKEN is scoped to the publish step's `env:` only.
  #   * the plugin .zip is pulled from the GitHub Release (which persists) and
  #     checksum-verified against the cosign-signed SHA256SUMS — not from a
  #     workflow artifact, which cleanup-*-artifacts could delete while this
  #     job sits waiting for approval.
  #
  # Gated off until PUBLISH_JETBRAINS_MARKETPLACE is set (a non-secret flag
  # variable), so forks/clones without the secret never reach the gate.
  # Nothing depends on this job, so its approval wait never blocks cleanup.
  publish-jetbrains-marketplace:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_JETBRAINS_MARKETPLACE == 'true'
    needs: [build-jetbrains, publish-checksums]
    runs-on: ubuntu-24.04
    environment: marketplace-jetbrains
    permissions:
      contents: read # gh release download
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'

      - name: Download the released plugin zip and verify against the signed SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          mkdir -p dist && cd dist
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'tcl-lsp-jetbrains-*.zip' --pattern 'SHA256SUMS' \
            --pattern 'SHA256SUMS.cosign.bundle' --clobber
          # Verify SHA256SUMS is the manifest publish-checksums actually signed
          # (keyless OIDC) BEFORE trusting any hash in it.  The Release stays
          # mutable while this job waits for approval, so an actor with
          # release-write could otherwise swap the .zip AND SHA256SUMS as a
          # self-consistent pair and pass a bare `sha256sum -c`.  Pinning the
          # cosign identity to this repo's ci.yml on a v* tag makes that swap
          # detectable.
          cosign verify-blob \
            --bundle SHA256SUMS.cosign.bundle \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/bitwisecook/tcl-lsp/\.github/workflows/ci\.yml@refs/tags/v' \
            SHA256SUMS
          # --ignore-missing: SHA256SUMS lists every release asset; we only
          # fetched the .zip, so verify just that one (others are skipped).
          sha256sum -c --ignore-missing SHA256SUMS

      - name: Publish to JetBrains Marketplace
        # Body lives in scripts/release/jetbrains_publish.sh: uploads the
        # verified zip via the Marketplace API and picks the "eap" channel for
        # odd-minor 2.x tags (scripts/release/prerelease.sh is the single
        # source of truth).
        env:
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
        run: bash scripts/release/jetbrains_publish.sh

  # Cleanup: delete workflow artifacts for all releases except the 3 most recent
  cleanup-old-artifacts:
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [build-vsix, build-claude-skills, build-jetbrains, build-sublime, build-zed, publish-checksums]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete artifacts outside the 3 most recent releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Get the 3 most recent non-draft release tags
          mapfile -t keep_tags < <(
            gh release list --repo "$REPO" --json tagName,isDraft,createdAt \
              | jq -r '[.[] | select(.isDraft==false)] | sort_by(.createdAt) | reverse | .[:3] | .[].tagName'
          )
          echo "Retaining artifacts for: ${keep_tags[*]}"

          # Always keep the current run (it may still be in_progress in the API)
          keep_runs=("${{ github.run_id }}")
          echo "  keeping run ${{ github.run_id }} (current)"

          # Resolve each tag to its most recent completed CI run
          for tag in "${keep_tags[@]}"; do
            run_id=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=push&branch=$tag&per_page=10" \
              | jq -r '[.workflow_runs[] | select(.status=="completed")] | first | .id // empty')
            if [[ -n "$run_id" && "$run_id" != "${{ github.run_id }}" ]]; then
              keep_runs+=("$run_id")
              echo "  keeping run $run_id for $tag"
            fi
          done

          # Page through all artifacts; delete those not from a kept run
          page=1
          while :; do
            payload=$(gh api "repos/$REPO/actions/artifacts?per_page=100&page=$page")
            count=$(jq '.artifacts | length' <<< "$payload")
            [[ "$count" -eq 0 ]] && break
            while IFS=$'\t' read -r art_id run_id; do
              if printf '%s\n' "${keep_runs[@]}" | grep -qx "$run_id"; then
                echo "  keeping artifact $art_id (run $run_id)"
              else
                echo "  deleting artifact $art_id (run $run_id)"
                gh api --method DELETE "repos/$REPO/actions/artifacts/$art_id"
              fi
            done < <(jq -r '.artifacts[] | [.id | tostring, .workflow_run.id | tostring] | @tsv' <<< "$payload")
            (( page++ ))
          done

  # Cleanup: delete all non-release artifacts (runs only during releases)
  cleanup-untagged-artifacts:
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [build-vsix, build-claude-skills, build-jetbrains, build-sublime, build-zed, publish-checksums]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete all artifacts not from the 3 most recent releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Find the 3 most recent release run IDs to protect
          keep_runs=()
          while IFS= read -r tag; do
            run_id=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=push&branch=$tag&per_page=5" \
              | jq -r '[.workflow_runs[] | select(.status=="completed")] | first | .id // empty')
            if [[ -n "$run_id" ]]; then
              keep_runs+=("$run_id")
              echo "  protecting release run $run_id ($tag)"
            fi
          done < <(
            gh release list --repo "$REPO" --json tagName,isDraft,createdAt \
              | jq -r '[.[] | select(.isDraft==false)] | sort_by(.createdAt) | reverse | .[:3] | .[].tagName'
          )

          # Delete everything else
          page=1
          while :; do
            payload=$(gh api "repos/$REPO/actions/artifacts?per_page=100&page=$page")
            count=$(jq '.artifacts | length' <<< "$payload")
            [[ "$count" -eq 0 ]] && break
            while IFS=$'\t' read -r art_id run_id; do
              if printf '%s\n' "${keep_runs[@]}" | grep -qx "$run_id"; then
                echo "  keeping artifact $art_id (release run $run_id)"
              else
                echo "  deleting artifact $art_id (run $run_id)"
                gh api --method DELETE "repos/$REPO/actions/artifacts/$art_id"
              fi
            done < <(jq -r '.artifacts[] | [.id | tostring, .workflow_run.id | tostring] | @tsv' <<< "$payload")
            (( page++ ))
          done
