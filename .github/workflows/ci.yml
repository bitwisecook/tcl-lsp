name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for every job: read-only.  Jobs that need to
# write to the repo (releases, artefact uploads, attestations) escalate
# explicitly in their own `permissions:` block.  A compromised step in
# `pr-gate` / `test-py` / `test-ext` therefore cannot push commits or
# create releases even if the repo-level default is "Read and write".
permissions:
  contents: read

jobs:
  # Fast PR gate (target wall-clock < 20s).  Runs on every PR and every push.
  # Covers: lint + typecheck + structural invariants + a tightly scoped pytest
  # subset that exercises the LSP server end-to-end.  Everything else is the
  # responsibility of `make test-slow` locally (enforced by the pre-push
  # hook installed via `make install-hooks`).  See AGENTS.md for the rule
  # that agents must run test-slow before opening a PR.
  pr-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # See `.github/actions/setup-build/action.yml` for why this composite
          # can't do its own checkout — it lives inside the workspace it would
          # need to materialise.  Default `fetch-depth: 1` + `fetch-tags` based
          # on whether we're on a tag ref (`git describe --tags` consumers
          # need tags reachable from HEAD; tag refs already have the tag at
          # HEAD so don't re-fetch).
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - uses: ./.github/actions/setup-build

      # Note: no wasmtime CLI setup here — the Python tests in ci-fast
      # use the `wasmtime` Python package (already a uv dep) for any
      # wasm execution, and `make test-zig` (which needs the CLI) is a
      # test-slow target that runs locally, not in CI.  If a CI job for
      # `test-zig` is ever added, the optimal action is
      # `bytecodealliance/actions/wasmtime/setup@v1`.
      - name: Run fast CI gate (make ci-fast)
        run: make ci-fast

  # PR gate: the committed `.test-slow.stamp` must match the code under
  # test.  `make test-slow` rewrites that stamp on success with a content
  # fingerprint of every tracked file (the stamp excepted), so a matching
  # stamp proves the full local gate was run against exactly this tree.
  # Content-addressed, hence reliable even though `actions/checkout`
  # resets file mtimes — a timestamp comparison could not work here.
  # Fails loudly with remediation steps; see AGENTS.md for the rule that
  # agents must run test-slow before opening a PR.
  test-slow-stamp:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Verify the PR's OWN head, not the default merge commit: the
          # stamp records the fingerprint the agent ran test-slow against
          # on their branch, so checking the merge-with-main tree would
          # fail spuriously whenever main advanced.  Only tracked-file
          # content is hashed, so a shallow checkout is enough.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify test-slow stamp matches the code under test
        run: bash scripts/test-slow-stamp.sh check

  # Backstop: full Python test suite — runs only on push to main and on tags.
  # PRs are gated by pr-gate; this job catches anything pr-gate missed once
  # the change has merged, so a regression is loud but doesn't block PRs.
  test-py:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10"]
      fail-fast: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # See `.github/actions/setup-build/action.yml` for why this composite
          # can't do its own checkout — it lives inside the workspace it would
          # need to materialise.  Default `fetch-depth: 1` + `fetch-tags` based
          # on whether we're on a tag ref (`git describe --tags` consumers
          # need tags reachable from HEAD; tag refs already have the tag at
          # HEAD so don't re-fetch).
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - uses: ./.github/actions/setup-build
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Zig (needed for runtime auto-build)
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          # Explicit: setup-zig defaults to use-cache=true, but be loud
          # about it so a future bump can't silently flip the default.
          # Caches both the zig toolchain download and the zig-cache dir
          # keyed on build.zig{,.zon} when present.
          use-cache: true

      - name: Fetch Tcl regex engine sources (runtime/zig/vendor/tcl-regex)
        run: bash scripts/fetch_tcl_regex.sh

      - name: Run Python tests
        run: >-
          uv run --extra dev pytest tests/ -q
          -m "not slow"
          --ignore-glob='*/test_vm_*_test.py'
          --ignore=tests/test_optimiser_coverage.py
          --ignore=tests/test_optimiser_vm_equivalence.py
          --ignore=tests/test_irule_test_framework.py
          --ignore=tests/test_real_world_examples.py
          --ignore=tests/test_bigip_parser.py
          --ignore=tests/test_bigip_validator.py
          -k 'not TestUnusedIruleProcs and not TestMockStubsIntegration and not test_generated_command_hover_marks_refinement_status and not test_generated_irules_hover_marks_refinement_status and not test_cookbook_tcp_collect_has_no_warnings'
  # Backstop: VS Code extension tests — runs only on push to main and on tags.
  # PRs are gated by pr-gate; locally this is covered by `make test-slow`.
  test-ext:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # See `.github/actions/setup-build/action.yml` for why this composite
          # can't do its own checkout — it lives inside the workspace it would
          # need to materialise.  Default `fetch-depth: 1` + `fetch-tags` based
          # on whether we're on a tag ref (`git describe --tags` consumers
          # need tags reachable from HEAD; tag refs already have the tag at
          # HEAD so don't re-fetch).
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - uses: ./.github/actions/setup-build

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      # Pin the npm CLI via the `packageManager` field in
      # editors/vscode/package.json. Corepack downloads and activates the
      # pinned npm so `npm ci` runs the same version locally and in CI.
      - name: Enable Corepack (pin npm via packageManager)
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          # `corepack enable` alone only shims pnpm/yarn; npm must be named
          # explicitly (`corepack enable npm`) or the shim isn't created and
          # the npm bundled with setup-node wins. Assert the pin is live so a
          # silent regression fails loudly instead of using the wrong npm.
          corepack enable npm
          cd editors/vscode
          active="$(npm --version)"
          echo "Active npm: $active (pinned via packageManager)"
          case "$active" in
            12.*) ;;
            *) echo "::error::expected npm 12 from packageManager pin, got $active"; exit 1 ;;
          esac

      # `package-lock.json` is committed, so installs are pinned by hash.
      # Cache the npm metadata directory keyed on the lockfile so the
      # cache invalidates whenever the resolved dependency tree changes.
      - name: Cache npm registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('editors/vscode/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install npm dependencies
        run: cd editors/vscode && npm ci

      - name: Lint TypeScript
        run: cd editors/vscode && npm run lint

      - name: Copy canonical AI data
        run: make copy-canonical

      - name: Compile TypeScript
        run: cd editors/vscode && npx tsc -p ./

      - name: Run extension tests
        run: make test-ext

  # Release: create (or verify) the GitHub Release so each build job
  # can upload its artifact independently — no single slow or failing
  # build blocks the others.
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pr-gate, test-py]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # gh release upload
      id-token: write        # OIDC for sigstore-backed attestations
      attestations: write    # actions/attest-build-provenance writes here
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" > /dev/null 2>&1; then
            exit 0
          fi
          # Require curated release notes.  The previous fallback to
          # `gh release create --generate-notes` builds the changelog
          # from commit messages and PR titles, both attacker-influenced
          # — anyone whose PR merged since the last release can land
          # text inside our official release notes.  Failing closed
          # forces the maintainer to commit RELEASE_NOTES.md before
          # tagging.
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "ERROR: RELEASE_NOTES.md is missing for tag $tag." >&2
            echo "Commit curated notes to RELEASE_NOTES.md before pushing the tag." >&2
            exit 1
          fi
          gh release create "$tag" \
            --title "$tag" \
            --notes-file RELEASE_NOTES.md

      - name: Stamp + upload installer script to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          sha="$(git rev-parse --short HEAD)"
          # Replace the @@INSTALLER_VERSION_*@@ placeholders so a user
          # running --version on the published asset sees the actual
          # release. The in-tree script on main stays unstamped so
          # contributors don't see misleading version strings locally.
          tmp="$(mktemp)"
          sed \
            -e "s/@@INSTALLER_VERSION_TAG@@/${tag}/" \
            -e "s/@@INSTALLER_VERSION_SHA@@/(${sha})/" \
            scripts/install/install.sh > "$tmp"
          # Sanity-check that both placeholders were actually replaced
          # before we upload — failing loudly here beats publishing a
          # script that reports itself as "dev (unstamped)".
          if grep -q '@@INSTALLER_VERSION_' "$tmp"; then
              echo "ERROR: installer placeholder was not stamped" >&2
              grep '@@INSTALLER_VERSION_' "$tmp" >&2
              exit 1
          fi
          install -m 0755 "$tmp" install.sh
          rm -f "$tmp"

      - name: Attest installer script build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "install.sh"

      - name: Upload installer script to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release upload "$tag" install.sh --clobber

  # Build: VSIX package
  build-vsix:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release, test-ext]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # gh release upload
      id-token: write        # OIDC for sigstore-backed attestations
      attestations: write    # actions/attest-build-provenance writes here
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # See `.github/actions/setup-build/action.yml` for why this composite
          # can't do its own checkout — it lives inside the workspace it would
          # need to materialise.  Default `fetch-depth: 1` + `fetch-tags` based
          # on whether we're on a tag ref (`git describe --tags` consumers
          # need tags reachable from HEAD; tag refs already have the tag at
          # HEAD so don't re-fetch).
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - uses: ./.github/actions/setup-build

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      # Pin the npm CLI via the `packageManager` field in
      # editors/vscode/package.json. Corepack downloads and activates the
      # pinned npm so `npm ci` runs the same version locally and in CI.
      - name: Enable Corepack (pin npm via packageManager)
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          # `corepack enable` alone only shims pnpm/yarn; npm must be named
          # explicitly (`corepack enable npm`) or the shim isn't created and
          # the npm bundled with setup-node wins. Assert the pin is live so a
          # silent regression fails loudly instead of using the wrong npm.
          corepack enable npm
          cd editors/vscode
          active="$(npm --version)"
          echo "Active npm: $active (pinned via packageManager)"
          case "$active" in
            12.*) ;;
            *) echo "::error::expected npm 12 from packageManager pin, got $active"; exit 1 ;;
          esac

      # `package-lock.json` is committed, so installs are pinned by hash.
      # Cache the npm metadata directory keyed on the lockfile so the
      # cache invalidates whenever the resolved dependency tree changes.
      - name: Cache npm registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('editors/vscode/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install npm dependencies
        run: cd editors/vscode && npm ci

      - name: Build and verify VSIX
        run: make package-vsix

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/*.vsix"
          artefact-name: vsix

  # ---------------------------------------------------------------------
  # build-zipapp — one matrix job that replaces what used to be eight
  # nearly-identical build-zipapp-<profile> jobs.
  #
  # Each matrix entry declares the profile name (which `make zipapp-<name>`
  # to invoke), the glob that resolves to the produced artefact, and an
  # optional `smoke` block that runs after the build.  The shared setup
  # (checkout + uv + python) and the shared release tail
  # (attest + SBOM + cosign sign + upload + gh release upload) live in
  # two composite actions under `.github/actions/`.
  #
  # Adding a new zipapp profile is one matrix entry here + one `Profile(...)`
  # registration in `scripts/build/zipapps.py` + one `zipapp_rule` line in
  # the Makefile.
  # ---------------------------------------------------------------------
  build-zipapp:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # gh release upload
      id-token: write        # OIDC for sigstore-backed attestations
      attestations: write    # actions/attest-build-provenance writes here
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: explorer-cli
            artefact_glob: "build/tcl-lsp-explorer-cli-*.pyz"
            smoke: |
              python3 build/tcl-lsp-explorer-cli-*.pyz --help
              # Verify the textual TUI dependency is bundled — without
              # this, `--tui` mode dies at import with `No module named
              # 'rich'` (the default surface on an interactive TTY).
              python3 -c "
              import zipfile, glob
              path = glob.glob('build/tcl-lsp-explorer-cli-*.pyz')[0]
              names = zipfile.ZipFile(path).namelist()
              assert any(n.startswith('rich/') for n in names), 'rich not bundled (--tui will fail)'
              assert any(n.startswith('textual/') for n in names), 'textual not bundled (--tui will fail)'
              print(f'OK: {len(names)} entries (textual + rich bundled for --tui)')
              "

          - profile: f5
            artefact_glob: "build/f5-*.pyz"
            smoke: |
              python3 build/f5-*.pyz --help
              python3 build/f5-*.pyz cleanup samples/bigip/bigip.conf
              python3 build/f5-*.pyz cleanup --json samples/bigip/bigip.conf > /tmp/cleanup.json
              python3 -c "import json; data = json.load(open('/tmp/cleanup.json')); assert 'candidates' in data, data; assert 'tmshScript' in data, data"
              # event-info / event-order are iRules-only verbs; they moved from
              # `tcl` to `f5 irule` in PR #387 when the irule binary alias was
              # dropped.
              python3 build/f5-*.pyz irule event-info HTTP_REQUEST --json
              # Bundled shell-completion scripts must round-trip through the zipapp
              # and parse cleanly under the corresponding shell where available.
              python3 build/f5-*.pyz completion bash > /tmp/f5.bash
              python3 build/f5-*.pyz completion fish > /tmp/f5.fish
              python3 build/f5-*.pyz completion zsh  > /tmp/_f5
              bash -n /tmp/f5.bash
              # zsh and fish aren't installed in CI; rely on the bash syntax
              # check plus the static unit tests for those scripts.

          - profile: tcl
            artefact_glob: "build/tcl-*.pyz"
            smoke: |
              python3 build/tcl-*.pyz --help
              python3 build/tcl-*.pyz format samples/for_screenshots/ai-scene.irul
              python3 build/tcl-*.pyz lint --source "set x 1"
              python3 build/tcl-*.pyz symbols samples/for_screenshots/ai-scene.irul --json
              python3 build/tcl-*.pyz callgraph samples/for_screenshots/ai-scene.irul --json
              python3 build/tcl-*.pyz command-info HTTP::uri --dialect f5-irules --json
              python3 build/tcl-*.pyz find-legacy samples/for_screenshots/ai-scene.irul --json
              python3 build/tcl-*.pyz highlight samples/for_screenshots/ai-scene.irul --no-colour
              python3 build/tcl-*.pyz diff samples/for_screenshots/ai-scene.irul samples/for_screenshots/ai-scene.irul --show ast --json
              python3 build/tcl-*.pyz help taint --dialect f5-irules

          - profile: lsp
            artefact_glob: "build/tcl-lsp-server-*.pyz"
            smoke: "python3 build/tcl-lsp-server-*.pyz --help"

          - profile: mcp
            artefact_glob: "build/tcl-lsp-mcp-server-*.pyz"
            smoke: "python3 build/tcl-lsp-mcp-server-*.pyz --help"

          # NOTE: the wasm profile is intentionally NOT in this matrix.  Unlike
          # the other profiles, `make zipapp-wasm` builds the Zig runtime
          # (RUNTIME_WASM → `zig build`), which needs the Zig toolchain and the
          # vendored Tcl-regex sources that the shared `setup-build` action does
          # not install.  It runs as the dedicated `build-zipapp-wasm` job below,
          # which sets up Zig, fetches the regex sources, and additionally emits
          # an SBOM + provenance attestation.  (Leaving it here produced a
          # duplicate `zipapp-wasm` artefact upload and failed for lack of Zig.)

          - profile: explorer-gui-cdn
            artefact_glob: "build/tcl-lsp-explorer-gui-cdn-*.pyz"
            smoke: |
              python3 -c "
              import zipfile, glob
              path = glob.glob('build/tcl-lsp-explorer-gui-cdn-*.pyz')[0]
              zf = zipfile.ZipFile(path)
              names = zf.namelist()
              assert 'static/index.html' in names, 'missing index.html'
              assert 'static/worker.js' in names, 'missing worker.js'
              assert not any('pyodide' in n for n in names), 'should not bundle pyodide'
              print(f'OK: {len(names)} entries (CDN variant)')
              "
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # See `.github/actions/setup-build/action.yml` for why this composite
          # can't do its own checkout — it lives inside the workspace it would
          # need to materialise.  Default `fetch-depth: 1` + `fetch-tags` based
          # on whether we're on a tag ref (`git describe --tags` consumers
          # need tags reachable from HEAD; tag refs already have the tag at
          # HEAD so don't re-fetch).
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - uses: ./.github/actions/setup-build

      - name: Build ${{ matrix.profile }} zipapp
        run: make zipapp-${{ matrix.profile }}

      - name: Smoke-test ${{ matrix.profile }} zipapp
        if: matrix.smoke != ''
        run: ${{ matrix.smoke }}

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: ${{ matrix.artefact_glob }}
          artefact-name: zipapp-${{ matrix.profile }}

  # ---------------------------------------------------------------------
  # build-claude-skills builds the AI zipapp first (since `make
  # claude-skills` bundles the AI zipapp into the skills release zip),
  # smokes both, then attests and uploads the skills zip + the AI zipapp.
  # Stays standalone because it produces TWO artefacts in one go.
  # ---------------------------------------------------------------------
  build-claude-skills:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # See `.github/actions/setup-build/action.yml` for why this composite
          # can't do its own checkout — it lives inside the workspace it would
          # need to materialise.  Default `fetch-depth: 1` + `fetch-tags` based
          # on whether we're on a tag ref (`git describe --tags` consumers
          # need tags reachable from HEAD; tag refs already have the tag at
          # HEAD so don't re-fetch).
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - uses: ./.github/actions/setup-build

      - name: Build AI zipapp
        run: make zipapp-ai

      - name: Smoke-test AI zipapp
        run: python3 build/tcl-lsp-ai-*.pyz context samples/for_screenshots/ai-scene.irul

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/tcl-lsp-ai-*.pyz"
          artefact-name: zipapp-ai

      - name: Build Claude skills zip
        run: make claude-skills

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/tcl-lsp-claude-skills-*.zip"
          artefact-name: claude-skills

  # Build: MCP server zipapp
  build-zipapp-mcp:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # gh release upload
      id-token: write        # OIDC for sigstore-backed attestations
      attestations: write    # actions/attest-build-provenance writes here
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # See pr-gate for why this is depth-1 + tags rather than full
          # history: `git describe --tags` is the only consumer of the
          # checkout and only needs tags reachable from HEAD.
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Sync Python environment
        run: uv sync --extra dev

      - name: Build MCP zipapp
        run: make zipapp-mcp

      - name: Smoke-test MCP zipapp
        run: python3 build/tcl-lsp-mcp-server-*.pyz --help

      - name: Attest MCP zipapp build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "build/tcl-lsp-mcp-server-*.pyz"

      - name: Resolve MCP zipapp path
        id: sbom_mcp
        run: |
          set -euo pipefail
          artefact=$(ls build/tcl-lsp-mcp-server-*.pyz | head -1)
          [ -n "$artefact" ]
          echo "artefact=$artefact" >> "$GITHUB_OUTPUT"
          echo "sbom=${artefact}.sbom.spdx.json" >> "$GITHUB_OUTPUT"

      - name: Generate MCP SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: ${{ steps.sbom_mcp.outputs.artefact }}
          format: spdx-json
          output-file: ${{ steps.sbom_mcp.outputs.sbom }}
          upload-artifact: false
          upload-release-assets: false

      - name: Attest MCP SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ steps.sbom_mcp.outputs.artefact }}
          sbom-path: ${{ steps.sbom_mcp.outputs.sbom }}

      - name: Upload MCP zipapp
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zipapp-mcp
          path: "build/tcl-lsp-mcp-server-*.pyz"
          retention-days: 7

      - name: Upload MCP zipapp to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SBOM_PATH: ${{ steps.sbom_mcp.outputs.sbom }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release upload "$tag" build/tcl-lsp-mcp-server-*.pyz "$SBOM_PATH" --clobber

  # Build: WASM compiler zipapp
  build-zipapp-wasm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # gh release upload
      id-token: write        # OIDC for sigstore-backed attestations
      attestations: write    # actions/attest-build-provenance writes here
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # See pr-gate for why this is depth-1 + tags rather than full
          # history: `git describe --tags` is the only consumer of the
          # checkout and only needs tags reachable from HEAD.
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Zig (needed for runtime auto-build)
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: true

      - name: Fetch Tcl regex engine sources (runtime/zig/vendor/tcl-regex)
        run: bash scripts/fetch_tcl_regex.sh

      - name: Sync Python environment
        run: uv sync --extra dev

      - name: Build WASM zipapp
        run: make zipapp-wasm

      - name: Smoke-test WASM zipapp
        run: python3 build/tcl-wasm-compiler-*.pyz --help

      - name: Attest WASM zipapp build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "build/tcl-wasm-compiler-*.pyz"

      - name: Resolve WASM zipapp path
        id: sbom_wasm
        run: |
          set -euo pipefail
          artefact=$(ls build/tcl-wasm-compiler-*.pyz | head -1)
          [ -n "$artefact" ]
          echo "artefact=$artefact" >> "$GITHUB_OUTPUT"
          echo "sbom=${artefact}.sbom.spdx.json" >> "$GITHUB_OUTPUT"

      - name: Generate WASM SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: ${{ steps.sbom_wasm.outputs.artefact }}
          format: spdx-json
          output-file: ${{ steps.sbom_wasm.outputs.sbom }}
          upload-artifact: false
          upload-release-assets: false

      - name: Attest WASM SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ steps.sbom_wasm.outputs.artefact }}
          sbom-path: ${{ steps.sbom_wasm.outputs.sbom }}

      - name: Upload WASM zipapp
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zipapp-wasm
          path: "build/tcl-wasm-compiler-*.pyz"
          retention-days: 7

      - name: Upload WASM zipapp to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SBOM_PATH: ${{ steps.sbom_wasm.outputs.sbom }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release upload "$tag" build/tcl-wasm-compiler-*.pyz "$SBOM_PATH" --clobber

  # Build: JetBrains plugin
  build-jetbrains:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # gh release upload
      id-token: write        # OIDC for sigstore-backed attestations
      attestations: write    # actions/attest-build-provenance writes here
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # See `.github/actions/setup-build/action.yml` for why this composite
          # can't do its own checkout — it lives inside the workspace it would
          # need to materialise.  Default `fetch-depth: 1` + `fetch-tags` based
          # on whether we're on a tag ref (`git describe --tags` consumers
          # need tags reachable from HEAD; tag refs already have the tag at
          # HEAD so don't re-fetch).
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - uses: ./.github/actions/setup-build

      - name: Set up Java 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            editors/jetbrains/*.gradle*
            editors/jetbrains/gradle/wrapper/gradle-wrapper.properties

      - name: Build JetBrains plugin
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: make build-editor-jetbrains

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/tcl-lsp-jetbrains-*.zip"
          artefact-name: jetbrains-plugin

  # Build: Sublime Text package
  build-sublime:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # gh release upload
      id-token: write        # OIDC for sigstore-backed attestations
      attestations: write    # actions/attest-build-provenance writes here
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # See `.github/actions/setup-build/action.yml` for why this composite
          # can't do its own checkout — it lives inside the workspace it would
          # need to materialise.  Default `fetch-depth: 1` + `fetch-tags` based
          # on whether we're on a tag ref (`git describe --tags` consumers
          # need tags reachable from HEAD; tag refs already have the tag at
          # HEAD so don't re-fetch).
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - uses: ./.github/actions/setup-build

      - name: Build Sublime Text package
        run: make build-editor-sublime

      - name: Smoke-test Sublime package
        run: |
          python3 -c "
          import zipfile, glob
          path = glob.glob('build/tcl-lsp-sublime-*.sublime-package')[0]
          zf = zipfile.ZipFile(path)
          names = zf.namelist()
          assert any(n.startswith('server/') for n in names), 'missing server directory'
          assert 'Tcl.sublime-syntax' in names, 'missing Tcl syntax'
          assert 'iRule.sublime-syntax' in names, 'missing iRule syntax'
          assert 'plugin.py' in names, 'missing plugin'
          assert 'LSP-Tcl.sublime-settings' in names, 'missing LSP settings'
          print(f'OK: {len(names)} entries')
          "

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/tcl-lsp-sublime-*.sublime-package"
          artefact-name: sublime-package

  # Build: Zed extension
  build-zed:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # gh release upload
      id-token: write        # OIDC for sigstore-backed attestations
      attestations: write    # actions/attest-build-provenance writes here
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # See `.github/actions/setup-build/action.yml` for why this composite
          # can't do its own checkout — it lives inside the workspace it would
          # need to materialise.  Default `fetch-depth: 1` + `fetch-tags` based
          # on whether we're on a tag ref (`git describe --tags` consumers
          # need tags reachable from HEAD; tag refs already have the tag at
          # HEAD so don't re-fetch).
          fetch-depth: 1
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - uses: ./.github/actions/setup-build

      - name: Set up Rust
        # actions-rust-lang/setup-rust-toolchain wraps swatinem/rust-cache
        # so we get cargo registry / target caching for free — meaningful
        # speedup vs the bare dtolnay/rust-toolchain action.
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: stable
          target: wasm32-wasip2
          components: clippy, rustfmt

      - name: Build Zed extension
        run: make build-editor-zed

      - name: Smoke-test Zed archive
        run: |
          python3 -c "
          import zipfile, glob
          path = glob.glob('build/tcl-lsp-zed-*.zip')[0]
          zf = zipfile.ZipFile(path)
          names = zf.namelist()
          assert 'extension.toml' in names, 'missing extension.toml'
          assert 'extension.wasm' in names, 'missing extension.wasm'
          assert any('languages/tcl/config.toml' in n for n in names), 'missing Tcl language config'
          assert any('snippets/tcl.json' in n for n in names), 'missing snippets'
          print(f'OK: {len(names)} entries')
          "

      - uses: ./.github/actions/sign-and-upload
        with:
          artefact-glob: "build/tcl-lsp-zed-*.zip"
          artefact-name: zed-extension

  # Publish: aggregate SHA256SUMS over every artefact attached to the
  # release, plus an optional cosign keyless signature. The installer
  # verifies downloaded artefacts against this file.
  publish-checksums:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release, build-vsix, build-zipapp, build-claude-skills, build-jetbrains, build-sublime, build-zed]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # gh release upload
      id-token: write   # cosign keyless OIDC signing
    steps:
      - name: Determine tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Download every release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          # Pull every asset currently attached to the release; this
          # gives a single SUMS covering whatever was uploaded by the
          # 12 build jobs (or by future ones, without further edits).
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir dist \
            --clobber

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          # Sort for deterministic ordering. Exclude any pre-existing
          # SHA256SUMS{,.cosign.bundle} so a rerun doesn't hash itself.
          find . -maxdepth 1 -type f \
            ! -name SHA256SUMS \
            ! -name 'SHA256SUMS.*' \
            -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs -r sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" dist/SHA256SUMS \
            --repo "${{ github.repository }}" --clobber

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin the cosign binary itself, not just the installer action.
          # Without this, the installer downloads "latest" cosign — which
          # is itself a moving target.  Bump in lockstep with the action.
          cosign-release: 'v2.6.3'

      - name: Sign SHA256SUMS (keyless OIDC)
        working-directory: dist
        run: |
          cosign sign-blob --yes \
            --bundle SHA256SUMS.cosign.bundle \
            SHA256SUMS

      - name: Upload SHA256SUMS.cosign.bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" dist/SHA256SUMS.cosign.bundle \
            --repo "${{ github.repository }}" --clobber

  # Keyless VS Code Marketplace publish via GitHub OIDC -> Azure Entra
  # workload-identity federation.  No marketplace PAT exists anywhere: the
  # job exchanges GitHub's OIDC token for a short-lived Entra token at
  # publish time (`vsce publish --azure-credential`).  This honours the
  # AGENTS.md invariant (no long-lived publish secret in CI) — the keyless
  # analogue of the sigstore signing used by publish-checksums above.
  #
  # Gated by the `marketplace-vscode` Environment (required reviewer + a
  # v*-tag-only deployment policy), so it PAUSES for manual approval and can
  # never run on a non-tag ref.  Minimal on purpose: it only downloads the
  # already-built, already-signed .vsix and runs vsce — no source build, no
  # project dep install — to keep the smallest possible surface around the
  # federated session.
  #
  # Skipped until the Entra identity is configured (AZURE_CLIENT_ID /
  # AZURE_TENANT_ID repo *variables* — non-secret identifiers).  Nothing
  # depends on this job, so its manual-approval wait never blocks cleanup.
  publish-vsix-marketplace:
    if: startsWith(github.ref, 'refs/tags/v') && vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != ''
    needs: [build-vsix, publish-checksums]
    runs-on: ubuntu-24.04
    environment: marketplace-vscode
    permissions:
      id-token: write # GitHub OIDC token for Entra federation
      contents: read
    steps:
      - name: Download the signed VSIX (built upstream)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
          path: dist

      - name: Azure login (OIDC — no secret at rest)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Publish to VS Code Marketplace (keyless)
        run: |
          set -euo pipefail
          vsix="$(find dist -name '*.vsix' | head -1)"
          if [ -z "$vsix" ]; then
            echo "::error::no .vsix found in the downloaded 'vsix' artifact"; exit 1
          fi
          echo "Publishing $vsix via vsce --azure-credential (no PAT)"
          npx --yes @vscode/vsce@3.9.2 publish --azure-credential --packagePath "$vsix"

  # Cleanup: delete workflow artifacts for all releases except the 3 most recent
  cleanup-old-artifacts:
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [build-vsix, build-zipapp, build-claude-skills, build-jetbrains, build-sublime, build-zed, publish-checksums]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete artifacts outside the 3 most recent releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Get the 3 most recent non-draft release tags
          mapfile -t keep_tags < <(
            gh release list --repo "$REPO" --json tagName,isDraft,createdAt \
              | jq -r '[.[] | select(.isDraft==false)] | sort_by(.createdAt) | reverse | .[:3] | .[].tagName'
          )
          echo "Retaining artifacts for: ${keep_tags[*]}"

          # Always keep the current run (it may still be in_progress in the API)
          keep_runs=("${{ github.run_id }}")
          echo "  keeping run ${{ github.run_id }} (current)"

          # Resolve each tag to its most recent completed CI run
          for tag in "${keep_tags[@]}"; do
            run_id=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=push&branch=$tag&per_page=10" \
              | jq -r '[.workflow_runs[] | select(.status=="completed")] | first | .id // empty')
            if [[ -n "$run_id" && "$run_id" != "${{ github.run_id }}" ]]; then
              keep_runs+=("$run_id")
              echo "  keeping run $run_id for $tag"
            fi
          done

          # Page through all artifacts; delete those not from a kept run
          page=1
          while :; do
            payload=$(gh api "repos/$REPO/actions/artifacts?per_page=100&page=$page")
            count=$(jq '.artifacts | length' <<< "$payload")
            [[ "$count" -eq 0 ]] && break
            while IFS=$'\t' read -r art_id run_id; do
              if printf '%s\n' "${keep_runs[@]}" | grep -qx "$run_id"; then
                echo "  keeping artifact $art_id (run $run_id)"
              else
                echo "  deleting artifact $art_id (run $run_id)"
                gh api --method DELETE "repos/$REPO/actions/artifacts/$art_id"
              fi
            done < <(jq -r '.artifacts[] | [.id | tostring, .workflow_run.id | tostring] | @tsv' <<< "$payload")
            (( page++ ))
          done

  # Cleanup: delete all non-release artifacts (runs only during releases)
  cleanup-untagged-artifacts:
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [build-vsix, build-zipapp, build-claude-skills, build-jetbrains, build-sublime, build-zed, publish-checksums]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete all artifacts not from the 3 most recent releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Find the 3 most recent release run IDs to protect
          keep_runs=()
          while IFS= read -r tag; do
            run_id=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=push&branch=$tag&per_page=5" \
              | jq -r '[.workflow_runs[] | select(.status=="completed")] | first | .id // empty')
            if [[ -n "$run_id" ]]; then
              keep_runs+=("$run_id")
              echo "  protecting release run $run_id ($tag)"
            fi
          done < <(
            gh release list --repo "$REPO" --json tagName,isDraft,createdAt \
              | jq -r '[.[] | select(.isDraft==false)] | sort_by(.createdAt) | reverse | .[:3] | .[].tagName'
          )

          # Delete everything else
          page=1
          while :; do
            payload=$(gh api "repos/$REPO/actions/artifacts?per_page=100&page=$page")
            count=$(jq '.artifacts | length' <<< "$payload")
            [[ "$count" -eq 0 ]] && break
            while IFS=$'\t' read -r art_id run_id; do
              if printf '%s\n' "${keep_runs[@]}" | grep -qx "$run_id"; then
                echo "  keeping artifact $art_id (release run $run_id)"
              else
                echo "  deleting artifact $art_id (run $run_id)"
                gh api --method DELETE "repos/$REPO/actions/artifacts/$art_id"
              fi
            done < <(jq -r '.artifacts[] | [.id | tostring, .workflow_run.id | tostring] | @tsv' <<< "$payload")
            (( page++ ))
          done
