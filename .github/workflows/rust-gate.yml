name: rust-gate

# Cargo-checks gate for the `rust` branch during the Python→Rust rewrite.
#
# BLOCKING gate. The workspace test binaries are built ONCE (`cargo nextest
# archive`), then the tests run in PARALLEL partitions against that pre-built
# archive — no per-job rebuild. This beats one-big-serial-run and the earlier
# core/heavy split (which rebuilt the workspace twice), because the CPU-bound
# VM-simulation suites (tcl-irule-test, f5 parity) are spread across the
# partitions by nextest instead of stacking behind everything else.
#
#   - build-test-archive  — build every test binary once, upload the archive
#   - test (partition N/4) — download the archive, run 1/4 of the tests (no build)
#   - doctest             — the workspace doctests (nextest doesn't archive these)
#   - rust-tests          — aggregate gate; succeeds iff all of the above pass.
#                           THIS is the required status check (name unchanged),
#                           so branch protection needs no update.
#
# The native-server lsp_e2e suite lives in its own workflow (`rust-lsp-e2e.yml`,
# the `lsp-e2e` required check). `main`'s pipeline is ci.yml; this lives on
# `rust` only.

on:
  pull_request:
    branches: [rust]
  push:
    branches: [rust]

concurrency:
  group: rust-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ARCHIVE: nextest-archive.tar.zst

jobs:
  # Build every test binary once and publish the nextest archive.
  build-test-archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: nextest

      # Builds all workspace test binaries + bundles them (with metadata) into a
      # single archive. `[profile.test] debug = "line-tables-only"` keeps the
      # archive small (panic backtraces still resolve).
      - name: Build test archive
        run: cargo nextest archive --workspace --all-features --archive-file "${{ runner.temp }}/${{ env.ARCHIVE }}"

      - name: Upload test archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/${{ env.ARCHIVE }}
          retention-days: 1
          compression-level: 0 # already zstd-compressed

  # Run a quarter of the tests against the pre-built archive (no compilation).
  # nextest spreads tests (incl. the heavy VM sims) across the partitions.
  test:
    needs: build-test-archive
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      # The source tree is needed for test fixtures + `--workspace-remap`.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: nextest

      - name: Download test archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextest-archive
          path: ${{ runner.temp }}

      - name: Run partition ${{ matrix.partition }}/4
        run: |
          cargo nextest run \
            --archive-file "${{ runner.temp }}/${{ env.ARCHIVE }}" \
            --workspace-remap . \
            --partition "hash:${{ matrix.partition }}/4" \
            --no-fail-fast

  # Doctests are not part of the nextest archive; run them once, workspace-wide,
  # reusing the build cache the archive job populated.
  doctest:
    needs: build-test-archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: cargo test --doc
        run: cargo test --workspace --all-features --doc --no-fail-fast

  # Aggregate gate: this is the REQUIRED status check (stable name), green only
  # when every partition + the doctests pass.
  rust-tests:
    needs: [build-test-archive, test, doctest]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify all rust test jobs passed
        run: |
          echo "build-test-archive: ${{ needs.build-test-archive.result }}"
          echo "test (partitions):  ${{ needs.test.result }}"
          echo "doctest:            ${{ needs.doctest.result }}"
          [ "${{ needs.build-test-archive.result }}" = "success" ] \
            && [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.doctest.result }}" = "success" ]

  # Supply-chain audit: advisories / licenses / bans / sources, driven by the
  # committed deny.toml.  Its own job (hence its own status check) so a denial
  # is attributable independently of the cargo test surface above — same split
  # rationale as rust-lsp-e2e.yml.  The action defaults match `make rust-deny`
  # (`check --all-features`, manifest `./Cargo.toml`); deny.toml and the
  # workspace manifest both live at the repo root.
  cargo-deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
