name: rust-gate

# Cargo-checks gate for the `rust` branch during the Python→Rust rewrite.
#
# This is a BLOCKING gate: the cargo workspace suite is green on `rust`, so the
# `rust-tests` job is wired as a REQUIRED status check (branch protection on
# `rust`) — a regression that reddens it blocks the merge.
#
# Scope: the cargo workspace suite only.  The native-server lsp_e2e suite lives
# in its own workflow (`rust-lsp-e2e.yml`, the `lsp-e2e` required check) so it is
# not coupled to the cargo checks — it builds a release binary and drives a
# Python suite, a different and slower surface that reports on its own.
#
# `main`'s pipeline is ci.yml; this lives on `rust` only.

on:
  pull_request:
    branches: [rust]
  push:
    branches: [rust]

concurrency:
  group: rust-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      # rust-toolchain.toml pins the channel (stable); rustup on the runner
      # resolves it on the first cargo call.  Cache registry + target dir.
      # (No Python: the workspace is pure Rust — the PyO3 binding crates were
      # retired, so `cargo test --workspace` needs no Python env.)
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # nextest runs every workspace test binary's tests in ONE global parallel
      # pool, so the CPU-bound VM-simulation suites (tcl-irule-test, f5 parity,
      # lsp e2e) overlap instead of running one binary at a time — a large
      # wall-clock win over `cargo test`, which runs test binaries serially.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: nextest

      # --no-fail-fast: run every test even after one fails, so a single run
      # lists all failures rather than aborting at the first.
      - name: cargo nextest run --workspace --all-features
        run: cargo nextest run --workspace --all-features --no-fail-fast

      # nextest does not run doctests; run them separately (deps are already
      # built, so this is just the doctest compile + run).
      - name: cargo test --doc
        run: cargo test --workspace --all-features --doc --no-fail-fast

  # Supply-chain audit: advisories / licenses / bans / sources, driven by the
  # committed deny.toml.  Its own job (hence its own status check) so a denial
  # is attributable independently of the cargo test surface above — same split
  # rationale as rust-lsp-e2e.yml.  The action defaults match `make rust-deny`
  # (`check --all-features`, manifest `./Cargo.toml`); deny.toml and the
  # workspace manifest both live at the repo root.
  cargo-deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
