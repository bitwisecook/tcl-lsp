name: rust-gate

# Status board for the `rust` branch during the Python→Rust rewrite.
#
# This is INFORMATIONAL, not a merge gate: the rust server is still being
# brought to parity, so genuine test/e2e failures are expected.  The job runs
# with `continue-on-error: true` so a failure NEVER blocks a merge — the point
# is visibility (the failing step is shown inside the run), not gating.  Remove
# `continue-on-error` once the rust server reaches parity and this should
# become a real gate.
#
# It runs exactly `make test-rust` — the same target developers run locally:
# the cargo workspace suite, then a native-server build, then the lsp_e2e suite
# driven against that server (TCL_LSP_SERVER_KIND=rust).  Driving CI through the
# make target keeps one source of truth for "what rust CI runs".
#
# `main`'s pipeline is ci.yml (test-slow-stamp included); none of it runs here.
# This rust-gate is the only CI on `rust`.

on:
  pull_request:
    branches: [rust]
  push:
    branches: [rust]

concurrency:
  group: rust-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-rust:
    runs-on: ubuntu-24.04
    # Non-blocking during the rewrite: surface failures without gating merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      # uv + Python: lsp_e2e is pytest-driven and a handful of workspace crates
      # (PyO3 surfaces) build against the project's Python env.
      - uses: ./.github/actions/setup-build

      # rust-toolchain.toml pins the channel (stable); rustup on the runner
      # resolves it on the first cargo call.  Cache registry + target dir.
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # `make test-rust` = cargo test --workspace --all-features, then
      # `make rust-server`, then lsp_e2e against that native server.
      - name: make test-rust
        run: make test-rust
