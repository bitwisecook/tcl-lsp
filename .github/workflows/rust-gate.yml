name: rust-gate

# Cargo-checks gate for the `rust` branch during the Python→Rust rewrite.
#
# This is a BLOCKING gate: the cargo workspace suite is green on `rust`, so the
# `rust-tests` job is wired as a REQUIRED status check (branch protection on
# `rust`) — a regression that reddens it blocks the merge.
#
# Scope: the cargo workspace suite only.  The native-server lsp_e2e suite lives
# in its own workflow (`rust-lsp-e2e.yml`, the `lsp-e2e` required check) so it is
# not coupled to the cargo checks — it builds a release binary and drives a
# Python suite, a different and slower surface that reports on its own.
#
# `main`'s pipeline is ci.yml; this lives on `rust` only.

on:
  pull_request:
    branches: [rust]
  push:
    branches: [rust]

concurrency:
  group: rust-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      # uv + Python: a handful of workspace crates (PyO3 surfaces) build against
      # the project's Python env, and it is cheap to have ready.
      - uses: ./.github/actions/setup-build

      # rust-toolchain.toml pins the channel (stable); rustup on the runner
      # resolves it on the first cargo call.  Cache registry + target dir.
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # --no-fail-fast: run every test binary even after one fails, so a single
      # run lists all failing crates rather than aborting at the first.
      - name: cargo test --workspace --all-features
        run: cargo test --workspace --all-features --no-fail-fast
