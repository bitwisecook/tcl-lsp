      - name: Run original SpecTcl ALL10 and separate original catch1
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/spectcl-fold-target
          OUT: ${{ runner.temp }}/spectcl-fold-output
          EXPECTED_WORK_SHA: ${{ inputs.runtime_sha }}
          TCL_REQUIRE_SPECTCL_COMPAT: "1"
        run: |
          set -euo pipefail
          unset TCL_RUNTIME_EXPECT_NO_TOMMATH
          export TCL_TOMMATH_DIR="$GITHUB_WORKSPACE/tmp/tcl9.0.4/libtommath"
          python3 -B docs/work/name-handling/validation-tools/spectcl-fold-diagnostics.py --sha "$EXPECTED_WORK_SHA" --out "$OUT"
      - name: Upload bounded original-test diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spectcl-fold-diagnostics-${{ inputs.runtime_sha }}-${{ github.run_attempt }}
