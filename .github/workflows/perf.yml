    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
      RUSTFLAGS: "-Dwarnings"
      RUST_BACKTRACE: short
      TCL_LSP_NATIVE_ADMISSION_DIAGNOSTIC: first-decline-v1
      TCL_LSP_TRACE_N17_FOLD: first-gate-v1
    steps:
      - name: Reserve time for bounded evidence upload
        run: echo "DIAGNOSTIC_DEADLINE_EPOCH=$(($(date +%s) + 3600))" >> "$GITHUB_ENV"
      - name: Checkout exact work revision
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.runtime_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install uncached Rust
        timeout-minutes: 5
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          build-warnings: deny
          cache: false
      - name: Bootstrap existing CI Tcl 9.0 reference and full TomMath
        timeout-minutes: 15
        env:
          EXPECTED_WORK_SHA: ${{ inputs.runtime_sha }}
          TCL_LSP_TCL_BIN_DIR: ${{ runner.temp }}/spectcl-reference-bin
        run: |
          set -euo pipefail
          [[ "$EXPECTED_WORK_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_WORK_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_WORK_SHA"
          make ensure-tcl90-reference
          . scripts/dev/tcl-reference-toolchains.sh
          tcl_reference_load_toolchains "$PWD"
          tclsh="$(tcl_reference_resolve_tclsh 9.0)"
          printf 'TCL_LSP_TCLSH90=%s\n' "$tclsh" >> "$GITHUB_ENV"
          printf 'TCL_LSP_TCL_BIN_DIR=%s\n' "$TCL_LSP_TCL_BIN_DIR" >> "$GITHUB_ENV"
          printf 'TCL_LSP_REQUIRE_TCLSH=9.0\n' >> "$GITHUB_ENV"
