      - name: Capture complete isolated original runtime inventory
        timeout-minutes: 50
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/runtime-fulltom-target
          OUT: ${{ runner.temp }}/runtime-fulltom-output
        run: |
          set -euo pipefail
          unset TCL_RUNTIME_EXPECT_NO_TOMMATH
          if [[ "$RUNTIME_FULLTOM_FOCUSED" == 1 ]]; then
            export TCL_LSP_RUNTIME_CONSTRUCTOR_DIAGNOSTIC=1
          fi
          export TCL_TOMMATH_DIR="$GITHUB_WORKSPACE/tmp/tcl9.0.4/libtommath"
          test ! -e "$CARGO_TARGET_DIR"
          for mount in "$GITHUB_WORKSPACE" "$RUNNER_TEMP"; do
            test "$(df -PB1 "$mount" | awk 'NR==2 {print $4}')" -ge 2147483648
          done
          find "$TCL_TOMMATH_DIR" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/tommath-before.sha256"
          printf '%s\n' '[profile.default]' 'slow-timeout = { period = "60s", terminate-after = 3 }' '[profile.default.junit]' "path = \"$OUT/process-outcomes.xml\"" 'store-success-output = false' 'store-failure-output = false' > "$OUT/nextest.toml"
          printf '%s\n' "$RUNTIME_DIAGNOSTIC_DEADLINE" > "$OUT/capture-deadline-epoch.txt"
          remaining=$(( RUNTIME_DIAGNOSTIC_DEADLINE - $(date +%s) ))
          if (( remaining <= 0 )); then
            printf '%s\n' 'deadline elapsed before build; diagnostic incomplete' > "$OUT/deadline-incomplete.txt"
            exit 125
          fi
          # Drain capped build streams. GNU timeout owns the build process group;
          # its absolute deadline leaves time for final seals and evidence upload.
          set +e
          timeout --signal=INT --kill-after=20s "$remaining" python3 - <<'BUILD'
          import json
          import os
          import runpy
          import selectors
          import signal
          import subprocess
          from pathlib import Path
          from typing import BinaryIO, cast

          out = Path(os.environ["OUT"])
          argv = [
              "cargo",
              "nextest",
              "list",
              "--locked",
              "--manifest-path",
              "runtime/rust/Cargo.toml",
              "--features",
              "engine",
              "--config-file",
              str(out / "nextest.toml"),
              "--message-format",
              "json",
          ]
          focused_tests = (
              "interp::tests::active_public_command_replacement_retires_client_data_before_dispatch_releases_its_handle",
              "cmd_string::native_append_tests::native_append_preserves_every_measured_primary_storage_and_identity_window",
              "builtins::tests::native_expression_and_increment_follow_selected_numeric_towers",
          )
          focused = os.environ["RUNTIME_FULLTOM_FOCUSED"] == "1"
          expression = (
              "binary_id(=tcl-runtime) & ("
              + " | ".join("test(=" + name + ")" for name in focused_tests)
              + ")"
          )
          if focused:
              argv += ["-E", expression]
              (out / "nextest-filter.txt").write_text(expression + "\n")
          # Keep draining when timeout interrupts the group; exec resets this handler in Cargo.
          signal.signal(signal.SIGINT, lambda _signal, _frame: None)
          process = subprocess.Popen(argv, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          streams = selectors.DefaultSelector()
          streams.register(cast(BinaryIO, process.stdout), selectors.EVENT_READ, "selected.json")
          streams.register(cast(BinaryIO, process.stderr), selectors.EVENT_READ, "build.stderr")
          files = {name: (out / name).open("wb") for name in ("selected.json", "build.stderr")}
          remaining = {"selected.json": 16777216, "build.stderr": 2000000}
          truncated = False
          try:
              while streams.get_map():
                  for key, _ in streams.select(1):
                      data = os.read(key.fd, 65536)
                      if not data:
                          streams.unregister(key.fileobj)
                          continue
                      kept = data[: remaining[key.data]]
                      files[key.data].write(kept)
                      remaining[key.data] -= len(kept)
                      truncated |= len(kept) != len(data)
          finally:
              for file in files.values():
                  file.close()
          code = process.wait()
          (out / "build-exit.txt").write_text(str(code) + "\n")
          (out / "build-incomplete.txt").write_text(str(int(truncated)) + "\n")
          if focused and code == 0 and not truncated:
              capture = runpy.run_path("scripts/dev/nextest-terminal-capture.py")
              digest, _suites, selected, _ignored = capture["roster"](out / "selected.json")
              expected = {("tcl-runtime", name) for name in focused_tests}
              if set(selected) != expected:
                  (out / "focus-selected-mismatch.json").write_text(
                      json.dumps(
                          {"expected": sorted(expected), "actual": sorted(selected)}, indent=2
                      )
                      + "\n"
                  )
                  raise SystemExit(125)
              (out / "focus-selected-verified.json").write_text(
                  json.dumps({"listing_sha256": digest, "selected": sorted(expected)}, indent=2)
                  + "\n"
              )
          raise SystemExit(125 if truncated else code if code >= 0 else 128 - code)
          BUILD
          build_result=$?
          set -e
          printf '%s\n' "$build_result" > "$OUT/build-capture-exit.txt"
          if (( build_result != 0 )); then
            printf '%s\n' 'build did not complete successfully; test inventory unrun' > "$OUT/build-capture-incomplete.txt"
            exit "$build_result"
          fi
          for output in "$CARGO_TARGET_DIR"/debug/build/tcl-runtime-*/output; do
            test -f "$output"
            grep -F 'cargo:rustc-cfg=have_tommath' "$output"
            printf '\nBUILD_OUTPUT %s\n' "$output" >> "$OUT/backend-output.txt"
            cat "$output" >> "$OUT/backend-output.txt"
          done
          filter_args=()
          if [[ "$RUNTIME_FULLTOM_FOCUSED" == 1 ]]; then
            test -f "$OUT/focus-selected-verified.json"
            filter_args=(-E "$(cat "$OUT/nextest-filter.txt")")
          fi
          stack_capture_result=0
          if [[ "$RUNTIME_FULLTOM_FOCUSED" == 1 ]]; then
            set +e
            python3 docs/work/name-handling/validation-tools/runtime-baseline-supplement.py prepare --out "$OUT" --sha '${{ inputs.runtime_sha }}'
            prepare_result=$?
            set -e
            printf '%s\n' "$prepare_result" > "$OUT/supplement-prepare-exit.txt"
            set +e
            python3 docs/work/name-handling/validation-tools/runtime-baseline-supplement.py frames --out "$OUT" --sha '${{ inputs.runtime_sha }}'
            stack_capture_result=$?
            set -e
            printf '%s\n' "$stack_capture_result" > "$OUT/stack-frame-capture-exit.txt"
            if [[ ! -f "$OUT/stack-frame-accounting.json" ]] || (( stack_capture_result != 0 && stack_capture_result != 125 )); then
              printf '%s\n' 'stack metadata process or ELF settlement unavailable; original cases unrun' > "$OUT/stack-frame-settlement-incomplete.txt"
              exit 125
            fi
          fi
          if [[ "$RUNTIME_FULLTOM_FOCUSED" == 1 ]]; then
            printf '%s\n' 'SUPPLEMENT ONLY: unchanged fourteen exact original baseline regressions, separate stack1, then exact other103 actual failures from authenticated a26 log, same sealed fullTom ELF after original3. Separate subtotals; one numeric repeat is explicit; UNRUN retained under unchanged budgets; no full shared-process semantic gate acceptance.' > "$OUT/coverage-supplement.txt"
          fi
          # Original cases retain their 180-second timeout and assertions.
          # The capture owns and drains nextest directly, retaining full reporter
          # JSON within its bound. JUnit preserves exits, signals and timeouts.
          remaining=$(( RUNTIME_DIAGNOSTIC_DEADLINE - $(date +%s) ))
          if (( remaining <= 0 )); then
            printf '%s\n' 'deadline elapsed before tests; diagnostic incomplete' > "$OUT/deadline-incomplete.txt"
            exit 125
          fi
          if (( remaining > 2700 )); then remaining=2700; fi
          printf '%s\n' "$remaining" > "$OUT/capture-deadline-seconds.txt"
          set +e
          python3 scripts/dev/nextest-terminal-capture.py --selected-json "$OUT/selected.json" --output-dir "$OUT/terminal" --console-cap 20000000 --raw-cap 20000000 --deadline-seconds "$remaining" --min-free-bytes 2147483648 -- \
            cargo nextest run --locked --manifest-path runtime/rust/Cargo.toml --features engine --config-file "$OUT/nextest.toml" "${filter_args[@]}" --no-fail-fast --message-format libtest-json-plus --message-format-version 0.1
          result=$?
          set -e
          printf '%s\n' "$result" > "$OUT/capture-exit.txt"
          incomplete=$(python3 - <<'COMPLETE'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          out = Path(os.environ["OUT"])
          errors = []
          process_rows = []
          try:
              summary = json.loads((out / "terminal/summary.json").read_text())
              if summary["capture_errors"] or summary["missing_terminal"]:
                  errors.append("terminal capture is incomplete")
              report = out / "process-outcomes.xml"
              if report.stat().st_size > 16777216:
                  raise ValueError("process outcome XML exceeds 16MiB")
              tree = ET.parse(report)
              actual = {}
              for case in tree.iter("testcase"):
                  key = (case.attrib["classname"], case.attrib["name"])
                  if key in actual:
                      raise ValueError("duplicate process outcome identity")
                  failures = [
                      {"kind": item.tag, "attributes": item.attrib, "description": item.text}
                      for item in case
                      if item.tag in ("failure", "error")
                  ]
                  actual[key] = bool(failures)
                  process_rows.append({"binary_id": key[0], "test": key[1], "failures": failures})
              expected = {}
              for line in (out / "terminal/terminal.jsonl").read_text().splitlines():
                  row = json.loads(line)
                  if row["status"] != "ignored":
                      expected[(row["binary_id"], row["test"])] = row["status"] == "failed"
              if actual != expected:
                  errors.append(
                      "process outcome identities/statuses differ from terminal capture"
                  )
          except (OSError, ValueError, KeyError, ET.ParseError) as exc:
              errors.append(f"process outcome validation failed: {exc}")
          (out / "process-outcomes.json").write_text(json.dumps(process_rows, indent=2) + "\n")
          (out / "diagnostic-completeness.json").write_text(
              json.dumps({"incomplete": bool(errors), "errors": errors}, indent=2) + "\n"
          )
          print(int(bool(errors)))
          COMPLETE
          )
          printf '%s\n' "$incomplete" > "$OUT/raw-capture-incomplete.txt"
          supplement_result=0
          if [[ "$RUNTIME_FULLTOM_FOCUSED" == 1 ]]; then
            set +e
            python3 docs/work/name-handling/validation-tools/runtime-baseline-supplement.py run --out "$OUT" --sha '${{ inputs.runtime_sha }}'
            supplement_result=$?
            set -e
            printf '%s\n' "$supplement_result" > "$OUT/supplement-exit.txt"
          fi
          find "$TCL_TOMMATH_DIR" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/tommath-after.sha256"
          cmp "$OUT/tommath-before.sha256" "$OUT/tommath-after.sha256"
          python3 scripts/dev/tracked-source-snapshot.py verify "$OUT/tracked-source-before.json" > "$OUT/source-after.json"
          git status --porcelain > "$OUT/git-after.txt"
          test ! -s "$OUT/git-after.txt"
          if [[ "$incomplete" == 1 ]]; then
            echo "::error::bounded diagnostic evidence is missing, incomplete or inconsistent"
            exit 125
          fi
          if (( stack_capture_result != 0 )); then exit 125; fi
          if (( supplement_result != 0 && supplement_result != 100 )); then exit 125; fi
          if (( result == 0 && supplement_result != 0 )); then result=$supplement_result; fi
          exit "$result"
      - name: Verify the Tcl 8.4 provider after runtime capture
        if: always()
        timeout-minutes: 3
        run: python3 docs/work/name-handling/validation-tools/runtime-c84-provider.py verify --out '${{ runner.temp }}/runtime-fulltom-output/c84-provider'
      - name: Upload full diagnostic evidence
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.mode }}-${{ inputs.runtime_sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/runtime-fulltom-output/*.txt
            ${{ runner.temp }}/runtime-fulltom-output/*.sha256
            ${{ runner.temp }}/runtime-fulltom-output/*.json
            ${{ runner.temp }}/runtime-fulltom-output/*.xml
            ${{ runner.temp }}/runtime-fulltom-output/*.toml
            ${{ runner.temp }}/runtime-fulltom-output/build.stderr
            ${{ runner.temp }}/runtime-fulltom-output/terminal/*.json
            ${{ runner.temp }}/runtime-fulltom-output/terminal/*.jsonl
            ${{ runner.temp }}/runtime-fulltom-output/terminal/*.txt
            ${{ runner.temp }}/runtime-fulltom-output/supplement/*.json
            ${{ runner.temp }}/runtime-fulltom-output/supplement/*.stdout
            ${{ runner.temp }}/runtime-fulltom-output/supplement/*.stderr
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  # Temporary WORK-only census; final strict all-packages gate remains required.
  scoped-lsp-clippy-diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'scoped-lsp-clippy-diagnostics' && github.ref == 'refs/heads/work'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: short
    steps:
      - name: Checkout exact work revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.runtime_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install Rust and Clippy
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          components: clippy
          build-warnings: deny
          cache: false
      - name: Validate revision and record source and tools
        env:
          EXPECTED_WORK_SHA: ${{ inputs.runtime_sha }}
          OUT: ${{ runner.temp }}/scoped-lsp-clippy-output
        run: |
          set -euo pipefail
          mkdir "$OUT"
          [[ "$EXPECTED_WORK_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${EXPECTED_WORK_SHA,,}"
          test "${EXPECTED_WORK_SHA,,}" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > "$OUT/source-commit.txt"
          git status --porcelain > "$OUT/git-before.txt"
          python3 scripts/dev/tracked-source-snapshot.py record "$OUT/tracked-source-before.json"
          cargo --version > "$OUT/cargo-version.txt"
          cargo clippy --version > "$OUT/clippy-version.txt"
          rustc -vV > "$OUT/rustc-version.txt"
          sha256sum "$(rustup which cargo)" "$(rustup which rustc)" "$(rustup which clippy-driver)" > "$OUT/tools.sha256"
          printf '%s\n' '${{ github.run_id }}' '${{ github.run_attempt }}' '${{ runner.os }}' '${{ runner.arch }}' > "$OUT/job.txt"
          printf '%s\n' 'DIAGNOSTIC ONLY: three independent scoped Clippy invocations after crate allows removal. No static estimate is a measured census. Final all-packages strict gate and complete allow audit remain required.' > "$OUT/coverage.txt"
      - name: Capture all three strict scoped Clippy outcomes
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/scoped-lsp-clippy-target
          OUT: ${{ runner.temp }}/scoped-lsp-clippy-output
        run: |
          set -euo pipefail
          test ! -e "$CARGO_TARGET_DIR"
          set +e
          python3 - <<'CAPTURE'
          import json
          import os
          import shutil
          import subprocess
          import sys
          import time
          from pathlib import Path
          from typing import TypedDict


          class Outcome(TypedDict, total=False):
              package: str
              state: str
              disk_before: dict[str, int]
              disk_after: dict[str, int]
              argv: list[str]
              started: float
              ended: float
              pid: int
              exit_code: int
              log_truncated: bool


          out = Path(os.environ["OUT"])
          root = Path.cwd()
          mounts = (root, Path(os.environ["RUNNER_TEMP"]))
          packages = ("tcl-lsp-core", "tcl-lsp-db", "tcl-lsp-server")
          rows: list[Outcome] = [
              {"package": package, "state": "UNREACHED"} for package in packages
          ]
          remaining = 20 * 1024 * 1024
          incomplete = False


          def save() -> None:
              (out / "outcomes.json").write_text(json.dumps(rows, indent=2) + "\n")


          save()
          for package, row in zip(packages, rows):
              floor = {str(path): shutil.disk_usage(path).free for path in mounts}
              row["disk_before"] = floor
              if min(floor.values()) < 2 * 1024**3:
                  row["state"] = "REFUSED_DISK_FLOOR"
                  incomplete = True
                  save()
                  continue
              argv = [
                  "cargo",
                  "clippy",
                  "--locked",
                  "--no-deps",
                  "-p",
                  package,
                  "--all-targets",
                  "--all-features",
                  "--",
                  "-Dwarnings",
              ]
              row.update(argv=argv, state="RUNNING", started=time.time())
              save()
              with (out / (package + ".log.txt")).open("wb") as log:
                  process = subprocess.Popen(
                      argv, stdout=subprocess.PIPE, stderr=subprocess.STDOUT
                  )
                  row["pid"] = process.pid
                  save()
                  if process.stdout is None:
                      raise RuntimeError("owned Cargo stdout pipe unavailable")
                  truncated = False
                  while data := process.stdout.read(65536):
                      kept = data[:remaining]
                      log.write(kept)
                      sys.stdout.buffer.write(kept)
                      sys.stdout.buffer.flush()
                      remaining -= len(kept)
                      truncated |= len(kept) != len(data)
                  code = process.wait()
              floor = {str(path): shutil.disk_usage(path).free for path in mounts}
              row.update(
                  state="CLOSED",
                  exit_code=code,
                  ended=time.time(),
                  log_truncated=truncated,
                  disk_after=floor,
              )
              incomplete |= truncated or code < 0 or min(floor.values()) < 2 * 1024**3
              save()
          (out / "capture-incomplete.txt").write_text(str(int(incomplete)) + "\n")
          sys.exit(125 if incomplete else int(any(row.get("exit_code") != 0 for row in rows)))
          CAPTURE
          result=$?
          set -e
          printf '%s\n' "$result" > "$OUT/capture-exit.txt"
          python3 scripts/dev/tracked-source-snapshot.py verify "$OUT/tracked-source-before.json" > "$OUT/source-after.json"
          sha256sum -c "$OUT/tools.sha256" > "$OUT/tools-after.txt"
          git status --porcelain > "$OUT/git-after.txt"
          test ! -s "$OUT/git-after.txt"
          exit "$result"
      - name: Upload scoped Clippy diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scoped-lsp-clippy-${{ inputs.runtime_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scoped-lsp-clippy-output
          if-no-files-found: error
          retention-days: 30

