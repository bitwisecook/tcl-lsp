          echo "${WASI_SDK_SHA256}  $RUNNER_TEMP/wasm25-wasi-sdk.tar.gz" | sha256sum --check --strict -
          sudo mkdir -p /opt/wasi-sdk
          sudo tar -xzf "$RUNNER_TEMP/wasm25-wasi-sdk.tar.gz" -C /opt/wasi-sdk --strip-components=1
