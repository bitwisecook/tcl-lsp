  # Temporary WORK-only reproduction of the CI rust-check worker.
  release-rust-check-diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release-rust-check-diagnostics' && github.ref == 'refs/heads/work'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Record diagnostic deadline
        env:
          OUT: ${{ runner.temp }}/release-rust-check-output
        run: |
          set -euo pipefail
          mkdir "$OUT"
          echo "RELEASE_RUST_CHECK_DEADLINE=$(( $(date +%s) + 3300 ))" >> "$GITHUB_ENV"
      - name: Checkout exact work revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.runtime_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Validate revision and record source and tools
        env:
          EXPECTED_WORK_SHA: ${{ inputs.runtime_sha }}
          OUT: ${{ runner.temp }}/release-rust-check-output
        run: |
          set -euo pipefail
          [[ "$EXPECTED_WORK_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${EXPECTED_WORK_SHA,,}"
          test "${EXPECTED_WORK_SHA,,}" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test -z "${SKIP_CHECK_RUST:-}${SKIP_RUST:-}${CLIPPY_LINT_FLAGS:-}${MAKEFLAGS:-}${MFLAGS:-}"
          git rev-parse HEAD > "$OUT/source-commit.txt"
          git rev-parse HEAD^{tree} > "$OUT/source-tree.txt"
          git status --porcelain > "$OUT/git-before.txt"
          python3 scripts/dev/tracked-source-snapshot.py record "$OUT/tracked-source-before.json"
          cargo --version > "$OUT/cargo-version.txt"
          cargo clippy --version > "$OUT/clippy-version.txt"
          cargo fmt --version > "$OUT/rustfmt-version.txt"
          rustc -vV > "$OUT/rustc-version.txt"
          make --version > "$OUT/make-version.txt"
          sha256sum "$(rustup which cargo)" "$(rustup which rustc)" "$(rustup which clippy-driver)" "$(rustup which rustfmt)" "$(command -v make)" "$(command -v git)" "$(command -v python3)" "$(command -v bash)" "$(command -v rustup)" > "$OUT/tools.sha256"
          printf '%s\n' '${{ github.run_id }}' '${{ github.run_attempt }}' '${{ runner.os }}' '${{ runner.arch }}' > "$OUT/job.txt"
          printf '%s\n' 'DIAGNOSTIC ONLY: exact CI rust-check command/setup on this WORK source, including its original check-rust-pr and xtask-check prerequisites. No CLEAN CI result, other test roster, editor, performance or release acceptance is implied.' > "$OUT/coverage.txt"
      - name: Fetch pinned Tcl 9.0.4 TomMath sources
        timeout-minutes: 16
        run: |
          set -euo pipefail
          test -z "${TCL_RUNTIME_EXPECT_NO_TOMMATH:-}"
          for mount in "$GITHUB_WORKSPACE" "$RUNNER_TEMP"; do
            test "$(df -PB1 "$mount" | awk 'NR==2 {print $4}')" -ge 2147483648
          done
          timeout --signal=TERM --kill-after=20s 900s bash .claude/skills/fetch-tcl-source/fetch_tcl_source.sh 9.0
          test -f tmp/tcl9.0.4/libtommath/tommath.h
          for mount in "$GITHUB_WORKSPACE" "$RUNNER_TEMP"; do
            test "$(df -PB1 "$mount" | awk 'NR==2 {print $4}')" -ge 2147483648
          done
      - name: Capture the original global strict command
        env:
          OUT: ${{ runner.temp }}/release-rust-check-output
        run: |
          set -euo pipefail
          set +e
          python3 -B - <<'CAPTURE'
          import hashlib
          import importlib.util
          import json
          import os
          import shutil
          import time
          from pathlib import Path

          out = Path(os.environ["OUT"])
          owner_path = Path(
              "docs/work/name-handling/validation-tools/runtime-diagnostics-exec.py"
          )
          with owner_path.open("rb") as stream:
              if (
                  hashlib.file_digest(stream, "sha256").hexdigest()
                  != "88125bd5267ac897dda4b5f665872c5ae0ab9984b0f42a41edeadf718873d811"
              ):
                  raise RuntimeError("process owner pin changed")
          spec = importlib.util.spec_from_file_location("release_rust_check_owner", owner_path)
          if spec is None or spec.loader is None:
              raise RuntimeError("process owner loader unavailable")
          owner = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(owner)
          make = Path(shutil.which("make") or "/absent").resolve()
          remaining = float(os.environ["RELEASE_RUST_CHECK_DEADLINE"]) - time.time() - 30
          if remaining <= 0:
              (out / "command-unrun.txt").write_text("deadline elapsed before command; UNRUN\n")
              raise SystemExit(125)
          receipt = owner.run(
              [str(make), "rust-check"],
              cwd=Path.cwd(),
              env=os.environ.copy(),
              stdout_path=out / "make-rust-check.stdout",
              stderr_path=out / "make-rust-check.stderr",
              receipt_path=out / "make-rust-check.process.json",
              artifact_path=make,
              deadline_seconds=remaining,
              cap_bytes=20 * 1024**2,
              disk_floor_bytes=2 * 1024**3,
              disk_paths=(Path.cwd(), out, Path(os.environ["RUNNER_TEMP"])),
          )
          code = receipt["exit_code"]
          (out / "original-exit.json").write_text(json.dumps({"exit_code": code}) + "\n")
          raise SystemExit(
              code if receipt["complete"] and isinstance(code, int) and 0 <= code <= 255 else 125
          )
          CAPTURE
          result=$?
          set -e
          printf '%s\n' "$result" > "$OUT/capture-exit.txt"
          exit "$result"
      - name: Verify source and tools after capture
        if: always()
        env:
          OUT: ${{ runner.temp }}/release-rust-check-output
        run: |
          set -euo pipefail
          seal_result=0
          python3 scripts/dev/tracked-source-snapshot.py verify "$OUT/tracked-source-before.json" > "$OUT/source-after.json" || seal_result=125
          sha256sum -c "$OUT/tools.sha256" > "$OUT/tools-after.txt" || seal_result=125
          git status --porcelain > "$OUT/git-after.txt" || seal_result=125
          test ! -s "$OUT/git-after.txt" || seal_result=125
          printf '%s\n' "$seal_result" > "$OUT/seals-exit.txt"
          exit "$seal_result"
      - name: Upload bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-rust-check-diagnostics-${{ inputs.runtime_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-rust-check-output
          if-no-files-found: error
          retention-days: 30

  jetbrains-candidate-validation:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'jetbrains-candidate-validation' && github.ref == 'refs/heads/work'
    name: Kotlin tests for ${{ inputs.candidate_sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - name: Admit only the WORK dispatch ref
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          echo "VALIDATION_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/jetbrains-validation"
          {
            printf 'candidate_sha=%s\n' "${CANDIDATE_SHA,,}"
            printf 'workflow_ref=%s\n' "$GITHUB_REF"
            printf 'workflow_sha=%s\n' "$GITHUB_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
          } > "$RUNNER_TEMP/jetbrains-validation/identity.txt"
          if [[ "$GITHUB_REF" != "refs/heads/work" ]]; then
            echo "complete=false" > "$RUNNER_TEMP/jetbrains-validation/test-metadata.txt"
            echo "stop_reason=refusal:workflow_ref_must_be_refs/heads/work" >> "$RUNNER_TEMP/jetbrains-validation/test-metadata.txt"
            echo "refusal: workflow must run from refs/heads/work" >&2
            exit 2
          fi
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "complete=false" > "$RUNNER_TEMP/jetbrains-validation/test-metadata.txt"
            echo "stop_reason=refusal:candidate_sha_must_be_40_hex" >> "$RUNNER_TEMP/jetbrains-validation/test-metadata.txt"
            echo "refusal: candidate_sha must be 40 hexadecimal characters" >&2
            exit 2
          fi

      # The owner is taken from WORK before the candidate is checked out. Pin
      # its exact source bytes so candidate contents cannot select supervision.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work
          path: workflow-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pinned process owner
        shell: bash
        run: |
          set -euo pipefail
          owner="workflow-source/docs/work/name-handling/validation-tools/runtime-diagnostics-exec.py"
          actual="$(sha256sum "$owner" | awk '{print $1}')"
          expected="88125bd5267ac897dda4b5f665872c5ae0ab9984b0f42a41edeadf718873d811"
          [[ "$actual" == "$expected" ]] || { echo "refusal: process owner hash mismatch: $actual" >&2; exit 2; }
          printf 'process_owner_sha256=%s\n' "$actual" >> "$RUNNER_TEMP/jetbrains-validation/identity.txt"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Verify candidate identity and initial disk floor
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          actual="$(git -C candidate rev-parse HEAD)"
          expected="${CANDIDATE_SHA,,}"
          [[ "$actual" == "$expected" ]] || { echo "refusal: checked out $actual, expected $expected" >&2; exit 2; }
          printf 'checked_out_sha=%s\n' "$actual" >> "$RUNNER_TEMP/jetbrains-validation/identity.txt"
          free_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')"
          printf 'free_kib_before_test=%s\n' "$free_kib" >> "$RUNNER_TEMP/jetbrains-validation/identity.txt"
          (( free_kib >= 2097152 )) || { echo "refusal: less than 2 GiB free before test setup" >&2; exit 125; }

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            candidate/editors/jetbrains/*.gradle*
            candidate/editors/jetbrains/gradle/wrapper/gradle-wrapper.properties

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Run bounded make test-jetbrains
        id: jetbrains-test
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, json, os, pathlib, shutil, sys, time

          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "jetbrains-validation"
          candidate = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "candidate"
          def refuse(reason):
              (root / "test-metadata.txt").write_text(f"complete=false\nstop_reason=refusal:{reason}\n")
              raise SystemExit(125)

          owner_file = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "workflow-source/docs/work/name-handling/validation-tools/runtime-diagnostics-exec.py"
          try:
              spec = importlib.util.spec_from_file_location("runtime_diagnostics_exec", owner_file)
              owner = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(owner)
          except Exception as error:
              refuse(f"cannot_load_pinned_owner:{type(error).__name__}:{error}")
          make = shutil.which("make")
          if not make:
              refuse("make_unavailable")
          make = str(pathlib.Path(make).resolve())
          # The 60-minute job keeps 5 minutes for artifact upload/summary; this
          # child gets at most 50 minutes, plus the owner's bounded 20s cleanup.
          job_started = float(os.environ["VALIDATION_JOB_START_EPOCH"])
          remaining = 3600 - (time.time() - job_started)
          required = 3000 + 20 + 300
          if remaining < required:
              (root / "test-metadata.txt").write_text(
                  f"stop_reason=insufficient_job_budget\nremaining_seconds={int(remaining)}\nrequired_seconds={required}\n"
              )
              raise SystemExit(125)
          # Pass only build/runtime essentials. No GitHub token, publish token,
          # actions token, or arbitrary credential context is forwarded.
          allow = ("PATH", "HOME", "JAVA_HOME", "TMPDIR", "LANG", "LC_ALL", "CI", "GRADLE_OPTS", "GITHUB_WORKSPACE", "RUNNER_TEMP")
          child_env = {key: os.environ[key] for key in allow if key in os.environ}
          child_env["GRADLE_OPTS"] = "-Dorg.gradle.daemon=false"
          candidate_sha = os.environ["CANDIDATE_SHA"].lower()
          receipt_path = root / "process-receipt.json"
          try:
              receipt = owner.run(
                  [make, "-C", str(candidate), "test-jetbrains"],
                  cwd=candidate,
                  env=child_env,
                  stdout_path=root / "gradle-test.stdout.log",
                  stderr_path=root / "gradle-test.stderr.log",
                  receipt_path=receipt_path,
                  artifact_path=make,
                  deadline_seconds=3000,
                  cap_bytes=20 * 1024 * 1024,
                  disk_floor_bytes=2 * 1024 * 1024 * 1024,
                  disk_paths=(candidate, root, pathlib.Path.home()),
              )
          except Exception as error:
              try:
                  receipt = json.loads(receipt_path.read_text()) if receipt_path.exists() else {}
              except (OSError, json.JSONDecodeError):
                  receipt = {}
              reason = receipt.get("stop_reason") or f"runner_refusal:{type(error).__name__}:{error}"
              (root / "test-metadata.txt").write_text(
                  f"candidate_sha={candidate_sha}\ncommand=make -C candidate test-jetbrains\n"
                  f"exit_code={receipt.get('exit_code')}\ncomplete=false\nstop_reason={reason}\n"
                  f"elapsed_seconds={receipt.get('elapsed_seconds')}\n"
                  f"retained_log_bytes={receipt.get('retained_bytes')}\n"
                  f"minimum_free_bytes={receipt.get('minimum_free_bytes')}\n"
                  f"process_group={receipt.get('process_group')}\npid={receipt.get('pid')}\n"
                  f"pid_start_ticks={receipt.get('pid_start_ticks')}\n"
                  f"group_empty_before_parent_reap={str(receipt.get('group_empty_before_parent_reap')).lower()}\n"
              )
              raise SystemExit(125) from error
          (root / "test-metadata.txt").write_text(
              f"candidate_sha={candidate_sha}\ncommand=make -C candidate test-jetbrains\n"
              f"exit_code={receipt.get('exit_code')}\ncomplete={str(receipt.get('complete')).lower()}\n"
              f"stop_reason={receipt.get('stop_reason')}\n"
              f"elapsed_seconds={receipt.get('elapsed_seconds')}\n"
              f"retained_log_bytes={receipt.get('retained_bytes')}\n"
              f"minimum_free_bytes={receipt.get('minimum_free_bytes')}\n"
              f"process_group={receipt.get('process_group')}\n"
              f"pid={receipt.get('pid')}\npid_start_ticks={receipt.get('pid_start_ticks')}\n"
              f"group_empty_before_parent_reap={str(receipt.get('group_empty_before_parent_reap')).lower()}\n"
          )
          if not receipt.get("complete"):
              raise SystemExit(125)
          raise SystemExit(receipt["exit_code"])
          PY

      - name: Collect bounded JUnit XML results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jetbrains-validation/test-results"
          python3 - <<'PY'
          import os, pathlib, shutil
          src = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "candidate/editors/jetbrains/build/test-results/test"
          dst = pathlib.Path(os.environ["RUNNER_TEMP"]) / "jetbrains-validation/test-results"
          cap = 20 * 1024 * 1024
          copied = 0
          truncated = False
          if src.exists():
              for path in sorted(src.glob("*.xml")):
                  size = path.stat().st_size
                  if copied + size > cap:
                      truncated = True
                      break
                  shutil.copy2(path, dst / path.name)
                  copied += size
          (dst.parent / "result-collection.txt").write_text(
              f"junit_xml_bytes={copied}\njunit_xml_truncated={str(truncated).lower()}\n"
          )
          PY

      - name: Upload bounded test proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jetbrains-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jetbrains-validation/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      - name: Publish proof summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/jetbrains-validation/identity.txt" ]]; then
            cat "$RUNNER_TEMP/jetbrains-validation/identity.txt" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f "$RUNNER_TEMP/jetbrains-validation/test-metadata.txt" ]]; then
            cat "$RUNNER_TEMP/jetbrains-validation/test-metadata.txt" >> "$GITHUB_STEP_SUMMARY"
          fi

  prep-pr-candidate-validation:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'prep-pr-candidate-validation' && github.ref == 'refs/heads/work'
    name: Exact make prep-pr for ${{ inputs.candidate_sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - name: Admit only the WORK dispatch ref
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          echo "VALIDATION_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/prep-pr-validation"
          {
            printf 'candidate_sha=%s\n' "${CANDIDATE_SHA,,}"
            printf 'workflow_ref=%s\n' "$GITHUB_REF"
            printf 'workflow_sha=%s\n' "$GITHUB_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
          } > "$RUNNER_TEMP/prep-pr-validation/identity.txt"
          if [[ "$GITHUB_REF" != "refs/heads/work" ]]; then
            echo "complete=false" > "$RUNNER_TEMP/prep-pr-validation/test-metadata.txt"
            echo "stop_reason=refusal:workflow_ref_must_be_refs/heads/work" >> "$RUNNER_TEMP/prep-pr-validation/test-metadata.txt"
            echo "refusal: workflow must run from refs/heads/work" >&2
            exit 2
          fi
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "complete=false" > "$RUNNER_TEMP/prep-pr-validation/test-metadata.txt"
            echo "stop_reason=refusal:candidate_sha_must_be_40_hex" >> "$RUNNER_TEMP/prep-pr-validation/test-metadata.txt"
            echo "refusal: candidate_sha must be 40 hexadecimal characters" >&2
            exit 2
          fi

      # The owner is taken from WORK before the candidate is checked out. Pin
      # its exact source bytes so candidate contents cannot select supervision.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work
          path: workflow-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pinned process owner
        shell: bash
        run: |
          set -euo pipefail
          owner="workflow-source/docs/work/name-handling/validation-tools/runtime-diagnostics-exec.py"
          actual="$(sha256sum "$owner" | awk '{print $1}')"
          expected="88125bd5267ac897dda4b5f665872c5ae0ab9984b0f42a41edeadf718873d811"
          [[ "$actual" == "$expected" ]] || { echo "refusal: process owner hash mismatch: $actual" >&2; exit 2; }
          printf 'process_owner_sha256=%s\n' "$actual" >> "$RUNNER_TEMP/prep-pr-validation/identity.txt"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Verify candidate identity and initial disk floor
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          actual="$(git -C candidate rev-parse HEAD)"
          expected="${CANDIDATE_SHA,,}"
          [[ "$actual" == "$expected" ]] || { echo "refusal: checked out $actual, expected $expected" >&2; exit 2; }
          printf 'checked_out_sha=%s\n' "$actual" >> "$RUNNER_TEMP/prep-pr-validation/identity.txt"
          free_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')"
          printf 'free_kib_before_test=%s\n' "$free_kib" >> "$RUNNER_TEMP/prep-pr-validation/identity.txt"
          (( free_kib >= 2097152 )) || { echo "refusal: less than 2 GiB free before test setup" >&2; exit 125; }

      - name: Run bounded prerequisite setup and exact make prep-pr
        id: prep-pr-test
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """Fixed hosted prep-pr transport. No command-line command selection."""
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import time

          OWNER_SHA = "88125bd5267ac897dda4b5f665872c5ae0ab9984b0f42a41edeadf718873d811"
          CAP = 20 * 1024 * 1024
          FLOOR = 2 * 1024 * 1024 * 1024


          def main():
              workspace = Path(os.environ["GITHUB_WORKSPACE"])
              candidate = workspace / "candidate"
              output = Path(os.environ["RUNNER_TEMP"]) / "prep-pr-validation"
              output.mkdir(parents=True, exist_ok=True)
              result = {"complete": False, "gate_pass": False, "command": ["make", "prep-pr"]}
              owner_file = workspace / "workflow-source/docs/work/name-handling/validation-tools/runtime-diagnostics-exec.py"
              receipts = []
              started = float(os.environ["VALIDATION_JOB_START_EPOCH"])
              deadline = started + 3300  # reserve 5 minutes of the existing 60-minute job
              expected = os.environ["CANDIDATE_SHA"].lower()
              child_env = {key: os.environ[key] for key in (
                  "PATH", "HOME", "TMPDIR", "LANG", "LC_ALL", "CI", "RUNNER_TEMP",
                  "GITHUB_WORKSPACE", "CARGO_HOME", "RUSTUP_HOME",
              ) if key in os.environ}
              # The pinned uv installer supports UV_INSTALL_DIR. Keep HOME
              # unchanged and install its tools outside the uploaded evidence.
              tool_bin = Path(os.environ["RUNNER_TEMP"]) / "prep-pr-tool-bin"
              child_env["UV_INSTALL_DIR"] = str(tool_bin)
              child_env["UV_NO_MODIFY_PATH"] = "1"
              tool_state = Path(os.environ["RUNNER_TEMP"]) / "prep-pr-tool-state"
              child_env["UV_TOOL_DIR"] = str(tool_state / "tools")
              child_env["UV_TOOL_BIN_DIR"] = str(tool_bin)
              child_env["UV_CACHE_DIR"] = str(tool_state / "cache")
              child_env["UV_PYTHON_INSTALL_DIR"] = str(tool_state / "python")
              child_env["UV_PYTHON_BIN_DIR"] = str(tool_bin)
              child_env["PATH"] = str(tool_bin) + ":" + str(Path.home() / ".cargo/bin") + ":" + str(Path.home() / ".local/bin") + ":" + child_env.get("PATH", "")

              metadata_counter = 0

              def collection_guard():
                  if time.time() >= deadline - 20:
                      raise RuntimeError("collection_deadline")
                  if any(shutil.disk_usage(path).free < FLOOR for path in (candidate, output, Path.home())):
                      raise RuntimeError("collection_disk_floor")

              def metadata(argv):
                  nonlocal metadata_counter
                  metadata_counter += 1
                  label = "identity-" + str(metadata_counter)
                  if not run(label, argv):
                      raise RuntimeError("identity_query_failed_or_incomplete")
                  data = (output / (label + ".stdout.log")).read_bytes()
                  if len(data) > 2 * 1024 * 1024:
                      raise RuntimeError("identity_output_cap")
                  return data

              def snapshot(label):
                  collection_guard()
                  head = metadata(["git", "rev-parse", "HEAD"]).decode().strip()
                  tree = metadata(["git", "rev-parse", "HEAD^{tree}"]).decode().strip()
                  paths = metadata(["git", "ls-files", "-z"]).split(b"\0")
                  files = {}
                  for raw in paths:
                      if not raw:
                          continue
                      collection_guard()
                      relative = os.fsdecode(raw)
                      path = candidate / relative
                      if path.is_symlink():
                          files[relative] = {"symlink": os.readlink(path)}
                      elif path.is_file():
                          digest = hashlib.sha256()
                          with path.open("rb") as stream:
                              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                                  collection_guard()
                                  digest.update(chunk)
                          files[relative] = {"sha256": digest.hexdigest(), "mode": path.stat().st_mode & 0o777}
                      else:
                          files[relative] = None
                  record = {"head": head, "tree": tree, "files": files,
                            "status": metadata(["git", "status", "--porcelain=v1", "--untracked-files=normal"]).decode("utf-8", "replace"),
                            "tracked_status": metadata(["git", "status", "--porcelain=v1", "--untracked-files=no"]).decode("utf-8", "replace")}
                  (output / (label + "-source.json")).write_text(json.dumps(record, sort_keys=True, indent=2) + "\n")
                  return record

              def run(label, argv):
                  executable = shutil.which(argv[0], path=child_env["PATH"])
                  if executable is None:
                      raise RuntimeError("missing_executable:" + argv[0])
                  executable = str(Path(executable).resolve())
                  remaining = deadline - time.time() - 20
                  used = sum(path.stat().st_size for path in output.glob("*.log"))
                  if remaining <= 0 or used >= CAP:
                      raise RuntimeError("shared_budget_exhausted")
                  receipt = owner.run([executable, *argv[1:]], cwd=candidate, env=child_env,
                                      stdout_path=output / (label + ".stdout.log"),
                                      stderr_path=output / (label + ".stderr.log"),
                                      receipt_path=output / (label + "-receipt.json"),
                                      artifact_path=executable, deadline_seconds=remaining,
                                      cap_bytes=CAP - used, disk_floor_bytes=FLOOR,
                                      disk_paths=(candidate, output, Path.home()))
                  receipts.append({"phase": label, "receipt": receipt})
                  return bool(receipt.get("complete")) and receipt.get("exit_code") == 0

              initial = None
              status = 125
              try:
                  if os.environ["GITHUB_REF"] != "refs/heads/work" or len(expected) != 40 or any(c not in "0123456789abcdef" for c in expected):
                      raise RuntimeError("invalid_dispatch_identity")
                  if hashlib.sha256(owner_file.read_bytes()).hexdigest() != OWNER_SHA:
                      raise RuntimeError("process_owner_pin")
                  spec = importlib.util.spec_from_file_location("prep_pr_process_owner", owner_file)
                  owner = importlib.util.module_from_spec(spec)
                  spec.loader.exec_module(owner)
                  tool_bin.mkdir(mode=0o700)
                  if tool_bin.is_symlink() or tool_bin.stat().st_uid != os.getuid():
                      raise RuntimeError("tool_bindir_not_owned")
                  result["tool_bindir"] = str(tool_bin)
                  tool_state.mkdir(mode=0o700)
                  if tool_state.is_symlink() or tool_state.stat().st_uid != os.getuid():
                      raise RuntimeError("tool_state_not_owned")
                  for name in ("tools", "cache", "python"):
                      (tool_state / name).mkdir(mode=0o700)
                  result["tool_state"] = str(tool_state)
                  initial = snapshot("initial")
                  if initial["head"] != expected or initial["status"]:
                      raise RuntimeError("candidate_identity_or_dirty_initial_tree")
                  result["candidate_sha"] = expected
                  # The documented complete prerequisite installer is unchanged. No SKIP,
                  # target override, credential, test filter, or make option is injected.
                  if not run("setup", ["make", "install-test-deps"]):
                      raise RuntimeError("setup_failed_or_incomplete")
                  ready = snapshot("before-gate")
                  if ready["head"] != expected or ready["files"] != initial["files"] or ready["status"]:
                      raise RuntimeError("setup_changed_candidate_inputs")
                  passed = run("prep-pr", ["make", "prep-pr"])
                  result["gate_command_exit_pass"] = passed
                  result["complete"] = bool(receipts[-1]["receipt"].get("complete"))
                  status = receipts[-1]["receipt"].get("exit_code") if result["complete"] else 125
              except Exception as error:
                  result["stop_reason"] = type(error).__name__ + ":" + str(error)
              finally:
                  try:
                      final = snapshot("final")
                      result["candidate_head_unchanged"] = final["head"] == expected
                      result["tracked_source_unchanged"] = initial is not None and final["files"] == initial["files"]
                      result["tracked_index_and_worktree_clean"] = not final["tracked_status"]
                      result["nonignored_worktree_clean"] = not final["status"]
                      # Captures all tracked formatting/codegen changes, not a guessed list.
                      diff_complete = run("generated-diff", ["git", "diff", "--binary", "HEAD", "--"])
                      result["diff_capture_complete"] = diff_complete
                      result["gate_pass"] = (result["complete"] and result.get("gate_command_exit_pass", False)
                                             and result["candidate_head_unchanged"] and result["tracked_source_unchanged"]
                                             and result["tracked_index_and_worktree_clean"] and result["nonignored_worktree_clean"]
                                             and diff_complete)
                      if not result["gate_pass"] and status == 0:
                          status = 1
                  except Exception as error:
                      result["collection_error"] = type(error).__name__ + ":" + str(error)
                      result["complete"] = False
                      status = 125
                  result["phases"] = receipts
                  (output / "result.json").write_text(json.dumps(result, sort_keys=True, indent=2) + "\n")
              return status


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

      - name: Upload bounded test proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prep-pr-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prep-pr-validation/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      - name: Publish proof summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/prep-pr-validation/result.json" ]]; then
            cat "$RUNNER_TEMP/prep-pr-validation/result.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'prep-pr UNOBSERVED: no result receipt' >> "$GITHUB_STEP_SUMMARY"
          fi
