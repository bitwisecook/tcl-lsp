            printf '%s\n' 'Seven separately reported authored namespace publication-revision controls follow the unchanged original inventories under the same remaining deadlines and caps. Planned or unstarted controls remain UNRUN.' >> "$OUT/coverage.txt"
            printf '%s\n' 'Three separately reported targeted-pruning controls follow the original125 supplemental cases with the same remaining deadlines and caps. Planned or unstarted cases remain UNRUN; no semantic or performance acceptance.' >> "$OUT/coverage.txt"
          fi
      - name: Prepare the pinned Tcl 8.4 integer-cache provider
        timeout-minutes: 17
        env:
          OUT: ${{ runner.temp }}/runtime-fulltom-output
          TCL_LSP_TCL_BIN_DIR: ${{ runner.temp }}/runtime-fulltom-output/c84-provider/reference-bin
        run: |
          set -euo pipefail
          python3 docs/work/name-handling/validation-tools/runtime-c84-provider.py preflight --out "$OUT/c84-provider"
          python3 - <<'PROVIDER'
          import hashlib
          import importlib.util
          import os
          import shutil
          import time
          from pathlib import Path

          owner_path = Path("docs/work/name-handling/validation-tools/runtime-diagnostics-exec.py")
          with owner_path.open("rb") as stream:
              assert hashlib.file_digest(stream, "sha256").hexdigest() == "88125bd5267ac897dda4b5f665872c5ae0ab9984b0f42a41edeadf718873d811"
          spec = importlib.util.spec_from_file_location("runtime_provider_owner", owner_path)
          assert spec is not None and spec.loader is not None
          owner = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(owner)
