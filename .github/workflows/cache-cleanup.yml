# Prune GitHub Actions caches so the repo stays under the 10 GiB per-repo
# ceiling.  Cache *keys* in ci.yml are all stable (lockfile/version hashes),
# so the bloat is not key churn — it's stale caches scoped to PR branches
# that nothing ever deletes.  GitHub auto-evicts LRU over 10 GiB, which
# silently guts hit rates; pruning proactively keeps rust's caches warm.
#
# Two triggers:
#   * pull_request closed — delete the caches scoped to that PR's merge ref
#     (the dominant source of accumulation).
#   * weekly schedule — backstop sweep of any non-default-branch caches left
#     behind by force-closed/abandoned branches or tags.
#
# Uses only the pre-installed `gh` CLI (no third-party actions → no added
# supply-chain surface).  Needs `actions: write` to delete caches.
name: cache-cleanup

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

# Default the workflow token to read-only; the single job that deletes
# caches elevates to `actions: write` at job scope (least privilege — a
# compromised step elsewhere never inherits cache-delete rights).
permissions:
  contents: read

concurrency:
  group: cache-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-24.04
    permissions:
      actions: write   # gh cache delete
      contents: read
    steps:
      - name: Delete caches for the closed PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          echo "Pruning caches scoped to $PR_REF"
          # Fetch every page before deleting anything.  Compiler caches can
          # create hundreds of records for one PR, and deleting while paging
          # would shift the remaining API pages underneath the traversal.
          ids=$(gh api --paginate \
            "repos/$REPO/actions/caches?per_page=100" \
            --jq ".actions_caches[] | select(.ref == \"$PR_REF\") | .id")
          if [ -z "$ids" ]; then
            echo "  no caches for this PR"
          else
            for id in $ids; do
              echo "  deleting cache $id"
              gh cache delete "$id" --repo "$REPO" || true
            done
          fi

      - name: Weekly sweep of unprotected-branch caches
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SCCACHE_MAX_IDLE_DAYS: 7
        run: |
          # Preserve the conventional caches of the long-lived branch that has
          # push-triggered blocking workflows. ci.yml runs on `rust`, so
          # purging those rust-cache entries every week would force cold gates.
          # sccache is different: every compiler object has its own immutable,
          # content-addressed record. Keep recently used objects on rust, but
          # retire ones whose source/compiler key has not been read for a week.
          # Keep the protected ref in sync with ci.yml's push triggers.
          cutoff=$(date -u -d "$SCCACHE_MAX_IDLE_DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "Sweeping non-rust caches and rust sccache objects idle since $cutoff"

          # Collect every page before deletion so records cannot shift the
          # remaining API pages underneath the traversal.
          ids=$(gh api --paginate \
            "repos/$REPO/actions/caches?per_page=100" \
            --jq ".actions_caches[] | select(\
              .ref != \"refs/heads/rust\" or \
              (.ref == \"refs/heads/rust\" and \
               (.key | startswith(\"sccache/\")) and \
               .last_accessed_at < \"$cutoff\")) | .id")
          if [ -z "$ids" ]; then
            echo "  nothing to sweep"
          else
            for id in $ids; do
              echo "  deleting non-rust cache $id"
              gh cache delete "$id" --repo "$REPO" || true
            done
          fi
          echo "Cache usage after sweep:"
          gh api "repos/$REPO/actions/cache/usage" \
            --jq '{bytes: .active_caches_size_in_bytes, count: .active_caches_count}'
