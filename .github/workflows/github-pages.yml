# The canonical copy of this workflow lives at
# `rust/bigip-report-gen/python/deploy/github-pages.yml`; the copy under
# `.github/workflows/` is installed from it, and the two must stay
# byte-identical — `cargo xtask workflow-sync --check` gates that.  Edit
# the canonical copy, then reinstall it:
#
#     cargo xtask workflow-sync   # or: cp rust/bigip-report-gen/python/deploy/github-pages.yml .github/workflows/
#     git add .github/workflows/github-pages.yml && git commit && git push
#
name: Deploy GitHub Pages (BIG-IP report + compiler explorer + spec studio)

# Builds the four static, self-contained web apps this repo publishes and serves
# them from ONE GitHub Pages deployment (Pages serves a single artifact per
# repo, so they must all ship together or they clobber each other):
#
#   /bigip-report-demo/  — the interactive f5report example, rendered from the
#                          committed sample UCS fixtures (Rust + PyO3 + maturin).
#   /compiler-explorer/  — the Tcl compiler explorer GUI, whose core is compiled
#                          Rust → WASM and runs entirely client-side (no backend,
#                          so it works as static hosting). Bundle built by
#                          `make explorer-build` into rust/tcl-cli/gui/.
#   /spec-studio/        — the command-registry spec studio: browse and edit any
#                          CommandSpec, render it back to a registry .rs file or
#                          a Tcl stub, and infer signatures from an imported
#                          package (one snapshot, or several releases for a
#                          version range). Its Pack DSL and Test panes are
#                          Monaco backed by the REAL Tcl language server,
#                          compiled to WASM and running in a Web Worker. A
#                          multi-file dist — index.html (registry + compiler
#                          analyser inlined as WASM), assets/ (the lazily
#                          loaded editor chunk), lsp/ (the server worker) —
#                          built by `make spec-studio-wasm`, which now also
#                          builds `make lsp-server-wasm` as a prerequisite.
#
# This supersedes the old `pages.yml` (Python `make explorer-build-cdn`), which
# no longer exists on the Python-free `rust` line.
on:
  push:
    # `rust` is the active development line these features land on; `main` is the
    # long-term default. Deploy from whichever holds the merged code.
    branches: [rust, main]
    paths:
      # BIG-IP report generator + demo sources (query engine, model, renderer).
      - "rust/bigip-report-gen/python/**"
      - "rust/bigip-report-gen/rust/**"
      - "rust/bigip-report-gen/frontend/**"
      - "rust/bigip-query-wasm/**"
      - "rust/bigip-report-gen/wasm/**"
      - "rust/tcl-bigip-query/**"
      - "rust/tcl-bigip/**"
      - "rust/tcl-bigip-io/**"
      # Compiler-explorer sources: the WASM shell + the compiler/analysis core
      # it embeds, so highlighting/analysis fixes redeploy the live explorer.
      - "rust/tcl-explorer-wasm/**"
      # Spec-studio sources: the schema/renderers crate, its WASM facade, and
      # its TypeScript front-end. The registry and compiler paths below are
      # shared with the explorer and already listed.
      - "rust/tcl-spec-studio/**"
      - "rust/tcl-spec-studio-wasm/**"
      # The studio's editors are driven by the language server built here, and
      # its dist carries that server's worker + wasm.
      - "rust/tcl-lsp-server-wasm/**"
      - "rust/tcl-lsp-server/**"
      - "rust/tcl-cli/gui/**"
      - "rust/tcl-lexer/**"
      - "rust/tcl-syntax/**"
      - "rust/tcl-registry/**"
      - "rust/tcl-compiler/**"
      - "rust/tcl-lsp-core/**"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: `tcl-version` resolves the release version with
          # `git describe --tags`, and a shallow, tagless checkout makes that fail —
          # every published artefact then reported the manifest placeholder (0.1.0)
          # rather than the release it was cut from.
          fetch-depth: 0

      # Stamp the version from a PRISTINE tree, before anything below regenerates
      # tracked files (build-wasm.sh rewrites assets/, the front-end build rewrites
      # dist/). `tcl-version` prefers TCL_LSP_VERSION over `git describe`, so it
      # cannot later mistake CI's own build output for a developer's edits and mark
      # a published build `.dirty`.
      - name: Stamp the release version
        shell: bash
        run: echo "TCL_LSP_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"

      # rust-toolchain.toml pins the channel (stable). Cache both crate trees:
      # the workspace member the report links (bigip-report-gen/python) and the
      # standalone WASM crate (tcl-explorer-wasm has its own lockfile).
      # The runner image ships a pinned stable (currently 1.96.1) and
      # `rust-toolchain.toml`'s `channel = "stable"` resolves to *that*, not to
      # the newest release — so cargo refuses the workspace's `rust-version`.
      # Install the current stable explicitly.  `cache: false` because the
      # Swatinem cache is configured separately below.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache: false

      - name: Cache cargo + build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            rust/bigip-report-gen/python
            rust/tcl-explorer-wasm
            rust/tcl-spec-studio-wasm
            rust/tcl-lsp-server-wasm

      # ── Compiler Explorer (Rust → WASM, client-side, no backend) ──────────
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack + wasm-bindgen-cli
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          # wasm-bindgen-cli must match the wasm-bindgen crate version pinned in
          # rust/bigip-report-gen/wasm/Cargo.toml.
          tool: wasm-pack,wasm-bindgen-cli@0.2.127

      # No wasm-opt/binaryen: it is intentionally disabled for this module
      # (see rust/tcl-explorer-wasm/Cargo.toml + the explorer-wasm Make target).
      # `make explorer-build` verifies the externref table is growable via
      # scripts/verify-wasm-externref.mjs (node is preinstalled on the runner).
      - name: Build the compiler-explorer GUI bundle (WASM + Mermaid)
        # Emits the wasm/js bundle + vendored Mermaid into rust/tcl-cli/gui/.
        run: make explorer-build

      # ── Shared report front-end (TypeScript → dist/, synced into f5report) ─
      # Builds rust/bigip-report-gen/frontend/src → dist/*.js and syncs the built JS +
      # styles + freshly-vendored wasm into the Python package, so maturin
      # embeds current assets. Node is preinstalled on the runner. Must run
      # BEFORE build-wasm.sh below: that script inlines the built front-end
      # templates (frontend/public/templates/input.html) into the single-file
      # report app, so the front-end has to be built first.
      - name: Build the shared report front-end (TypeScript)
        run: |
          cd rust/bigip-report-gen/frontend
          npm ci
          npm run build

      - name: Build the in-browser report generator (Rust → WASM)
        # Assembles the single-file upload app into
        # rust/bigip-report-gen/wasm/dist/index.html (WASM + glue inlined).
        # build-wasm.sh skips wasm-opt for the same externref-table reason as
        # the explorer, and verifies the module's externref table is growable.
        run: bash rust/bigip-report-gen/wasm/build-wasm.sh

      # ── Command-registry spec studio (TypeScript + Rust → WASM) ───────────
      # The front-end's DOM-free logic first: the GitHub release fetcher's
      # pagination, rate-limit reporting and failure messages are covered by
      # stubs here, which is the only place they can be — the live API is not
      # something a build should depend on.
      - name: Test the spec studio front-end
        run: make spec-studio-test

      # `spec-studio-wasm` builds, in order: the TypeScript front-end (the
      # controller bundle plus the lazily-loaded Monaco/language-client chunk),
      # the language server worker via its `lsp-server-wasm` prerequisite, and
      # the studio wasm — then assembles them into a multi-file
      # rust/tcl-spec-studio-wasm/dist/ (index.html + assets/ + lsp/). Same
      # no-wasm-opt + externref-growability handling as the two apps above.
      #
      # This is the heaviest build on the page: the language server links the
      # whole analyser and comes to ~21 MB of wasm (~5.6 MB gzipped, which is
      # what Pages actually serves).
      - name: Build the command-registry spec studio (TypeScript + Rust → WASM)
        run: make spec-studio-wasm

      # A dist that boots nowhere is worse than a build failure, because it
      # deploys. Playwright drives the assembled directory over HTTP exactly as
      # Pages serves it: the page loads under its own CSP, Monaco mounts, and
      # the language server worker answers `initialize`. The check skips itself
      # where chromium is unavailable rather than failing.
      - name: Install playwright chromium
        run: |
          cd rust/tcl-spec-studio/web
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Boot the assembled spec studio in headless chromium
        run: |
          cd rust/tcl-spec-studio/web
          NODE_PATH="$PWD/node_modules" node ../../tcl-spec-studio-wasm/test/boot.mjs

      # ── BIG-IP report (PyO3 + maturin) ────────────────────────────────────
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Render the report and assemble the Pages site
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip maturin
          # maturin develop installs f5report editable against the source tree,
          # so the vendored Mermaid + wasm engine (committed under
          # python/f5report/vendor/) are embedded — GitHub Pages has no strict
          # CSP, so the in-browser query console works when hosted.
          ( cd rust/bigip-report-gen/python && maturin develop --release )

          # BIG-IP report → /bigip-report-demo/
          mkdir -p site/bigip-report-demo
          python -m f5report \
            rust/bigip-report-gen/python/tests/data/lab-device-01.ucs \
            rust/bigip-report-gen/python/tests/data/lab-device-02.ucs \
            -t "F5 BIG-IP Estate — example report" \
            -o site/bigip-report-demo/index.html

          # Interactive report generator (upload a UCS/SCF, all in-browser) →
          # /bigip-report-generator/ (single self-contained file built above).
          mkdir -p site/bigip-report-generator
          cp rust/bigip-report-gen/wasm/dist/index.html site/bigip-report-generator/index.html

          # Compiler Explorer → /compiler-explorer/ (bundle built above; the
          # wasm/js/mermaid assets are gitignored build outputs, so copy the
          # whole GUI dir minus its .gitignore).
          mkdir -p site/compiler-explorer
          cp -r rust/tcl-cli/gui/. site/compiler-explorer/
          rm -f site/compiler-explorer/.gitignore

          # Command-registry spec studio → /spec-studio/. The dist IS a
          # directory now — index.html, the lazily-loaded editor chunk under
          # assets/, and the language server worker under lsp/ — and every path
          # the page uses is computed at run time from `document.baseURI` /
          # `import.meta.url`, so it works under this subdirectory without any
          # rewriting. Copy it whole; losing any one file breaks a feature
          # silently rather than loudly, so assert the set afterwards.
          mkdir -p site/spec-studio
          cp -r rust/tcl-spec-studio-wasm/dist/. site/spec-studio/
          for required in index.html assets/monaco-host.js assets/monaco-host.css \
                          lsp/worker.js lsp/tcl_lsp_server_wasm.js \
                          lsp/tcl_lsp_server_wasm_bg.wasm; do
            test -f "site/spec-studio/$required" \
              || { echo "spec-studio: dist is missing $required"; exit 1; }
          done
          du -sh site/spec-studio

          # Root landing page linking both apps (the shared Pages root).
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>tcl-lsp — demos</title>
            <style>
              body { font: 16px/1.5 system-ui, sans-serif; max-width: 40rem;
                     margin: 4rem auto; padding: 0 1rem; }
              h1 { font-size: 1.4rem; }
              a { color: #0645ad; }
              li { margin: .5rem 0; }
            </style>
          </head>
          <body>
            <h1>tcl-lsp — live demos</h1>
            <ul>
              <li><a href="compiler-explorer/">Tcl compiler explorer</a> —
                  lex / parse / bytecode / diagnostics, compiled to WASM and run
                  in your browser.</li>
              <li><a href="bigip-report-generator/">F5 BIG-IP report generator</a> —
                  upload your own <code>.ucs</code> / <code>bigip.conf</code>
                  and generate a report entirely in your browser (nothing is
                  uploaded; encrypted UCS + <code>f5mku</code> secrets
                  supported).</li>
              <li><a href="bigip-report-demo/">F5 BIG-IP estate report</a> —
                  an example report with an in-browser query console, rendered
                  from sample UCS fixtures.</li>
              <li><a href="spec-studio/">Command registry spec studio</a> —
                  browse every command tcl-lsp knows, edit any field of its
                  <code>CommandSpec</code>, and render it back out as a
                  registry <code>.rs</code> file or a Tcl dialect stub. Import
                  a package's Tcl and the compiler infers a starting signature
                  for each <code>proc</code>; import several releases and it
                  derives each command's version range. Edits happen in Monaco,
                  driven by the real Tcl language server running in your
                  browser.</li>
            </ul>
          </body>
          </html>
          HTML

          # .nojekyll keeps Pages from post-processing the single-file apps.
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
