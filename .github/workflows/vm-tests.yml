name: VM Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vm-tests:
    # ubuntu-26.04 (public preview since 2026-06). The rest of the pipeline is
    # still on 24.04; this rust-branch gate rides the newer image first.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the channel (stable); the action installs it
      # and wires up the Swatinem cache (registry + target dir).
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable

      # `make vm-test` runs `cargo test` for the bytecode VM crates
      # (tcl-bytecode + tcl-runtime-api + tcl-vm). No Python is involved, so
      # no `uv sync`/pyproject.toml step is needed; the target is `vm-test`
      # (not `test-vm`).
      - name: Run bytecode VM crate tests
        run: make vm-test
