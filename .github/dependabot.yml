# Dependabot configuration.
#
# This is the inbound channel for security updates to pinned dependencies.
# Workflows pin third-party actions to commit SHAs (see .github/workflows/*),
# which is only safe if there's an automated update channel — that's this file.
#
# Grouped updates land as a single PR per ecosystem per week to keep review
# load manageable. Security advisories still open a PR immediately regardless
# of schedule.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /rust/bigip-report-gen/python
    schedule:
      interval: weekly
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
    groups:
      # The npm CLI itself is pinned via the `packageManager` field in
      # package.json (currently npm@12.0.0-pre.0.0). Dependabot tracks that
      # field as the "npm" dependency, so isolate it in its own group: a CLI
      # bump (e.g. the npm 12 prerelease -> stable 12.0.0) then lands as a
      # clearly labelled standalone PR instead of being buried in the weekly
      # devDependency roll-up.
      npm-cli:
        patterns:
          - "npm"
      npm:
        patterns:
          - "*"
        exclude-patterns:
          - "npm"
    ignore:
      # typescript-eslint 8.69 supports TypeScript only below 6.1.
      - dependency-name: typescript
        versions: [">=7.0.0"]

  # Every npm project in the tree needs its own entry — Dependabot does not
  # walk sub-directories.  The spec-studio web app was the gap that let four
  # DOMPurify advisories sit unnoticed (they only surfaced through the
  # Scorecard `Vulnerabilities` check, which reads the lockfiles directly).
  - package-ecosystem: npm
    directory: /rust/tcl-spec-studio/web
    schedule:
      interval: weekly
    groups:
      npm-cli:
        patterns:
          - "npm"
      npm:
        patterns:
          - "*"
        exclude-patterns:
          - "npm"
    ignore:
      # typescript-eslint 8.69 supports TypeScript only below 6.1.
      - dependency-name: typescript
        versions: [">=7.0.0"]

  - package-ecosystem: npm
    directory: /rust/bigip-report-gen/frontend
    schedule:
      interval: weekly
    groups:
      npm-cli:
        patterns:
          - "npm"
      npm:
        patterns:
          - "*"
        exclude-patterns:
          - "npm"
    ignore:
      # typescript-eslint 8.69 supports TypeScript only below 6.1.
      - dependency-name: typescript
        versions: [">=7.0.0"]

  # Every cargo root in the tree, not just the workspace at `/`.  The root
  # `[workspace] exclude` list (Cargo.toml) holds each target that cannot
  # inherit the workspace lints or targets wasm32 — every one is a separate
  # crate with its own Cargo.lock, so Dependabot has to be pointed at it
  # explicitly.  Only `editors/zed` was tracked, which left the shipped `.pyz`
  # bindings, the report and query WASM builds, both browser/WASI language
  # server transports and the VM unmonitored.  `directories` keeps that as one
  # grouped PR a week rather than twelve.  Keep this list in step with
  # `[workspace] exclude`; `git ls-files '*Cargo.lock'` is the check.
  - package-ecosystem: cargo
    directories:
      - /
      - /runtime/rust
      - /editors/zed
      - /rust/bigip-query-wasm
      - /rust/bigip-report-gen/python
      - /rust/bigip-report-gen/wasm
      - /rust/tcl-explorer-wasm
      - /rust/tcl-lsp-server-wasi
      - /rust/tcl-lsp-server-wasm
      - /rust/tcl-spec-studio-wasm
      - /rust/tcl-vm-wasm
      - /rust/zed-query-check
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      # This is the Preview 1 errno API. wasi 0.12+ is a component-model API
      # with a different surface and cannot replace it in place.
      - dependency-name: wasi
        versions: [">=0.12.0"]

  - package-ecosystem: gradle
    directory: /editors/jetbrains
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns:
          - "*"
