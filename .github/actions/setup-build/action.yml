name: "Set up build environment"
description: |
  Standard tcl-lsp build setup used by every CI job that runs Python or
  invokes `make`.  Logs commit info (with safe env-var interpolation to
  avoid the head-ref expression-injection vector), installs `uv`, sets
  up Python, and runs `uv sync --extra dev`.

  **Callers must run `actions/checkout` BEFORE using this composite.**
  Composite actions referenced via `./.github/actions/...` need the
  action.yml file to be present in the workspace; the runner can't load
  the action before its own steps run, and the composite can't check
  itself out.  Each caller workflow does the checkout step itself with
  its required fetch-depth / fetch-tags — that's a tiny duplication
  in exchange for a cleanly loadable composite.

  All third-party action SHAs are pinned identically to how the inlined
  copies were before this composite landed; bump them here in ONE place.

inputs:
  python-version:
    description: "Python version for `actions/setup-python`."
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    # `github.head_ref` is the PR source branch and is attacker-controlled
    # on forked-PR runs — interpolating it directly into `run:` is the
    # classic GitHub Actions expression-injection vector.  Pipe every
    # workflow-context value through `env:` so the shell sees a plain
    # variable, not template-expanded source.
    - name: Log commit info
      shell: bash
      env:
        GH_SHA: ${{ github.sha }}
        GH_EVENT: ${{ github.event_name }}
        GH_REF: ${{ github.ref }}
        GH_HEAD_REF: ${{ github.head_ref }}
        GH_RUN_ID: ${{ github.run_id }}
      run: |
        echo "::group::Commit info"
        echo "github.sha        = $GH_SHA"
        echo "github.event_name = $GH_EVENT"
        echo "github.ref        = $GH_REF"
        echo "github.head_ref   = $GH_HEAD_REF"
        echo "github.run_id     = $GH_RUN_ID"
        echo "checked-out HEAD  = $(git rev-parse HEAD)"
        echo
        git log -1 --pretty=fuller HEAD || true
        echo "::endgroup::"

    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Sync Python environment
      shell: bash
      run: uv sync --extra dev
