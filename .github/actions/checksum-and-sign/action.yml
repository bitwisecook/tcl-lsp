name: "(Re)generate and sign a release's SHA256SUMS"
description: |
  Download every asset currently attached to a GitHub Release, regenerate
  SHA256SUMS over them, and sign it with cosign (keyless OIDC).

  Shared by ci.yml's `publish-checksums` job and report-pyz.yml's
  `finalize-checksums` job.  The two run as separate, unsynchronised
  workflows — `push` on a tag vs. this repo's own `release: published` —
  so whichever finishes last must redo this to cover every asset both
  have attached by then; duplicating the sum/sign body in both places
  would just let the two drift.

  The calling job must set `permissions: { contents: write, id-token:
  write }` and have already checked out the repo (so this composite
  action resolves on the runner).

inputs:
  tag:
    description: "The release tag, e.g. v2.1.0 (no leading refs/tags/)."
    required: true

runs:
  using: composite
  steps:
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        # Pin the cosign binary itself, not just the installer action.
        cosign-release: 'v2.6.3'

    - name: Regenerate + sign SHA256SUMS
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        dist="$(mktemp -d)"
        trap 'rm -rf "$dist"' EXIT

        # Pull every asset currently attached to the release; this gives a
        # single SUMS covering whatever has been uploaded so far by either
        # workflow, whichever of the two calls this last.
        gh release download "$TAG" --dir "$dist" --clobber

        (
          cd "$dist"
          # Sort for deterministic ordering. Exclude any pre-existing
          # SHA256SUMS{,.cosign.bundle} so a rerun doesn't hash itself.
          find . -maxdepth 1 -type f \
            ! -name SHA256SUMS \
            ! -name 'SHA256SUMS.*' \
            -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs -r sha256sum > SHA256SUMS
          cat SHA256SUMS
        )

        gh release upload "$TAG" "$dist/SHA256SUMS" --clobber

        cosign sign-blob --yes \
          --bundle "$dist/SHA256SUMS.cosign.bundle" \
          "$dist/SHA256SUMS"

        gh release upload "$TAG" "$dist/SHA256SUMS.cosign.bundle" --clobber
