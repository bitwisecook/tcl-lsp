# Bytecode instructions, assembly, layout and disassembly. Shared tables live
# below this crate in tcl-bytecode-tables, which analysis and runtime/rust use
# without depending on opcode selection or encoding.
[package]
name = "tcl-bytecode"
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Tcl 9 bytecode artifact types (opcodes, instructions, FunctionAsm/ModuleAsm, layout, disassembly)"

[dependencies]
tcl-bytecode-tables = { path = "../tcl-bytecode-tables" }
tcl-dialect = { path = "../tcl-dialect" }
tcl-lexer = { path = "../tcl-lexer" }
tcl-runtime-api = { path = "../tcl-runtime-api" }
tcl-syntax = { path = "../tcl-syntax" }

[lints]
workspace = true
