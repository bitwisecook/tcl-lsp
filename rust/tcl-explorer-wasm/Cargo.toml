# Rust → WASM facade for the compiler-explorer GUI.
#
# Excluded from the main workspace (like `editors/zed/`): it is a cdylib
# targeting `wasm32-unknown-unknown`, and wasm-bindgen's generated glue
# needs `unsafe`, which the workspace `unsafe_code = "forbid"` lint bans.
# Built via `make explorer-wasm` (wasm-pack + wasm-opt); see the Makefile.
[package]
name = "tcl-explorer-wasm"
# This crate is `exclude`d from the root workspace (see the comment above and
# the workspace `exclude` list), so it cannot inherit `publish` from
# `[workspace.package]` — `publish.workspace = true` makes `cargo metadata`
# (and therefore wasm-pack) fail with "failed to find a workspace root".  It is
# a browser wasm facade that is never published to crates.io, so set it
# explicitly.
publish = false
description = "Rust → WASM compile() facade for the Tcl compiler-explorer GUI"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/bitwisecook/tcl-lsp"

[lib]
crate-type = ["cdylib"]

[dependencies]
tcl-explorer = { path = "../tcl-explorer" }
serde_json = "1"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[profile.release]
# Optimise for size — this ships to the browser.
opt-level = "s"
lto = true
codegen-units = 1

# Disable wasm-pack's built-in wasm-opt for this crate: on newer rustc layouts,
# binaryen 120 (Ubuntu 24.04 apt) mis-rebinds the `__wbindgen_externrefs`
# export from the growable externref table onto the fixed-size funcref table,
# which breaks `Table.grow` at runtime ("could not grow the table"). The raw
# wasm-bindgen output has the correct binding; we ship it unoptimised.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
