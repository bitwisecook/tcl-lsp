# The native, idiomatic Rust bytecode VM ("TCLVM").
#
# Executes the bytecode artifact (`tcl-bytecode`) the compiler emits, with an
# `Rc`-based dual-rep value model (NOT the 24-byte wasm32 ABI obj) and a
# non-recursive (NRE/trampoline) execution engine. Reuses `tcl-syntax` for the
# expr tower / number / list semantics, and satisfies the `tcl-runtime-api`
# Family-B contract. Stays `forbid(unsafe)` and compiler-optional (the
# `CompileService` injection point keeps it off `tcl-compiler`).
#
# See `docs/design/common-runtime-emitter-architecture.md`.
[package]
name = "tcl-vm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Native Rust bytecode VM executing Tcl 9 bytecode (TCLVM)"

[lib]
name = "tcl_vm"

[dependencies]
tcl-bytecode = { path = "../tcl-bytecode" }
tcl-syntax = { path = "../tcl-syntax" }
tcl-runtime-api = { path = "../tcl-runtime-api" }
tcl-cmd-core = { path = "../tcl-cmd-core" }
tcl-platform = { path = "../tcl-platform" }
tcl-host-native = { path = "../tcl-host-native" }
tcl-regex = { path = "../tcl-regex", features = ["cmd-core"] }

[dev-dependencies]
# End-to-end tests compile real Tcl to bytecode then run it. Dev-only, so the
# library itself stays off the compiler (CompileService is the runtime seam).
tcl-compiler = { path = "../tcl-compiler" }
tcl-registry = { path = "../tcl-registry" }

[lints]
workspace = true
