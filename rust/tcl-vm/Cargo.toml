# The native, idiomatic Rust bytecode VM ("TCLVM").
#
# Executes the bytecode artifact (`tcl-bytecode`) the compiler emits, with an
# `Rc`-based dual-rep value model (NOT the 24-byte wasm32 ABI obj) and a
# non-recursive (NRE/trampoline) execution engine. Reuses `tcl-syntax` for the
# expr tower / number / list semantics, and satisfies the `tcl-runtime-api`
# Family-B contract. Stays `forbid(unsafe)` and compiler-optional (the
# `CompileService` injection point keeps it off `tcl-compiler`).
#
# See `docs/design/common-runtime-emitter-architecture.md`.
[package]
name = "tcl-vm"
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Bytecode VM executing Tcl 9 bytecode (TCLVM)"

[lib]
name = "tcl_vm"

[dependencies]
tcl-core-types = { path = "../tcl-core-types" }
tcl-bytecode = { path = "../tcl-bytecode" }
tcl-dialect = { path = "../tcl-dialect" }
# The release-aware `${…}` close rule (`ranges::braced_var_name_end`) the
# `subst` engine resolves brace-form variable references through — already in
# the tree via `tcl-syntax`; this makes the edge direct.
tcl-lexer = { path = "../tcl-lexer" }
tcl-syntax = { path = "../tcl-syntax", features = ["num-bigint"] }
tcl-runtime-api = { path = "../tcl-runtime-api" }
tcl-cmd-core = { path = "../tcl-cmd-core" }
tcl-platform = { path = "../tcl-platform" }
tcl-host-native = { path = "../tcl-host-native" }
tcl-regex = { path = "../tcl-regex", features = ["cmd-core"] }
tcl-registry = { path = "../tcl-registry" }
# Arbitrary-precision integers for the `expr` tower: the VM is
# pure Rust (no libtommath), so `num-bigint` is its bignum backend once a result
# outgrows the `i128` fast path. `num-integer`/`num-traits` supply floor
# div/mod, `pow`, and the primitive narrowing. The `tcl-syntax` `num-bigint`
# feature above supplies the shared tower's `BigIntOps` adapter for this same
# `BigInt`, so the operator semantics come from `tcl_syntax::number_tower`.
num-bigint = "0.5"
num-integer = "0.1"
num-traits = "0.2"

# The browser half of the capability seam (`src/host_wasm.rs`), which is the
# `Vm`'s default host on `wasm32-unknown-unknown`: there is no OS under that
# target and `std::time::SystemTime::now` panics, so the wall clock has to come
# from JavaScript's `Date.now()` (issue #1661). Target-gated so no native build
# — and no `wasm32-wasip1` build, where std time works — carries wasm-bindgen.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"

[dev-dependencies]
# End-to-end tests compile real Tcl to bytecode then run it. Dev-only, so the
# library itself stays off the compiler (CompileService is the runtime seam).
tcl-compiler = { path = "../tcl-compiler" }

[lints]
workspace = true
