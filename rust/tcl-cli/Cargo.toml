[package]
name = "tcl-cli"
description = "Native Rust port of the unified `tcl` toolchain CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "tcl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
anyhow = "1"
tcl-cli-support = { path = "../tcl-cli-support" }
tcl-lsp-core = { path = "../tcl-lsp-core" }
tcl-compiler = { path = "../tcl-compiler" }
tcl-explorer = { path = "../tcl-explorer" }
tcl-lexer = { path = "../tcl-lexer" }
tcl-registry = { path = "../tcl-registry" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Bundled SQLite (with FTS5) for the `help` verb's embedded KCS database.
rusqlite = { version = "0.32", features = ["bundled"] }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

[dev-dependencies]
# Used by the CLI parity tests to compare help-search retrieval structurally
# (the BM25 `rank` float is environment-dependent, so we don't byte-match it).
serde_json = { version = "1", features = ["preserve_order"] }
# Normalise the absolute fixtures path baked into `minimize`/`symbols` output
# so the goldens compare portably (see cli_parity.rs).
regex = "1"

[features]
# The interactive `tcl explore --tui` shell. Off by default so the lean CLI
# build doesn't pull the terminal-UI stack (mirrors Python's optional Textual).
tui = ["dep:ratatui", "dep:crossterm"]

[build-dependencies]
# Build the embedded KCS help database (FTS5) from the committed
# docs/kcs/features/*.md at compile time — port of scripts/build/kcs_db.py.
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"

[lints]
workspace = true
