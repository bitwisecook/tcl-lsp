[package]
name = "bigip-report-gen-rust"
publish.workspace = true
description = "Standalone HTML BIG-IP estate report built from the f5-query engine (the Rust port of the f5report generator)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Resolves the release version from the git tag. The workspace manifest carries
# 0.1.0 and is never bumped (releases are tag-only), so CARGO_PKG_VERSION made
# every report header read "query engine v0.1.0".
tcl-version = { path = "../../tcl-version" }
# The query engine, without the network-probe layer so this crate also builds
# for wasm32 (the in-browser report generator). A report never probes — but the
# `x509` surface (pure Rust: x509-parser + sha2, no socket/TLS) is on so the
# certs tab can parse certificate files read out of a UCS filestore.
tcl-bigip-query = { path = "../../tcl-bigip-query", default-features = false, features = ["x509"] }
# The BIG-IP object model + parser. The query DSL only projects the `ltm`
# module, so the certificate inventory reads `sys file ssl-cert` objects from
# the parsed model directly (the same parser the engine uses).
tcl-bigip = { path = "../../tcl-bigip" }
tcl-sslictcl = { path = "../../tcl-sslictcl" }
# The real Tcl tokeniser + its HTML highlighter, for the iRule source view.
tcl-lexer = { path = "../../tcl-lexer", features = ["html"] }
# IR-based control-flow diagram → Mermaid, for the iRule flowchart.
tcl-diagram = { path = "../../tcl-diagram" }
tcl-compiler = { path = "../../tcl-compiler" }
tcl-registry = { path = "../../tcl-registry" }
# The resolved iRules profile the head-identity scan is threaded with.
tcl-dialect = { path = "../../tcl-dialect" }
# F5 master-key (`f5mku`) secret decryption. `default-features = false` drops
# the `rand`/getrandom salt path (only `encrypt` needs it), keeping the wasm
# build entropy-free — a report only ever *decrypts*.
tcl-f5mku = { path = "../../tcl-f5mku", default-features = false }
# Default-credential verification (Security tab): deterministic, offline
# verification of a stored password hash against a known candidate, with no
# platform `crypt(3)` call (so native, wasm and any future backend agree).
# `sha-crypt` (RustCrypto) covers the glibc `$5$`/`$6$` SHA-256/512-crypt
# schemes used by modern BIG-IP local accounts; default features are
# `alloc` + `password-hash` (no `getrandom` — verification needs no
# randomness, keeping the wasm build entropy-free like `tcl-f5mku` above).
sha-crypt = "0.6"
# `$1$` MD5-crypt (older BIG-IP / Linux accounts) is implemented locally in
# `crypt.rs` on top of the plain MD5 digest — the algorithm has no established
# maintained pure-Rust crate, but is small, has no randomness, and is
# unit-tested against real `crypt(3)` output.
md-5 = "0.11"
regex = "1"
ipnet = "2"
base64 = "0.23"
# CommonMark + GFM for the user-supplied report front-matter, rendered to HTML at
# generation time (shared by the Python, Rust and wasm backends via one impl).
# `default-features = false` keeps the wasm build lean; raw HTML is stripped in
# `markdown.rs` so front-matter can't break the single-file document.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# Parse the x509 ISO validity strings to an epoch (for the live countdown) and a
# human date. `default-features = false` — no clock; a report is time-free.
chrono = { version = "0.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
minijinja = { version = "2", default-features = false, features = ["builtins", "macros", "loop_controls", "serde", "json"] }
# UCS extraction (plain / OpenPGP) for the native CLI: read a `.ucs` off disk,
# flatten it to SCF, and pull the certificate filestore + forensic file
# inventory the same way the wasm generator does. Native-only — gated behind the
# `cli` feature so the wasm/library builds (which never touch the filesystem)
# don't pull it in.
tcl-bigip-io = { path = "../../tcl-bigip-io", optional = true }

[features]
# The native command-line generator (`bigip-report-gen`). Off by default so the
# default `cargo build` (and the wasm / PyO3 consumers, which render in-process
# and are time-free) stay lean: `chrono/clock` — needed only to stamp the CLI's
# generation timestamp — is confined here, keeping the wasm build clockless.
cli = ["dep:tcl-bigip-io", "chrono/clock"]

[dev-dependencies]
# Load the shared UCS fixtures the Python f5report tests use, so the port is
# validated against the same inputs.
tcl-bigip-io = { path = "../../tcl-bigip-io" }

# The native CLI generator: `cargo run -p bigip-report-gen-rust --features cli
# --bin bigip-report-gen -- device.ucs -o report.html`. Requires `cli` (which
# pulls the UCS reader + a real clock); a plain `cargo build` skips it.
[[bin]]
name = "bigip-report-gen"
required-features = ["cli"]

[lints]
workspace = true
