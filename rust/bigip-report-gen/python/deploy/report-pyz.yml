# Build the report-generator release artefacts and attach them to the GitHub
# Release:
#   * the self-contained f5report `.pyz` (Python generator CLI) per platform,
#   * the single-file HTML generator (the Rust generator's browser form — one
#     index.html with the WASM engine embedded), built once, and
#   * the native Rust generator CLI binary (`bigip-report-gen`) per platform.
#
# The `.pyz` bundles the native `_engine` extension (Rust query engine via PyO3)
# together with its Python deps (minijinja), built by `shiv`. Because the compiled
# engine is baked in, each artefact is OS/arch-specific (but runs on any CPython
# >= 3.9 for that platform — the extension is abi3). `GIT_HASH` is injected at
# build time so the report footer shows the commit the `.pyz` was built from
# even when it is later run outside any git checkout — the whole reason this
# lives in CI rather than only in `make build-report-pyz`.
#
# It runs on published releases (attaching the `.pyz` files to the release) and
# on manual dispatch (artefacts only). The local equivalent is
# `make build-report-pyz`, which runs the same maturin + shiv steps for the host
# platform.
# The canonical copy of this workflow lives at
# `rust/bigip-report-gen/python/deploy/report-pyz.yml`; the copy under
# `.github/workflows/` is installed from it, and the two must stay
# byte-identical — `cargo xtask workflow-sync --check` gates that.  Edit
# the canonical copy, then reinstall it:
#
#     cargo xtask workflow-sync   # or: cp rust/bigip-report-gen/python/deploy/report-pyz.yml .github/workflows/
#     git add .github/workflows/report-pyz.yml && git commit && git push
#
name: Build report-generator release artefacts

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # attach artefacts to the release

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: macos-14
            arch: arm64
          - os: windows-latest
            arch: x86_64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history + tags: `tcl-version` resolves the release version with
          # `git describe --tags`, and a shallow, tagless checkout makes that fail —
          # every published artefact then reported the manifest placeholder (0.1.0)
          # rather than the release it was cut from.
          fetch-depth: 0

      # Stamp the version from a PRISTINE tree, before anything below regenerates
      # tracked files (build-wasm.sh rewrites assets/, the front-end build rewrites
      # dist/). `tcl-version` prefers TCL_LSP_VERSION over `git describe`, so it
      # cannot later mistake CI's own build output for a developer's edits and mark
      # a published build `.dirty`.
      - name: Stamp the release version
        shell: bash
        run: echo "TCL_LSP_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"

      # The runner image ships a pinned stable (currently 1.96.1) and
      # `rust-toolchain.toml`'s `channel = "stable"` resolves to *that*, not to
      # the newest release — so cargo refuses the workspace's `rust-version`.
      # Install the current stable explicitly.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: stable

      # abi3 wheels run on any CPython >= 3.9; build on a current one.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      # The wheel embeds the shared front-end assets (templates + JS/CSS +
      # vendored wasm), which `npm run build` regenerates from
      # rust/bigip-report-gen/frontend into the package. They are build outputs, not
      # checked in (see rust/bigip-report-gen/python/.gitignore + the maturin `include`),
      # so build them here before maturin packages the wheel. Node is
      # preinstalled on the GitHub runners.
      - name: Build the shared report front-end (TypeScript)
        shell: bash
        run: |
          cd rust/bigip-report-gen/frontend
          npm ci
          npm run build

      # rust-toolchain.toml pins the channel; the runners ship cargo, so no
      # explicit toolchain install is needed.
      - name: Build the .pyz (maturin wheel + shiv bundle)
        shell: bash
        env:
          # The commit the report footer will show. Short, to match the
          # `git rev-parse --short` form the build script uses in a checkout.
          GIT_HASH: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip maturin shiv

          # Version tag for the filename: the release tag (minus a leading `v`)
          # on a release, else the short commit.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${GIT_HASH:0:12}"
          fi
          os="$(echo '${{ runner.os }}' | tr '[:upper:]' '[:lower:]')"
          pyz="f5-report-${version}-${os}-${{ matrix.arch }}.pyz"

          # Short-hash the injected commit so the footer stays compact.
          export GIT_HASH="${GIT_HASH:0:12}"

          rm -rf report-wheels && mkdir -p report-wheels dist
          maturin build --release \
            --manifest-path rust/bigip-report-gen/python/Cargo.toml \
            --out report-wheels
          shiv --console-script f5-report --output-file "dist/${pyz}" \
            --find-links report-wheels --reproducible \
            f5report
          echo "PYZ_PATH=dist/${pyz}" >> "$GITHUB_ENV"
          # Share the version/os stamp with the Rust-CLI step below (each step is
          # a fresh shell, so shell vars don't carry over).
          echo "REPORT_VERSION=${version}" >> "$GITHUB_ENV"
          echo "REPORT_OS=${os}" >> "$GITHUB_ENV"

      # ── Native Rust generator CLI binary ──────────────────────────────────
      # The Rust generator's command-line form: the same report the `.pyz`
      # produces, from a single self-contained native binary (no Python runtime).
      # `--features cli` pulls the UCS reader + a real clock (the default build is
      # time-free for the wasm/PyO3 consumers); `build.rs` stamps `git describe`
      # into the footer. Platform-specific, so built inside the same matrix.
      - name: Build the native Rust generator CLI
        id: cli
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p bigip-report-gen-rust --features cli \
            --bin bigip-report-gen
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          out="f5-report-cli-${REPORT_VERSION}-${REPORT_OS}-${{ matrix.arch }}${ext}"
          cp "target/release/bigip-report-gen${ext}" "${out}"
          echo "CLI_PATH=${out}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artefacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: f5-report-${{ runner.os }}-${{ matrix.arch }}
          path: |
            ${{ env.PYZ_PATH }}
            ${{ steps.cli.outputs.CLI_PATH }}
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: |
            ${{ env.PYZ_PATH }}
            ${{ steps.cli.outputs.CLI_PATH }}

  # ── Single-file HTML generator (Rust → WASM, runs entirely in the browser) ─
  # The Rust generator's "website" form: one self-contained index.html with the
  # WASM engine embedded — upload a UCS/SCF and generate a report client-side,
  # nothing uploaded. Platform-independent, so build it once.
  single-file-html:
    name: single-file HTML generator
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history + tags: `tcl-version` resolves the release version with
          # `git describe --tags`, and a shallow, tagless checkout makes that fail —
          # every published artefact then reported the manifest placeholder (0.1.0)
          # rather than the release it was cut from.
          fetch-depth: 0

      # Stamp the version from a PRISTINE tree, before anything below regenerates
      # tracked files (build-wasm.sh rewrites assets/, the front-end build rewrites
      # dist/). `tcl-version` prefers TCL_LSP_VERSION over `git describe`, so it
      # cannot later mistake CI's own build output for a developer's edits and mark
      # a published build `.dirty`.
      - name: Stamp the release version
        shell: bash
        run: echo "TCL_LSP_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"

      # The runner image ships a pinned stable (currently 1.96.1) and
      # `rust-toolchain.toml`'s `channel = "stable"` resolves to *that*, not to
      # the newest release — so cargo refuses the workspace's `rust-version`.
      # Install the current stable explicitly.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: stable

      # The generator page inlines the front-end bundle (input.js), so build the
      # shared front-end first. Node is preinstalled on the runner.
      - name: Build the shared report front-end (TypeScript)
        run: |
          cd rust/bigip-report-gen/frontend
          npm ci
          npm run build

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack + wasm-bindgen-cli
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          # wasm-bindgen-cli must match the wasm-bindgen crate pinned in
          # rust/bigip-report-gen/wasm/Cargo.toml.
          tool: wasm-pack,wasm-bindgen-cli@0.2.126

      - name: Build the single-file generator
        id: build
        shell: bash
        env:
          GIT_HASH: ${{ github.sha }}
        run: |
          set -euo pipefail
          export GIT_HASH="${GIT_HASH:0:12}"
          # Assembles rust/bigip-report-gen/wasm/dist/index.html (WASM inlined).
          bash rust/bigip-report-gen/wasm/build-wasm.sh
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${GIT_HASH}"
          fi
          out="f5-report-generator-${version}.html"
          cp rust/bigip-report-gen/wasm/dist/index.html "${out}"
          echo "HTML_PATH=${out}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: f5-report-generator-html
          path: ${{ steps.build.outputs.HTML_PATH }}
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: ${{ steps.build.outputs.HTML_PATH }}
