# PyO3 bindings for the BIG-IP query engine.
#
# This crate exposes `tcl-bigip-query` (the jq-flavoured `f5 query` DSL) and the
# `tcl-bigip-io` UCS reader to Python as a native extension module
# (`f5report._engine`). It is the interface the pure-Python report generator in
# `python/f5report/` imports — no subprocess, no shelling out to `f5-query`.
#
# It is intentionally EXCLUDED from the workspace (see the root Cargo.toml
# `exclude` list) for the same reason `editors/zed` and `tcl-explorer-wasm` are:
# the PyO3 procedural macros expand to code the workspace `unsafe_code =
# "forbid"` lint would reject, and the extension links libpython, which the
# other workspace crates must not require. Built with maturin, not `cargo`
# directly (see pyproject.toml).
#
# The empty `[workspace]` table below is load-bearing (see the fuller comment
# in `rust/tcl-spec-studio-wasm/Cargo.toml`, issue #1136): without it, cargo
# walks up past this crate looking for a `[workspace]` ancestor, and inside a
# git worktree nested under the main checkout's directory (this repo's
# standard parallel-agent worktree layout) it finds the *main checkout's*
# top-level `Cargo.toml` instead of stopping at this crate — the exclude-path
# match then fails (it's relative to the wrong manifest) and cargo/maturin
# errors with "current package believes it's in a workspace when it's not".
# An empty `[workspace]` table makes this manifest its own workspace root so
# the search never escapes the worktree.

[workspace]

[package]
name = "bigip-report-gen-py"
description = "PyO3 bindings for the F5 BIG-IP query engine (f5-query DSL + UCS reader)"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-or-later"
repository = "https://github.com/bitwisecook/tcl-lsp"
authors = ["tcl-lsp contributors"]
publish = false

[lib]
name = "_engine"
crate-type = ["cdylib"]

[dependencies]
# abi3 (the CPython stable ABI / limited API) is enabled with a 3.9 floor so a
# single wheel loads on every CPython from 3.9 up — the interpreter used to
# build it no longer has to match the one that runs it. The binding only uses
# the subset of the C-API covered by the limited API, so nothing here needs the
# full, version-specific C-API.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
# Resolves the release version from the git tag. The workspace manifest carries
# 0.1.0 and is never bumped (releases are tag-only), so CARGO_PKG_VERSION would
# make `f5-report --version` report `engine 0.1.0` forever.
tcl-version = { path = "../../tcl-version" }
tcl-bigip = { path = "../../tcl-bigip" }
tcl-bigip-io = { path = "../../tcl-bigip-io" }
tcl-bigip-query = { path = "../../tcl-bigip-query" }
# The Rust report generator — reused here only for its architecture/tier
# detection (`build_architecture`), so the Python report exposes the same
# cross-device tier model (and diagram) without reimplementing it.
bigip-report-gen-rust = { path = "../rust" }
# F5 master-key (`f5mku`) secret decryption, shared with the wasm report.
tcl-f5mku = { path = "../../tcl-f5mku" }
# The real Tcl tokeniser + HTML highlighter, for the iRule source view.
tcl-lexer = { path = "../../tcl-lexer", features = ["html"] }
# IR-based control-flow diagram & Mermaid serialiser for the iRule flowchart.
tcl-diagram = { path = "../../tcl-diagram" }
tcl-registry = { path = "../../tcl-registry" }
# The certificate projection serialises the parsed `sys file ssl-cert` field
# maps to JSON for the pure-Python report layer to consume.
serde_json = { version = "1", features = ["preserve_order"] }

# NOTE: no `[lints] workspace = true` — this crate must not inherit the
# workspace `unsafe_code = "forbid"` lint (PyO3's generated glue needs it).
