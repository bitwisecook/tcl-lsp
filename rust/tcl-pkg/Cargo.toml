[package]
name = "tcl-pkg"
publish.workspace = true
description = "The tclpkg package manager: manifest, MVS resolver, lockfile, CAS, fetchers, venv, docker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tcl-lexer = { path = "../tcl-lexer" }
tcl-syntax = { path = "../tcl-syntax" }
tcl-sandbox = { path = "../tcl-sandbox" }
tcl-userdirs = { path = "../tcl-userdirs" }
tcl-version = { path = "../tcl-version" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sha2 = "0.11"
base64 = "0.23"
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
ureq = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[lints]
workspace = true

[dev-dependencies]
tcl-registry = { path = "../tcl-registry" }
