[package]
name = "tcl-numeric"
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Release-selected Tcl numeric grammar, rendering, boolean and integer operations"

[features]
num-bigint = ["dep:num-bigint", "dep:num-integer", "dep:num-traits"]

[dependencies]
num-bigint = { version = "0.5", optional = true }
num-integer = { version = "0.1", optional = true }
num-traits = { version = "0.2", optional = true }
tcl-core-types = { path = "../tcl-core-types" }
tcl-dialect = { path = "../tcl-dialect" }

[lints]
workspace = true
