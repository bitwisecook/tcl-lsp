# Rust → WASM facade for the real LSP server.
#
# `tcl-lsp-server`'s `LspService<Backend>` is the whole protocol core and is
# transport-free; this crate is the browser transport for it, the way
# `main.rs` is the stdio one. It owns no LSP behaviour — every handler,
# every diagnostic, every provider is the same code the native binary runs.
#
# EXCLUDED from the Cargo workspace (see the root Cargo.toml `exclude` list)
# for the same reasons as `tcl-spec-studio-wasm` and `tcl-explorer-wasm`:
# wasm-bindgen's generated glue needs `unsafe`, which the workspace
# `unsafe_code = "forbid"` lint bans, and it targets wasm32 with its own
# lockfile. Built via `make lsp-server-wasm`; see build-wasm.sh.
#
# The empty `[workspace]` table below is load-bearing, not decorative: with
# no workspace table of its own, cargo walks *up* the directory tree looking
# for an ancestor manifest with `[workspace]` to attach to. That is normally
# harmless because this crate's path is on the root workspace's `exclude`
# list — except inside a git worktree checked out under the main checkout's
# directory (the standard layout for this repo's parallel agent worktrees):
# cargo keeps walking past the worktree root and finds the *main checkout's*
# top-level Cargo.toml, whose exclude paths do not match the worktree-relative
# path, and errors with "current package believes it's in a workspace when
# it's not" (issue #1136). An empty `[workspace]` table makes this manifest a
# workspace root in its own right, so the search never looks further up.
[workspace]

[package]
name = "tcl-lsp-server-wasm"
# This crate is `exclude`d from the root workspace, so it cannot inherit
# `publish` from `[workspace.package]` — `publish.workspace = true` makes
# `cargo metadata` fail with "failed to find a workspace root".
publish = false
description = "wasm32 build of the Tcl language server — the real LspService, driven over postMessage from a Web Worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
repository = "https://github.com/bitwisecook/tcl-lsp"
authors = ["tcl-lsp contributors"]

[lib]
crate-type = ["cdylib"]

[dependencies]
tcl-lsp-server = { path = "../tcl-lsp-server" }
tower-lsp-server = { version = "0.23", default-features = false, features = ["runtime-agnostic"] }
tower = { version = "0.5", features = ["util"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
serde = "1"
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
# Optimise for size — this ships to the browser.
opt-level = "s"
lto = true
codegen-units = 1

# Disable wasm-pack's built-in wasm-opt for this crate: on newer rustc layouts,
# binaryen mis-rebinds the `__wbindgen_externrefs` export from the growable
# externref table onto the fixed-size funcref table, which breaks `Table.grow`
# at runtime ("could not grow the table"). The raw wasm-bindgen output has the
# correct binding; we ship it unoptimised, as tcl-explorer-wasm does.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# NOTE: no `[lints] workspace = true` — must not inherit `unsafe_code = "forbid"`.
