[package]
name = "tcl-cli-support"
publish.workspace = true
description = "Shared CLI plumbing for the native tcl / f5 CLIs (input/output, dialect registries)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tcl-lexer = { path = "../tcl-lexer" }
tcl-registry = { path = "../tcl-registry" }
tcl-compiler = { path = "../tcl-compiler" }
tcl-lsp-core = { path = "../tcl-lsp-core" }
thiserror = "2"
anstream = "1"
anstyle = "1"
tabled = "0.21"
rpassword = "7"

[dev-dependencies]
# Scoped env-var mutation for the secret-input resolver tests (the workspace
# forbids `unsafe`, so `std::env::set_var` cannot be called directly).
temp-env = "0.3"

[lints]
workspace = true
