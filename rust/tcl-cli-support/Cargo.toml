[package]
name = "tcl-cli-support"
publish.workspace = true
description = "Shared CLI plumbing for the native tcl / f5 CLIs (input/output, dialect registries)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tcl-lexer = { path = "../tcl-lexer" }
tcl-dialect = { path = "../tcl-dialect" }
tcl-registry = { path = "../tcl-registry" }
tcl-compiler = { path = "../tcl-compiler" }
tcl-lsp-core = { path = "../tcl-lsp-core" }
# The EDA vendor libraries ship as bundled `.tclspec` loadables, so the CLI
# needs the pack loader to see them (`docs/design/spec-packs.md`).
tcl-spectcl = { path = "../tcl-spectcl" }
# `spec_import` derives version ranges with the studio's versioned importer and
# renders the result with its `.tclspec` renderer — the same code the Spec
# Studio runs, so the CLI and the MCP server cannot drift from the UI.
tcl-spec-studio = { path = "../tcl-spec-studio" }
# Archive snapshots are unpacked with the package manager's hardened
# extractor (zip-slip / symlink / bomb safe) rather than a second one here.
tcl-pkg = { path = "../tcl-pkg" }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anstream = "1"
anstyle = "1"
# `default-features = false` drops the `derive` feature (and its `tabled_derive`
# proc-macro, the sole pull of the unmaintained `proc-macro-error2`); the Builder
# API in `render_table` needs only `std`.
tabled = { version = "0.22", default-features = false, features = ["std"] }
rpassword = "7"

[dev-dependencies]
# Scoped env-var mutation for the secret-input resolver tests (the workspace
# forbids `unsafe`, so `std::env::set_var` cannot be called directly).
temp-env = "0.3"

[lints]
workspace = true
