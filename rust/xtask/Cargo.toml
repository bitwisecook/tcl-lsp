[package]
name = "xtask"
publish.workspace = true
description = "Build/check task runner for the workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
tcl-dialect = { path = "../tcl-dialect" }
tcl-test-support = { path = "../tcl-test-support" }
clap = { version = "4", features = ["derive", "wrap_help"] }
anyhow = "1"
regex = "1"
tcl-core-types = { path = "../tcl-core-types" }
tcl-registry = { path = "../tcl-registry" }
tcl-spectcl = { path = "../tcl-spectcl" }
tcl-syntax = { path = "../tcl-syntax" }
tcl-lexer = { path = "../tcl-lexer" }
tcl-compiler = { path = "../tcl-compiler" }
tcl-cli-support = { path = "../tcl-cli-support" }
tcl-lsp-core = { path = "../tcl-lsp-core" }
tcl-bigip-query = { path = "../tcl-bigip-query" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[lints]
workspace = true
