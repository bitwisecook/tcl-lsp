# The SpecTcl hook host: the layer above the Tcl extension interface that owns
# everything DSL-specific — emitter verbs, per-family calling conventions and
# preconditions, abstention and error policy, budgets, per-pack isolation, and
# quarantine. It speaks only `tcl-engine-api` beneath it, so it cannot depend
# on an engine's identity.
[package]
name = "tcl-spec-hooks"
publish.workspace = true
description = "The SpecTcl hook host — pack-declared hook bodies on a sandboxed engine, with crash containment and per-pack isolation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "tcl_spec_hooks"

[dependencies]
tcl-engine-api = { path = "../tcl-engine-api" }
tcl-engine-tclvm = { path = "../tcl-engine-tclvm" }
tcl-registry = { path = "../tcl-registry" }
tcl-dialect = { path = "../tcl-dialect" }
# `pack_eval` — the SpecTcl 2.0 pack-evaluation host — is deliberately
# engine-specific: re-entrant body evaluation from inside a registered
# command and per-command line tracking are `Vm` facilities the neutral
# interface does not carry, so that one module speaks to the VM directly.
tcl-vm = { path = "../tcl-vm" }

[dev-dependencies]
tcl-compiler = { path = "../tcl-compiler" }
# Deliberately no `tcl-spectcl`, even as a dev-dependency: the adapter that
# joins a loaded pack to this host now lives in `tcl-spectcl::hooks`, so the
# dependency runs one way — loader over host — and the pack-source proving case
# lives in that crate's tests.

[lints]
workspace = true
