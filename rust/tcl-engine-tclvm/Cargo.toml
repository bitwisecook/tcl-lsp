# The `tcl-vm` implementation of the Tcl extension interface
# (`tcl-engine-api`). Its own crate so that selecting this engine does not drag
# in another, and so the interface crate stays dependency-free. Links
# `tcl-compiler` for the `CompileService` the VM injects — the VM library
# itself stays compiler-optional.
[package]
name = "tcl-engine-tclvm"
publish.workspace = true
description = "The tcl-vm engine: the bytecode VM behind the Tcl extension interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "tcl_engine_tclvm"

[dependencies]
tcl-engine-api = { path = "../tcl-engine-api" }
tcl-vm = { path = "../tcl-vm" }
tcl-compiler = { path = "../tcl-compiler" }
tcl-registry = { path = "../tcl-registry" }

[lints]
workspace = true
