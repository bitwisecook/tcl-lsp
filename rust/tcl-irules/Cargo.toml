[package]
name = "tcl-irules"
publish.workspace = true
description = "The F5 iRules BIG-IP object-reference extractor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Request-level integration tests can assert that a consumer builds exactly one
# executable closure without carrying counters in production builds.
test-instrumentation = []

[dependencies]
tcl-core-types = { path = "../tcl-core-types" }
tcl-dialect = { path = "../tcl-dialect" }
tcl-lexer = { path = "../tcl-lexer" }
tcl-compiler = { path = "../tcl-compiler" }
tcl-registry = { path = "../tcl-registry" }
# The Tcl list grammar, for splitting a `switch`/`expect` clause list.
tcl-syntax = { path = "../tcl-syntax" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
