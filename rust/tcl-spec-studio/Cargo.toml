[package]
name = "tcl-spec-studio"
publish.workspace = true
description = "Command-registry spec studio — field schema, draft model, .rs / Tcl-stub renderers, and package signature inference behind the web UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tcl-dialect = { path = "../tcl-dialect" }
tcl-registry = { path = "../tcl-registry" }
tcl-spectcl = { path = "../tcl-spectcl" }
tcl-compiler = { path = "../tcl-compiler" }
tcl-lexer = { path = "../tcl-lexer" }
tcl-syntax = { path = "../tcl-syntax" }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
# `SetterConstraint::code` is a real `DiagCode`, so the coverage gate needs the
# type to build the witness constraint it seeds a draft from.
tcl-core-types = { path = "../tcl-core-types" }

[lints]
workspace = true
