[package]
name = "tcl-compiler-it"
publish.workspace = true
description = "tcl-compiler's tests that need crates above it (tcl-spectcl, tcl-engine-tclvm); no library code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]

[dev-dependencies]
tcl-compiler = { path = "../tcl-compiler", features = ["test-support"] }
# Seeds Jim's compiled-in core surface (`core_surfaces::ensure`) and loads
# `.tclspec` packs; it depends on `tcl-compiler`, so these tests live here
# rather than in `tcl-compiler`, where every edit would rebuild it.
tcl-spectcl = { path = "../tcl-spectcl", features = ["programmed-packs"] }
# Concrete closed-consumer test ingress.
tcl-engine-tclvm = { path = "../tcl-engine-tclvm" }
tcl-test-support = { path = "../tcl-test-support" }
tcl-bytecode = { path = "../tcl-bytecode" }
tcl-core-types = { path = "../tcl-core-types" }
tcl-dialect = { path = "../tcl-dialect" }
tcl-lexer = { path = "../tcl-lexer" }
tcl-registry = { path = "../tcl-registry" }

[lints]
workspace = true

# The value-transfer performance report: a plain `main` that prints
# its tables; `cargo test -p tcl-compiler-it --bench value_transfers` runs it
# at smoke sizes.
[[bench]]
name = "value_transfers"
harness = false
