user nginx;
include /etc/nginx/conf.d/*.conf;

http {
    ssl_protocols TLSv1 TLSv1.2;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256;
    add_header Strict-Transport-Security "max-age=300" always;
    future_http_option retained;

    server {
        listen 443 ssl http2;
        server_name example.test www.example.test;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers "ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305";
        ssl_ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
        ssl_certificate /etc/nginx/tls/example-chain.pem;
        ssl_certificate_key /etc/nginx/tls/example.key;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        quic_retry on;

        location / {
            proxy_pass http://backend;
            include /etc/nginx/snippets/proxy.conf;
        }
    }

    server {
        listen 8443 ssl;
        server_name inherited.example.test;
        ssl_certificate /etc/nginx/tls/inherited.pem;
        ssl_certificate_key /etc/nginx/tls/inherited.key;
    }
}
