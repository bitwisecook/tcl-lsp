[package]
name = "tcl-sslictcl"
publish.workspace = true
description = "SslicTcl: declarative offline TLS configuration, certificate, trust, and assessment model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tcl-compiler = { path = "../tcl-compiler" }
tcl-core-types = { path = "../tcl-core-types" }
tcl-lexer = { path = "../tcl-lexer" }
tcl-syntax = { path = "../tcl-syntax" }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.23"
sha2 = "0.11"
x509-parser = { version = "0.18", features = ["verify"] }
rsa = "0.10.0-rc.18"
p256 = "0.14"
p384 = "0.14"

# Entropy backends the transitive crypto crates need when the workspace's
# browser-facing WASM packages are checked. Keyed on the browser target alone:
# `js`/`wasm_js` route getrandom through `crypto.getRandomValues`, which exists
# only where there is a JS host. WASI has `random_get` and getrandom picks that
# backend by itself, so a `target_family = "wasm"` key here would force the
# browser backend onto a target that has no JS to call.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom-02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom-04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[lints]
workspace = true
