[package]
name = "tcl-lsp-db"
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
tcl-dialect = { path = "../tcl-dialect" }
# `default-features = false` drops salsa's `rayon` (its default `macros` +
# `rayon` + `salsa_unstable`-adjacent set): the parallel query machinery needs
# real threads, which wasm32-unknown-unknown does not have, and nothing in this
# crate uses it. `macros` supplies `#[salsa::db]`/`#[salsa::tracked]` and
# `inventory` the query registration this crate's `#[salsa::input]`s rely on —
# the minimal pair that both builds need.
salsa = { version = "0.28", default-features = false, features = ["macros", "inventory"] }
tcl-compiler = { path = "../tcl-compiler" }
tcl-lexer = { path = "../tcl-lexer" }
tcl-registry = { path = "../tcl-registry" }
tcl-lsp-core = { path = "../tcl-lsp-core" }

[dev-dependencies]
rayon = "1"
# `salsa_unstable` exposes `<dyn salsa::Database>::memory_usage()` — per-ingredient
# slot counts and memo sizes. Used by the `edit_memory` example to attribute
# per-edit growth to a specific interned key / tracked query (issue #1035).
salsa = { version = "0.28", features = ["salsa_unstable"] }
