[package]
name = "f5-cli"
description = "Native Rust port of the `f5-query` BIG-IP / iRules CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "f5-query"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
anyhow = "1"
tcl-cli-support = { path = "../tcl-cli-support" }
tcl-bigip = { path = "../tcl-bigip" }
tcl-bigip-io = { path = "../tcl-bigip-io" }
tcl-bigip-query = { path = "../tcl-bigip-query" }
tcl-lsp-core = { path = "../tcl-lsp-core" }
tcl-registry = { path = "../tcl-registry" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
# Remote verbs (`fetch` / `push` / `pull`): iControl REST over `ureq` + `rustls`,
# Basic-auth encoding, and UTC fetch timestamps. All pure-Rust / unsafe-free and
# already present in the workspace lockfile.
ureq = "3"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rpassword = "7"

[lints]
workspace = true
