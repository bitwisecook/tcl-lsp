[package]
name = "f5-cli"
publish.workspace = true
description = "The `f5-query` BIG-IP / iRules CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "f5-query"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
anyhow = "1"
tcl-cli-support = { path = "../tcl-cli-support" }
tcl-bigip = { path = "../tcl-bigip" }
tcl-bigip-io = { path = "../tcl-bigip-io" }
tcl-bigip-query = { path = "../tcl-bigip-query" }
tcl-irules = { path = "../tcl-irules" }
tcl-irule-test = { path = "../tcl-irule-test" }
tcl-lsp-core = { path = "../tcl-lsp-core" }
tcl-registry = { path = "../tcl-registry" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
indexmap = "2"
# Remote verbs (`fetch` / `push` / `pull`): iControl REST over `ureq` + `rustls`,
# Basic-auth encoding, and UTC fetch timestamps. All pure-Rust / unsafe-free and
# already present in the workspace lockfile.
ureq = "3"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rpassword = "7"
# SSH fetch transport: the pure-Rust `russh` client + `russh-sftp` subsystem,
# driven on a private current-thread Tokio runtime. Replaces shelling out to the
# system `ssh` / `scp` / `sshpass` binaries. `>= 0.60.3` carries the fix for
# RUSTSEC-2026-0153 / -0154.
russh = "0.62.1"
russh-sftp = "2"
tokio = { version = "1", features = ["rt", "net", "io-util", "time"] }
# `encrypt-secrets` / `decrypt-secrets`: F5 master-key (`f5mku`) AES-ECB crypto,
# now in the shared, wasm-friendly `tcl-f5mku` crate.
tcl-f5mku = { path = "../tcl-f5mku" }

[lints]
workspace = true
