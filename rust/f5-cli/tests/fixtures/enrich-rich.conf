ltm node /Common/web1 {
    address 10.0.1.10
}
ltm node /Common/web2 {
    address 10.0.1.11
}
ltm pool /Common/web_pool {
    members {
        /Common/web1:80 {
            address 10.0.1.10
        }
        /Common/web2:80 {
            address 10.0.1.11
        }
    }
}
ltm snatpool /Common/snat1 {
    members {
        10.0.2.50
        10.0.2.51
    }
}
ltm rule /Common/redir_rule {
    when HTTP_REQUEST {
        HTTP::redirect "https://example.com:8443/login"
        node 10.0.9.9 8081
    }
}
ltm virtual /Common/web_vs {
    destination /Common/10.0.0.5:443
    pool /Common/web_pool
    profiles {
        /Common/http { }
        /Common/clientssl {
            context clientside
        }
    }
    rules {
        /Common/redir_rule
    }
}
ltm virtual /Common/dns_vs {
    destination /Common/10.0.0.6:53
    profiles {
        /Common/udp { }
    }
}
ltm policy /Common/pol1 {
    rules {
        r1 {
            conditions {
                0 {
                    tcp
                    port
                    port-equals
                    values { 8443 }
                }
            }
        }
    }
}
ltm monitor http /Common/mon_http {
    destination *:8080
}
ltm monitor udp /Common/mon_udp {
    destination *:1812
}
net vlan /Common/external {
    tag 4094
}
net vlan /Common/internal {
    tag 100
}
net self /Common/external-self {
    address 10.0.0.250/24
    allow-service {
        tcp:443
        udp:161
    }
}
net self /Common/internal-self {
    address 10.0.1.250/24
}
net arp /Common/static-arp1 {
    ip-address 10.0.1.10%0
    mac-address 00:11:22:33:44:55
}
gtm server /Common/dc1 {
    addresses {
        10.0.0.5 { }
    }
    virtual-servers {
        vs1 {
            destination 10.0.0.5:443
        }
    }
}
gtm pool a /Common/gpool {
    members {
        /Common/dc1:vs1
    }
}
gtm wideip a /Common/www.example.com {
    pools {
        /Common/gpool
    }
}
