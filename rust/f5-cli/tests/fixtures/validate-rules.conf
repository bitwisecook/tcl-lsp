# Dedicated lint fixture: exercises orphan-monitor (warning + /Common/ info),
# virtual-without-pool, pool-without-monitor, irule-deprecated-command,
# irule-empty-when, and irule-unknown-event.

ltm monitor http /Common/factory_mon {
    interval 5
    timeout 16
}

ltm monitor http /Partition2/orphan_mon {
    interval 5
    timeout 16
}

ltm node /Common/n1 {
    address 10.0.0.10
}

ltm pool /Common/no_monitor_pool {
    members {
        /Common/n1:80 {
            address 10.0.0.10
        }
    }
}

ltm virtual /Common/vs_no_pool {
    destination /Common/10.0.0.1:443
}

ltm rule /Common/deprecated_rule {
    when HTTP_REQUEST {
        log_local0.info "hello"
        set x [X509::extensions [SSL::cert 0]]
    }
}

ltm rule /Common/empty_when_rule {
    when CLIENT_ACCEPTED {
    }
}

ltm rule /Common/unknown_event_rule {
    when TOTALLY_FAKE_EVENT {
        log local0. "x"
    }
}
