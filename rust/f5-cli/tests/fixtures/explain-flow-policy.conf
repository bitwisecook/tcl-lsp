ltm virtual /Common/vs_https {
    destination /Common/198.51.100.10:443
    ip-protocol tcp
    pool /Common/pool_web
    policies { /Common/pol_all { } /Common/pol_best { } /Common/pol_edge { } }
    profiles { /Common/http { } /Common/tcp { } }
}
ltm pool /Common/pool_web { members { /Common/192.0.2.20:80 { address 192.0.2.20 } } }
ltm pool /Common/pool_api { members { /Common/192.0.2.30:80 { address 192.0.2.30 } } }
ltm policy /Common/pol_all {
    strategy all-match
    rules {
        r_host {
            ordinal 1
            conditions { 0 { http-host
                equals
                values { vs.example.com } } }
            actions { 0 { http-header
                insert
                name X-Tier
                value gold } }
        }
        r_method {
            ordinal 2
            conditions { 0 { http-method
                equals
                values { POST } } }
            actions { 0 { http-reply
                redirect
                location http://x/ } }
        }
        r_ua {
            ordinal 3
            conditions { 0 { http-header
                name User-Agent
                contains
                case-insensitive
                values { CURL } } }
            actions { 0 { forward
                select
                pool /Common/pool_api } }
        }
    }
}
ltm policy /Common/pol_best {
    strategy best-match
    rules {
        b1 {
            ordinal 1
            conditions { 0 { http-uri
                path
                starts-with
                values { /lo } } }
            actions { 0 { tcp
                reset } }
        }
        b2 {
            ordinal 2
            conditions {
                0 { http-uri
                    path
                    starts-with
                    values { /login } }
                1 { ssl-extension
                    name server-name
                    ends-with
                    values { example.com } }
            }
            actions { 0 { http-uri
                replace
                path /new } }
        }
    }
}
ltm policy /Common/pol_edge {
    rules {
        e_neg {
            ordinal 1
            conditions { 0 { http-host
                negate
                equals
                values { other.com } } }
            actions { 0 { forward
                select
                pool /Common/pool_web } }
        }
        e_unsup {
            ordinal 2
            conditions { 0 { geoip
                name country-code
                equals
                values { US } } }
        }
        e_exists {
            ordinal 3
            conditions { 0 { http-header
                name X-Missing
                exists } }
        }
    }
}
