ltm virtual /Common/vs_https {
    destination /Common/198.51.100.10:443
    ip-protocol tcp
    pool /Common/pool_web
    profiles {
        /Common/clientssl { context clientside }
        /Common/http { }
        /Common/tcp { }
    }
    rules {
        /Common/rule_rich
    }
}
ltm pool /Common/pool_web {
    members {
        /Common/192.0.2.20:80 { address 192.0.2.20 }
    }
}
ltm rule /Common/rule_rich {
when CLIENT_ACCEPTED {
    log local0. "accepted [IP::client_addr]:[TCP::client_port] -> [IP::local_addr]:[TCP::local_port]"
}
when CLIENTSSL_CLIENTHELLO {
    set sni [SSL::extensions servername]
    log local0. "sni=[SNI]"
}
when HTTP_REQUEST {
    if { [HTTP::host] equals "old.example.com" } {
        HTTP::redirect "https://new.example.com[HTTP::uri]"
    }
    set ua [HTTP::header User-Agent]
    log local0. "method=[HTTP::method] path=[HTTP::path] q=[HTTP::query] v=[HTTP::version]"
}
when LB_SELECTED {
    log local0. "picked [LB::server]"
}
when HTTP_RESPONSE {
    HTTP::header insert X-Served-By tmm
}
when MY_CUSTOM_EVENT {
    log local0. "custom"
}
when CLIENT_CLOSED {
    log local0. "closed"
}
}
