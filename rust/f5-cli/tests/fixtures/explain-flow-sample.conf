ltm virtual /Common/vs_https {
    destination /Common/198.51.100.10:443
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/pool_web
    profiles {
        /Common/clientssl { context clientside }
        /Common/http { }
        /Common/tcp { }
    }
    rules {
        /Common/rule_redirect
    }
    source 0.0.0.0/0
    translate-address enabled
    translate-port enabled
}
ltm pool /Common/pool_web {
    members {
        /Common/192.0.2.20:80 {
            address 192.0.2.20
        }
    }
    monitor /Common/http
}
ltm rule /Common/rule_redirect {
when HTTP_REQUEST {
    if { [HTTP::host] equals "old.example.com" } {
        HTTP::redirect "https://new.example.com[HTTP::uri]"
    }
}
}
