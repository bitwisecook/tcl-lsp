ltm node /Common/n1 {
    address 10.0.0.1
}
ltm node /Common/n3 {
    address 10.0.0.3
}
ltm pool /Common/p1 {
    load-balancing-mode least-connections-member
    members {
        /Common/n1:80 {
            address 10.0.0.1
        }
        /Common/n3:80 {
            address 10.0.0.3
        }
    }
}
ltm virtual /Common/v1 {
    destination /Common/10.0.0.1:80
    pool /Common/p1
}
ltm virtual /Common/v2 {
    destination /Common/10.0.0.2:80
    pool /Common/p1
}
