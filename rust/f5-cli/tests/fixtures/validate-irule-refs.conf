# Exercises additional irule-missing-<kind> buckets (profile, persistence,
# node, rule) plus a resolvable reference that must NOT fire. The presence of
# real config objects satisfies `_has_config_context`.

ltm pool /Common/real_pool {
    members {
        /Common/n1:80 {
            address 10.0.0.10
        }
    }
    monitor /Common/real_mon
}

ltm node /Common/n1 {
    address 10.0.0.10
}

ltm monitor http /Common/real_mon {
    interval 5
    timeout 16
}

ltm rule /Common/ref_rule {
    when HTTP_REQUEST {
        pool /Common/real_pool
        pool /Common/ghost_pool
        node /Common/ghost_node 80
        virtual /Common/ghost_vs
        persist uie /Common/ghost_persist
    }
}
