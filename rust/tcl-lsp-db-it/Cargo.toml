[package]
name = "tcl-lsp-db-it"
publish.workspace = true
description = "tcl-lsp-db's tests that need crates above it (tcl-spectcl, tcl-vm); no library code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]

[dev-dependencies]
tcl-lsp-db = { path = "../tcl-lsp-db" }
# Loads workspace packs from SpecTcl text, installs their overlays and
# publishes their hook plans as the server does; it sits beside
# `tcl-lsp-db`, so these tests live here rather than in `tcl-lsp-db`, where
# every SpecTcl or VM edit would rebuild them.
tcl-spectcl = { path = "../tcl-spectcl", features = ["programmed-packs"] }
# A real VM hands the function-lattice test its native compilation entry.
tcl-vm = { path = "../tcl-vm" }
tcl-runtime-api = { path = "../tcl-runtime-api" }
tcl-bytecode = { path = "../tcl-bytecode" }
tcl-compiler = { path = "../tcl-compiler" }
tcl-dialect = { path = "../tcl-dialect" }
tcl-lexer = { path = "../tcl-lexer" }
tcl-lsp-core = { path = "../tcl-lsp-core" }
tcl-registry = { path = "../tcl-registry" }
tcl-native-model = { path = "../tcl-native-model" }
salsa = { version = "0.28.5", default-features = false, features = ["macros", "inventory"] }

[lints]
workspace = true
