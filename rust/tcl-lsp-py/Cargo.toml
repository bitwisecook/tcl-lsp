[package]
name = "tcl-lsp-py"
description = "Public PyO3 bindings exposing the tcl-lsp Rust crates to Python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# cdylib → Python loads the wheel as a native extension module.
# rlib   → the transitional `tcl-lsp-rust` crate links against this
#          to re-expose the same symbols under the legacy module name.
crate-type = ["cdylib", "rlib"]

[dependencies]
tcl-lexer = { path = "../tcl-lexer" }
tcl-registry = { path = "../tcl-registry" }
tcl-compiler = { path = "../tcl-compiler" }
tcl-lsp-core = { path = "../tcl-lsp-core" }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }

[lints]
workspace = true
