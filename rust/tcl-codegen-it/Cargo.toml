[package]
name = "tcl-codegen-it"
publish.workspace = true
description = "tcl-codegen's tests that read the command registry; no library code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]

[dev-dependencies]
tcl-codegen = { path = "../tcl-codegen" }
# Installs the shipped command surfaces before the first registry read.
tcl-registry = { path = "../tcl-registry" }
tcl-bytecode = { path = "../tcl-bytecode" }
tcl-compiler = { path = "../tcl-compiler", features = ["test-support"] }
tcl-core-types = { path = "../tcl-core-types" }
tcl-dialect = { path = "../tcl-dialect" }
tcl-lexer = { path = "../tcl-lexer" }
tcl-names = { path = "../tcl-names" }
tcl-native-model = { path = "../tcl-native-model" }
tcl-runtime-api = { path = "../tcl-runtime-api" }
tcl-source = { path = "../tcl-source" }
tcl-syntax = { path = "../tcl-syntax", features = ["num-bigint"] }
tcl-test-support = { path = "../tcl-test-support" }
tcl-vm = { path = "../tcl-vm" }
temp-env = "0.3"

[lints]
workspace = true
