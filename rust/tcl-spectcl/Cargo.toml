[package]
name = "tcl-spectcl"
publish.workspace = true
description = "SpecTcl runtime pack support — the .tclspec loader, pack discovery, the compiled-pack cache, and registry insertion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tcl-source = { path = "../tcl-source" }
tcl-core-types = { path = "../tcl-core-types" }
tcl-dialect = { path = "../tcl-dialect" }
tcl-registry = { path = "../tcl-registry" }
tcl-native-model = { path = "../tcl-native-model" }
tcl-spec-hooks = { path = "../tcl-spec-hooks", optional = true }
# `tcl_lsp_core::vfs::SourceStore` only: pack discovery and pack reading run
# over the same closed-file seam the LSP server's workspace scan and package
# database do, so a browser host that has the `.tclspec` bytes but no
# filesystem loads packs from them. That crate is the lowest one that can hold
# the trait and both its implementations undivided — see `tcl_lsp_core::vfs`,
# "Why the trait lives here".
tcl-lsp-core = { path = "../tcl-lsp-core" }
tcl-compiler = { path = "../tcl-compiler" }
tcl-lexer = { path = "../tcl-lexer" }
tcl-syntax = { path = "../tcl-syntax" }
tcl-userdirs = { path = "../tcl-userdirs" }
# `PackFactStamp` only: the facts an embedder's VM holds for a pack set
# (`PackSet::fact_stamps`), in the runtime's own vocabulary.
tcl-runtime-api = { path = "../tcl-runtime-api" }
# The manifest and lockfile model only, to read a package's place in the
# dependency graph beside its packs (`discovery::PackFile::dependency_tier`).
# Not `tcl-pkg`: that crate carries the network client, the archive readers
# and the process sandbox, and none of them builds for the browser hosts that
# load packs.
tcl-pkg-model = { path = "../tcl-pkg-model" }
rustc-hash = { workspace = true }
xxhash-rust = { workspace = true }

[features]
# Packs that are programs: a pack the static reader cannot capture is run in
# the VM, and declared hook bodies get registry slots and a host. Without it a
# programmed pack fails its load naming this feature, and every hook body
# abstains as a dormant one does. The entry points that load programmed packs
# enable it (the server, the CLI, MCP, Spec Studio and `xtask`); a crate that
# only reads pack data, such as the explorer, does not, so it links no VM.
programmed-packs = ["dep:tcl-spec-hooks"]

# The corpus-validation harness (`tests/spec_corpus.rs`) drives the hook host
# with the shipped engine behind a counting/panic-injecting wrapper, so it
# needs the engine interface and the tclvm implementation directly. Neither is
# a library dependency: `hooks.rs` reaches the engine only through
# `tcl_spec_hooks::tclvm_host`, and that stays the one place naming an engine.
[dev-dependencies]
tcl-sslictcl = { path = "../tcl-sslictcl" }
# This crate's own tests run with `programmed-packs` on.
tcl-spectcl = { path = ".", features = ["programmed-packs"] }
tcl-codegen = { path = "../tcl-codegen" }
tcl-engine-api = { path = "../tcl-engine-api" }
tcl-engine-tclvm = { path = "../tcl-engine-tclvm" }
tcl-test-support = { path = "../tcl-test-support" }
# `tests/codegen_stamps.rs` compiles against a pack-installed registry and
# runs the module on the VM, so the identity a stamp records is checked by
# the VM's own admission rather than asserted about it.
tcl-vm = { path = "../tcl-vm", features = ["test-support"] }

[lints]
workspace = true
