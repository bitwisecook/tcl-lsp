[package]
name = "tcl-spectcl"
publish.workspace = true
description = "SpecTcl runtime pack support — the .tclspec loader, pack discovery, the compiled-pack cache, and registry insertion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tcl-core-types = { path = "../tcl-core-types" }
tcl-dialect = { path = "../tcl-dialect" }
tcl-registry = { path = "../tcl-registry" }
tcl-spec-hooks = { path = "../tcl-spec-hooks" }
tcl-compiler = { path = "../tcl-compiler" }
tcl-lexer = { path = "../tcl-lexer" }
tcl-syntax = { path = "../tcl-syntax" }
tcl-userdirs = { path = "../tcl-userdirs" }
rustc-hash = { workspace = true }
xxhash-rust = { workspace = true }

[lints]
workspace = true
