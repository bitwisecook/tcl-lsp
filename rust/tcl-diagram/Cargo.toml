[package]
name = "tcl-diagram"
publish.workspace = true
description = "iRule (Tcl) structural analysis for reports/CLI/MCP: control-flow diagram extraction ({events, procedures}) with a deterministic Mermaid serialiser, and dynamic object-attachment (pool/node/snatpool) name-pattern reconstruction. Independent of the LSP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tcl-compiler = { path = "../tcl-compiler" }
tcl-lexer = { path = "../tcl-lexer" }
tcl-registry = { path = "../tcl-registry" }
tcl-syntax = { path = "../tcl-syntax" }
serde_json = "1"

[lints]
workspace = true
