[package]
name = "tcl-spec-hooks-it"
publish.workspace = true
description = "tcl-spec-hooks' tests that read the command registry; no library code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]

[dev-dependencies]
tcl-spec-hooks = { path = "../tcl-spec-hooks" }
# Installs the shipped command surfaces before the first registry read.
tcl-registry = { path = "../tcl-registry" }
tcl-compiler = { path = "../tcl-compiler" }
tcl-engine-api = { path = "../tcl-engine-api" }
tcl-engine-tclvm = { path = "../tcl-engine-tclvm" }
tcl-dialect = { path = "../tcl-dialect" }
tcl-native-model = { path = "../tcl-native-model" }
# The runtime as a second engine (its `engine` feature): every family's test
# runs on it as on the VM, so a body answers the same on both.
tcl-runtime = { path = "../../runtime/rust", features = ["engine"] }
# Deliberately no `tcl-spectcl`: the adapter that joins a loaded pack to the
# hook host lives in `tcl-spectcl::hooks`, and the pack-source proving case
# lives in that crate's tests.

[lints]
workspace = true
