# WebAssembly build of the BIG-IP query engine.
#
# Compiles `tcl-bigip-query` (the `f5-query` DSL) to wasm32 so the report's
# in-page query console can run real queries against the embedded configs —
# entirely client-side, no server. The network-probe builtins are compiled out
# (`default-features = false`, i.e. no `probes` feature), so there is no socket
# / TLS / x509 dependency to break the wasm build.
#
# EXCLUDED from the Cargo workspace (see the root Cargo.toml `exclude` list) for
# the same reasons as `editors/zed` and `rust/bigip-report-gen/python`: wasm-bindgen's
# generated glue trips the workspace `unsafe_code = "forbid"` lint. Built with
# `cargo build --target wasm32-unknown-unknown` + `wasm-bindgen` (see the
# Makefile target / build script), not plain `cargo`.

[package]
name = "bigip-query-wasm"
description = "wasm32 build of the F5 BIG-IP query engine for the in-browser query console"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-or-later"
repository = "https://github.com/bitwisecook/tcl-lsp"
authors = ["tcl-lsp contributors"]
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# No `probes` feature → no ureq / rustls / dns-lookup / x509 in the wasm binary.
tcl-bigip-query = { path = "../tcl-bigip-query", default-features = false }
# Reports the release version resolved from the git tag. The workspace manifest
# carries 0.1.0 and is never bumped (releases are tag-only), so CARGO_PKG_VERSION
# would make the console's status line claim 0.1.0 forever.
tcl-version = { path = "../tcl-version" }
tcl-bigip = { path = "../tcl-bigip" }
# Tcl formatter + highlighter + iRules command registry for the report's iRule
# Format button — runs the same formatter as the LSP / `tcl` CLI, client-side.
tcl-lsp-core = { path = "../tcl-lsp-core" }
tcl-lexer = { path = "../tcl-lexer", features = ["html"] }
tcl-registry = { path = "../tcl-registry" }
# Analyser (diagnostics + optimiser suggestions) for the report's inline
# iRule diagnostics toggle.
tcl-compiler = { path = "../tcl-compiler" }
tcl-core-types = { path = "../tcl-core-types" }
wasm-bindgen = "=0.2.126"
serde_json = { version = "1", features = ["preserve_order"] }
# Pull chrono's `wasmbind` in via feature unification so the DSL's time builtins
# (`now`, `strftime`, …) have a working clock on wasm32.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }

[profile.release]
opt-level = "s"
lto = true

# NOTE: no `[lints] workspace = true` — must not inherit `unsafe_code = "forbid"`.
