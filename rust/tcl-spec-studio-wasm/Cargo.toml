# Rust → WASM facade for the command-registry spec studio.
#
# EXCLUDED from the Cargo workspace (see the root Cargo.toml `exclude` list)
# for the same reasons as `tcl-explorer-wasm` and `bigip-report-wasm`:
# wasm-bindgen's generated glue needs `unsafe`, which the workspace
# `unsafe_code = "forbid"` lint bans, and it targets wasm32 with its own
# lockfile. Built via `make spec-studio-wasm`; see build-wasm.sh.
#
# The empty `[workspace]` table below is load-bearing, not decorative: with
# no workspace table of its own, cargo walks *up* the directory tree looking
# for an ancestor manifest with `[workspace]` to attach to. That is normally
# harmless because this crate's path is on the root workspace's `exclude`
# list — except inside a git worktree checked out under the main checkout's
# directory (e.g. `<main>/.claude/worktrees/<name>/rust/tcl-spec-studio-wasm`,
# the standard layout for this repo's parallel agent worktrees): cargo keeps
# walking past the worktree root and finds the *main checkout's* top-level
# Cargo.toml. The exclude match is a path comparison relative to that
# manifest's own directory, so the worktree-relative path
# (`.claude/worktrees/<name>/rust/tcl-spec-studio-wasm`) does not match the
# listed `rust/tcl-spec-studio-wasm`, and cargo errors with "current package
# believes it's in a workspace when it's not" — `make check-rust` then fails
# in every worktree, before and after any code change (issue #1136). An
# empty `[workspace]` table makes this manifest a workspace root in its own
# right, so the search never looks further up, in the main checkout or in
# any worktree.
[workspace]

[package]
name = "tcl-spec-studio-wasm"
# This crate is `exclude`d from the root workspace, so it cannot inherit
# `publish` from `[workspace.package]` — `publish.workspace = true` makes
# `cargo metadata` fail with "failed to find a workspace root".
publish = false
description = "wasm32 build of the command-registry spec studio — browse, edit, and render CommandSpec entirely in-browser"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
repository = "https://github.com/bitwisecook/tcl-lsp"
authors = ["tcl-lsp contributors"]

[lib]
crate-type = ["cdylib"]

[dependencies]
tcl-spec-studio = { path = "../tcl-spec-studio" }
# For the Pack DSL editor's client-side highlight/hover (`dsl_highlight.rs`):
# the real Tcl lexer, so the `.tclspec` overlay editor tokenises with the same
# lexer the rest of the toolchain does rather than a hand-rolled scanner.
tcl-lexer = { path = "../tcl-lexer" }
serde_json = { version = "1", features = ["preserve_order"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[profile.release]
# Optimise for size — this ships to the browser.
opt-level = "s"
lto = true
codegen-units = 1

# Disable wasm-pack's built-in wasm-opt for this crate: on newer rustc layouts,
# binaryen mis-rebinds the `__wbindgen_externrefs` export from the growable
# externref table onto the fixed-size funcref table, which breaks `Table.grow`
# at runtime ("could not grow the table"). The raw wasm-bindgen output has the
# correct binding; we ship it unoptimised, as tcl-explorer-wasm does.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# NOTE: no `[lints] workspace = true` — must not inherit `unsafe_code = "forbid"`.
