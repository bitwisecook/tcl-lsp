[package]
name = "xtask-backing"
publish.workspace = true
description = "The command-backing gate: asks both engines what they register"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "xtask-backing"
path = "src/main.rs"

# A package of its own so that `xtask`, which every other gate builds, links
# no engine of its own (plan item 298): only this gate needs the runtimes.
[dependencies]
tcl-dialect = { path = "../tcl-dialect" }
tcl-host-native = { path = "../tcl-host-native" }
tcl-registry = { path = "../tcl-registry" }
tcl-runtime-api = { path = "../tcl-runtime-api" }
tcl-syntax = { path = "../tcl-syntax" }
tcl-vm = { path = "../tcl-vm" }
# The standalone WASM runtime, which the gate asks what it registers. It is
# excluded from the workspace (it needs `unsafe`), so it is reached by path;
# its `wasm_stdlib` feature embeds the Tcl library whose commands it reports
# as defined by that library.
tcl-runtime = { path = "../../runtime/rust", features = ["wasm_stdlib"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
anyhow = "1"
regex = "1"

[lints]
workspace = true
