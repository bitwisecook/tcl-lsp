net vlan /Common/internal {
    tag 20
}
ltm monitor http /Common/http_mon {
    defaults-from http
}
ltm monitor https /Common/https_mon {
    defaults-from https
}
ltm rule /Common/redirect_rule {
    when HTTP_REQUEST {
        HTTP::redirect "https://example.com"
    }
}
ltm policy /Common/web_policy {
    controls { forwarding }
    requires { http }
}
ltm profile http /Common/custom_http {
    insert-xforwarded-for enabled
}
ltm persistence cookie /Common/cookie_persist {
    cookie-name BIGIP
}
sys file ssl-cert /Common/web.crt {
    source-path /config/ssl/ssl.crt/web.crt
}
sys file ssl-key /Common/web.key {
    source-path /config/ssl/ssl.key/web.key
}
ltm profile client-ssl /Common/web_clientssl {
    cert-key-chain {
        webchain {
            cert /Common/web.crt
            key /Common/web.key
        }
    }
}
ltm snatpool /Common/snat_pool1 {
    members {
        /Common/10.0.0.9
    }
}
security firewall address-list /Common/web_servers {
    addresses {
        10.0.0.0/24 { }
    }
}
security firewall port-list /Common/web_ports {
    ports {
        443 { }
    }
}
security firewall rule-list /Common/web_rules {
    rules {
        allow_https {
            action accept
            ip-protocol tcp
            destination {
                address-lists { /Common/web_servers }
                port-lists { /Common/web_ports }
            }
        }
    }
}
ltm pool /Common/app_pool {
    monitor min 1 of { /Common/http_mon /Common/https_mon }
    members {
        /Common/10.0.0.5:80 { address 10.0.0.5 }
    }
}
ltm virtual /Common/app_vs {
    destination /Common/10.0.0.200:80
    pool /Common/app_pool
    source-address-translation {
        type snat
        pool /Common/snat_pool1
    }
    profiles {
        /Common/custom_http { }
        /Common/web_clientssl { }
    }
    persist {
        /Common/cookie_persist { default yes }
    }
    rules {
        /Common/redirect_rule
    }
    policies {
        /Common/web_policy
    }
    vlans {
        /Common/internal
    }
}
