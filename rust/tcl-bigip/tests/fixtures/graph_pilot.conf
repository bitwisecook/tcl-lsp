net vlan /Common/internal {
    tag 20
}
ltm rule /Common/redirect_rule {
    when HTTP_REQUEST {
        HTTP::redirect "https://example.com"
    }
}
ltm policy /Common/web_policy {
    controls { forwarding }
    requires { http }
}
ltm pool /Common/app_pool {
    members {
        /Common/10.0.0.5:80 { address 10.0.0.5 }
    }
}
ltm virtual /Common/app_vs {
    destination /Common/10.0.0.200:80
    pool /Common/app_pool
    rules {
        /Common/redirect_rule
    }
    policies {
        /Common/web_policy
    }
    vlans {
        /Common/internal
    }
}
