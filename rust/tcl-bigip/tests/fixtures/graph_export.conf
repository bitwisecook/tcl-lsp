ltm node /Common/web1 {
    address 10.0.0.1
}
ltm node /Common/web2 {
    address 10.0.0.2
}
ltm monitor http /Common/http_mon {
    defaults-from http
}
ltm pool /Common/web_pool {
    monitor /Common/http_mon
    members {
        /Common/web1:80 { address 10.0.0.1 }
        /Common/web2:80 { address 10.0.0.2 }
    }
}
ltm virtual /Common/web_vs {
    pool /Common/web_pool
}
