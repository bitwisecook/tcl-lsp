[package]
name = "tcl-bigip"
publish.workspace = true
description = "The F5 BIG-IP object model and config parser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tcl-dialect = { path = "../tcl-dialect" }
tcl-lexer = { path = "../tcl-lexer" }
tcl-registry = { path = "../tcl-registry" }
tcl-irules = { path = "../tcl-irules" }
tcl-core-types = { path = "../tcl-core-types" }
tcl-syntax = { path = "../tcl-syntax" }
tcl-sslictcl = { path = "../tcl-sslictcl" }
serde = { workspace = true }
serde_json = "1"
regex = "1"
ipnet = "2"
sha2 = "0.11"
indexmap = "2"
thiserror = "2"

[lints]
workspace = true
