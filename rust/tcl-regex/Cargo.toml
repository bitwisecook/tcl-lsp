# Pure-Rust Tcl ARE and Jim integer-program regular-expression engines.
# Original-object command plumbing lives in tcl-cmd-core; the optional cmd-core
# feature supplies engine adapters. Native character decoding and case rules
# come from tcl-syntax's independently selected physical string owners.
[package]
name = "tcl-regex"
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Pure-Rust Tcl ARE and Jim integer-program regular-expression engines"

[dependencies]
tcl-cmd-core = { path = "../tcl-cmd-core", optional = true }
tcl-core-types = { path = "../tcl-core-types" }
tcl-syntax = { path = "../tcl-syntax" }

[features]
# Implement `tcl_cmd_core::regex::RegexEngine` so the shared command plumbing
# can drive these engines. Off by default to omit command plumbing.
cmd-core = ["dep:tcl-cmd-core"]

[lints]
workspace = true
