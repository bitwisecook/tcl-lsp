# Pure-Rust implementation of Tcl 9's Henry-Spencer Advanced Regular Expression (ARE)
# engine — the *same* engine `tclsh` uses, following the C sources in Tcl's
# upstream `generic/` tree (regcomp.c / regc_*.c / regexec.c /
# rege_dfa.c) into safe Rust.
#
# The C engine is pointer-heavy (intrusive NFA arc/state linked lists, a union
# colormap tree, a subre child-pointer tree). The workspace forbids `unsafe`,
# so this port uses an arena/index model (`Vec` + integer handles) in place of
# raw pointers, preserving the exact observable behaviour: match positions,
# submatch participation, `re_info` bits, `nsub`, and `REG_*` compile errors.
#
# It is engine-only — no command plumbing. The `regexp`/`regsub`/`lsearch
# -regexp`/`switch -regexp` option handling lives once in `tcl-cmd-core::regex`
# over the `RegexEngine` trait; this crate supplies an ARE provider via
# the optional `cmd-core` feature, replacing both the C FFI (`runtime/rust`) and
# the approximate `regex`-crate path (the bytecode VM).
[package]
name = "tcl-regex"
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Pure-Rust implementation of Tcl 9's Henry-Spencer Advanced Regular Expression (ARE) engine"

[dependencies]
tcl-cmd-core = { path = "../tcl-cmd-core", optional = true }
tcl-core-types = { path = "../tcl-core-types" }

[features]
# Implement `tcl_cmd_core::regex::RegexEngine` so the shared command plumbing
# can drive this engine. Off by default to keep the engine dependency-free.
cmd-core = ["dep:tcl-cmd-core"]

[lints]
workspace = true
