# The Tcl extension interface: the layer that plays, for our engines, the role
# Tcl's C API plays for C Tcl — in modern idiomatic Rust, with owned structured
# values and no interp pointers. Deliberately dependency-free: an engine
# implements it (`tcl-engine-tclvm`), a host consumes it (`tcl-spec-hooks`),
# and selecting one engine must never require another to be present.
[package]
name = "tcl-engine-api"
publish.workspace = true
description = "The Tcl extension interface — compile-unit / handle / structured-value contract every execution engine implements"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "tcl_engine_api"

[dependencies]

[lints]
workspace = true
