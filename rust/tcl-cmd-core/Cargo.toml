# Portable Tcl command logic — written once, run by every Rust runtime.
#
# The home for the *what a command computes* half of the split: pure value→value
# bodies (string/list/dict/format/scan/math/regexp) generic over
# `tcl_syntax::value::ValueOps`, plus the platform-command bodies (file/exec/…)
# that call through the `tcl-platform` capability traits, plus the *stateful*
# command cores (e.g. `info`) generic over `ValueOps` + a Family-B storage /
# introspection role trait (`tcl-runtime-api`). These export **logic helpers
# returning `Result<V, CmdError>`** — never a runtime `Completion` and never a
# concrete interp — so the two runtimes (with their opposite command ABIs) each
# wrap them in a thin adapter. See
# `docs/design/common-runtime-emitter-architecture.md` (§ central pattern).
#
# Depends on `tcl-syntax` (ValueOps + the parse grammars), `tcl-platform`
# (capability traits), and the **light** `tcl-runtime-api` (role traits over
# `tcl-core-types` only — no bytecode artifact). It never depends on
# `tcl-bytecode` or a concrete runtime.
[package]
name = "tcl-cmd-core"
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Portable Tcl command logic (string/list/dict/… + platform helpers) generic over ValueOps"

[dependencies]
tcl-syntax = { path = "../tcl-syntax" }
tcl-dialect = { path = "../tcl-dialect" }
tcl-platform = { path = "../tcl-platform" }
tcl-runtime-api = { path = "../tcl-runtime-api" }

[lints]
workspace = true
