[package]
name = "tcl-mcp"
publish.workspace = true
description = "Native Rust MCP server exposing the tcl-lsp analysis engine over stdio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "tcl-mcp"
path = "src/main.rs"

[dependencies]
tcl-dialect = { path = "../tcl-dialect" }
tcl-version = { path = "../tcl-version" }
tcl-diagram = { path = "../tcl-diagram" }
tcl-lsp-core = { path = "../tcl-lsp-core" }
tcl-compiler = { path = "../tcl-compiler" }
tcl-registry = { path = "../tcl-registry" }
tcl-lexer = { path = "../tcl-lexer" }
tcl-syntax = { path = "../tcl-syntax" }
tcl-bigip = { path = "../tcl-bigip" }
tcl-cli = { path = "../tcl-cli" }
f5-xc = { path = "../f5-xc" }
f5-cli = { path = "../f5-cli" }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
rmcp = { version = "2", features = ["server", "transport-io"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "io-std"] }

[lints]
workspace = true
