[package]
name = "tcl-mcp"
publish.workspace = true
description = "Native Rust MCP server exposing the tcl-lsp analysis engine over stdio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "tcl-mcp"
path = "src/main.rs"

[dependencies]
tcl-dialect = { path = "../tcl-dialect" }
tcl-version = { path = "../tcl-version" }
tcl-diagram = { path = "../tcl-diagram" }
tcl-lsp-core = { path = "../tcl-lsp-core" }
tcl-compiler = { path = "../tcl-compiler" }
tcl-registry = { path = "../tcl-registry" }
tcl-spectcl = { path = "../tcl-spectcl" }
tcl-spec-studio = { path = "../tcl-spec-studio" }
tcl-lexer = { path = "../tcl-lexer" }
tcl-syntax = { path = "../tcl-syntax" }
tcl-bigip = { path = "../tcl-bigip" }
tcl-irules = { path = "../tcl-irules" }
tcl-cli = { path = "../tcl-cli" }
# `spec_import` runs the same local-snapshot pipeline `tcl spec import` does.
# It is in the support crate, not in `tcl-cli`, precisely so this binary gains
# the derivation without gaining the CLI's GitHub fetcher.
tcl-cli-support = { path = "../tcl-cli-support" }
f5-xc = { path = "../f5-xc" }
f5-cli = { path = "../f5-cli" }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
rmcp = { version = "3", features = ["server", "transport-io"] }
# Async runtime for the MCP stdio transport. Floor is the plain `1` the rest of
# the workspace uses (tcl-lsp-server, f5-cli) — no API or advisory here needs a
# tighter requirement, and the lockfile carries the exact version.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
# Enables the request-local closure counter only while this crate's unit tests
# are linked; normal `tcl-mcp` builds carry no instrumentation.
tcl-irules = { path = "../tcl-irules", features = ["test-instrumentation"] }

[lints]
workspace = true
