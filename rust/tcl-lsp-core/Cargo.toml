[package]
name = "tcl-lsp-core"
publish.workspace = true
description = "Pure Rust LSP feature providers for tcl-lsp (folding, symbols, diagnostics projection)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tcl-core-types = { path = "../tcl-core-types" }
tcl-dialect = { path = "../tcl-dialect" }
tcl-lexer = { path = "../tcl-lexer" }
tcl-syntax = { path = "../tcl-syntax" }
tcl-cmd-core = { path = "../tcl-cmd-core" }
tcl-registry = { path = "../tcl-registry" }
tcl-compiler = { path = "../tcl-compiler" }
tcl-irules = { path = "../tcl-irules" }
# APL (iApp presentation) lexer, for the bespoke `tcl-apl` token path.
tcl-bigip = { path = "../tcl-bigip" }
regex = "1"
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = "1"

[dev-dependencies]
# The runtime ARE engine, used as an oracle in the semantic-token regex tests:
# every pattern the tokenizer sub-tokenises is confirmed to be valid ARE by the
# same engine Tcl uses at runtime, tying the two to one source of truth.
tcl-regex = { path = "../tcl-regex" }

[lints]
workspace = true
