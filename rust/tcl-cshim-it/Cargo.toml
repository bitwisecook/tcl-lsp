[package]
name = "tcl-cshim-it"
publish.workspace = true
description = "tcl-cshim's tests that read the command registry; no library code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[dependencies]

[dev-dependencies]
tcl-cshim = { path = "../tcl-cshim" }
tcl-core-types = { path = "../tcl-core-types" }
tcl-dialect = { path = "../tcl-dialect" }
tcl-engine-api = { path = "../tcl-engine-api" }
tcl-engine-tclvm = { path = "../tcl-engine-tclvm" }
tcl-native-model = { path = "../tcl-native-model" }
# Installs the shipped command surfaces before the first registry read.
tcl-registry = { path = "../tcl-registry" }
tcl-spec-hooks = { path = "../tcl-spec-hooks" }
tcl-syntax = { path = "../tcl-syntax" }
tcl-vm = { path = "../tcl-vm" }

# NOTE: no `[lints] workspace = true` — its tests declare and
# define C ABI functions, as `tcl-cshim` itself does, so it cannot inherit
# `unsafe_code = "forbid"`. The remaining workspace lint settings are
# replicated verbatim so the crate is held to the same clippy bar.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)", "cfg(tokio_taskdump)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
