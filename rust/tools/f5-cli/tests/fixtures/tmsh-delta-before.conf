ltm node /Common/n1 {
    address 10.0.0.1
}
ltm node /Common/n2 {
    address 10.0.0.2
}
ltm pool /Common/p1 {
    load-balancing-mode round-robin
    members {
        /Common/n1:80 {
            address 10.0.0.1
        }
        /Common/n2:80 {
            address 10.0.0.2
        }
    }
}
ltm pool /Common/p_gone {
    load-balancing-mode round-robin
}
ltm virtual /Common/v1 {
    destination /Common/10.0.0.1:80
    pool /Common/p1
}
