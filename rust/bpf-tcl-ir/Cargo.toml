[package]
name = "bpf-tcl-ir"
publish.workspace = true
description = "Typed, backend-agnostic mid-IR and framework front-end for the BPF-Tcl DSL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tcl-lexer = { path = "../tcl-lexer" }
tcl-registry = { path = "../tcl-registry" }
tcl-compiler = { path = "../tcl-compiler" }

[dev-dependencies]
# Only for the operator-completeness test in `lower.rs`: iterating
# `ALL_BIN_OPS`/`ALL_UNARY_OPS` to prove every variant either lowers or hits
# `BpfDiag::OutOfSubset`, never silently mishandled — issue #983's plan.
tcl-syntax = { path = "../tcl-syntax" }

[lints]
workspace = true
