[package]
name = "tcl-bigip-query"
publish.workspace = true
description = "The F5 BIG-IP query DSL: the jq-flavoured language powering `f5 query` (lexer, parser, evaluator, projection, builtins)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tcl-bigip = { path = "../tcl-bigip" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
indexmap = "2"
ipnet = "2"
libm = "0.2"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
# Network-probe layer, gated behind
# --enable-probes. x509-parser + sha2 back the deterministic, byte-parity
# `x509_parse`; ureq / rustls / dns-lookup back the live probes.
x509-parser = "0.18"
sha2 = "0.10"
dns-lookup = "3"
ureq = "3"
rustls = "0.23"
rustls-native-certs = "0.8"

[dev-dependencies]
temp-env = "0.3"

[lints]
workspace = true
