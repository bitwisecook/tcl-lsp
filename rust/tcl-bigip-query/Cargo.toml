[package]
name = "tcl-bigip-query"
description = "Faithful Rust port of the F5 BIG-IP query DSL (dialects/f5/query): the jq-flavoured language powering `f5 query`. Front-end (lexer + parser + AST) landed; evaluator / projection / builtins follow."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
indexmap = "2"
ipnet = "2"
libm = "0.2"
regex = "1"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
temp-env = "0.3"

[lints]
workspace = true
