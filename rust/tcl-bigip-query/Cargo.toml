[package]
name = "tcl-bigip-query"
publish.workspace = true
description = "The F5 BIG-IP query DSL: the jq-flavoured language powering `f5 query` (lexer, parser, evaluator, projection, builtins)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tcl-bigip = { path = "../tcl-bigip" }
# The shared native-stack safety-net primitive (issue #996) — see
# `value.rs`'s `MAX_VALUE_WALK_DEPTH`. Dependency-free leaf crate, so it
# stays wasm-safe for the report/console build too.
tcl-core-types = { path = "../tcl-core-types" }
# The real Tcl tokeniser, for parsing the architecture-manifest DSL (device /
# link / zone / interface / dns-zone / maps). Core lexer only (no `html`), so it
# stays wasm-safe for the report/console build.
tcl-lexer = { path = "../tcl-lexer" }
# Profile / event registry — the source of truth for a profile's protocol
# stack `layer`, used to sort profiles into traffic order. Pure data + logic,
# so it stays wasm-safe for the report/console build.
tcl-registry = { path = "../tcl-registry" }
# Shared Tcl semantics layer — `string match` glob (`Tcl_StringCaseMatch`) for
# the forensic file builtins. Pure `&str` logic, wasm-safe.
tcl-syntax = { path = "../tcl-syntax" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
indexmap = "2"
ipnet = "2"
libm = "0.2"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
# Network-probe layer, gated behind the `probes` cargo feature (on by default)
# *and* the runtime `--enable-probes` flag. x509-parser + sha2 back the
# deterministic, byte-parity `x509_parse`; ureq / rustls / dns-lookup back the
# live probes. All are optional so the crate can be built for targets without a
# socket / TLS stack (e.g. the wasm32 query console), which just omits the
# probe builtins.
x509-parser = { version = "0.18", optional = true }
sha2 = { version = "0.10", optional = true }
dns-lookup = { version = "3", optional = true }
ureq = { version = "3", optional = true }
rustls = { version = "0.23", optional = true }
rustls-native-certs = { version = "0.8", optional = true }

[features]
default = ["probes"]
# The deterministic, byte-parity x509 surface (`x509_parse` and friends). Pure
# Rust — x509-parser + sha2 — so it builds for the wasm32 report/console with no
# socket or TLS dependency. Split out of `probes` so the offline report can read
# certificate files out of a UCS without pulling in the network stack.
x509 = ["dep:x509-parser", "dep:sha2"]
# The live network-probe builtin family (dns / ping / tls_handshake / url_*),
# which also needs the x509 surface for `ucs_cert` / `tls_handshake`. Turn both
# off (default-features = false) to build without any socket or TLS dependency.
probes = [
    "x509",
    "dep:dns-lookup",
    "dep:ureq",
    "dep:rustls",
    "dep:rustls-native-certs",
]

[dev-dependencies]
temp-env = "0.3"

[lints]
workspace = true
