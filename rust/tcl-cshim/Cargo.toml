# The C Tcl extension shim: hosts a command written against the C Tcl API
# (`Tcl_CreateObjCommand`, `objv`, `Tcl_SetObjResult`) behind the engine-
# neutral Tcl extension interface (`tcl-engine-api`), so it runs on whichever
# engine the host picked without knowing which. The C-facing header is
# `include/tclshim.h`; every declaration there is implemented in `src/ffi.rs`.
# See docs/design/c-extension-shim.md.
[package]
name = "tcl-cshim"
publish.workspace = true
description = "C Tcl extension shim over the engine-neutral Tcl extension interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"
links = "tclshim"

[lib]
name = "tcl_cshim"

[dependencies]
tcl-engine-api = { path = "../tcl-engine-api" }
# The shared owners the shim must not re-implement: list quoting/splitting,
# number parsing and double formatting (`tcl-syntax`), and option-table
# prefix resolution with its C-shaped messages (`tcl-cmd-core`).
tcl-syntax = { path = "../tcl-syntax" }
tcl-cmd-core = { path = "../tcl-cmd-core" }

[dev-dependencies]
tcl-engine-tclvm = { path = "../tcl-engine-tclvm" }
tcl-spec-hooks = { path = "../tcl-spec-hooks" }

[build-dependencies]
# Compiles the test extension under `tests/c/` on non-Windows targets; see
# `build.rs` for the gating.
cc = "1"

# NOTE: no `[lints] workspace = true` — this is the one crate in the
# workspace whose whole purpose is the C ABI boundary, so it cannot inherit
# `unsafe_code = "forbid"`. The remaining workspace lint settings are
# replicated verbatim so the crate is held to the same clippy bar.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)", "cfg(tokio_taskdump)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
