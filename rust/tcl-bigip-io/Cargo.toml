[package]
name = "tcl-bigip-io"
publish.workspace = true
description = "Pure-Rust f5 input layer: UCS (gzip-tar + OpenPGP-symmetric) archives and the read_path/load_paths resolver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tcl-bigip = { path = "../tcl-bigip" }
# The shared native-stack safety-net primitive — see `openpgp.rs`'s
# `MAX_COMPRESSED_PACKET_DEPTH`. Dependency-free leaf crate.
tcl-core-types = { path = "../tcl-core-types" }
tcl-platform = { path = "../tcl-platform" }
thiserror = "2"

# UCS container: gzip-compressed tar of /config.
flate2 = "1"
tar = "0.4"

# Encrypted UCS = OpenPGP symmetric message (S2K + AES-CFB, F5 KB K5437).
# RustCrypto supplies AES and the CFB mode. Packet framing, S2K, and
# integrity checks stay in the symmetric OpenPGP reader.
aes = "0.9"
base64 = "0.23"
cfb-mode = "0.9.1"
digest = "0.11"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
ripemd = "0.2"

[dev-dependencies]
temp-env = "0.3"
flate2 = "1"
tar = "0.4"

[lints]
workspace = true
