# Foundational dialect vocabulary — the true leaf of the dialect stack.
#
# Holds `DialectSet`, `TclVersion`, the lexer/expr grammar structs
# (`LexerGrammar`, `BracedVarStyle`), and the `DialectProfile` catalog, so
# every layer (tcl-lexer, tcl-syntax, tcl-registry, the compiler, the LSP,
# the CLIs) consumes ONE source of truth for both the availability axis and
# the behaviour/runtime axis of a dialect.
#
# Dependency DAG (no cycles):
#   tcl-dialect  <-  tcl-lexer  <-  tcl-syntax  <-  { tcl-registry, … }
#
# It depends only on `bitflags` (which tcl-syntax already carries) so it stays
# `wasm32`-clean — the runtime (a workspace-excluded wasm32 crate) reaches it
# through its tcl-lexer / tcl-syntax path-deps.
#
# See `docs/design/dialect-profile-model.md` (§3, the DECIDED Option-A
# foundational crate).
[package]
name = "tcl-dialect"
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Foundational dialect vocabulary: DialectSet, TclVersion, grammar structs, and the DialectProfile catalog"

[dependencies]
bitflags = "2"

[lints]
workspace = true
