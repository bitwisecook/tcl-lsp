# The runtime compiled to wasm32 (`tcl_runtime.wasm`) as an engine of the
# extension interface, under wasmtime, and the host C extensions built for it
# are evaluated on with fuel. Its own crate so that wasmtime is linked only by
# what asks for it: the registry holds the seam (`extension_host`), and the
# language server, which links the registry, never links this. Excluded from
# the main test partitions for the same reason `tcl-fuzz` is (wasmtime and
# cranelift stay out of their build graph); its tests that need the real-link
# toolchain run in the `wasm-real-link` job.
[package]
name = "tcl-engine-wasm"
publish.workspace = true
description = "The WASM runtime as an engine: tcl_runtime.wasm under wasmtime, with fuel, and C extensions loaded as side modules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "tcl_engine_wasm"

[dependencies]
tcl-engine-api = { path = "../tcl-engine-api" }
tcl-registry = { path = "../tcl-registry" }
tcl-syntax = { path = "../tcl-syntax" }
# The same version and features `tcl-fuzz` builds, so the two share one build.
wasmtime = { version = "49.0.1", default-features = false, features = ["cranelift", "runtime", "gc-drc"] }

[dev-dependencies]
# For the real-link gate shared by path with `tcl-compiler`'s suites.
tcl-runtime-api = { path = "../tcl-runtime-api" }

[lints]
workspace = true
