[package]
name = "tcl-pkg-model"
publish.workspace = true
description = "The tclpkg data model: manifest, lockfile, versions, errors, and a package's dependency tier — the part of the package manager the pack loader reads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# `DependencyTier` lives with `Provenance` and `WorkspaceTrust`, the lowest
# crate the package manager, the registry and the pack loader all reach.
tcl-dialect = { path = "../tcl-dialect" }
tcl-lexer = { path = "../tcl-lexer" }
tcl-syntax = { path = "../tcl-syntax" }
regex = "1"
serde_json = "1"

[lints]
workspace = true
