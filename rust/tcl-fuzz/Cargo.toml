# `tcl-fuzz` — differential fuzzer for the native Tcl VM and related backends.
#
# Generates structurally-valid Tcl over the VM's supported surface (variables,
# expr, string/list/dict ops, control flow, procs, arrays — no I/O), runs each
# script through a pair of backend engines — `tclvm`, a reference `tclsh`, or
# `runtime/rust`'s interpreter — and flags any divergence in stdout / exit
# status (and, opt-in, error message text) as a finding. The campaign runner +
# generator + findings registry drive the differential fuzzer.
#
# Both backends run as subprocesses with a wall-clock timeout, so a generated
# script that hangs one engine is recorded as a finding rather than wedging the
# campaign.
[package]
name = "tcl-fuzz"
publish.workspace = true
description = "Differential fuzzer for the native Tcl backends (tclvm / tclsh / runtime-rust)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "tcl-fuzz"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# The WASM arms compile generated programs to the eval-fallback WASM module:
# the runnability arm runs them under the wasmtime CLI; the value-differential
# arm embeds wasmtime in-process with a `tcl-vm`-backed host. Needs the codegen,
# registry, bytecode, and the VM as the eval host.
tcl-bytecode = { path = "../tcl-bytecode" }
tcl-compiler = { path = "../tcl-compiler" }
tcl-registry = { path = "../tcl-registry" }
# The document lexing configuration threaded into the lowering entry point.
tcl-lexer = { path = "../tcl-lexer" }
tcl-vm = { path = "../tcl-vm" }
# The ordered Tcl release enum, for recording (and comparing) which release
# each engine in a differential pair emulates — see `src/version.rs` and
# issue #1328.
tcl-dialect = { path = "../tcl-dialect" }
# The eBPF value-differential arm runs a registry-derived BPF-Tcl program
# through the real lowering, bytecode emitter, and userspace eBPF VM.
bpf-tcl = { path = "../bpf-tcl" }
bpf-tcl-codegen = { path = "../bpf-tcl-codegen" }
bpf-tcl-ir = { path = "../bpf-tcl-ir" }
# Core-wasm embedding only (compile + run with host funcs) — the heavy default
# features (component-model, async, gc, cache, …) are off.
wasmtime = { version = "48", default-features = false, features = ["cranelift", "runtime", "gc-drc"] }

[lints]
workspace = true
