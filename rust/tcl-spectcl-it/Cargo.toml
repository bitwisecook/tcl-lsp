[package]
name = "tcl-spectcl-it"
publish.workspace = true
description = "tcl-spectcl's tests that read the command registry; no library code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]

[dev-dependencies]
tcl-spectcl = { path = "../tcl-spectcl", features = ["programmed-packs"] }
# Installs the shipped command surfaces before the first registry read.
tcl-registry = { path = "../tcl-registry" }
tcl-codegen = { path = "../tcl-codegen" }
tcl-compiler = { path = "../tcl-compiler" }
tcl-core-types = { path = "../tcl-core-types" }
tcl-dialect = { path = "../tcl-dialect" }
tcl-engine-api = { path = "../tcl-engine-api" }
tcl-engine-tclvm = { path = "../tcl-engine-tclvm" }
tcl-lsp-core = { path = "../tcl-lsp-core" }
tcl-native-model = { path = "../tcl-native-model" }
tcl-pkg-model = { path = "../tcl-pkg-model" }
tcl-runtime-api = { path = "../tcl-runtime-api" }
tcl-spec-hooks = { path = "../tcl-spec-hooks" }
tcl-sslictcl = { path = "../tcl-sslictcl" }
tcl-syntax = { path = "../tcl-syntax" }
tcl-test-support = { path = "../tcl-test-support" }
tcl-vm = { path = "../tcl-vm", features = ["test-support"] }

[lints]
workspace = true
