# Bytecode and WASM emission, reference-body inlining and the bytecode compile
# service, split out of `tcl-compiler` so the analyser and its consumers do not
# wait on (or recompile with) the emitters. It depends on `tcl-compiler`;
# nothing in `tcl-compiler` depends on it.
[package]
name = "tcl-codegen"
publish.workspace = true
description = "Bytecode/WASM emission, inlining and the compile service for the Tcl compiler pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tcl-compiler = { path = "../tcl-compiler" }
tcl-dialect = { path = "../tcl-dialect" }
tcl-lexer = { path = "../tcl-lexer" }
tcl-syntax = { path = "../tcl-syntax", features = ["num-bigint"] }
tcl-cmd-core = { path = "../tcl-cmd-core" }
tcl-bytecode = { path = "../tcl-bytecode" }
tcl-registry = { path = "../tcl-registry" }
tcl-core-types = { path = "../tcl-core-types" }
tcl-runtime-api = { path = "../tcl-runtime-api" }
rustc-hash = { workspace = true }

[dev-dependencies]
tcl-compiler = { path = "../tcl-compiler", features = ["test-support"] }
tcl-test-support = { path = "../tcl-test-support" }
tcl-vm = { path = "../tcl-vm" }
temp-env = "0.3"

[lints]
workspace = true
