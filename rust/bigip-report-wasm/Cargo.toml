# WebAssembly build of the BIG-IP *report generator*.
#
# Compiles `tcl-bigip-report` (the Rust port of the f5report generator) plus the
# `tcl-bigip-io` UCS layer to wasm32, so the whole pipeline — decrypt/extract a
# UCS (plain or OpenPGP-encrypted), run the `f5-query` engine, shape the model
# and render the standalone HTML report — runs entirely in the browser. Nothing
# is uploaded; no network is used once the wasm has loaded.
#
# EXCLUDED from the Cargo workspace (see the root Cargo.toml `exclude` list) for
# the same reasons as `bigip-query-wasm`: wasm-bindgen's generated glue trips
# the workspace `unsafe_code = "forbid"` lint, and it targets wasm32 with its
# own lockfile. Built with `build-wasm.sh` (cargo + wasm-bindgen + wasm-opt).

[package]
name = "bigip-report-wasm"
description = "wasm32 build of the F5 BIG-IP report generator — upload a UCS/SCF, get a standalone HTML report, entirely in-browser"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-or-later"
repository = "https://github.com/bitwisecook/tcl-lsp"
authors = ["tcl-lsp contributors"]
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tcl-bigip-report = { path = "../tcl-bigip-report" }
tcl-bigip-io = { path = "../tcl-bigip-io" }
wasm-bindgen = "=0.2.126"
serde_json = { version = "1", features = ["preserve_order"] }
# Give chrono a working clock on wasm32 (feature unification with the query
# engine's time builtins), matching bigip-query-wasm.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }

[profile.release]
opt-level = "s"
lto = true

# NOTE: no `[lints] workspace = true` — must not inherit `unsafe_code = "forbid"`.
