name: Publish BIG-IP example report to GitHub Pages

# Builds the interactive f5report example (from the committed sample UCS
# fixtures) and publishes it to GitHub Pages, so there is a stable URL that
# always reflects the latest code.
#
# GitHub Pages serves ONE site per repo. This workflow and the (manual-only)
# Compiler-Explorer `pages.yml` both target that single site via the shared
# `pages` concurrency group and the `github-pages` environment — whichever runs
# most recently is what's live. This one runs automatically on report changes.
on:
  push:
    # `rust` is the active development line this feature lands on; `main` is the
    # long-term default. Deploy from whichever holds the merged report code.
    branches: [rust, main]
    paths:
      - "rust/bigip-query-py/**"
      - "rust/bigip-query-wasm/**"
      - "rust/tcl-bigip-query/**"
      - "rust/tcl-bigip/**"
      - "rust/tcl-bigip-io/**"
      - ".github/workflows/bigip-report-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # rust-toolchain.toml pins the channel (stable); rustup on the runner
      # resolves it on the first cargo call. The PyO3 extension links against
      # the interpreter set up below.
      - name: Cache cargo + build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: rust/bigip-query-py

      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Build the report generator (PyO3) and render the example
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip maturin
          # maturin develop installs f5report editable against the source tree,
          # so the vendored Mermaid + wasm engine (committed under
          # python/f5report/vendor/) are embedded — GitHub Pages has no strict
          # CSP, so the in-browser query console works when hosted.
          ( cd rust/bigip-query-py && maturin develop --release )
          mkdir -p site
          python -m f5report \
            rust/bigip-query-py/tests/data/lab-device-01.ucs \
            rust/bigip-query-py/tests/data/lab-device-02.ucs \
            -t "F5 BIG-IP Estate — example report" \
            -o site/index.html
          # A .nojekyll file keeps Pages from post-processing the single-file app.
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
