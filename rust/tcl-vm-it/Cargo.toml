[package]
name = "tcl-vm-it"
publish.workspace = true
description = "tcl-vm's tests that compile Tcl through tcl-compiler and tcl-codegen; no library code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]

[dev-dependencies]
# The VM under test, with its `test_support` interpreter constructors.
tcl-vm = { path = "../tcl-vm", features = ["test-support"] }
# The source compiler these tests run Tcl through. It sits above `tcl-vm`, so
# the tests live here rather than in `tcl-vm`, where every compiler edit would
# rebuild them.
tcl-codegen = { path = "../tcl-codegen" }
tcl-compiler = { path = "../tcl-compiler" }
tcl-bytecode = { path = "../tcl-bytecode" }
tcl-cmd-core = { path = "../tcl-cmd-core" }
tcl-core-types = { path = "../tcl-core-types" }
tcl-dialect = { path = "../tcl-dialect" }
tcl-host-native = { path = "../tcl-host-native" }
tcl-lexer = { path = "../tcl-lexer" }
tcl-platform = { path = "../tcl-platform" }
tcl-registry = { path = "../tcl-registry" }
tcl-runtime-api = { path = "../tcl-runtime-api" }
tcl-syntax = { path = "../tcl-syntax", features = ["num-bigint"] }
tcl-test-support = { path = "../tcl-test-support" }
serde_json.workspace = true

[lints]
workspace = true
