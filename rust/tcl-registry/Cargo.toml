[package]
name = "tcl-registry"
publish.workspace = true
description = "Command registry — single source of truth for Tcl command metadata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tcl-dialect = { path = "../tcl-dialect" }
tcl-syntax = { path = "../tcl-syntax" }
tcl-lexer = { path = "../tcl-lexer" }
tcl-core-types = { path = "../tcl-core-types" }
tcl-cmd-core = { path = "../tcl-cmd-core" }
tcl-regex = { path = "../tcl-regex", features = ["cmd-core"] }
bitflags = "2"
sha2 = "0.11"
rustc-hash = { workspace = true }

[dev-dependencies]
# A dev-dependency cycle (`tcl-spectcl` depends on this crate), which Cargo
# permits: the EDA vendor libraries are bundled `.tclspec` loadables now, so
# the tests that used to sweep them out of `load_eda_packs` have to load them
# through the pack loader like everything else does.
tcl-spectcl = { path = "../tcl-spectcl" }

[lints]
workspace = true
