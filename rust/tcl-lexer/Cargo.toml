[package]
name = "tcl-lexer"
publish.workspace = true
description = "Position-aware lexer for Tcl, iRules, and related dialects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# HTML syntax-highlighting helper (tcl_lexer::highlight_tcl). Off by default;
# turn on for the BIG-IP report generator's iRule source view.
html = []

[dependencies]
tcl-core-types = { path = "../tcl-core-types" }
tcl-dialect = { path = "../tcl-dialect" }
thiserror = "2.0"

[lints]
workspace = true
