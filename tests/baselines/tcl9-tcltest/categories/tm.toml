# tm.test categorisation (Tcl 9.0.3 source tree).
# Stem: in-scope, currently traps before tcltest summary —
# Tcl Modules — depends on FS-based module discovery.
# Test IDs are parked in impossible_in_wasm_browser only — WASI can host this
# surface today (or with a near-term preview2 step) so the
# WASI-target injector should *not* skip these.
# trap_allowed = true keeps the harness from promoting the
# current mid-run trap to a hard fail; the impossibility
# list is forward-looking documentation for a runtime-
# target-aware -skip injector once the bundle reaches a
# tcltest summary line (see categories/README.md).

