# Categorisation for cmdIL.test (Tcl 9.0.3 source tree).
# See ``categories/README.md`` for bucket definitions.  Unlisted IDs
# default to ``must_pass`` — anything new from upstream fails closed.

# cmdIL.test exercises ``lsort`` and ``lsearch`` semantics.  The bulk
# of failing tests are option-combination edge cases (``-stride``,
# ``-index``, ``-nocase`` interactions, ``-real``/``-integer`` mixed
# with ``-dictionary``, ``-subindices``, ``-bisect``) that our list
# primitives haven't grown yet, plus a cluster of ASCII vs. Unicode
# ordering questions where the test pins C tcl's exact lsort
# tie-breaking rules.  Each ID is grouped by the option it exercises
# so a follow-up sweep can knock them out by feature.
good_to_have = [
  "1.7",    # lsort -decreasing: tie-breaking when prefixes match.
  "1.8",    # lsort -decreasing -dictionary tie-breaking.
  "1.9",    # lsort -dictionary numeric-segment compare.
  "1.13",   # lsort -index end -integer interaction.
