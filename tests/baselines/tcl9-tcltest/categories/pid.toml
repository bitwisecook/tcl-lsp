# pid.test categorisation (Tcl 9.0.3 source tree).
# Stem: in-scope, currently traps before tcltest summary —
# [pid] reads a process model neither runtime exposes.
# Test IDs are parked in impossible_in_wasm_wasi (and therefore also impossible
# under the browser, which is strictly stricter — the
# browser-target injector picks them up via the union).
# trap_allowed = true keeps the harness from promoting the
# current mid-run trap to a hard fail; the impossibility
# list is forward-looking documentation for a runtime-
# target-aware -skip injector once the bundle reaches a
# tcltest summary line (see categories/README.md).

trap_allowed = true

good_to_have = []
just_to_match_ctcl = []
skip = []

impossible_in_wasm_wasi = [
  "1.1", "1.2", "1.3", "1.4", "1.5",
]

impossible_in_wasm_browser = []

[baseline]
good_to_have_failing = 0
just_to_match_ctcl_failing = 0
skip_failing = 0
impossible_in_wasm_wasi_failing = 5
impossible_in_wasm_browser_failing = 0
