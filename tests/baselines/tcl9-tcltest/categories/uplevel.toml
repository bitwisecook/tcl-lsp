# uplevel.test categorisation (Tcl 9.0.3 source tree).
# Bundle reaches its tcltest summary line now.

good_to_have = [
  "3.4",    # uplevel-3.4: ``uplevel #1 set y`` should resolve to
            # the frame at absolute level 1.  Our level-numeric
            # parser maps ``#1`` to the global frame instead of
            # the per-call ``::a1`` frame.
  "4.9",    # uplevel-4.9: ``uplevel -0 {}`` — TIP 467 says
            # ``-0`` is a no-op alias for ``-level 0`` (run in
            # current frame).  Our level parser rejects it as a
            # bad level.
]
just_to_match_ctcl = []
skip = []

