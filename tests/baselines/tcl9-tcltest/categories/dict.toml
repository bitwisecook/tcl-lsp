  "21.14",        # dict-21.14: ``trace add variable aa write
                  #   "string length \$indices ;#"`` inside an apply
                  #   body — when the dict-update write fires the
                  #   trace, ``\$indices`` should substitute to the
                  #   apply-frame value ``{2 3}`` before ``string
                  #   length`` runs.  Our trace callback delivers the
                  #   raw body string with the ``\$`` unsubstituted,
                  #   so ``string length`` receives zero arguments and
                  #   raises ``wrong # args``.  Real codegen fix —
