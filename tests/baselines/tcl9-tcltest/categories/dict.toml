# Tests we intentionally do NOT run on the WASM side: they probe
# C-Tcl bytecode shape (instruction count, ``[linenumber]`` from
# ``info frame -1`` tied to the bcc), the ``::tcl::dict::*``
# private namespace, or other reference-implementation internals
# our codegen doesn't emulate.  Routed through
# ``tcltest::configure -skip`` so they appear in the Skipped count
# and never as failures — saves the runtime cycles, and a future
# accidental "pass" is still surfaced via the bucket count drop.
skip = [
  "23.1",         # dict-23.1: bytecode compile-crash regression for
                  #   Bug 3487626 — uses ``::tcl::dict::for`` /
                  #   ``::tcl::dict::update`` and ``[linenumber]``
                  #   via ``dict get [info frame -1] line``.  Tests
                  #   C bcc shape, not user-visible semantics.
  "23.2",         # dict-23.2: same family — internal compiler probe
  "23.3",         # dict-23.3
  "23.4",         # dict-23.4
  "23.5",         # dict-23.5: ``CompileWord`` OBOE — direct internal
                  #   C bytecode operand-emit regression
  "23.6",         # dict-23.6
  "23.7",         # dict-23.7
  "23.8",         # dict-23.8
  "23.9",         # dict-23.9
  "23.10",        # dict-23.10
  "23.11",        # dict-23.11
  "23.12",        # dict-23.12
  "23.13",        # dict-23.13
  "23.14",        # dict-23.14
  "24.20.1",      # dict-24.20.1: ``dict for`` bytecode compile-crash
                  #   (Bug 3487626) — same shape as 23.1
  "24.21",        # dict-24.21: same family
]

# Implementation-detail divergences from C Tcl that aren't bytecode-
# shape per se but where matching the reference output isn't a
# parity claim we make.  Counted but not gating; a future accidental
# pass is informative.
just_to_match_ctcl = [
  "24.24",        # dict-24.24: ``dict map`` over a 100k-pair "huge
                  #   dict" — bignum precision beyond what tcl_arith
                  #   claims to match (sum of squares overflows i64)
  "24.25",        # dict-24.25: compiled form of 24.24 — same root
                  #   cause; the compiled-side ``dict map`` also
