# unixFCmd.test categorisation (Tcl 9.0.3 source tree).
# Stem: platform-specific — Unix-only [file] mutators (chmod, chown, etc.) — exercises root-only paths the WASI sandbox refuses.
# Every test ID is parked in impossible_in_wasm_wasi: the
# host OS subsystem under test does not exist on either WASM
# runtime target.  Because browser is the strictly stricter
# sandbox, WASI-impossible implies browser-impossible — IDs
# are NOT also listed in impossible_in_wasm_browser (the
# loader rejects overlap, and `browser_impossible_full_ids()`
# composes the union for a browser-target injector).  Tracked
# for visibility per categories/README.md, never gating.

