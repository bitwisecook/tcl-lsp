# load.test categorisation (Tcl 9.0.3 source tree).
# Stem: in-scope, currently traps before tcltest summary —
# [load] requires a host shared-library loader — browser cannot dlopen native libs.
# Test IDs are parked in impossible_in_wasm_browser only — WASI can host this
# surface today (or with a near-term preview2 step) so the
# WASI-target injector should *not* skip these.
# trap_allowed = true keeps the harness from promoting the
# current mid-run trap to a hard fail; the impossibility
# list is forward-looking documentation for a runtime-
# target-aware -skip injector once the bundle reaches a
# tcltest summary line (see categories/README.md).

trap_allowed = true

good_to_have = []
just_to_match_ctcl = []
skip = []

impossible_in_wasm_wasi = []

impossible_in_wasm_browser = [
  "1.1", "1.2", "1.3", "1.4", "1.5", "1.6",
  "1.7", "1.8", "2.1", "2.2", "2.3", "2.4",
  "3.1", "3.2", "4.1", "4.2", "5.1", "6.1",
  "7.1", "7.2", "7.3", "7.4", "8.1", "8.2",
  "8.4", "8.3a", "8.3b", "9.1", "10.1", "11.1",
]

[baseline]
good_to_have_failing = 0
just_to_match_ctcl_failing = 0
skip_failing = 0
impossible_in_wasm_wasi_failing = 0
impossible_in_wasm_browser_failing = 30
