# httpProxy.test categorisation (Tcl 9.0.3 source tree).
# Stem: in-scope, currently traps — depends on socket runtime which is not yet implemented.
# Per categories/README.md: ``trap_allowed = true`` lets the
# harness record the mid-run trap as a tracked failure rather
# than promoting it to a hard fail.  Per-test-ID triage will
# be added once the runtime gap closes and the bundle reaches
# a tcltest summary line.

trap_allowed = true

good_to_have = []
just_to_match_ctcl = []
skip = []

[baseline]
good_to_have_failing = 0
just_to_match_ctcl_failing = 0
skip_failing = 0
