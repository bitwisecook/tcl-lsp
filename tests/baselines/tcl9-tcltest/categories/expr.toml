# expr.test categorisation (Tcl 9.0.3 source tree).
# Stream: tcl9-arith-wording.  See ``categories/README.md`` for
# bucket definitions.  Unlisted IDs default to ``must_pass`` —
# anything new from upstream fails closed.
#
# Snapshot: 861/2168 passing; 1055 skipped (constraint-gated tests
# plus tcltest's own "test runner" skips); 252 failing — many of those
# are loop-driven ``expr-31.x.y`` and ``expr-58.x(...)-N`` test
# instances generated from the same template, which collapse to the
# 36 unique categorised below.  Was timeout-trap before the binary /
# octal literal panic and the bool / isqrt math-function additions
# landed.

# Real semantic feature gaps tracked but non-gating.
good_to_have = [
  # ``hello_world`` / ``do_twelve_days`` stress procs are stubbed by
  # ``_patch_hello_world_procs`` because their deeply nested ternaries
  # trip the AOT codegen's short-circuit-with-side-effect handling.
  "3.7",
  "3.8",
  # ``expr 01eq1`` — leading-zero canonicalisation makes the string
  # repr ``"1"`` instead of ``"01"`` so the ``eq`` string comparison
  # reports them equal.  Reference Tcl preserves source spelling on
  # the un-canonicalised value side.
  "8.17",
  # ``cannot use a list as right operand of "+"`` — error wording for
  # list-shaped arithmetic operands.  Our diagnostic surfaces the
  # underlying number-parse failure with the verbatim string.
  "11.14",
  "11.16",
  # ``expr $a(123)`` — array-elem ref in unbraced expr through the
  # runtime eval-script path.  AOT path handles it; the runtime word
  # substitution doesn't yet wire array element resolution through
  # the expr arg.
  "14.13",
  # ``expr + {[incr]}`` — compile error of nested cmd subst should
  # surface the ``wrong # args`` directly.  We surface a generic
  # ``cannot use … as operand`` instead.
  "20.6",
  # ``NaN`` arithmetic error wording — reference Tcl emits ``cannot
  # use non-numeric floating-point value "NaN" as <position> operand
  # of "<op>"``; we surface ``domain error: argument not in valid
  # range`` from the underlying math helper.  Functionally equivalent.
  "22.1",
  "22.7",
  # ``expr {$x == $x}`` with ``$x = NaN`` should be 0 (NaN is unordered
  # with respect to itself).  Our ``tcl_expr_order_cmp`` doesn't yet
  # detect the NaN-unordered case and reports ``equal``, so ``==``
  # returns 1.  Tracked for the NaN-aware comparison-helper rework.
  "22.9",
  # ``**`` (power) error messages for non-numeric operands.
  "23.9",
  "23.10",
  "23.12",
  # ``-2**N`` precedence — our parser binds ``-`` looser than ``**`` so
  # ``-2**4`` evaluates to ``(-2)**4 = 16`` rather than C Tcl's
  # ``-(2**4) = -16``.
  "23.49",
  # ``NaN`` ordering across the compiled fast path.
  "27.4",
  # ``::tcl::mathfunc::abs`` direct invocation as a command.  We don't
  # yet expose the ``::tcl::mathfunc::*`` namespace as runtime commands;
  # callers go through the expr-level dispatcher only.
  "38.5",
  "38.6",
  "38.7",
  "38.8",
  "38.11",
  "38.12",
  "38.13",
  "38.14",
  "38.15",
  # ``expr 123[string repeat 0 309]1e-310`` — float significand
  # overflow then exponent underflow; reference Tcl renders the result
  # as ``123.0`` after the underflow saturates.  We emit a near-308-
  # digit decimal because the bignum path swallows the ``e-310``.
  "41.23",
  # ``entier(Inf)`` should raise ``integer value too large to represent``.
  "45.7",
  # ``isqrt`` error wording (``expected number but got "X"`` vs our
  # ``cannot use non-numeric string …``) and bignum range tests for
  # 256-digit operands.
  "47.2",
  "47.13",
  "47.14",
  "47.15",
  "47.16",
  # ``expr {-0x8000000000000001 >> 0x8000000000000000}`` — extreme
  # bignum shift edge case.  Bug 1770224 in upstream.
  "48.1",
  # ``coroutine foo apply ...`` with ``[yield]`` inside expr — we
  # don't fully thread coroutine state through the AOT codegen yet.
  "49.1",
  # ``sqrt("1[616 zeros]") == 1e308`` — bignum-to-float coercion in
  # sqrt() needs the rounding rules the C ``ExprSqrtFunc`` applies.
  "50.1",
  # ``$a eq {}`` / ``< {}`` / ``> {}`` test that the empty-string
  # comparison doesn't force a string-rep generation on the LHS list.
  # Our short-circuit doesn't satisfy the ``string match *no string
  # representation*`` assertion verbatim.
  "52.1",
  # ``expr {0x2#don't splice\n ne#don't splice\n2}`` — TIP 582
  # comments interact with hex source-spelling preservation: reference
  # Tcl keeps ``"0x2"`` as the string repr of the parsed hex literal
  # so ``ne 2`` compares ``"0x2"`` vs ``"2"`` (true).  We canonicalise
  # to decimal ``"2"`` and the comparison reports equal.
  "62.6",
]

just_to_match_ctcl = []

