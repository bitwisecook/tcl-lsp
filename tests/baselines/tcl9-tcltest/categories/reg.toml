# reg.test categorisation (Tcl 9.0.3 source tree).
# The bundle was reaching its tcltest summary line with the previous
# preamble, but the freshly-presset ``testConstraint testbytestring 0``
# in the harness preamble exposed an earlier-test pattern that
# recursively walks the regex DFA's duplication routine and overruns
# the WASM stack.  Keep ``trap_allowed = true`` until the regex
# stack-overflow root cause is fixed; the residual must_pass IDs
# below remain tracked for the post-fix state.
trap_allowed = true

good_to_have = [
  "33.15.1", # reg-33.15.1: ``regexp -expanded -about <big multi-line
             # pattern>`` — pinned C tcl behaviour around the
             # capture-count return when the pattern has a giant
             # ``-expanded`` body.  Our regex engine returns a
             # slightly different group count for unicode
             # interior-anchored alternation.
  "33.16.1", # reg-33.16.1: same shape — pinned-pattern test from a
             # production iRule that fed the regex through.
]
just_to_match_ctcl = []
skip = []

[baseline]
good_to_have_failing = 2
just_to_match_ctcl_failing = 0
skip_failing = 0
