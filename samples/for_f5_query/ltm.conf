ltm node /Common/web1 {
    address 10.0.1.10
}
ltm node /Common/web2 {
    address 10.0.1.11
}
ltm node /Common/api1 {
    address 10.0.2.20
}
ltm node /Common/api2 {
    address 10.0.2.21
}
ltm node /Common/legacy1 {
    address 192.168.50.10
}
ltm pool /Common/web_pool {
    members {
        /Common/web1:80 {
            address 10.0.1.10
        }
        /Common/web2:80 {
            address 10.0.1.11
        }
    }
    monitor /Common/http
}
ltm pool /Common/api_pool {
    members {
        /Common/api1:8443 {
            address 10.0.2.20
        }
        /Common/api2:8443 {
            address 10.0.2.21
        }
    }
    monitor /Common/https
}
ltm pool /Common/legacy_pool {
    members {
        /Common/legacy1:80 {
            address 192.168.50.10
        }
    }
    monitor /Common/http
}
ltm pool /Common/unused_pool {
    monitor /Common/tcp
}
ltm data-group internal /Common/banned_ips {
    type ip
    records {
        10.99.0.0/16 { }
        198.51.100.7/32 { data "manual block 2024-12" }
    }
}
ltm data-group internal /Common/api_keys {
    type string
    records {
        deadbeef { data "tenant-a" }
        cafebabe { data "tenant-b" }
    }
}
ltm data-group internal /Common/routing_map {
    type string
    records {
        /api      { data "/Common/api_pool" }
        /legacy   { data "/Common/legacy_pool" }
    }
}
ltm rule /Common/log_rule {
when HTTP_REQUEST {
    log local0. "[HTTP::host] [HTTP::uri]"
}
}
ltm rule /Common/maintenance_rule {
when HTTP_REQUEST {
    HTTP::respond 503 content "down for maintenance"
}
}
ltm rule /Common/ip_blocklist_rule {
when CLIENT_ACCEPTED {
    if { [class match [IP::client_addr] equals banned_ips] } {
        log local0. "blocked [IP::client_addr]"
        reject
    }
}
}
ltm rule /Common/api_router_rule {
when HTTP_REQUEST {
    set tgt [class match -value [HTTP::path] starts_with routing_map]
    if { $tgt ne "" } {
        pool $tgt
    } else {
        pool /Common/web_pool
    }
}
}
ltm rule /Common/api_auth_rule {
when HTTP_REQUEST {
    set key [HTTP::header X-API-Key]
    if { ! [class match $key equals api_keys] } {
        HTTP::respond 401 content "missing or invalid api key"
    }
}
}
ltm virtual /Common/web_vs {
    destination /Common/10.0.0.10:80
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/web_pool
    profiles {
        /Common/http { }
        /Common/tcp { }
    }
    rules {
        /Common/log_rule
    }
}
ltm virtual /Common/web_secure_vs {
    destination /Common/10.0.0.10:443
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/web_pool
    profiles {
        /Common/http { }
        /Common/tcp { }
    }
}
ltm virtual /Common/api_vs {
    destination /Common/10.0.0.20:443
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/api_pool
    profiles {
        /Common/http { }
        /Common/tcp { }
    }
    rules {
        /Common/ip_blocklist_rule
        /Common/api_auth_rule
        /Common/api_router_rule
        /Common/log_rule
    }
}
ltm virtual /Common/legacy_vs {
    destination /Common/192.168.50.100:80
    ip-protocol tcp
    pool /Common/legacy_pool
}
ltm virtual /Common/forwarder_vs {
    destination /Common/0.0.0.0:0
    ip-protocol tcp
    profiles {
        /Common/fastL4 { }
    }
}
ltm virtual /Common/vpn_vs {
    destination /Common/10.0.0.30:443
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/api_pool
    profiles {
        /Common/employee_login_profile { }
        /Common/http { }
        /Common/tcp { }
    }
}
