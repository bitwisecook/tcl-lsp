# Platform / base-system fixture: the `sys`, `cm`, and `net` stanzas an
# SCF carries alongside the LTM config.  Pairs with `lab_localhost.conf`
# (which holds the `net self` / LTM side) and covers the projections the
# cert-expiry, HA-topology, and base-system recipes read.
#
# Cert metadata is the real shape tmsh records for a filestore cert;
# the PEMs themselves live in a UCS filestore, not in an SCF, so
# `x509_from_config` reads these fields and `ucs_cert` re-opens the
# archive when there is one. One client-ssl profile names a cert so the
# `virtual -> profile -> cert` audit chain resolves against a sample.

sys global-settings {
    gui-setup disabled
    hostname lab-a.example.test
    mgmt-dhcp disabled
}
sys dns {
    name-servers { 10.1.0.53 10.1.0.54 }
    search { example.test }
}
sys ntp {
    servers { time1.example.test time2.example.test }
    timezone UTC
}
sys snmp {
    agent-addresses { tcp6:161 udp6:161 }
    sys-contact "netops@example.test"
    sys-location "lab rack 3"
}
sys provision ltm {
    level nominal
}
sys provision apm {
    level minimum
}
sys management-route /Common/default {
    gateway 192.0.2.1
    network default
}
sys folder /Common {
    device-group /Common/lab-failover
    traffic-group /Common/traffic-group-1
}
sys file ssl-cert /Common/app.example.test.crt {
    cache-path /config/filestore/files_d/Common_d/certificate_d/:Common:app.example.test.crt_1
    certificate-key-size 2048
    expiration-date 1780574400
    expiration-string "Jun  4 12:00:00 2026 GMT"
    fingerprint SHA256/3F:8A:1C:44:9B:02:D7:6E:15:A0:BB:73:C9:2E:50:81:D4:6F:AA:37:12:8E:C5:90:64:1B:E8:2D:79:F3:06:55
    issuer "CN=Example Issuing CA,O=Example,C=AU"
    key-type rsa-public
    serial-number 4886718345
    source-path file:///config/ssl/ssl.crt/app.example.test.crt
    subject "CN=app.example.test,O=Example,C=AU"
    subject-alternative-name "DNS:app.example.test, DNS:www.example.test"
    version 3
}
sys file ssl-cert /Common/legacy.example.test.crt {
    cache-path /config/filestore/files_d/Common_d/certificate_d/:Common:legacy.example.test.crt_1
    certificate-key-size 1024
    expiration-date 1735689600
    expiration-string "Jan  1 00:00:00 2025 GMT"
    fingerprint SHA256/C1:07:52:E9:38:4D:6B:AA:90:11:F5:23:87:CE:44:1D:69:B2:30:5C:78:E1:9F:02:A6:3B:D8:41:56:70:2C:93
    issuer "CN=Example Issuing CA,O=Example,C=AU"
    key-type rsa-public
    serial-number 4886718346
    source-path file:///config/ssl/ssl.crt/legacy.example.test.crt
    subject "CN=legacy.example.test,O=Example,C=AU"
    version 3
}
sys file ssl-key /Common/app.example.test.key {
    key-size 2048
    key-type rsa-private
    security-type normal
    source-path file:///config/ssl/ssl.key/app.example.test.key
}

ltm profile client-ssl /Common/app_clientssl {
    cert /Common/app.example.test.crt
    defaults-from /Common/clientssl
    key /Common/app.example.test.key
}

cm cert /Common/dtdi.crt {
    certificate-key-size 2048
    expiration-string "Aug 12 09:31:00 2033 GMT"
    fingerprint SHA256/5B:22:AE:70:31:C4:98:6D:0F:E3:14:87:BA:59:2D:76:40:98:C3:1E:A5:72:66:0B:D9:34:EF:81:47:5A:12:B0
    issuer "CN=lab-a.example.test"
    key-type rsa-public
    subject "CN=lab-a.example.test"
}
cm key /Common/dtdi.key {
    key-size 2048
    key-type rsa-private
    security-type normal
}
cm device /Common/lab-a {
    base-mac 00:23:e9:00:0a:01
    build 0.0.4
    cert /Common/dtdi.crt
    chassis-id f5-lab-a
    edition "Point Release 1"
    hostname lab-a.example.test
    key /Common/dtdi.key
    management-ip 192.0.2.11
    marketing-name "BIG-IP Virtual Edition"
    product BIG-IP
    self-device true
    time-zone UTC
    unicast-address {
        { effective-ip 10.1.0.5 effective-port 1026 ip 10.1.0.5 }
    }
    version 17.1.1
}
cm device /Common/lab-b {
    base-mac 00:23:e9:00:0a:02
    build 0.0.4
    chassis-id f5-lab-b
    edition "Point Release 1"
    hostname lab-b.example.test
    management-ip 192.0.2.12
    marketing-name "BIG-IP Virtual Edition"
    product BIG-IP
    time-zone UTC
    version 17.1.1
}
cm device-group /Common/lab-failover {
    auto-sync enabled
    devices {
        /Common/lab-a { }
        /Common/lab-b { }
    }
    network-failover enabled
    type sync-failover
}
cm traffic-group /Common/traffic-group-1 {
    default-device /Common/lab-a
    ha-group /Common/lab-ha
    ha-load-factor 1
    ha-order {
        /Common/lab-a
        /Common/lab-b
    }
    unit-id 1
}
cm ha-group /Common/lab-ha {
    active-bonus 10
    enabled-state enabled
    pools {
        /Common/web_pool {
            threshold 1
            weight 20
        }
    }
}
cm trust-domain /Common/Root {
    ca-cert /Common/dtdi.crt
    ca-devices {
        /Common/lab-a
        /Common/lab-b
    }
    ca-key /Common/dtdi.key
    status standalone
    trust-group /Common/device_trust_group
}

net interface 1.1 {
    bundle not-supported
    lldp-admin txonly
    media-active 10000SR-FD
    mtu 9198
}
net interface 1.2 {
    bundle not-supported
    lldp-admin txonly
    media-active 10000SR-FD
    mtu 9198
}
net vlan /Common/mgmt {
    interfaces {
        1.1 { }
    }
    mtu 9198
    tag 10
}
net route /Common/mgmt_default {
    interface /Common/mgmt
    network 198.18.0.0/15
}
net port-list /Common/web-ports {
    description "public web service ports"
    ports {
        80 { }
        443 { }
        8443 { }
    }
}
net dns-resolver /Common/lab-resolver {
    forward-zones {
        example.test {
            nameservers {
                10.1.0.53:domain { }
            }
        }
    }
    route-domain /Common/0
}
net stp /Common/cist {
    interfaces {
        1.1 { }
        1.2 { }
    }
    mode passthru
}
net tunnels tunnel /Common/http-tunnel {
    description "http proxy tunnel"
    profile /Common/tcp-forward
}
