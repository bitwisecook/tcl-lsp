net vlan /Common/external {
    interfaces {
        1.1 { }
    }
    tag 100
}
net vlan /Common/internal {
    interfaces {
        1.2 { }
    }
    tag 200
}
net self /Common/198.51.100.5 {
    address 198.51.100.5/24
    vlan /Common/external
    allow-service none
    traffic-group /Common/traffic-group-1
}
net self /Common/10.1.0.5 {
    address 10.1.0.5/24
    vlan /Common/internal
    allow-service all
    traffic-group /Common/traffic-group-1
}
net self /Common/10.2.0.5 {
    address 10.2.0.5/24
    vlan /Common/internal
    allow-service default
    traffic-group /Common/traffic-group-1
}
ltm pool /Common/loopback_pool {
    members {
        /Common/loopback_n:8080 {
            address 127.0.0.1
        }
    }
    monitor /Common/tcp
}
ltm pool /Common/wildcard_pool {
    members {
        /Common/anyhost:80 {
            address 0.0.0.0
        }
    }
    monitor /Common/tcp
}
ltm pool /Common/external_pool {
    members {
        /Common/ext1:443 {
            address 10.5.0.10
        }
    }
    monitor /Common/https
}
ltm rule /Common/loopback_node_rule {
when HTTP_REQUEST {
    if { [HTTP::uri] starts_with "/admin" } {
        node 127.0.0.1 8080
    }
}
}
ltm rule /Common/internal_route_rule {
when HTTP_REQUEST {
    if { [HTTP::host] eq "internal.example.com" } {
        pool /Common/external_pool
    }
}
}
ltm virtual /Common/admin_vs {
    destination /Common/10.1.0.50:443
    pool /Common/external_pool
    profiles {
        /Common/http { }
        /Common/tcp { }
    }
    rules {
        /Common/loopback_node_rule
        /Common/internal_route_rule
    }
    vlans {
        /Common/internal
    }
    vlans-enabled
}
ltm virtual /Common/public_vs {
    destination /Common/198.51.100.50:443
    pool /Common/external_pool
    profiles {
        /Common/http { }
        /Common/tcp { }
    }
}
