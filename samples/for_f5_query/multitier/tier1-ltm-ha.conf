}
ltm node /Common/t2_c12_vip {
    address 10.2.0.10%112
}
ltm pool /Common/t2_fanout_pool {
    members {
        /Common/t2_c01_vip:443 {
            address 10.2.0.10%101
        }
        /Common/t2_c02_vip:443 {
            address 10.2.0.10%102
        }
        /Common/t2_c03_vip:443 {
            address 10.2.0.10%103
        }
        /Common/t2_c04_vip:443 {
            address 10.2.0.10%104
        }
        /Common/t2_c05_vip:443 {
            address 10.2.0.10%105
        }
        /Common/t2_c06_vip:443 {
            address 10.2.0.10%106
        }
        /Common/t2_c07_vip:443 {
            address 10.2.0.10%107
        }
        /Common/t2_c08_vip:443 {
            address 10.2.0.10%108
        }
        /Common/t2_c09_vip:443 {
            address 10.2.0.10%109
        }
        /Common/t2_c10_vip:443 {
            address 10.2.0.10%110
        }
        /Common/t2_c11_vip:443 {
            address 10.2.0.10%111
        }
        /Common/t2_c12_vip:443 {
            address 10.2.0.10%112
        }
    }
    monitor /Common/tcp
    load-balancing-mode least-connections-member
}
ltm virtual /Common/t1_ingress_vs {
    destination /Common/10.1.0.10:443
    pool /Common/t2_fanout_pool
    profiles {
        /Common/tcp { }
        /Common/http { }
        /Common/clientssl { context clientside }
        /Common/serverssl { context serverside }
    }
    ip-protocol tcp
}
