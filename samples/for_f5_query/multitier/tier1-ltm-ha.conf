cm device /Common/t1-a {
    hostname t1-a.example.test
    management-ip 192.0.2.11
}
cm device /Common/t1-b {
    hostname t1-b.example.test
    management-ip 192.0.2.12
}
cm device-group /Common/t1-failover {
    type sync-failover
    devices {
        /Common/t1-a { }
        /Common/t1-b { }
    }
    auto-sync enabled
}
net route-domain /Common/to_t2_c01 {
    id 101
}
net route-domain /Common/to_t2_c02 {
    id 102
}
net route-domain /Common/to_t2_c03 {
    id 103
