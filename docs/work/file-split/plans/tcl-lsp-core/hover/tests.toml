# The parent keeps the shared helpers and the tests of what `hover.rs` itself
# keeps: foreign-factory cards, cross-document cards, word-at-cursor lookups and
# IP-address cards. The modules carry the names of the production modules.
file = "rust/tcl-lsp-core/src/hover/tests.rs"

[[module]]
name = "classes"
doc = "Class cards: properties, counted class and method sources, hierarchy details."
items = [
    "fn:original_property_hover_uses_unique_current_source_declaration..fn:counted_class_hover_refuses_unsettled_and_foreign_binding",
    "fn:hover_on_class_name_returns_metaclass_signature",
    "fn:class_hover_text_lists_methods_alphabetically..fn:class_hover_shows_mro_and_subclasses",
    "fn:class_hover_disambiguates_same_name_across_namespaces",
]

