# Second level: applies to the `interpreters` module that
# plans/tcl-vm/interp.toml creates. The facade keeps the interpreter arena:
# the current interpreter, running a closure in another interpreter,
# minting and retiring slots, and `interp` path resolution.
file = "rust/tcl-vm/src/interp/interpreters.rs"

[[module]]
name = "aliases"
doc = "`interp alias`: publishing an alias, target-death backrefs, the alias-loop check, and invoking an alias's words with its usage rewrite."
items = [
    "impl:Vm::note_alias_backref..impl:Vm::alias_chain_loops_for_rename",
    "impl:Vm::alias_usage_rewrites_value..impl:Vm::invoke_alias_words_with_usage",
]

[[module]]
name = "children"
doc = "Child interpreters: creating and naming a child, its dialect profile, `interp debug` and `bgerror`, safe interpreters, evaluating in a child and deleting it."
items = [
    "const:DEBUG_OPTIONS",
    "impl:Vm::fork_child_state..impl:Vm::is_safe",
    "impl:Vm::mark_interp_trusted",
    "impl:Vm::make_safe..impl:Vm::eval_values_in_interp_in_original_name",
    "impl:Vm::delete_interp",
]

[[module]]
name = "hidden_commands"
doc = "Hidden commands: `interp hide` and `expose`, the hidden-name table, their visibility errors, and `interp invokehidden`."
items = [
    "enum:CommandVisibilityError..fn:native_visibility_completion",
    "impl:CommandVisibilityError::into_completion",
    "impl:Vm::invoke_hidden_in_child..impl:Vm::take_invoked_sidecar",
    "impl:Vm::command_visibility_policy..impl:Vm::own_hidden_names",
    "impl:Vm::invoke_hidden_by_id..impl:Vm::invoke_own_hidden_in_namespace",
]

[[module]]
name = "child_command"
doc = "The child-as-command form (`$child sub ?arg ...?`): dispatch of its subcommands for C and Jim children."
items = ["impl:Vm::child_wrong_arguments..impl:Vm::child_hide_by_id"]
