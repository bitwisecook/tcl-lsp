# The facade keeps `Value`, the object and representation types (`Obj`,
# `IntRep`, `DictRep`, `ByteArrayRep`, the cache structs: every module reads
# their private fields), lifetime leases, the plain constructors (`string`,
# `int`, `double`, `bool`, `list`, native string constructors), the shared
# stage checks and `replace_primary*`, and the invocation-list views used for
# error context.
file = "rust/tcl-vm/src/value.rs"

