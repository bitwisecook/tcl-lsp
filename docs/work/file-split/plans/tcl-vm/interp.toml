# First level of two. The facade keeps the interpreter model: `Vm`,
# `InterpState` and every state struct (the existing `interp/` modules and
# the modules below read their private fields, so the structs stay while
# their methods move), the `Deref` from `Vm` to the current `InterpState`,
# `ok`/`err`, and `standard_host`.
#
# `configuration`, `interpreters`, `commands`, `namespaces`, `traces`,
# `variables`, `errors`, `compilation` and `runtime_api` are split again by
# plans/tcl-vm/interp/<name>.toml; the other modules are final.
file = "rust/tcl-vm/src/interp.rs"

