# The facade keeps the protocol and policy types (`NativeNameProtocol`,
# `NamePolicyProtocol`, `NativeNamePurpose`, `NativeNameContext`), the
# projections every part returns, recipe selection, the subcommand and
# package inputs and the private `projection` helpers all parts share.
# The loose `#[test]` functions below `mod tests;` move to three test
# modules: declare those `#[cfg(test)] mod` (the tool writes a plain `mod`).
