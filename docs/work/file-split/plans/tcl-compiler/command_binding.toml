# First of two levels. The facade keeps the module docs, the binding lattice
# (`BindingKind`, `Binding`, `MayBinding`) and the structs whose private fields
# the existing child modules read: `SourceCommandBindings`,
# `ModuleCommandBindings`, `SourceInvocationBinding`, `SourceOutcomes` and the
# other walk carriers. `source_walk` and `module_bindings` are split again by
# `command_binding/source_walk.toml` and `command_binding/module_bindings.toml`.
file = "rust/tcl-compiler/src/command_binding.rs"

[[module]]
name = "command_identity"
doc = "Command identity: the token that survives slot movement and the allocation that created it."
items = [
    "struct:CommandIdentity..type:CommandToken",
    "struct:CommandAllocationSite..struct:CommandAllocation",
    "impl:CommandAllocation",
]

