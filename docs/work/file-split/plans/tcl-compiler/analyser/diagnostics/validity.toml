    "impl:Analyser::emit_w004_dialect_invalid_option..impl:Analyser::emit_w145_ambiguous_option",
]

[[module]]
name = "stub_shadows"
doc = "W116 and W117: a stub `proc` that shadows a built-in command or `expr` function."
items = [
