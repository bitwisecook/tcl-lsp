    "fn:is_builtin_math_function..fn:is_irules_only_expr_op",
]

[[module]]
name = "expr_operators"
doc = "W003 and W002 inside `expr`: operators and math functions the active dialect does not have, and the portable rewrite of a gated operator."
items = [
