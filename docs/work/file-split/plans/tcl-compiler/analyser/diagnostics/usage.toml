    "fn:original_word_has_pad_space",
    "impl:Analyser::emit_w104_append_list..impl:Analyser::w104_lappend_fix",
    "impl:Analyser::variable_name_positions..impl:Analyser::emit_w216_brace_then_paren",
    "fn:build_w216_replacement",
]

[[module]]
name = "expression_rewrites"
doc = "A redundant nested `expr` (W114) and `==` / `!=` on strings (W110), with their rewrites."
