    "impl:Analyser::emit_binary_field_version_gates..impl:Analyser::emit_w108_non_ascii",
    "fn:is_standard_ascii..fn:nearest_valid_mask",
]

[[module]]
name = "variable_arguments"
doc = "Arguments that name or extend a variable: `lappend` on a non-list (W104), a value where a name belongs (W212) and a broken `${name}(...)` element (W216)."
