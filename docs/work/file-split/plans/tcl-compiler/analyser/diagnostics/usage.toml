# The facade keeps the module docs, the `source_channel` module and
# `original_expression_parser_context`, which the expression checks share.
file = "rust/tcl-compiler/src/analyser/diagnostics/usage.rs"

[[module]]
name = "unbraced_words"
doc = "Unbraced expressions (W100), script bodies (W105) and `switch` bodies (W106)."
items = [
    "struct:UnbracedSourceExpression..fn:original_word_is_hex_conversion",
    "fn:original_word_has_substitution",
    "impl:Analyser::emit_w105_unbraced_body..impl:Analyser::push_w100",
    "impl:Analyser::emit_w106_unbraced_switch_body..impl:Analyser::push_w106",
    "fn:is_safe_literal..fn:is_safe_literal_expr_in_context",
]

[[module]]
name = "literal_contents"
doc = "What a literal argument holds: `binary` template gates (W200, W202), a subnet mask (W121) and non-ASCII text (W108)."
