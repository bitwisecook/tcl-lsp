    "impl:FunctionUnit::interproc_taints",
    "impl:FunctionUnit::interproc_taints_with_source",
    "impl:CompilationUnit::original_interproc_taints_for_body",
    "impl:CompilationUnit::with_interprocedural..impl:CompilationUnit::with_interprocedural_callback",
]

[[module]]
