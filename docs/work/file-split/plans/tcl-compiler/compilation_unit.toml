# The facade keeps `FunctionUnit` and `CompilationUnit` with their fact
# structs, `UnitBuildOptions`, the input structs one stage builds for another
# (`FunctionBuildInputs`, `ModuleWideFacts`, `BodyUnitContext`,
# `DeclaredBodyMemoContext`, `ProcedureBuildContext`, the original-body cache
# inputs) and the debug-only pipeline trace, whose thread-local cannot move.
# The two large impls are split by concern, one impl block a file.
file = "rust/tcl-compiler/src/compilation_unit.rs"

[[module]]
name = "lattice_request"
doc = "`LatticeRequest`: one procedure's baseline-lattice build request for the memo callback, and the encoding of its parameter seeds."
items = ["struct:LatticeRequest..type:ProcLatticeCache", "fn:encode_param_constants", "fn:decode_param_constants"]

[[module]]
name = "function_build"
doc = "Building a `FunctionUnit`: the `build*` constructors and the shared full pipeline behind them (SSA, SCCP, derived artefacts)."
items = [
    "struct:FullSccpInputs..fn:build_full_derived_artifacts",
    "impl:FunctionUnit::build..impl:FunctionUnit::trivial_guarded",
    "fn:extend_existence_folds..fn:function_source_entry",
]

[[module]]
name = "function_queries"
doc = "`FunctionUnit` accessors: retained source metadata, semantic values, existence facts and source positions."
items = [
    "impl:FunctionUnit::with_body_id..impl:FunctionUnit::requires_native_math_binding_validation",
    "impl:FunctionUnit::existence..impl:FunctionUnit::word_at",
]

[[module]]
name = "template_instantiation"
doc = "Instantiating a body template: restoring source proofs and relocating variable proofs through an alpha-renaming."
items = [
    "fn:relocate_statement_variable_proofs",
    "impl:FunctionUnit::restored_source_proofs..impl:FunctionUnit::relocated_variable_proofs",
]

[[module]]
name = "memory_and_semantic_facts"
doc = "Memory SSA and semantic facts attached on demand, for one function and for the whole unit."
items = [
    "impl:FunctionUnit::with_memory_ssa..impl:FunctionUnit::semantic_facts_with_metadata",
    "impl:CompilationUnit::with_memory_ssa..impl:CompilationUnit::with_deep_semantic_analysis",
]

[[module]]
name = "interprocedural_analysis"
doc = "The interprocedural pass over a finished unit: summaries, the memoised taint cascade and per-body taint reruns."
