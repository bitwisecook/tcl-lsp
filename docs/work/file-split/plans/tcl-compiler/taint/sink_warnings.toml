# Second level, for the `sink_warnings` module that `taint.toml` creates. The
# facade keeps the per-function entry points (`find_taint_warnings*`,
# `taint_warning_report_impl`), the shadowed-builtin scan, the
# `SinkWarningContext` impl and `BranchTaintCtx`, which the report loop builds.
file = "rust/tcl-compiler/src/taint/sink_warnings.rs"

[[module]]
name = "classification"
doc = "Which sink a command is: the diagnostic code and label from the selected registry schema, and the network and cross-interpreter sinks."
items = ["fn:classify_sink..fn:classify_network_interp_sinks"]

[[module]]
name = "double_encode"
doc = "T106: a tainted value encoded twice by the same transform."
items = ["fn:emit_double_encode_warnings"]

