    "struct:UplevelLevel..fn:invalidate_const_map_for",
    "impl:<'r> Lowerer<'r>::in_procedure_frame..impl:<'r> Lowerer<'r>::retain_script_source",
    "impl:<'r> Lowerer<'r>::current_source_channel..impl:<'r> Lowerer<'r>::const_map_lookup",
    "impl:<'r> Lowerer<'r>::try_lower_uplevel_static..impl:<'r> Lowerer<'r>::walk_namespace_eval_body",
]

