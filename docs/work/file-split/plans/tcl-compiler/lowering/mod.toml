# First of two levels. The facade keeps the module docs, `Lowerer` and the
# configuration enums its private fields hold, the `lower*` target methods,
# the `lower_to_ir*` family, the fatal-parse-error queries and the word-shape
# predicates every group shares. `script_bodies`, `commands` and
# `declarations` are split again by the plans named after them.
file = "rust/tcl-compiler/src/lowering/mod.rs"

[[module]]
name = "configuration"
doc = "Constructing and configuring a `Lowerer`: dialect, registries, source metadata, body caches and the bytecode entry."
items = [
    "fn:context_with_command_store",
    "impl:<'r> Lowerer<'r>::new..impl:<'r> Lowerer<'r>::select_bytecode_entry",
    "impl:<'r> Lowerer<'r>::set_source_analysis_options..impl:<'r> Lowerer<'r>::set_source_image_channel",
]

[[module]]
name = "module_assembly"
doc = "Starting and finishing a module: the entry frame and runtime target namespace, the final passes and the variable-trace facts."
items = [
    "impl:<'r> Lowerer<'r>::retain_module_source_bindings..impl:<'r> Lowerer<'r>::start_module",
    "impl:Lowerer<'_>#2",
    "fn:populate_trace_facts..fn:walk_for_trace",
]

[[module]]
name = "script_bodies"
