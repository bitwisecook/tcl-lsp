# list and the call-site enumeration every collector shares.
file = "rust/tcl-compiler/src/common_aot_plan.rs"

[[module]]
name = "direct_calls"
doc = "Direct procedure calls: the evidence and decline types, formal binding, body specialisation and the collector."
