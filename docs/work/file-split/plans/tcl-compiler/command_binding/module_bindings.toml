    "enum:ResolvedFrameBodySelection..impl:ResolvedBindingInvocation",
    "impl:ModuleCommandBindings::resolve_statement..impl:ModuleCommandBindings::variable_read_projection_for_command_words_with_metadata_context",
]

[[module]]
name = "mutation_record"
doc = "Rebindings recorded as opaque, dynamic or unnameable, and the summaries projected from them."
items = [
    "impl:ModuleCommandBindings::mark_opaque_resolution..impl:ModuleCommandBindings::mark_receiver_frame_opacity",
    "impl:ModuleCommandBindings::mark_opaque_binding_mutation..impl:ModuleCommandBindings::record_proc_rebound_candidates",
    "impl:ModuleCommandBindings::changed_command_spellings..impl:ModuleCommandBindings::rebound_names",
]

[[module]]
name = "binding_transitions"
