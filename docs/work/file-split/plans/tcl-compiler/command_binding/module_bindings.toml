# Second level of `command_binding.toml`. The facade keeps the whole-module
# analysis entry points (`analyse`, `analyse_with_options`), the retained
# callable roots they replay and the history of redefined procedures.
file = "rust/tcl-compiler/src/command_binding/module_bindings.rs"

[[module]]
name = "target_resolution"
doc = "The targets a command word may reach: source keys, alias chains and unresolved dispatch."
items = [
    "impl:ModuleCommandBindings::absent_head_runs_nothing..impl:ModuleCommandBindings::unknown_handler_is_original",
    "impl:ModuleCommandBindings::definitely_absent",
    "impl:ModuleCommandBindings::receiver_context_head..impl:ModuleCommandBindings::declared_command_frame_effect",
    "impl:ModuleCommandBindings::targets..impl:ModuleCommandBindings::resolve_targets_with_prefixes_in",
]

[[module]]
name = "namespace_transitions"
doc = "Namespace transitions of the may-state and the command resolution they change."
items = [
    "fn:is_default_namespace_unknown_handler",
    "impl:NamespaceResolutionProjection::record..impl:NamespaceResolutionProjection::join",
    "fn:apply_namespace_ensure..fn:literal_subject",
]

[[module]]
name = "state_equality"
doc = "Equality, hashing and the observation stamp of a binding state."
items = [
    "struct:NonBindingObservationStamp",
    "impl:PartialEq for ModuleCommandBindings..impl:Eq for ModuleCommandBindings",
    "impl:ModuleCommandBindings::same_state..impl:ModuleCommandBindings::non_binding_observation_stamp",
    "impl:std::hash::Hash for ModuleCommandBindings",
    "impl:ModuleCommandBindings::same_command_world",
]

[[module]]
name = "source_order"
doc = "Source-order views of the state: a command's registry barrier and the statement timeline."
items = [
    "impl:ModuleCommandBindings::source_order_call_boundary..impl:ModuleCommandBindings::source_order_registry_barrier_for_command_with_metadata_context",
    "impl:ModuleCommandBindings::source_binding_timeline_from_boundary..impl:ModuleCommandBindings::source_binding_timeline_from_initial",
    "struct:SourceBindingTimeline..impl:SourceBindingTimeline",
]

[[module]]
name = "bounded_classes"
doc = "Bounded class constructions: recorded definitions, constructors and manufacture slots."
items = [
    "struct:BoundedClassConstruction",
    "impl:ModuleCommandBindings::default_construction_dependencies_hold..impl:ModuleCommandBindings::install_manufacture_slot",
    "fn:definition_body_command_tokens",
]

[[module]]
name = "initial_state"
doc = "The initial binding state of a registry baseline and its entry options."
items = [
    "impl:ModuleCommandBindings::initial..impl:ModuleCommandBindings::effective_semantics",
    "impl:ModuleCommandBindings::hosted_rule_loader_world",
]

[[module]]
name = "resolved_invocation"
