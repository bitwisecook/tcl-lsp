# hoist the inline test modules `completed_world_owner_controls` and
# `closed_source_child_ingress_tests` first: they are 2,212 lines, a `mod` item cannot
# move, and `hoist_inline_tests.py` passes them by because their attribute is
# `#[cfg(all(test, not(target_family = "wasm")))]`, not `#[cfg(test)]`.
# The facade keeps every view, work-state and settlement type (their private fields are
# read across the modules), the contention constants and the `symbol_sources` re-exports.
file = "rust/tcl-lsp-server/src/readonly_reference_reports/source_views.rs"
hoist = ["completed_world_owner_controls", "closed_source_child_ingress_tests"]

