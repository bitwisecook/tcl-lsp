# First of two levels. The crate root keeps the crate docs, `Backend`, `BackendState`
# (every module reads its fields), `DocumentState` and the constructors; each module
# below is one subsystem and is split again by the plan named after it.
# `language_server` is the one `impl LanguageServer for Backend` (3,376 lines): a trait
# impl moves whole, so it stays over the limit until its handler bodies become
# inherent methods.
