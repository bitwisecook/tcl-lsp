# The facade keeps the `CommandRegistry` struct with its caches, the shared
# spec groups and spec packs, generation and overlay bookkeeping, and the
# private helpers every topic module calls (`best_visible`, `query_surfaces`,
# `spec_for_this_registry`, `package_floor*`, the control numeral grammar and
# release, `effect_provider_is_admitted`). The 7,500-line `impl CommandRegistry`
# is split by the question a group of methods answers.
file = "rust/tcl-registry/src/registry.rs"

[[module]]
name = "snapshot"
doc = "An immutable, comparable snapshot of a registry and the keys that identify its semantics."
items = ["struct:RegistrySnapshot..impl:Hash for RegistrySemanticKey", "impl:CommandRegistry::snapshot"]

[[module]]
name = "construction"
doc = "Building a registry: the default build, loading a surface, projecting for a profile, and inserting specs, reference texts and ambient packages."
items = ["impl:CommandRegistry::build_default..impl:CommandRegistry::insert_special_var"]

