# The facade keeps `InvocationSemantics`, `ResolvedInvocation` with its
# constructors and the private helpers several topic modules call, the form
# and availability types, and the queries that fit no narrower topic (option
# effects, substitutions, return type, presentation, diagnostics, literal
# replacement).
# The 4,123-line `impl ResolvedInvocation` is split by the question each
# group of methods answers; each answer type moves with the methods that build
# it. The `#[test]` functions written inline in this file move to
# `variable_receiver_tests`.
file = "rust/tcl-registry/src/resolved_invocation.rs"

[[module]]
name = "operation_resolution"
doc = "Which semantic operation and merged semantics the command, subcommand and form descriptors select for one invocation."
items = ["fn:descriptor_operation..fn:resolve_invocation_semantics"]

[[module]]
name = "subcommand_resolution"
doc = "The outcome of resolving a subcommand word: resolved, ambiguous, unknown or unresolved, borrowed and owned."
items = ["struct:ResolvedSubcommand..impl:<'r, 'w> StructuredInvocationResolution<'r, 'w>"]

