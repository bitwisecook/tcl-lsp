# First of two levels. The facade keeps the object-system types (`Method`,
# `Class`, `Object`, `CallStep`, `OoFrame`, `OoState`, `OoExec` and the
# publication records: every part reads their private fields), the
# `oo_original_*` macros, the error helpers and the small `Interp` accessors
# (`active_def_target`, `oo_next_id`, `oo_refused_publication`).
# `introspection` and `engine` are split again by
# `plans/runtime/cmd_oo/introspection.toml` and `plans/runtime/cmd_oo/engine.toml`.
file = "runtime/rust/src/cmd_oo.rs"

