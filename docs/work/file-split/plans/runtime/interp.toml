# First of two levels. The facade keeps the module contract, `Interp`,
# `InterpState` and the types whose private fields the existing `interp/*`
# children read (`Code`, `CmdFrame`, `ExceptionState`, the error snapshots,
# `CoroContext`, `ObjCommand`, `ProcDef`, the publication records,
# `EnsembleRewrite`), the `thread_local!` block, and a handful of accessors
# (`in_proc`, the pending `exit`, `events_mut`, `clone_handle`, the PRNG).
# `setup`, `commands`, `variables`, `errors`, `evaluation` and `dispatch` are
# split again by the plans under `plans/runtime/interp/`.
file = "runtime/rust/src/interp.rs"

[[module]]
name = "setup"
doc = "Constructing an interpreter and selecting the world it runs in: host, release, pinned context, invocation protocols and the bootstrap."
items = [
    "const:DEFAULT_RUNTIME_VERSION..fn:default_host",
