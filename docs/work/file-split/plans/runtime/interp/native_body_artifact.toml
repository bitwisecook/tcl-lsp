# The facade keeps the artifact model (`NativeBodyArtifact`, `Script`, the
# instruction structs, `Operation`, `Builder`, `BodyExecution`: the operation
# modules beside it read their private fields), the bytecode object type and
# the cache install. The core builder and executor methods move; the existing
# `native_*` children keep their per-operation halves.
file = "runtime/rust/src/interp/native_body_artifact.rs"

