# Standalone, workspace-excluded experiment for the SRV-ROPE track.
#
# Quantifies the cost a rope-backed DocumentState would save (edit splice +
# line-index rebuild) against the cost it cannot avoid (the O(n) String the
# salsa `SourceFile` input still demands) across file sizes, edit-burst sizes,
# high edit rates, and many-small-document memory footprint.
#
# Run:  cargo run --release --manifest-path docs/design/rope/experiment/Cargo.toml
#
# Deliberately NOT a workspace member (it pulls `ropey`, which is not a
# production dependency, and it is build/run on demand, not in CI).
[package]
name = "rope-experiment"
version = "0.0.0"
edition = "2021"
publish = false

# Own workspace root so it stays fully isolated from the main tcl-lsp workspace.
[workspace]

[dependencies]
# The production line-index the server rebuilds on every edit; depended on by
# path so the String arm measures the *real* code, not an approximation.
tcl-lexer = { path = "../../../../rust/tcl-lexer" }
# The rope the rust-rewrite plan ratified for the document store.
ropey = "1.6"

[profile.release]
opt-level = 3
