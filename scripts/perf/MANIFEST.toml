# --- benchmark scopes ---------------------------------------------------------
#
# The full corpus is ~2400 .tcl files, which is the right scale for the
# workspace-scan and steady-state memory measurements but too slow to run the
# per-check suite against on every release. `bench.py --scope` selects one.
#
# `small` is deliberately the georgtree group alone: it is the smallest scope
# that still contains SpiceGenTcl, so it reproduces #1297 while running in
# seconds rather than minutes.

# Files that must be opened by every run when present, regardless of the
# seeded selection. These pin *known pathological shapes* so a suite that
# happens to seed onto four easy files cannot report a clean bill of health:
# `tcl_tools/mathutil.tcl` is the 26 s `references` / `codeLens/resolve` case
# in #1297 (top-level `proc`s resolved against SpiceGenTcl's source+package
# graph). Add an entry here whenever a perf issue is found, so the graph
# tracks it from then on.
[anchors]
paths = [
  "georgtree/tcl_tools/mathutil.tcl",
]

[scope.small]
groups = ["georgtree"]

[scope.medium]
groups = ["georgtree", "nico-robert", "aplsimple"]

[scope.full]
groups = ["georgtree", "nico-robert", "aplsimple", "tcltk", "other"]

# --- versions under test ------------------------------------------------------
#
# `get_server.py` resolves each of these to a binary: a published release asset
# where one exists, otherwise a build from the tag. Native `tcl-lsp-server`
# release assets begin at v2.1.5; v2.1.0 through v2.1.4 must be built from
# source, which is slow but cached.
#
# v2.1.2 is absent upstream (no release was cut).

[versions]
tags = [
  "v2.1.0", "v2.1.1", "v2.1.3", "v2.1.4", "v2.1.5", "v2.1.6", "v2.1.7",
  "v2.1.8", "v2.1.9", "v2.1.10", "v2.1.11", "v2.1.12", "v2.1.13", "v2.1.14",
  "v2.1.15", "v2.1.16",
]
# Tags at or above this have a published native server asset per platform.
first_with_release_asset = "v2.1.5"
asset_pattern = "tcl-lsp-server-{target}"
