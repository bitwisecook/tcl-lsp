# Pinned corpus for the cross-version performance benchmark (issue #1181).
#
# Every entry is pinned to an exact commit so a benchmark run in a year's
# time measures the same bytes as one today. A graph that compares v2.1.5
# against v2.1.16 is only meaningful if the workload did not move underneath
# it, so `fetch_corpus.py` refuses to proceed when a checkout does not match
# its pin rather than silently benchmarking different source.
#
# To advance a pin: change the `commit`, re-run every version's benchmark
# (results are not comparable across corpus revisions), and say so in the
# release notes. Do not advance pins piecemeal.

[corpus]
# Bumped whenever any pin below changes. Results carry this, and `report.py`
# refuses to plot results from two different revisions on one graph.
revision = 1

