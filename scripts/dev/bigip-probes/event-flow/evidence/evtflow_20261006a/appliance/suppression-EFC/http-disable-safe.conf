ltm rule /Common/__tcl_lsp_evtflow_EFC_http_disable_safe {
    when HTTP_REQUEST priority 400 {
        set evtflow_suppression_id [HTTP::header value X-Evtflow-Request]
        log local0. "EVTFLOW|run=EFC|probe=suppression-safe|case=http-disable-safe|point=before|request=$evtflow_suppression_id|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
        HTTP::disable
        log local0. "EVTFLOW|run=EFC|probe=suppression-safe|case=http-disable-safe|point=after|request=$evtflow_suppression_id|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
}
