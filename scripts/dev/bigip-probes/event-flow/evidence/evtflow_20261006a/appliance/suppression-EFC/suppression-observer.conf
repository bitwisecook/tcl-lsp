ltm rule /Common/__tcl_lsp_evtflow_EFC_suppression_observer {
    when HTTP_REQUEST priority 500 {
        log local0. "EVTFLOW|run=EFC|probe=suppression-observer|event=HTTP_REQUEST|request=$evtflow_suppression_id|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
    when HTTP_DISABLED priority 500 {
        log local0. "EVTFLOW|run=EFC|probe=suppression-observer|event=HTTP_DISABLED|request=$evtflow_suppression_id|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
    when HTTP_RESPONSE priority 500 {
        log local0. "EVTFLOW|run=EFC|probe=suppression-observer|event=HTTP_RESPONSE|request=$evtflow_suppression_id|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
    when CLIENT_CLOSED priority 500 {
        log local0. "EVTFLOW|run=EFC|probe=suppression-observer|event=CLIENT_CLOSED|request=$evtflow_suppression_id|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
}
