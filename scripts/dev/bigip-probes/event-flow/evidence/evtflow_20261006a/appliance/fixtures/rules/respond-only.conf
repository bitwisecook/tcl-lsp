ltm rule /Common/__tcl_lsp_evtflow_EFA_respond_only {
    when HTTP_REQUEST priority 400 {
        log local0. "EVTFLOW|run=EFA|probe=suppression|case=respond-only|point=before|request=[HTTP::header value X-Evtflow-Request]|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
        HTTP::respond 204 -version auto noserver Connection close
        log local0. "EVTFLOW|run=EFA|probe=suppression|case=respond-only|point=after|request=[HTTP::header value X-Evtflow-Request]|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
}
