ltm rule /Common/__tcl_lsp_evtflow_EFA_http_trace {
    when RULE_INIT {
        log local0. "EVTFLOW|run=EFA|probe=http|event=RULE_INIT|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
    when CLIENT_ACCEPTED {
        set evtflow_seq 0
        set evtflow_request none
        set evtflow_txn 0
        set evtflow_flow [format {%s:%s-%s:%s} [IP::client_addr] [TCP::client_port] [IP::local_addr] [TCP::local_port]]
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=CLIENT_ACCEPTED|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq"
    }
    when CLIENTSSL_CLIENTHELLO {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=CLIENTSSL_CLIENTHELLO|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq"
    }
    when CLIENTSSL_SERVERHELLO_SEND {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=CLIENTSSL_SERVERHELLO_SEND|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq"
    }
    when CLIENTSSL_HANDSHAKE {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=CLIENTSSL_HANDSHAKE|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq|cipher=[SSL::cipher name]|version=[SSL::cipher version]"
    }
    when HTTP_REQUEST {
        incr evtflow_txn
        set evtflow_request [HTTP::header value X-Evtflow-Request]
        if {$evtflow_request eq ""} { set evtflow_request none }
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=HTTP_REQUEST|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq|request=$evtflow_request|txn=$evtflow_txn|method=[HTTP::method]|uri=[HTTP::uri]|version=[HTTP::version]"
        if {[HTTP::header exists Content-Length] && [HTTP::header value Content-Length] > 0} {
            HTTP::collect [HTTP::header value Content-Length]
        }
    }
    when HTTP_REQUEST_DATA {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=HTTP_REQUEST_DATA|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq|request=$evtflow_request|bytes=[HTTP::payload length]"
        HTTP::release
    }
    when LB_SELECTED {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=LB_SELECTED|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq|request=$evtflow_request|member=[LB::server addr]:[LB::server port]"
    }
    when LB_FAILED {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=LB_FAILED|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq|request=$evtflow_request"
    }
    when SERVER_INIT {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=SERVER_INIT|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq|request=$evtflow_request"
    }
    when SA_PICKED {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=SA_PICKED|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq|request=$evtflow_request"
    }
    when SERVER_CONNECTED {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=SERVER_CONNECTED|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq|request=$evtflow_request|peer=[IP::server_addr]:[TCP::server_port]"
    }
    when SERVERSSL_CLIENTHELLO_SEND {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=SERVERSSL_CLIENTHELLO_SEND|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq|request=$evtflow_request"
    }
    when SERVERSSL_SERVERHELLO {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=SERVERSSL_SERVERHELLO|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq|request=$evtflow_request"
    }
    when SERVERSSL_SERVERCERT {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=SERVERSSL_SERVERCERT|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq|request=$evtflow_request"
    }
    when SERVERSSL_HANDSHAKE {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=SERVERSSL_HANDSHAKE|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq|request=$evtflow_request"
    }
    when HTTP_REQUEST_SEND {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=HTTP_REQUEST_SEND|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq|request=$evtflow_request"
    }
    when HTTP_REQUEST_RELEASE {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=HTTP_REQUEST_RELEASE|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq|request=$evtflow_request"
    }
    when HTTP_RESPONSE_CONTINUE {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=HTTP_RESPONSE_CONTINUE|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq|request=$evtflow_request"
    }
    when HTTP_RESPONSE {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=HTTP_RESPONSE|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq|request=$evtflow_request|status=[HTTP::status]|version=[HTTP::version]"
        if {[HTTP::header exists X-Evtflow-Collect]} { HTTP::collect }
    }
    when HTTP_RESPONSE_DATA {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=HTTP_RESPONSE_DATA|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq|request=$evtflow_request|bytes=[HTTP::payload length]"
        HTTP::release
    }
    when HTTP_RESPONSE_RELEASE {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=HTTP_RESPONSE_RELEASE|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq|request=$evtflow_request"
    }
    when HTTP_DISABLED {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=HTTP_DISABLED|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq|request=$evtflow_request"
    }
    when HTTP_REJECT {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=HTTP_REJECT|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq|request=$evtflow_request"
    }
    when SERVER_CLOSED {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=SERVER_CLOSED|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq|request=$evtflow_request"
    }
    when CLIENT_CLOSED {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=CLIENT_CLOSED|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq|request=$evtflow_request"
    }
}
