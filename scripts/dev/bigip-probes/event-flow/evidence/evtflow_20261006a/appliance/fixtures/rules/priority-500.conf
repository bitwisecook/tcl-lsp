ltm rule /Common/__tcl_lsp_evtflow_EFA_priority_500 {
    when CLIENT_ACCEPTED priority 500 {
        log local0. "EVTFLOW|run=EFA|probe=priority|event=CLIENT_ACCEPTED|priority=500|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
    when HTTP_REQUEST priority 500 {
        log local0. "EVTFLOW|run=EFA|probe=priority|event=HTTP_REQUEST|priority=500|request=[HTTP::header value X-Evtflow-Request]|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
    when HTTP_RESPONSE priority 500 {
        log local0. "EVTFLOW|run=EFA|probe=priority|event=HTTP_RESPONSE|priority=500|status=[HTTP::status]|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
}
