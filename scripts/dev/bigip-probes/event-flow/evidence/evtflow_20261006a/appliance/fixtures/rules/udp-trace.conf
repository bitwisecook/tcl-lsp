ltm rule /Common/__tcl_lsp_evtflow_EFA_udp_trace {
    when RULE_INIT {
        log local0. "EVTFLOW|run=EFA|probe=udp|event=RULE_INIT|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
    when CLIENT_ACCEPTED {
        set evtflow_seq 0
        set evtflow_flow [format {%s:%s-%s:%s} [IP::client_addr] [UDP::client_port] [IP::local_addr] [UDP::local_port]]
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=CLIENT_ACCEPTED|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq|bytes=[UDP::payload length]"
    }
    when LB_SELECTED {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=LB_SELECTED|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq"
    }
    when LB_FAILED {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=LB_FAILED|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq"
    }
    when SERVER_CONNECTED {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=SERVER_CONNECTED|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq"
    }
    when CLIENT_DATA {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=CLIENT_DATA|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq|bytes=[UDP::payload length]"
    }
    when SERVER_DATA {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=SERVER_DATA|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq|bytes=[UDP::payload length]"
    }
    when SERVER_CLOSED {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=SERVER_CLOSED|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq"
    }
    when CLIENT_CLOSED {
        incr evtflow_seq
        log local0. "EVTFLOW|run=EFA|probe=flow|event=CLIENT_CLOSED|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|flow=$evtflow_flow|seq=$evtflow_seq"
    }
}
