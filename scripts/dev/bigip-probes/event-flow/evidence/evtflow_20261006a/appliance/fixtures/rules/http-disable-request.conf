ltm rule /Common/__tcl_lsp_evtflow_EFA_http_disable_request {
    when HTTP_REQUEST priority 400 {
        log local0. "EVTFLOW|run=EFA|probe=suppression|case=http-disable-request|point=before|request=[HTTP::header value X-Evtflow-Request]|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
        HTTP::disable
        log local0. "EVTFLOW|run=EFA|probe=suppression|case=http-disable-request|point=after|request=[HTTP::header value X-Evtflow-Request]|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
}
