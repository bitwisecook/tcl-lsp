ltm rule /Common/__tcl_lsp_evtflow_EFA_reject_disable_all {
    when HTTP_REQUEST priority 400 {
        log local0. "EVTFLOW|run=EFA|probe=suppression|case=reject-disable-all|point=before|request=[HTTP::header value X-Evtflow-Request]|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
        reject
                event disable all
        log local0. "EVTFLOW|run=EFA|probe=suppression|case=reject-disable-all|point=after|request=[HTTP::header value X-Evtflow-Request]|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
}
