ltm rule /Common/__tcl_lsp_evtflow_EFA_reject_only {
    when HTTP_REQUEST priority 400 {
        log local0. "EVTFLOW|run=EFA|probe=suppression|case=reject-only|point=before|request=[HTTP::header value X-Evtflow-Request]|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
        reject
        log local0. "EVTFLOW|run=EFA|probe=suppression|case=reject-only|point=after|request=[HTTP::header value X-Evtflow-Request]|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
}
