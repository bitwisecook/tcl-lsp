ltm rule /Common/__tcl_lsp_evtflow_EFB_priority_100 {
    when CLIENT_ACCEPTED priority 100 {
        log local0. "EVTFLOW|run=EFB|probe=priority|event=CLIENT_ACCEPTED|priority=100|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
    when HTTP_REQUEST priority 100 {
        log local0. "EVTFLOW|run=EFB|probe=priority|event=HTTP_REQUEST|priority=100|request=[HTTP::header value X-Evtflow-Request]|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
    when HTTP_RESPONSE priority 100 {
        log local0. "EVTFLOW|run=EFB|probe=priority|event=HTTP_RESPONSE|priority=100|status=[HTTP::status]|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
}
