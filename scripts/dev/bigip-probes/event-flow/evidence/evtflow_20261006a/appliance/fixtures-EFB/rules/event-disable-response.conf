ltm rule /Common/__tcl_lsp_evtflow_EFB_event_disable_response {
    when HTTP_REQUEST priority 400 {
        log local0. "EVTFLOW|run=EFB|probe=suppression|case=event-disable-response|point=before|request=[HTTP::header value X-Evtflow-Request]|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
        event disable HTTP_RESPONSE
        log local0. "EVTFLOW|run=EFB|probe=suppression|case=event-disable-response|point=after|request=[HTTP::header value X-Evtflow-Request]|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
}
