ltm profile web-acceleration /EVTFLOW_EFB/__tcl_lsp_evtflow_EFB_cache_profile {
    defaults-from /Common/webacceleration
    cache-object-min-size 0
}
ltm pool /EVTFLOW_EFB/__tcl_lsp_evtflow_EFB_cache_pool {
    members {
        /EVTFLOW_EFB/__tcl_lsp_evtflow_EFB_node:18601 { address 192.168.9.80 }
    }
}
ltm virtual /EVTFLOW_EFB/__tcl_lsp_evtflow_EFB_cache_vs {
    destination 192.168.9.24:18506
    ip-protocol tcp
    mask 255.255.255.255
    pool /EVTFLOW_EFB/__tcl_lsp_evtflow_EFB_cache_pool
    profiles {
        /EVTFLOW_EFB/__tcl_lsp_evtflow_EFB_cache_profile { }
        /Common/http { }
        /Common/tcp { }
    }
    rules { /Common/__tcl_lsp_evtflow_EFB_http_trace /Common/__tcl_lsp_evtflow_EFB_cache_trace }
    source 0.0.0.0/0
    source-address-translation { type automap }
}
