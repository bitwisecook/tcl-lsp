ltm rule /Common/__tcl_lsp_evtflow_EFB_sip_trace {
    when SIP_REQUEST {
        log local0. "EVTFLOW|run=EFB|probe=sip|event=SIP_REQUEST|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
    when SIP_REQUEST_SEND {
        log local0. "EVTFLOW|run=EFB|probe=sip|event=SIP_REQUEST_SEND|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
    when SIP_RESPONSE {
        log local0. "EVTFLOW|run=EFB|probe=sip|event=SIP_RESPONSE|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
    when SIP_RESPONSE_SEND {
        log local0. "EVTFLOW|run=EFB|probe=sip|event=SIP_RESPONSE_SEND|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
}
