ltm rule /Common/__tcl_lsp_evtflow_EFB_rtsp_trace {
    when RTSP_REQUEST {
        log local0. "EVTFLOW|run=EFB|probe=rtsp|event=RTSP_REQUEST|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
    when RTSP_REQUEST_DATA {
        log local0. "EVTFLOW|run=EFB|probe=rtsp|event=RTSP_REQUEST_DATA|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
    when RTSP_RESPONSE {
        log local0. "EVTFLOW|run=EFB|probe=rtsp|event=RTSP_RESPONSE|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
    when RTSP_RESPONSE_DATA {
        log local0. "EVTFLOW|run=EFB|probe=rtsp|event=RTSP_RESPONSE_DATA|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
}
