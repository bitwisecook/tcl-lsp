apm aaa active-directory /Common/__tcl_lsp_evtflow_efo_complex_ad_server {
    domain lab.bitwisecook.org
    domain-controller 192.168.9.251
    domain-controllers { ad.lab.bitwisecook.org { ip 192.168.9.251 } }
}
apm aaa ldap /Common/__tcl_lsp_evtflow_efo_complex_ldap_server {
    address 192.168.9.250
    admin-dn "cn=admin,dc=bitwisecook,dc=org"
    admin-encrypted-password "!evtflow-admin-2026"
    base-dn "dc=bitwisecook,dc=org"
    port 1389
    use-pool disabled
}
net dns-resolver /Common/__tcl_lsp_evtflow_efo_complex_resolver { route-domain 0 }
apm aaa oauth-provider /Common/__tcl_lsp_evtflow_efo_complex_oidc_provider {
    allow-self-signed-jwk-cert yes
    authentication-uri https://192.168.9.252:8443/realms/evtflow/protocol/openid-connect/auth
    openid-cfg-uri https://192.168.9.252:8443/realms/evtflow/.well-known/openid-configuration
    token-uri https://192.168.9.252:8443/realms/evtflow/protocol/openid-connect/token
    trusted-ca-bundle /Common/__tcl_lsp_evtflow_efo_complex_keycloak_ca
    type custom
    use-auto-jwt-config true
    userinfo-request-uri https://192.168.9.252:8443/realms/evtflow/protocol/openid-connect/userinfo
}
apm aaa oauth-server /Common/__tcl_lsp_evtflow_efo_complex_oidc_server {
    client-id evtflow-apm
    client-secret "evtflow-oidc-client-secret-2026"
    client-serverssl-profile-name /Common/serverssl
    dns-resolver-name /Common/__tcl_lsp_evtflow_efo_complex_resolver
    mode client
    provider-name /Common/__tcl_lsp_evtflow_efo_complex_oidc_provider
}
apm aaa oauth-request /Common/__tcl_lsp_evtflow_efo_complex_auth_request {
    method get
    parameters {
        client_id { type client-id }
        redirect_uri { type redirect-uri }
        response_type { type response-type }
        scope { type scope }
    }
    type auth-redirect-request
}
apm aaa oauth-request /Common/__tcl_lsp_evtflow_efo_complex_token_request {
    method post
    parameters {
        client_id { type client-id }
        client_secret { type client-secret }
        grant_type { type grant-type }
        redirect_uri { type redirect-uri }
    }
    type token-request
}
apm aaa oauth-request /Common/__tcl_lsp_evtflow_efo_complex_userinfo_request {
    headers { Authorization { value "Bearer %{session.oauth.client.last.access_token}" } }
    method get
    type openid-userinfo-request
}
apm policy customization-group /Common/__tcl_lsp_evtflow_efo_complex_logon_cg { source standard type logon }
apm policy customization-group /Common/__tcl_lsp_evtflow_efo_complex_otp_cg { source standard type logon }
apm policy agent logon-page /Common/__tcl_lsp_evtflow_efo_complex_ad_logon_ag {
    customization-group /Common/__tcl_lsp_evtflow_efo_complex_logon_cg
    fieldtype1 text
    field-type2 password
    post-var-name1 username
    post-var-name2 password
    sess-var-name1 username
    sess-var-name2 password
    type form-based
}
apm policy agent logon-page /Common/__tcl_lsp_evtflow_efo_complex_ldap_logon_ag {
    customization-group /Common/__tcl_lsp_evtflow_efo_complex_logon_cg
    fieldtype1 text
    field-type2 password
    post-var-name1 username
    post-var-name2 password
    sess-var-name1 username
    sess-var-name2 password
    type form-based
}
apm policy agent logon-page /Common/__tcl_lsp_evtflow_efo_complex_mfa_logon_ag {
    customization-group /Common/__tcl_lsp_evtflow_efo_complex_logon_cg
    fieldtype1 text
    field-type2 password
    post-var-name1 username
    post-var-name2 password
    sess-var-name1 username
    sess-var-name2 password
    type form-based
}
apm policy agent logon-page /Common/__tcl_lsp_evtflow_efo_complex_otp_logon_ag {
    customization-group /Common/__tcl_lsp_evtflow_efo_complex_otp_cg
    fieldtype1 none
    field-type2 password
    post-var-name2 password
    sess-var-name2 password
    type form-based
}
apm policy agent aaa-active-directory /Common/__tcl_lsp_evtflow_efo_complex_ad_auth_ag {
    auth-max-logon-attempt 1
    server /Common/__tcl_lsp_evtflow_efo_complex_ad_server
    type auth
}
apm policy agent aaa-active-directory /Common/__tcl_lsp_evtflow_efo_complex_mfa_ad_auth_ag {
    auth-max-logon-attempt 1
    server /Common/__tcl_lsp_evtflow_efo_complex_ad_server
    type auth
}
apm policy agent aaa-ldap /Common/__tcl_lsp_evtflow_efo_complex_ldap_auth_ag {
    max-logon-attempt 1
    server /Common/__tcl_lsp_evtflow_efo_complex_ldap_server
    type auth
    user-dn "uid=%{session.logon.last.username},ou=people,dc=bitwisecook,dc=org"
}
apm policy agent aaa-oauth /Common/__tcl_lsp_evtflow_efo_complex_oidc_auth_ag {
    auth-redirect-request /Common/__tcl_lsp_evtflow_efo_complex_auth_request
    grant-type authorization-code
    openid-connect disabled
    redirection-uri "https://app.bitwisecook.org:18840/oauth/client/redirect"
    scope "openid profile email"
    server /Common/__tcl_lsp_evtflow_efo_complex_oidc_server
    token-request /Common/__tcl_lsp_evtflow_efo_complex_token_request
    type client
}
apm policy agent otp-generate /Common/__tcl_lsp_evtflow_efo_complex_otp_generate_ag { otp-length 6 otp-timeout 300 }
apm policy agent otp-verify /Common/__tcl_lsp_evtflow_efo_complex_otp_verify_ag { max-logon-attempt 3 otp-source "%{session.logon.last.password}" }
apm policy agent irule-event /Common/__tcl_lsp_evtflow_efo_complex_public_event_ag { expect-data http id EFO_public_ok }
apm policy agent irule-event /Common/__tcl_lsp_evtflow_efo_complex_ad_event_ag { expect-data http id EFO_ad_ok }
apm policy agent irule-event /Common/__tcl_lsp_evtflow_efo_complex_ldap_event_ag { expect-data http id EFO_ldap_ok }
apm policy agent irule-event /Common/__tcl_lsp_evtflow_efo_complex_oidc_event_ag { expect-data http id EFO_oidc_ok }
apm policy agent irule-event /Common/__tcl_lsp_evtflow_efo_complex_otp_issued_ag { expect-data http id EFO_otp_issued }
apm policy agent irule-event /Common/__tcl_lsp_evtflow_efo_complex_mfa_event_ag { expect-data http id EFO_mfa_ok }
apm policy agent ending-allow /Common/__tcl_lsp_evtflow_efo_complex_allow_ag { }
apm policy agent ending-deny /Common/__tcl_lsp_evtflow_efo_complex_deny_ag { }
apm policy policy-item /Common/__tcl_lsp_evtflow_efo_complex_start {
    caption "Start"
    color 1
    item-type entry
    rules { { caption fallback next-item /Common/__tcl_lsp_evtflow_efo_complex_route } }
}
apm policy policy-item /Common/__tcl_lsp_evtflow_efo_complex_route {
    caption "Route by landing URI"
    color 1
    item-type action
    rules {
        { caption MFA expression "expr { [string match "/mfa*" [mcget {session.server.landinguri}]] }" next-item /Common/__tcl_lsp_evtflow_efo_complex_mfa_logon }
        { caption OIDC expression "expr { [string match "/oidc*" [mcget {session.server.landinguri}]] }" next-item /Common/__tcl_lsp_evtflow_efo_complex_oidc_auth }
        { caption AD expression "expr { [string match "/ad*" [mcget {session.server.landinguri}]] }" next-item /Common/__tcl_lsp_evtflow_efo_complex_ad_logon }
        { caption LDAP expression "expr { [string match "/ldap*" [mcget {session.server.landinguri}]] }" next-item /Common/__tcl_lsp_evtflow_efo_complex_ldap_logon }
        { caption fallback next-item /Common/__tcl_lsp_evtflow_efo_complex_public_event }
    }
}
apm policy policy-item /Common/__tcl_lsp_evtflow_efo_complex_public_event {
    agents { /Common/__tcl_lsp_evtflow_efo_complex_public_event_ag { type irule-event } }
    caption "Public scope"
    color 1
    item-type action
    rules { { caption fallback next-item /Common/__tcl_lsp_evtflow_efo_complex_allow } }
}
apm policy policy-item /Common/__tcl_lsp_evtflow_efo_complex_ad_logon {
    agents { /Common/__tcl_lsp_evtflow_efo_complex_ad_logon_ag { type logon-page } }
    caption "AD username/password"
    color 1
    item-type action
    rules { { caption fallback next-item /Common/__tcl_lsp_evtflow_efo_complex_ad_auth } }
}
apm policy policy-item /Common/__tcl_lsp_evtflow_efo_complex_ad_auth {
    agents { /Common/__tcl_lsp_evtflow_efo_complex_ad_auth_ag { type aaa-active-directory } }
    caption "Samba AD authentication"
    color 1
    item-type action
    rules {
        { caption Successful expression "expr { [mcget {session.ad.last.authresult}] == 1 }" next-item /Common/__tcl_lsp_evtflow_efo_complex_ad_event }
        { caption fallback next-item /Common/__tcl_lsp_evtflow_efo_complex_deny }
    }
}
apm policy policy-item /Common/__tcl_lsp_evtflow_efo_complex_ad_event {
    agents { /Common/__tcl_lsp_evtflow_efo_complex_ad_event_ag { type irule-event } }
    caption "AD scope"
    color 1
    item-type action
    rules { { caption fallback next-item /Common/__tcl_lsp_evtflow_efo_complex_allow } }
}
apm policy policy-item /Common/__tcl_lsp_evtflow_efo_complex_ldap_logon {
    agents { /Common/__tcl_lsp_evtflow_efo_complex_ldap_logon_ag { type logon-page } }
    caption "LDAP username/password"
    color 1
    item-type action
    rules { { caption fallback next-item /Common/__tcl_lsp_evtflow_efo_complex_ldap_auth } }
}
apm policy policy-item /Common/__tcl_lsp_evtflow_efo_complex_ldap_auth {
    agents { /Common/__tcl_lsp_evtflow_efo_complex_ldap_auth_ag { type aaa-ldap } }
    caption "OpenLDAP authentication"
    color 1
    item-type action
    rules {
        { caption Successful expression "expr { [mcget {session.ldap.last.authresult}] == 1 }" next-item /Common/__tcl_lsp_evtflow_efo_complex_ldap_event }
        { caption fallback next-item /Common/__tcl_lsp_evtflow_efo_complex_deny }
    }
}
apm policy policy-item /Common/__tcl_lsp_evtflow_efo_complex_ldap_event {
    agents { /Common/__tcl_lsp_evtflow_efo_complex_ldap_event_ag { type irule-event } }
    caption "LDAP scope"
    color 1
    item-type action
    rules { { caption fallback next-item /Common/__tcl_lsp_evtflow_efo_complex_allow } }
}
apm policy policy-item /Common/__tcl_lsp_evtflow_efo_complex_oidc_auth {
    agents { /Common/__tcl_lsp_evtflow_efo_complex_oidc_auth_ag { type aaa-oauth } }
    caption "Keycloak OAuth authorization code"
    color 1
    item-type action
    rules {
        { caption Successful expression "expr { [string length [mcget {session.oauth.client.last.access_token}]] > 0 }" next-item /Common/__tcl_lsp_evtflow_efo_complex_oidc_event }
        { caption fallback next-item /Common/__tcl_lsp_evtflow_efo_complex_deny }
    }
}
apm policy policy-item /Common/__tcl_lsp_evtflow_efo_complex_oidc_event {
    agents { /Common/__tcl_lsp_evtflow_efo_complex_oidc_event_ag { type irule-event } }
    caption "OIDC scope"
    color 1
    item-type action
    rules { { caption fallback next-item /Common/__tcl_lsp_evtflow_efo_complex_allow } }
}
apm policy policy-item /Common/__tcl_lsp_evtflow_efo_complex_mfa_logon {
    agents { /Common/__tcl_lsp_evtflow_efo_complex_mfa_logon_ag { type logon-page } }
    caption "MFA AD password"
    color 1
    item-type action
    rules { { caption fallback next-item /Common/__tcl_lsp_evtflow_efo_complex_mfa_ad } }
}
apm policy policy-item /Common/__tcl_lsp_evtflow_efo_complex_mfa_ad {
    agents { /Common/__tcl_lsp_evtflow_efo_complex_mfa_ad_auth_ag { type aaa-active-directory } }
    caption "MFA AD authentication"
    color 1
    item-type action
    rules {
        { caption Successful expression "expr { [mcget {session.ad.last.authresult}] == 1 }" next-item /Common/__tcl_lsp_evtflow_efo_complex_otp_generate }
        { caption fallback next-item /Common/__tcl_lsp_evtflow_efo_complex_deny }
    }
}
apm policy policy-item /Common/__tcl_lsp_evtflow_efo_complex_otp_generate {
    agents { /Common/__tcl_lsp_evtflow_efo_complex_otp_generate_ag { type otp-generate } }
    caption "Generate OTP"
    color 1
    item-type action
    rules { { caption fallback next-item /Common/__tcl_lsp_evtflow_efo_complex_otp_issued } }
}
apm policy policy-item /Common/__tcl_lsp_evtflow_efo_complex_otp_issued {
    agents { /Common/__tcl_lsp_evtflow_efo_complex_otp_issued_ag { type irule-event } }
