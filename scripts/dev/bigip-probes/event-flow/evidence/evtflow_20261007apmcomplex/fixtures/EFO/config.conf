    item-type action
    rules { { caption fallback next-item /Common/__tcl_lsp_evtflow_efo_complex_allow } }
}
apm policy policy-item /Common/__tcl_lsp_evtflow_efo_complex_allow {
    agents { /Common/__tcl_lsp_evtflow_efo_complex_allow_ag { type ending-allow } }
    caption Allow
    color 1
    item-type ending
}
apm policy policy-item /Common/__tcl_lsp_evtflow_efo_complex_deny {
    agents { /Common/__tcl_lsp_evtflow_efo_complex_deny_ag { type ending-deny } }
    caption Deny
    color 2
    item-type ending
}
apm policy access-policy /Common/__tcl_lsp_evtflow_efo_complex_policy {
    default-ending /Common/__tcl_lsp_evtflow_efo_complex_deny
    items {
        /Common/__tcl_lsp_evtflow_efo_complex_start { priority 1 }
        /Common/__tcl_lsp_evtflow_efo_complex_route { priority 2 }
        /Common/__tcl_lsp_evtflow_efo_complex_public_event { priority 3 }
        /Common/__tcl_lsp_evtflow_efo_complex_ad_logon { priority 4 }
        /Common/__tcl_lsp_evtflow_efo_complex_ad_auth { priority 5 }
        /Common/__tcl_lsp_evtflow_efo_complex_ad_event { priority 6 }
        /Common/__tcl_lsp_evtflow_efo_complex_ldap_logon { priority 7 }
        /Common/__tcl_lsp_evtflow_efo_complex_ldap_auth { priority 8 }
        /Common/__tcl_lsp_evtflow_efo_complex_ldap_event { priority 9 }
        /Common/__tcl_lsp_evtflow_efo_complex_oidc_auth { priority 10 }
        /Common/__tcl_lsp_evtflow_efo_complex_oidc_event { priority 11 }
        /Common/__tcl_lsp_evtflow_efo_complex_mfa_logon { priority 12 }
        /Common/__tcl_lsp_evtflow_efo_complex_mfa_ad { priority 13 }
        /Common/__tcl_lsp_evtflow_efo_complex_otp_generate { priority 14 }
        /Common/__tcl_lsp_evtflow_efo_complex_otp_issued { priority 15 }
        /Common/__tcl_lsp_evtflow_efo_complex_otp_logon { priority 16 }
        /Common/__tcl_lsp_evtflow_efo_complex_otp_verify { priority 17 }
        /Common/__tcl_lsp_evtflow_efo_complex_mfa_event { priority 18 }
        /Common/__tcl_lsp_evtflow_efo_complex_allow { priority 19 }
        /Common/__tcl_lsp_evtflow_efo_complex_deny { priority 20 }
    }
    start-item /Common/__tcl_lsp_evtflow_efo_complex_start
}
apm profile access /Common/__tcl_lsp_evtflow_efo_complex_access {
    defaults-from /Common/access
    access-policy /Common/__tcl_lsp_evtflow_efo_complex_policy
    generation-action increment
    max-failure-delay 0
    min-failure-delay 0
}
ltm pool /Common/__tcl_lsp_evtflow_efo_complex_pool { members { 192.168.9.80:18710 { address 192.168.9.80 } } }
ltm virtual /Common/__tcl_lsp_evtflow_efo_complex_vs {
    destination 192.168.9.24:18840
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/__tcl_lsp_evtflow_efo_complex_pool
    profiles {
        /Common/__tcl_lsp_evtflow_efo_complex_access { }
        /Common/__tcl_lsp_evtflow_efd_clientssl { context clientside }
        /Common/http { }
        /Common/tcp { }
    }
    rules { /Common/__tcl_lsp_evtflow_efo_complex_trace }
    source 0.0.0.0/0
    source-address-translation { type automap }
}
