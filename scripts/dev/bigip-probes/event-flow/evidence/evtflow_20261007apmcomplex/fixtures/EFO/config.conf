    caption "OTP challenge"
    color 1
    item-type action
    rules { { caption fallback next-item /Common/__tcl_lsp_evtflow_efo_complex_otp_verify } }
}
apm policy policy-item /Common/__tcl_lsp_evtflow_efo_complex_otp_verify {
    agents { /Common/__tcl_lsp_evtflow_efo_complex_otp_verify_ag { type otp-verify } }
    caption "Verify OTP"
    color 1
    item-type action
    rules {
        { caption Successful expression "expr { [mcget {session.otp.verify.last.authresult}] == 1 }" next-item /Common/__tcl_lsp_evtflow_efo_complex_mfa_event }
        { caption fallback next-item /Common/__tcl_lsp_evtflow_efo_complex_deny }
    }
}
apm policy policy-item /Common/__tcl_lsp_evtflow_efo_complex_mfa_event {
