ltm rule /Common/__tcl_lsp_evtflow_egi_cross_security {
    when RULE_INIT {
        log local0. "EVTFLOW3|run=EGI|event=RULE_INIT|phase=security|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
    when HTTP_REQUEST priority 100 {
        set evtflow3_id [HTTP::header value X-Evtflow-Request]
        ASM::enable /Common/__tcl_lsp_evtflow_egh_asm_blocking
        log local0. "EVTFLOW3|run=EGI|event=HTTP_REQUEST|phase=security|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|id=$evtflow3_id|asm={args.asm_policy}"
    }
    when ASM_REQUEST_DONE {
        log local0. "EVTFLOW3|run=EGI|event=ASM_REQUEST_DONE|phase=security|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|id=$evtflow3_id|status=[ASM::status]|count=[ASM::violation count]|names=[ASM::violation names]"
    }
    when ASM_REQUEST_BLOCKING {
        log local0. "EVTFLOW3|run=EGI|event=ASM_REQUEST_BLOCKING|phase=security|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|id=$evtflow3_id|policy=[ASM::policy]"
    }
}
