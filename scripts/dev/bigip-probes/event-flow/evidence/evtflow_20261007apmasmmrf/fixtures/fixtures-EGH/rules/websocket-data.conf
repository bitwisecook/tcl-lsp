ltm rule /Common/__tcl_lsp_evtflow_egh_websocket_data {
    when WS_REQUEST {
        log local0. "EVTFLOW2|run=EGH|event=WS_REQUEST|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=websocket"
    }
    when WS_RESPONSE {
        log local0. "EVTFLOW2|run=EGH|event=WS_RESPONSE|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=websocket"
    }
    when WS_CLIENT_FRAME {
        log local0. "EVTFLOW2|run=EGH|event=WS_CLIENT_FRAME|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=websocket"
        WS::collect frame
    }
    when WS_CLIENT_DATA {
        binary scan [WS::payload] H* payload_hex
        log local0. "EVTFLOW2|run=EGH|event=WS_CLIENT_DATA|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=websocket|bytes=[WS::payload length]|hex=$payload_hex"
        WS::release
    }
    when WS_CLIENT_FRAME_DONE {
        log local0. "EVTFLOW2|run=EGH|event=WS_CLIENT_FRAME_DONE|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=websocket"
    }
    when WS_SERVER_FRAME {
        log local0. "EVTFLOW2|run=EGH|event=WS_SERVER_FRAME|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=websocket"
        WS::collect frame
    }
    when WS_SERVER_DATA {
        binary scan [WS::payload] H* payload_hex
        log local0. "EVTFLOW2|run=EGH|event=WS_SERVER_DATA|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=websocket|bytes=[WS::payload length]|hex=$payload_hex"
        WS::release
    }
    when WS_SERVER_FRAME_DONE {
        log local0. "EVTFLOW2|run=EGH|event=WS_SERVER_FRAME_DONE|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=websocket"
    }
}
