apm aaa ldap /Common/__tcl_lsp_evtflow_efn_ldap_server {
    address 192.168.9.250
    admin-dn "cn=admin,dc=bitwisecook,dc=org"
    admin-encrypted-password "!evtflow-admin-2026"
    base-dn "dc=bitwisecook,dc=org"
    port 1389
    schema-attr {
        group-member member
        group-member-value dn
        group-memberof memberOf
        group-object-class groupOfNames
        user-memberof memberOf
        user-object-class inetOrgPerson
    }
    use-pool disabled
}
apm policy customization-group /Common/__tcl_lsp_evtflow_efn_ldap_logon_cg {
    source standard
    type logon
}
apm policy agent logon-page /Common/__tcl_lsp_evtflow_efn_ldap_logon_ag {
    basic-auth-realm "tcl-lsp event-flow LDAP"
    customization-group /Common/__tcl_lsp_evtflow_efn_ldap_logon_cg
    http-401-auth-level basic
    split-username false
    type 401
}
apm policy agent aaa-ldap /Common/__tcl_lsp_evtflow_efn_ldap_auth_ag {
    max-logon-attempt 1
    server /Common/__tcl_lsp_evtflow_efn_ldap_server
    type auth
    user-dn "uid=%{session.logon.last.username},ou=people,dc=bitwisecook,dc=org"
}
apm policy agent irule-event /Common/__tcl_lsp_evtflow_efn_ldap_success_ag {
    expect-data http
    id EFN_ldap_success
}
apm policy agent irule-event /Common/__tcl_lsp_evtflow_efn_ldap_failure_ag {
    expect-data http
    id EFN_ldap_failure
}
apm policy agent ending-allow /Common/__tcl_lsp_evtflow_efn_ldap_allow_ag { }
apm policy agent ending-deny /Common/__tcl_lsp_evtflow_efn_ldap_deny_ag { }
apm policy policy-item /Common/__tcl_lsp_evtflow_efn_ldap_start {
    caption Start
    rules { { caption fallback next-item /Common/__tcl_lsp_evtflow_efn_ldap_logon } }
}
apm policy policy-item /Common/__tcl_lsp_evtflow_efn_ldap_logon {
    agents { /Common/__tcl_lsp_evtflow_efn_ldap_logon_ag { type logon-page } }
    caption "HTTP Basic logon"
    color 1
    item-type action
    rules { { caption fallback next-item /Common/__tcl_lsp_evtflow_efn_ldap_auth } }
}
apm policy policy-item /Common/__tcl_lsp_evtflow_efn_ldap_auth {
    agents { /Common/__tcl_lsp_evtflow_efn_ldap_auth_ag { type aaa-ldap } }
    caption "LDAP authentication"
    color 1
    item-type action
    rules {
        { caption Successful expression "expr { [mcget {session.ldap.last.authresult}] == 1 }" next-item /Common/__tcl_lsp_evtflow_efn_ldap_success }
        { caption fallback next-item /Common/__tcl_lsp_evtflow_efn_ldap_failure }
    }
}
apm policy policy-item /Common/__tcl_lsp_evtflow_efn_ldap_success {
    agents { /Common/__tcl_lsp_evtflow_efn_ldap_success_ag { type irule-event } }
    caption "LDAP success event"
    color 1
    item-type action
    rules { { caption fallback next-item /Common/__tcl_lsp_evtflow_efn_ldap_allow } }
}
apm policy policy-item /Common/__tcl_lsp_evtflow_efn_ldap_failure {
    agents { /Common/__tcl_lsp_evtflow_efn_ldap_failure_ag { type irule-event } }
    caption "LDAP failure event"
    color 2
    item-type action
    rules { { caption fallback next-item /Common/__tcl_lsp_evtflow_efn_ldap_deny } }
}
apm policy policy-item /Common/__tcl_lsp_evtflow_efn_ldap_allow {
    agents { /Common/__tcl_lsp_evtflow_efn_ldap_allow_ag { type ending-allow } }
    caption Allow
    color 1
    item-type ending
}
apm policy policy-item /Common/__tcl_lsp_evtflow_efn_ldap_deny {
    agents { /Common/__tcl_lsp_evtflow_efn_ldap_deny_ag { type ending-deny } }
    caption Deny
    color 2
    item-type ending
}
apm policy access-policy /Common/__tcl_lsp_evtflow_efn_ldap_policy {
    default-ending /Common/__tcl_lsp_evtflow_efn_ldap_deny
    items {
        /Common/__tcl_lsp_evtflow_efn_ldap_start { priority 1 }
        /Common/__tcl_lsp_evtflow_efn_ldap_logon { priority 2 }
        /Common/__tcl_lsp_evtflow_efn_ldap_auth { priority 3 }
        /Common/__tcl_lsp_evtflow_efn_ldap_success { priority 4 }
        /Common/__tcl_lsp_evtflow_efn_ldap_failure { priority 5 }
        /Common/__tcl_lsp_evtflow_efn_ldap_allow { priority 6 }
        /Common/__tcl_lsp_evtflow_efn_ldap_deny { priority 7 }
    }
    start-item /Common/__tcl_lsp_evtflow_efn_ldap_start
}
apm profile access /Common/__tcl_lsp_evtflow_efn_ldap_access {
    defaults-from /Common/access
    access-policy /Common/__tcl_lsp_evtflow_efn_ldap_policy
    generation-action increment
    max-failure-delay 0
    min-failure-delay 0
}
ltm pool /Common/__tcl_lsp_evtflow_efn_ldap_pool {
    members { 192.168.9.80:18703 { address 192.168.9.80 } }
}
ltm virtual /Common/__tcl_lsp_evtflow_efn_ldap_vs {
    destination 192.168.9.24:18617
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/__tcl_lsp_evtflow_efn_ldap_pool
    profiles {
        /Common/__tcl_lsp_evtflow_efn_ldap_access { }
        /Common/__tcl_lsp_evtflow_efe_clientssl { context clientside }
        /Common/http { }
        /Common/tcp { }
    }
    rules { /Common/__tcl_lsp_evtflow_efn_ldap_trace }
    source 0.0.0.0/0
    source-address-translation { type automap }
}
