ltm rule /Common/__tcl_lsp_evtflow_efn_ldap_trace {
    when RULE_INIT {
        log local0. "EVTFLOW4|run=EFN|event=RULE_INIT|probe=apm-ldap|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
    when CLIENT_ACCEPTED {
        set evtflow4_id "[IP::client_addr]:[TCP::client_port]"
        log local0. "EVTFLOW4|run=EFN|event=CLIENT_ACCEPTED|probe=apm-ldap|id=$evtflow4_id|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
    when HTTP_REQUEST {
        if { [HTTP::header exists X-Evtflow-Request] } {
            set evtflow4_id [HTTP::header value X-Evtflow-Request]
        }
        log local0. "EVTFLOW4|run=EFN|event=HTTP_REQUEST|probe=apm-ldap|id=$evtflow4_id|uri=[HTTP::uri]|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
    when ACCESS_SESSION_STARTED {
        log local0. "EVTFLOW4|run=EFN|event=ACCESS_SESSION_STARTED|probe=apm-ldap|id=$evtflow4_id|sid=[ACCESS::session sid]|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
    when ACCESS_POLICY_AGENT_EVENT {
        set username [ACCESS::session data get session.logon.last.username]
        set authresult [ACCESS::session data get session.ldap.last.authresult]
        log local0. "EVTFLOW4|run=EFN|event=ACCESS_POLICY_AGENT_EVENT|probe=apm-ldap|id=$evtflow4_id|agent=[ACCESS::policy agent_id]|username=$username|authresult=$authresult|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
    when ACCESS_POLICY_COMPLETED {
        set username [ACCESS::session data get session.logon.last.username]
        set authresult [ACCESS::session data get session.ldap.last.authresult]
        log local0. "EVTFLOW4|run=EFN|event=ACCESS_POLICY_COMPLETED|probe=apm-ldap|id=$evtflow4_id|result=[ACCESS::policy result]|username=$username|authresult=$authresult|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
    when ACCESS_ACL_ALLOWED {
        log local0. "EVTFLOW4|run=EFN|event=ACCESS_ACL_ALLOWED|probe=apm-ldap|id=$evtflow4_id|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
    when SERVER_CONNECTED {
        log local0. "EVTFLOW4|run=EFN|event=SERVER_CONNECTED|probe=apm-ldap|id=$evtflow4_id|peer=[IP::server_addr]:[TCP::server_port]|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
}
