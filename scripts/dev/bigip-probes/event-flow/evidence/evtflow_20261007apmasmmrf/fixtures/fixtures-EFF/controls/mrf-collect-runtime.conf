ltm rule /Common/__tcl_lsp_evtflow_eff_mrf_collect_runtime {
    when MR_INGRESS {
        log local0. "EVTFLOW2|run=EFF|event=MR_INGRESS|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=mrf-collect-runtime"
        MR::collect
    }
    when MR_DATA {
        binary scan [MR::payload] H* payload_hex
        log local0. "EVTFLOW2|run=EFF|event=MR_DATA|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=mrf-collect-runtime|bytes=[string length [MR::payload]]|hex=$payload_hex"
        MR::release
    }
}
