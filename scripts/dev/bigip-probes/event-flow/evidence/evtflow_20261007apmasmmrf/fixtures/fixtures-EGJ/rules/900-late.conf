ltm rule /Common/__tcl_lsp_evtflow_egj_cross_late {
    when RULE_INIT {
        log local0. "EVTFLOW3|run=EGJ|event=RULE_INIT|phase=late|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
    when HTTP_REQUEST priority 900 {
        set evtflow3_id [HTTP::header value X-Evtflow-Request]
        log local0. "EVTFLOW3|run=EGJ|event=HTTP_REQUEST|phase=late|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|id=$evtflow3_id|uri=[HTTP::uri]"
    }
    when HTTP_REQUEST_RELEASE {
        log local0. "EVTFLOW3|run=EGJ|event=HTTP_REQUEST_RELEASE|phase=late|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|id=$evtflow3_id|uri=[HTTP::uri]"
    }
    when SERVER_CONNECTED {
        log local0. "EVTFLOW3|run=EGJ|event=SERVER_CONNECTED|phase=late|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|id=$evtflow3_id|server=[IP::server_addr]:[TCP::server_port]"
    }
    when HTTP_REQUEST_SEND {
        log local0. "EVTFLOW3|run=EGJ|event=HTTP_REQUEST_SEND|phase=late|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|id=$evtflow3_id|uri=[HTTP::uri]"
    }
    when HTTP_RESPONSE priority 100 {
        log local0. "EVTFLOW3|run=EGJ|event=HTTP_RESPONSE|phase=late|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|id=$evtflow3_id|status=[HTTP::status]"
    }
    when HTTP_RESPONSE_RELEASE {
        log local0. "EVTFLOW3|run=EGJ|event=HTTP_RESPONSE_RELEASE|phase=late|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|id=$evtflow3_id|status=[HTTP::status]"
    }
    when CLIENT_CLOSED {
        set close_id unset
        if { [info exists evtflow3_id] } { set close_id $evtflow3_id }
        log local0. "EVTFLOW3|run=EGJ|event=CLIENT_CLOSED|phase=late|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|id=$close_id"
    }
}
