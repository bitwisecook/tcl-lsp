ltm rule /Common/__tcl_lsp_evtflow_egj_cross_early {
    when RULE_INIT {
        log local0. "EVTFLOW3|run=EGJ|event=RULE_INIT|phase=early|tmm=[TMM::cmp_group]:[TMM::cmp_unit]"
    }
    when CLIENT_ACCEPTED priority 10 {
        log local0. "EVTFLOW3|run=EGJ|event=CLIENT_ACCEPTED|phase=early|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|client=[IP::client_addr]:[TCP::client_port]"
    }
    when HTTP_REQUEST priority 10 {
        set evtflow3_id [HTTP::header value X-Evtflow-Request]
        log local0. "EVTFLOW3|run=EGJ|event=HTTP_REQUEST|phase=early|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|id=$evtflow3_id|uri=[HTTP::uri]"
    }
}
