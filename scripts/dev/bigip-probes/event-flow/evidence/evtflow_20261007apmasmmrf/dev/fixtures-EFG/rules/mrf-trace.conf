ltm rule /Common/__tcl_lsp_evtflow_efg_mrf_trace {
    when RULE_INIT {
        log local0. "EVTFLOW2|run=EFG|event=RULE_INIT|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=mrf"
    }
    when CLIENT_ACCEPTED {
        set evtflow2_peer [format {client-%s-%s} [IP::client_addr] [TCP::client_port]]
        GENERICMESSAGE::peer name $evtflow2_peer
        log local0. "EVTFLOW2|run=EFG|event=CLIENT_ACCEPTED|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=mrf|peer=$evtflow2_peer"
    }
    when SERVER_CONNECTED {
        set evtflow2_peer [format {server-%s-%s} [IP::server_addr] [TCP::server_port]]
        GENERICMESSAGE::peer name $evtflow2_peer
        log local0. "EVTFLOW2|run=EFG|event=SERVER_CONNECTED|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=mrf|peer=$evtflow2_peer"
    }
    when GENERICMESSAGE_INGRESS {
        if { [clientside] } {
            GENERICMESSAGE::message is_request true
            GENERICMESSAGE::message dst evtflow-backend
        }
        set evtflow2_mrf_sequence [GENERICMESSAGE::message request_sequence_number]
        log local0. "EVTFLOW2|run=EFG|event=GENERICMESSAGE_INGRESS|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=mrf|sequence=$evtflow2_mrf_sequence|length=[GENERICMESSAGE::message length]|request=[GENERICMESSAGE::message is_request]|src=[GENERICMESSAGE::message src]|dst=[GENERICMESSAGE::message dst]"
    }
    when MR_INGRESS {
        set evtflow2_mrf_context ingress
        MR::store evtflow2_mrf_sequence
        MR::store evtflow2_mrf_context
        log local0. "EVTFLOW2|run=EFG|event=MR_INGRESS|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=mrf|sequence=$evtflow2_mrf_sequence|protocol=[MR::protocol]|flow=[MR::flow_id]|instance=[MR::instance]"
    }
    when MR_EGRESS {
        MR::restore evtflow2_mrf_sequence
        MR::restore evtflow2_mrf_context
        log local0. "EVTFLOW2|run=EFG|event=MR_EGRESS|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=mrf|sequence=$evtflow2_mrf_sequence|restored=$evtflow2_mrf_context|protocol=[MR::protocol]|flow=[MR::flow_id]|route=[MR::message route]|status=[MR::message status]"
    }
    when GENERICMESSAGE_EGRESS {
        log local0. "EVTFLOW2|run=EFG|event=GENERICMESSAGE_EGRESS|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=mrf|status=[GENERICMESSAGE::message status]|length=[GENERICMESSAGE::message length]"
    }
    when MR_FAILED {
        log local0. "EVTFLOW2|run=EFG|event=MR_FAILED|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=mrf"
    }
}
