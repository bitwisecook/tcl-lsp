ltm rule /Common/__tcl_lsp_evtflow_efg_client_cert {
    when RULE_INIT {
        log local0. "EVTFLOW2|run=EFG|event=RULE_INIT|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=client-cert"
    }
    when CLIENT_ACCEPTED {
        set evtflow2_cert_renegotiate none
        set evtflow2_http_held 0
    }
    when CLIENTSSL_CLIENTHELLO {
        log local0. "EVTFLOW2|run=EFG|event=CLIENTSSL_CLIENTHELLO|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=client-cert"
    }
    when CLIENTSSL_CLIENTCERT {
        set cert_count [SSL::cert count]
        set verify_result [SSL::verify_result]
        set subject none
        if { $cert_count > 0 } {
            set subject [X509::subject [SSL::cert 0]]
        }
        log local0. "EVTFLOW2|run=EFG|event=CLIENTSSL_CLIENTCERT|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=client-cert|count=$cert_count|verify=$verify_result|subject=$subject|renegotiate=$evtflow2_cert_renegotiate"
    }
    when CLIENTSSL_HANDSHAKE {
        set cert_count [SSL::cert count]
        set verify_result [SSL::verify_result]
        log local0. "EVTFLOW2|run=EFG|event=CLIENTSSL_HANDSHAKE|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=client-cert|count=$cert_count|verify=$verify_result|mode=[SSL::cert mode]|renegotiate=$evtflow2_cert_renegotiate"
        if { $evtflow2_http_held } {
            set evtflow2_http_held 0
            HTTP::release
        }
    }
    when HTTP_REQUEST priority 100 {
        set evtflow2_request_id [HTTP::header value X-Evtflow-Request]
        set cert_count [SSL::cert count]
        set verify_result [SSL::verify_result]
        set path [HTTP::path]
        log local0. "EVTFLOW2|run=EFG|event=HTTP_REQUEST|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=client-cert|id=$evtflow2_request_id|path=$path|count=$cert_count|verify=$verify_result|mode=[SSL::cert mode]"
        if { $path starts_with "/cert/request" && $cert_count == 0 } {
            set evtflow2_cert_renegotiate request
            set evtflow2_http_held 1
            HTTP::collect
            SSL::session invalidate
            SSL::authenticate always
            SSL::authenticate depth 9
            SSL::cert mode request
            SSL::renegotiate enable
            SSL::renegotiate
            return
        }
        if { $path starts_with "/cert/require" && $cert_count == 0 } {
            set evtflow2_cert_renegotiate require
            set evtflow2_http_held 1
            HTTP::collect
            SSL::session invalidate
            SSL::authenticate always
            SSL::authenticate depth 9
            SSL::cert mode require
            SSL::renegotiate enable
            SSL::renegotiate
            return
        }
        if { $path starts_with "/cert/ignore" } {
            SSL::cert mode ignore
        }
        HTTP::header replace X-Evtflow-Cert-Count $cert_count
        HTTP::header replace X-Evtflow-Cert-Verify $verify_result
    }
}
