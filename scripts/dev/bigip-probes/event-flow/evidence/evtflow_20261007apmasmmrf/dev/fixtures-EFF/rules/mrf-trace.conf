ltm rule /Common/__tcl_lsp_evtflow_eff_mrf_trace {
    when RULE_INIT {
        log local0. "EVTFLOW2|run=EFF|event=RULE_INIT|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=mrf"
    }
    when GENERICMESSAGE_INGRESS {
        set evtflow2_mrf_sequence [GENERICMESSAGE::message request_sequence_number]
        log local0. "EVTFLOW2|run=EFF|event=GENERICMESSAGE_INGRESS|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=mrf|sequence=$evtflow2_mrf_sequence|length=[GENERICMESSAGE::message length]"
    }
    when MR_INGRESS {
        set evtflow2_mrf_context ingress
        MR::store evtflow2_mrf_sequence
        MR::store evtflow2_mrf_context
        log local0. "EVTFLOW2|run=EFF|event=MR_INGRESS|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=mrf|sequence=$evtflow2_mrf_sequence|protocol=[MR::protocol]|flow=[MR::flow_id]|instance=[MR::instance]"
    }
    when MR_EGRESS {
        MR::restore evtflow2_mrf_sequence
        MR::restore evtflow2_mrf_context
        log local0. "EVTFLOW2|run=EFF|event=MR_EGRESS|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=mrf|sequence=$evtflow2_mrf_sequence|restored=$evtflow2_mrf_context|protocol=[MR::protocol]|flow=[MR::flow_id]"
    }
    when GENERICMESSAGE_EGRESS {
        log local0. "EVTFLOW2|run=EFF|event=GENERICMESSAGE_EGRESS|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=mrf|status=[GENERICMESSAGE::message status]|length=[GENERICMESSAGE::message length]"
    }
    when MR_FAILED {
        log local0. "EVTFLOW2|run=EFF|event=MR_FAILED|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|probe=mrf"
    }
}
