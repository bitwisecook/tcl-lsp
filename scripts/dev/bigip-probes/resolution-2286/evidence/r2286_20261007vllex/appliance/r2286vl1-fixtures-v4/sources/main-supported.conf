ltm rule /Common/__tcl_lsp_2286_vl1_main_supported {
    when HTTP_REQUEST {
        if {[HTTP::uri] eq "/r2286-vl1-backend"} { return }
        set payload [binary format H* ]
        set outer_rc [catch {eval $payload} outer_result]
        if {$outer_rc != 0} {
            binary scan $outer_result H* outer_hex
            log local0.notice [list R2286VL vl1 main_supported_outer tmm [TMM::cmp_group]:[TMM::cmp_unit] rc $outer_rc result_hex $outer_hex]
            HTTP::respond 500 content [list vl1 $outer_rc $outer_hex] "Content-Type" "text/plain" "Connection" "close"
        }
    }
}
