ltm rule /Common/__tcl_lsp_2286_vl1_global {
    when HTTP_REQUEST {
        if {[HTTP::path] ne "/r2286-vl1-global"} { return }
        set rows {}
        set payload [binary format H* 736574203a3a6572726f72436f64652053454e54494e454c3b207365742068206c617070656e643b20246820763b206c697374205b736574203a3a6572726f72436f64655d205b73657420765d0a]
        set rc [catch {eval $payload} result]
        set scan_rc [catch {binary scan $result H* result_hex} scan_result]
        lappend rows [list quiet_missing $rc $scan_rc $result_hex $scan_result]
        set payload [binary format H* ]
        set rc [catch {eval $payload} result]
        set scan_rc [catch {binary scan $result H* result_hex} scan_result]
        lappend rows [list callback_error $rc $scan_rc $result_hex $scan_result]
        set payload [binary format H* ]
        set rc [catch {eval $payload} result]
        set scan_rc [catch {binary scan $result H* result_hex} scan_result]
        lappend rows [list scan_rebind_global $rc $scan_rc $result_hex $scan_result]
        log local0.notice [list R2286VL vl1 global tmm [TMM::cmp_group]:[TMM::cmp_unit] rows $rows]
        HTTP::respond 200 content [list vl1 [TMM::cmp_group] [TMM::cmp_unit] $rows] "Content-Type" "text/plain" "Connection" "close"
    }
}
