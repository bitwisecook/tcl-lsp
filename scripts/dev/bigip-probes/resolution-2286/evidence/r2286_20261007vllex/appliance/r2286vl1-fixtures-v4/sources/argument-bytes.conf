ltm rule /Common/__tcl_lsp_2286_vl1_argument_bytes {
    when HTTP_REQUEST {
        if {[HTTP::path] ne "/r2286-vl1-argument-bytes"} { return }
        set payload [binary format H* ]
        set rc [catch {eval $payload} result]
        set scan_rc [catch {binary scan $result H* result_hex} scan_result]
        HTTP::respond 200 content [list vl1 [TMM::cmp_group] [TMM::cmp_unit] $rc $scan_rc $result_hex $scan_result] "Content-Type" "text/plain" "Connection" "close"
    }
}
