ltm rule __tcl_lsp_2286_vl1_context_events {
when RULE_INIT {
        set payload [binary format H* ]
        set rc [catch {eval $payload} result]
        set scan_rc [catch {binary scan $result H* result_hex} scan_result]
        log local0.notice [list R2286VL vl1 context_event RULE_INIT tmm [TMM::cmp_group]:[TMM::cmp_unit] rc $rc scan_rc $scan_rc result_hex $result_hex scan_result $scan_result]
    }
    when CLIENT_ACCEPTED {
        set payload [binary format H* ]
        set rc [catch {eval $payload} result]
        set scan_rc [catch {binary scan $result H* result_hex} scan_result]
        log local0.notice [list R2286VL vl1 context_event CLIENT_ACCEPTED tmm [TMM::cmp_group]:[TMM::cmp_unit] session [IP::client_addr]:[TCP::client_port] rc $rc scan_rc $scan_rc result_hex $result_hex scan_result $scan_result]
    }
}
