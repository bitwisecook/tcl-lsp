ltm rule /Common/__tcl_lsp_2286_vl1_global {
    when HTTP_REQUEST {
        if {[HTTP::path] ne "/r2286-vl1-global"} { return }
        set rows {}
        set missing_c [catch {set ::errorCode SENTINEL; set h lappend; $h v; list [set ::errorCode] [set v]} missing_r]
        binary scan $missing_r H* missing_hex
        lappend rows [list quiet_missing $missing_c $missing_hex]
        set callback_c [catch {
            set ::errorCode SENTINEL
            set v OLD
            proc __tcl_lsp_2286_vl1_error_watch {n k op} {error BOOM}
            trace variable v r __tcl_lsp_2286_vl1_error_watch
            set h lappend
            set answer [$h v]
            trace vdelete v r __tcl_lsp_2286_vl1_error_watch
            list $answer [set ::errorCode] [set v]
        } callback_r]
        binary scan $callback_r H* callback_hex
        lappend rows [list callback_error $callback_c $callback_hex]
        set global_c [catch {
            set ::__tcl_lsp_2286_vl1_replacement BEFORE
            set first INIT
            set second ORIGINAL
            proc __tcl_lsp_2286_vl1_global_watch {n k op} {uplevel 1 {upvar #0 ::__tcl_lsp_2286_vl1_replacement second}}
            trace variable first w __tcl_lsp_2286_vl1_global_watch
            set n first
            set m second
            set h scan
            set count [$h {7 9} {%d %d} $n $m]
            list $count $first $second [set ::__tcl_lsp_2286_vl1_replacement]
        } global_r]
        binary scan $global_r H* global_hex
        lappend rows [list scan_rebind_global $global_c $global_hex]
        log local0.notice [list R2286VL vl1 global tmm [TMM::cmp_group]:[TMM::cmp_unit] rows $rows]
        HTTP::respond 200 content [list vl1 [TMM::cmp_group] [TMM::cmp_unit] $rows] "Content-Type" "text/plain" "Connection" "close"
    }
}
