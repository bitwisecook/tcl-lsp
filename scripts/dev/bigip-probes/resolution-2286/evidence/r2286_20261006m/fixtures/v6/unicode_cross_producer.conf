ltm rule /Common/__tcl_lsp_2286_r2286m_unicode_cross_producer {
    when HTTP_REQUEST {
        set payload [binary format H* ]
        set rc [catch {eval $payload} result]
        binary scan $result H* result_hex
        log local0. "R2286 __tcl_lsp_2286_r2286m_unicode_cross_producer tmm=[TMM::cmp_group]:[TMM::cmp_unit] rc=$rc result_hex=$result_hex"
        HTTP::respond 200 content [list $rc $result_hex] X-R2286-TMM "[TMM::cmp_group]:[TMM::cmp_unit]" Connection close
    }
}
