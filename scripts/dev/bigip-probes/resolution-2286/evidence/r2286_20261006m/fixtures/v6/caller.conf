ltm rule /R2286_r2286m/lifetime/__tcl_lsp_2286_r2286m_caller {
when HTTP_REQUEST {
    set phase [HTTP::header value X-R2286-Phase]
    set request [HTTP::header value X-R2286-Request]
    set cell CALLER_SEED
    if {[HTTP::path] eq "/two"} {
        set rc [catch {call /R2286_r2286m/lifetime/__tcl_lsp_2286_r2286m_provider::incarnation cell EXPLICIT_SUFFIX} result]
        set actuals two
    } else {
        set rc [catch {call /R2286_r2286m/lifetime/__tcl_lsp_2286_r2286m_provider::incarnation cell} result]
        set actuals one
    }
    binary scan $result H* result_hex
    binary scan $cell H* cell_hex
    log local0. "R2286LIFE|r2286m|phase=$phase|request=$request|actuals=$actuals|tmm=[TMM::cmp_group]:[TMM::cmp_unit]|rc=$rc|result_hex=$result_hex|cell_hex=$cell_hex"
    HTTP::respond 200 content [list $rc $result_hex $cell_hex] X-R2286-TMM "[TMM::cmp_group]:[TMM::cmp_unit]" Connection close
}
}
