ltm rule /Common/__tcl_lsp_probe_2286_r2286_20261006c_dynamic_package {
when HTTP_REQUEST {
    set u [TMM::cmp_unit]
    set script "list \[package provide Tcl\] \[catch \{package require Tcl\} required\] \$required"
    set rc [catch {eval $script} result]
    set ec UNAVAILABLE
    if {[info exists errorCode]} {set ec $errorCode}
    binary scan $result H* result_hex
    binary scan $ec H* errorcode_hex
    log local0. "R2286|r2286_20261006c|dynamic_package|unit=$u|rc=$rc|result_hex=$result_hex|errorcode_hex=$errorcode_hex|[HTTP::uri]"
    HTTP::respond 200 content "$rc $result_hex $errorcode_hex\n" X-R2286-TMM $u Connection close
}
}
