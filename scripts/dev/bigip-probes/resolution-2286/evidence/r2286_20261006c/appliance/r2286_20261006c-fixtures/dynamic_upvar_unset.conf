ltm rule /Common/__tcl_lsp_probe_2286_r2286_20261006c_dynamic_upvar_unset {
when HTTP_REQUEST {
    set u [TMM::cmp_unit]
    set script "proc __tcl_lsp_probe_2286_r2286_20261006c_inner \{n\} \{upvar 1 \$n a; unset a; set a AGAIN\}\nproc __tcl_lsp_probe_2286_r2286_20261006c_outer \{\} \{set x 1; __tcl_lsp_probe_2286_r2286_20261006c_inner x; return \$x\}\n__tcl_lsp_probe_2286_r2286_20261006c_outer"
    set rc [catch {eval $script} result]
    set ec UNAVAILABLE
    if {[info exists errorCode]} {set ec $errorCode}
    binary scan $result H* result_hex
    binary scan $ec H* errorcode_hex
    log local0. "R2286|r2286_20261006c|dynamic_upvar_unset|unit=$u|rc=$rc|result_hex=$result_hex|errorcode_hex=$errorcode_hex|[HTTP::uri]"
    HTTP::respond 200 content "$rc $result_hex $errorcode_hex\n" X-R2286-TMM $u Connection close
}
}
