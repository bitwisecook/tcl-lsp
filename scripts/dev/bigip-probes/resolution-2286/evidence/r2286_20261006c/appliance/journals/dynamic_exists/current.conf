    set script "proc __tcl_lsp_probe_2286_r2286_20261006c_test \{\} \{list \[info exists missing_r2286_20261006c\] \[array exists missing_r2286_20261006c\]\}\n__tcl_lsp_probe_2286_r2286_20261006c_test"
