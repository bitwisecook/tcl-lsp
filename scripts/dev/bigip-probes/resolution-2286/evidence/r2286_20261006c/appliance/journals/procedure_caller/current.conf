ltm rule __tcl_lsp_probe_2286_r2286_20261006c_procedure_caller {
when HTTP_REQUEST priority 110 {
    set u [TMM::cmp_unit]
    set localname "__tcl_lsp_probe_2286_r2286_20261006c_procedure_a::same"
    set absolute "/Common/__tcl_lsp_probe_2286_r2286_20261006c_procedure_a::same"
    set r1 [catch {call $localname} v1]
    set r2 [catch {call $absolute} v2]
    set out [list R2286 r2286_20261006c procedure_caller $u $r1 $v1 $r2 $v2]
    log local0. $out
    HTTP::respond 200 content "$out\n" X-R2286-TMM $u Connection close
}
}
