ltm rule /Common/__tcl_lsp_probe_2286_r2286i_caller {
proc local_identify {expected} {
    set command [binary format H* 6e616d6573706163652063757272656e74]
    set current [eval $command]
    return [list $expected $current [info level 0]]
}
when HTTP_REQUEST {
    set unit [TMM::cmp_unit]
    set request [HTTP::header value X-R2286-Request]
    foreach item [list {local local_identify} {common_root_relative __tcl_lsp_probe_2286_r2286i_rootlib::identify} {common_root_absolute /Common/__tcl_lsp_probe_2286_r2286i_rootlib::identify} {common_a_absolute /Common/__tcl_lsp_probe_2286_r2286i_fa/__tcl_lsp_probe_2286_r2286i_lib::identify} {common_b_absolute /Common/__tcl_lsp_probe_2286_r2286i_fb/__tcl_lsp_probe_2286_r2286i_lib::identify} {partition_root_absolute /R2286_r2286i/__tcl_lsp_probe_2286_r2286i_rootlib::identify} {partition_a_absolute /R2286_r2286i/__tcl_lsp_probe_2286_r2286i_fa/__tcl_lsp_probe_2286_r2286i_lib::identify} {wrong_folder /Common/__tcl_lsp_probe_2286_r2286i_fa/__tcl_lsp_probe_2286_r2286i_missing::identify} {tcl_absolute_namespace ::__tcl_lsp_probe_2286_r2286i_rootlib::identify}] {
        set label [lindex $item 0]
        set target [lindex $item 1]
        set rc [catch {call $target $label} value]
        set which_script [list [binary format H* 6e616d657370616365] which -command $target]
        set which_rc [catch {eval $which_script} which]
        binary scan $value H* value_hex
        binary scan $which H* which_hex
        log local0. "R2286|r2286i|caller_common_root|unit=$unit|request=$request|label=$label|target=$target|rc=$rc|value_hex=$value_hex|which_rc=$which_rc|which_hex=$which_hex"
    }
    HTTP::header insert X-R2286-Scope "caller_common_root:$unit"
}
when HTTP_RESPONSE {
    HTTP::header insert X-R2286-TMM [TMM::cmp_unit]
}
}
