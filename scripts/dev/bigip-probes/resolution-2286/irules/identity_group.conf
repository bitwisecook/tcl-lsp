ltm rule /Common/__tcl_lsp_probe_2286_lab2286_identity_group {
when HTTP_REQUEST {
    set u [TMM::cmp_unit]
    set g [TMM::cmp_group]
    set n [TMM::cmp_count]
    log local0. "R2286|lab2286|identity_group|group=$g|unit=$u|count=$n|[HTTP::uri]"
    HTTP::respond 200 content "group=$g unit=$u count=$n\n" X-R2286-TMM "$g:$u" Connection close
}
}
