ltm rule /Common/__tcl_lsp_probe_2286_lab2286_collision_b {
when RULE_INIT {
    set static::__tcl_lsp_probe_2286_lab2286_collision INIT_b
    log local0. "R2286|lab2286|collision_b|INIT|seed=INIT_b"
}
when HTTP_REQUEST priority 102 {
    set u [TMM::cmp_unit]
    set action [URI::query [HTTP::uri] action]
    if {$action eq "write_b"} {set static::__tcl_lsp_probe_2286_lab2286_collision "EVENT_b_$u"}
    set value MISSING
    if {[info exists static::__tcl_lsp_probe_2286_lab2286_collision]} {set value [set static::__tcl_lsp_probe_2286_lab2286_collision]}
    log local0. [list R2286 lab2286 collision_b $u $action $value]
}
}
