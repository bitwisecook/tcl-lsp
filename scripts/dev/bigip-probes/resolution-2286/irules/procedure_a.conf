ltm rule /Common/__tcl_lsp_probe_2286_lab2286_procedure_a {
proc same {} {return A}
proc caller_link {name} {upvar 1 $name alias; set alias LINK_A; return $alias}
when HTTP_REQUEST priority 101 {
    set x INITIAL
    set rc [catch {call caller_link x} result]
    log local0. [list R2286 lab2286 procedure_a [TMM::cmp_unit] $rc $result $x [call same]]
}
}
