ltm rule /Common/__tcl_lsp_probe_2286_lab2286_dynamic_trace_static {
when HTTP_REQUEST {
    set u [TMM::cmp_unit]
    set script "set static::__tcl_lsp_probe_2286_lab2286_events \{\}\nproc __tcl_lsp_probe_2286_lab2286_trace \{n i op\} \{lappend static::__tcl_lsp_probe_2286_lab2286_events \[list \$n \$i \$op\]\}\nset static::__tcl_lsp_probe_2286_lab2286_x 1\ntrace variable static::__tcl_lsp_probe_2286_lab2286_x rwu __tcl_lsp_probe_2286_lab2286_trace\nset a \[set static::__tcl_lsp_probe_2286_lab2286_x\]\nunset static::__tcl_lsp_probe_2286_lab2286_x\nset static::__tcl_lsp_probe_2286_lab2286_x 3\nlist \$a \$static::__tcl_lsp_probe_2286_lab2286_events"
    set rc [catch {eval $script} result]
    set ec UNAVAILABLE
    if {[info exists errorCode]} {set ec $errorCode}
    binary scan $result H* result_hex
    binary scan $ec H* errorcode_hex
    log local0. "R2286|lab2286|dynamic_trace_static|unit=$u|rc=$rc|result_hex=$result_hex|errorcode_hex=$errorcode_hex|[HTTP::uri]"
    HTTP::respond 200 content "$rc $result_hex $errorcode_hex\n" X-R2286-TMM $u Connection close
}
}
