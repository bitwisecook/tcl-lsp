ltm rule /Common/__tcl_lsp_probe_2286_lab2286_collision_a {
when RULE_INIT {
    set static::__tcl_lsp_probe_2286_lab2286_collision INIT_a
    log local0. "R2286|lab2286|collision_a|INIT|seed=INIT_a"
}
when HTTP_REQUEST priority 101 {
    set u [TMM::cmp_unit]
    set action [URI::query [HTTP::uri] action]
    if {$action eq "write_a"} {set static::__tcl_lsp_probe_2286_lab2286_collision "EVENT_a_$u"}
    set value MISSING
    if {[info exists static::__tcl_lsp_probe_2286_lab2286_collision]} {set value [set static::__tcl_lsp_probe_2286_lab2286_collision]}
    log local0. [list R2286 lab2286 collision_a $u $action $value]
}
}
