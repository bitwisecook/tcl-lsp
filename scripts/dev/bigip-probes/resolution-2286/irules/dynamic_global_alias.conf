ltm rule /Common/__tcl_lsp_probe_2286_lab2286_dynamic_global_alias {
when HTTP_REQUEST {
    set u [TMM::cmp_unit]
    set script "set ::__tcl_lsp_probe_2286_lab2286_g 11\nproc __tcl_lsp_probe_2286_lab2286_read \{\} \{global __tcl_lsp_probe_2286_lab2286_g; return \$__tcl_lsp_probe_2286_lab2286_g\}\n__tcl_lsp_probe_2286_lab2286_read"
    set rc [catch {eval $script} result]
    set ec UNAVAILABLE
    if {[info exists errorCode]} {set ec $errorCode}
    binary scan $result H* result_hex
    binary scan $ec H* errorcode_hex
    log local0. "R2286|lab2286|dynamic_global_alias|unit=$u|rc=$rc|result_hex=$result_hex|errorcode_hex=$errorcode_hex|[HTTP::uri]"
    HTTP::respond 200 content "$rc $result_hex $errorcode_hex\n" X-R2286-TMM $u Connection close
}
}
