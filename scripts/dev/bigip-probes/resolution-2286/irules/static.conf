    set after_exists [info exists static::__tcl_lsp_probe_2286_lab2286_cell]
    set after MISSING
    if {$after_exists} {set after [set static::__tcl_lsp_probe_2286_lab2286_cell]}
    set record [list R2286 lab2286 static $u $action $before_exists $before $rc $result $after_exists $after]
    log local0. $record
    HTTP::respond 200 content "$record\n" X-R2286-TMM $u Connection close
}
}
