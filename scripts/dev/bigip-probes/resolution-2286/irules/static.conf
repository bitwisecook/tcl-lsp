    set before MISSING
    if {$before_exists} {set before [set static::__tcl_lsp_probe_2286_lab2286_cell]}
    set rc 0
    set result NONE
    if {$action eq "write"} {set result [set static::__tcl_lsp_probe_2286_lab2286_cell "EVENT_$u"]}
    if {$action eq "unset"} {set rc [catch {unset static::__tcl_lsp_probe_2286_lab2286_cell} result]}
