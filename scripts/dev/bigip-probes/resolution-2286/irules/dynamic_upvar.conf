ltm rule /Common/__tcl_lsp_probe_2286_lab2286_dynamic_upvar {
when HTTP_REQUEST {
    set u [TMM::cmp_unit]
    set script "proc __tcl_lsp_probe_2286_lab2286_inner \{n\} \{upvar 1 \$n a; set a 9\}\nproc __tcl_lsp_probe_2286_lab2286_outer \{\} \{set x 1; __tcl_lsp_probe_2286_lab2286_inner x; return \$x\}\n__tcl_lsp_probe_2286_lab2286_outer"
    set rc [catch {eval $script} result]
    set ec UNAVAILABLE
    if {[info exists errorCode]} {set ec $errorCode}
    binary scan $result H* result_hex
    binary scan $ec H* errorcode_hex
    log local0. "R2286|lab2286|dynamic_upvar|unit=$u|rc=$rc|result_hex=$result_hex|errorcode_hex=$errorcode_hex|[HTTP::uri]"
    HTTP::respond 200 content "$rc $result_hex $errorcode_hex\n" X-R2286-TMM $u Connection close
}
}
