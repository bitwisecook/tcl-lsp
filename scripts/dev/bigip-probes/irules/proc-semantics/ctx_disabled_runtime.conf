ltm rule __tcl_lsp_probe_ctx_irule {
when RULE_INIT {
set ::dis [list auto_execok auto_import auto_load auto_qualify cd eof exec exit fblocked fconfigure fcopy file flush gets glob interp load namespace open package pid pwd rename seek socket source tell time unknown update vwait]
set acc {}
foreach c $::dis {
  set rc [catch {eval $c} e]
  if {[string match "invalid command name*" $e]} { set k ABSENT } else { set k PRESENT }
  lappend acc "$c=$k"
}
set i 0
foreach s [list 0 8 16 24] {
  set part [lrange $acc $s [expr {$s+7}]]
  if {[llength $part]} { log local0. "TCLLSPPROBE|TmmIRule|dis$i| [join $part " "]"; incr i }
}
}
}
