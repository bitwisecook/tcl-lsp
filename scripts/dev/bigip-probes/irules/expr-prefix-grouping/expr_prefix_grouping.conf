# Settles #2165: does a prefix operator bind tighter than a custom
# comparison, or looser?
#
#   (not A) starts_with B     <- what the compiler/VM does today (UNARY_BP = 24)
#   not (A starts_with B)     <- what expr_ops.tcl's rewriter does
#
# Every case below is chosen so the two groupings give *different*
# observable answers, or so one of them is an error. Run it and capture
# the /var/log/ltm lines verbatim, errors included.
ltm rule probe_expr_prefix_grouping {
when HTTP_REQUEST {
    # A. The direct discriminator. "" is a prefix of everything, so
    #    (A starts_with "") is always 1.
    #      tight prefix -> (not 1) = 0, then 0 starts_with ""  -> 1
    #      loose prefix -> not (1 starts_with "") = not 1      -> 0
    if {[catch {expr {not 1 starts_with ""}} r]} {
        log local0. "A1 not-1-starts_with-empty ERROR: $r"
    } else {
        log local0. "A1 not-1-starts_with-empty = $r"
    }
    if {[catch {expr {! 1 starts_with ""}} r]} {
        log local0. "A2 bang-1-starts_with-empty ERROR: $r"
    } else {
        log local0. "A2 bang-1-starts_with-empty = $r"
    }

    # B. Same question with a string left operand, where the tight
    #    grouping has to boolean-negate a non-numeric string and may
    #    error instead of answering.
    if {[catch {expr {! "abc" contains "z"}} r]} {
        log local0. "B1 bang-abc-contains-z ERROR: $r"
    } else {
        log local0. "B1 bang-abc-contains-z = $r"
    }
    if {[catch {expr {not "abc" contains "b"}} r]} {
        log local0. "B2 not-abc-contains-b ERROR: $r"
    } else {
        log local0. "B2 not-abc-contains-b = $r"
    }

    # C. The shape real iRules actually write, and the reason the harness
    #    was not simply made to refuse `!` too.
    if {[catch {expr {! [HTTP::uri] contains "/admin"}} r]} {
        log local0. "C1 bang-uri-contains-admin ERROR: $r"
    } else {
        log local0. "C1 bang-uri-contains-admin = $r (uri=[HTTP::uri])"
    }

    # D. Controls. Explicit parentheses both ways, to confirm the engine
    #    agrees with itself and that neither spelling errors on its own.
    if {[catch {expr {(not 1) starts_with ""}} r]} {
        log local0. "D1 paren-tight ERROR: $r"
    } else {
        log local0. "D1 paren-tight = $r"
    }
    if {[catch {expr {not (1 starts_with "")}} r]} {
        log local0. "D2 paren-loose ERROR: $r"
    } else {
        log local0. "D2 paren-loose = $r"
    }

    # E. Does the answer depend on the comparison operator, or is it one
    #    rule for the whole custom-comparison family?
    if {[catch {expr {not 1 equals 1}} r]} {
        log local0. "E1 not-1-equals-1 ERROR: $r"
    } else {
        log local0. "E1 not-1-equals-1 = $r"
    }
    if {[catch {expr {not "ab" ends_with "b"}} r]} {
        log local0. "E2 not-ab-ends_with-b ERROR: $r"
    } else {
        log local0. "E2 not-ab-ends_with-b = $r"
    }

    # F. Version, so the transcript can be filed against a release.
    log local0. "F1 version = [TMM::version]"
}
}
