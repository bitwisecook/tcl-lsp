# proc nested inside a BRACED eval argument. The compiler scans braced script
# literals, so this is rejected exactly like the bare form.
# Expected: REJECT  error: [command is not valid in the current scope]
ltm rule __tcl_lsp_probe_dyn_c_eval_define_literal_call {
when RULE_INIT {
  eval {proc dp3 {} { return x }}
  log local0. "DYN c_eval_define_literal_call r=[dp3]"
}
}
