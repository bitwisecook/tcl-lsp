ltm rule __tcl_lsp_probe_dyn_m_when_via_var {
when RULE_INIT {
  set s "when HTTP_REQUEST \{ log local0. \"DYNEVT dynamic-handler-fired\" \}"
  if {[catch {uplevel #0 $s} e]} {
    log local0. "DYN m_when_via_var register=FAIL err=$e"
  } else {
    log local0. "DYN m_when_via_var register=OK"
  }
}
}
