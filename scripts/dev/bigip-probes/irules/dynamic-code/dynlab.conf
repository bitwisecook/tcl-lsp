# Traffic lab: dynamic proc persistence, mid-request definition, and runtime
# event creation. Attach to a virtual server and issue an HTTP request.
#
# Measured result (2026-08-26, BIG-IP 21.1.0.1):
#   RULE_INIT : define_rc=0 call_rc=0 v=persisted
#   request 1 : persist=YES(persisted) when_at_runtime=NO(invalid command name "when") defineinreq=YES(madeinrequest)
#   request 2 : identical — the RULE_INIT proc survives across requests
ltm rule __tcl_lsp_probe_dynlab {
when RULE_INIT {
  set s "proc dpp \{\} \{ return persisted \}"
  set rc [catch {uplevel #0 $s} e]
  set c "dpp"
  set r [catch {uplevel #0 $c} v]
  log local0. "DYNLAB init define_rc=$rc call_rc=$r v=$v"
}
when HTTP_REQUEST {
  set c "dpp"
  if {[catch {uplevel #0 $c} v]} { set out "persist=NO($v)" } else { set out "persist=YES($v)" }
  set w "when HTTP_RESPONSE \{ log local0. dynevt \}"
  if {[catch {uplevel #0 $w} e]} { append out " when_at_runtime=NO($e)" } else { append out " when_at_runtime=YES" }
  set d "proc dpq \{\} \{ return madeinrequest \}"
  if {[catch {uplevel #0 $d}]} { append out " defineinreq=NO" } else {
    set c2 "dpq"
    if {[catch {uplevel #0 $c2} v2]} { append out " defineinreq=DEFONLY" } else { append out " defineinreq=YES($v2)" }
  }
  HTTP::respond 200 content "$out\n" Content-Type "text/plain"
}
}
ltm virtual __tcl_lsp_probe_dynvs {
  destination 192.168.9.240:80
  ip-protocol tcp
  mask 255.255.255.255
  profiles { tcp { } http { } }
  source 0.0.0.0/0
  translate-address enabled
  translate-port enabled
  rules { __tcl_lsp_probe_dynlab }
}
