# Standalone: iRules resolve command names at RULE LOAD, so a literal reference
# to an undefined command is a hard compile error EVEN INSIDE catch. The other
# three contexts resolve at runtime and this whole body loads fine there.
# Expected on TmmIRule: REJECT with
#   error: [undefined procedure: __no_such_command__]
ltm rule __tcl_lsp_probe_ctx_unknown {
when RULE_INIT {
  if {[catch {__no_such_command__} e]} {
    log local0. "TCLLSPPROBE|TmmIRule|unknown-cmd-in-catch|caught=$e"
  }
}
}
