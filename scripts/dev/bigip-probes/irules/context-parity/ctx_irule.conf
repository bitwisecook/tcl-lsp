ltm rule __tcl_lsp_probe_ctx_irule {
when RULE_INIT {
set ::probe_cases [list \
    {g_if_control} {grammar} {if {1} {set ::m 42}; set ::m} \
    {g_if_chain} {grammar} {if {1}{set ::m 43}; set ::m} \
    {g_list_chain} {grammar} {list {a}{b}} \
    {g_set_chain} {grammar} {set zq {a}{b}} \
    {g_cmd_glued} {grammar} {if{1}{set ::m 44}} \
    {g_expansion} {grammar} {list {*}{a b}} \
    {g_quote_chain} {grammar} {list "a"b} \
    {g_dollarbrace} {grammar} {set zz XX; list ${zz}b} \
    {n_if_nextline} {newline} {if {1}
{set ::m 45}
set ::m} \
    {n_while_nextline} {newline} {set n 1
while {$n < 30}
{
set n 31
}
set n} \
    {n_else_nextline} {newline} {set o no
if {0} {set o then}
else {set o else}
set o} \
    {n_list_absorb} {newline} {list a b
{c}} \
    {n_blank_breaks} {newline} {if {1}

{set ::m 46}} \
    {n_comment_breaks} {newline} {if {1}
# c
{set ::m 47}} \
    {e_starts_with} {expr} {expr {"abc" starts_with "a"}} \
    {e_contains} {expr} {expr {"abc" contains "b"}} \
    {e_matches} {expr} {expr {"abc" matches "abc"}} \
    {e_and_word} {expr} {expr {1 and 1}} \
    {e_adjacent_eq} {expr} {expr {"a"eq"a"}} \
    {num_octal} {numeral} {expr {010}} \
    {num_hex} {numeral} {expr {0x10}} \
    {num_binary} {numeral} {expr {0b101}} \
    {num_exp} {numeral} {expr {1e3}} \
    {s_dict} {surface} {dict set d a 1} \
    {s_lassign} {surface} {lassign {1 2} p q} \
    {s_lmap} {surface} {lmap i {1 2} {set i}} \
    {s_try} {surface} {try {set x 1}} \
    {s_throw} {surface} {throw {A B} msg} \
    {s_apply} {surface} {apply {{} {return 1}}} \
    {s_package} {surface} {package names} \
    {s_interp} {surface} {interp aliases} \
    {s_namespace} {surface} {namespace current} \
    {s_exec} {surface} {exec /bin/true} \
    {s_after} {surface} {after 1} \
]
set ::acc {}
foreach {cid cat src} $::probe_cases {
    set ::m unset
    set rc [catch {uplevel #0 $src} v]
    regsub -all {[\n\r|]} $v " " v
    if {[string length $v] > 60} { set v "[string range $v 0 59]..." }
    lappend ::acc "$cid rc=$rc v=($v)"
}
set tpl UNSET
if {[info exists tcl_patchLevel]} { set tpl $tcl_patchLevel }
# Built dynamically: the iRule compiler rejects a literal reference to an
# undefined command at rule load, even inside catch (see ctx_unknown_cmd.conf).
set tvcmd tmsh::version
if {[catch {eval $tvcmd} tv]} { set tv n/a }
lappend ::acc "REPORTED patchlevel=[info patchlevel] tclversion=[info tclversion] tcl_patchLevel=$tpl tmshversion=$tv"
lappend ::acc "REPORTED ncommands=[llength [info commands]]"
set plat {}
foreach k [lsort [array names tcl_platform]] { lappend plat "$k=$tcl_platform($k)" }
lappend ::acc "REPORTED tcl_platform([llength [array names tcl_platform]]) [join $plat ,]"
set i 0
foreach chunkstart [list 0 8 16 24 32 40] {
    set part [lrange $::acc $chunkstart [expr {$chunkstart + 7}]]
    if {[llength $part]} { log local0. "TCLLSPPROBE|TmmIRule|$i| [join $part " ;; "]" ; incr i }
}
}
}
