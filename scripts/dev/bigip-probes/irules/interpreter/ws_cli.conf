cli script probe_ws_cli {
proc script::run {} {
  set v XX
  puts "CLI brace_bare   n=[llength [list {a}b]]   v=<[list {a}b]>"
  puts "CLI brace_brace  n=[llength [list {a}{b}]] v=<[list {a}{b}]>"
  puts "CLI quote_bare   n=[llength [list "a"b]]   v=<[list "a"b]>"
  puts "CLI three        n=[llength [list {a}"b"c]] v=<[list {a}"b"c]>"
}
}
