ltm rule probe_ev {
when RULE_INIT {
set cases [list c_stray_close "list \{a\}\}" c_quote_stray "list \"a\"\}" c_brack "list \{a\}\]" c_openbrace "list \{a\}\{" c_baseline "list \{a\}\{b\}"]
foreach {id s} $cases {
  if {[catch {eval $s} r]} {
    log local0. "EVRES $id ERR <$r>"
  } else {
    log local0. "EVRES $id OK n=[llength $r] v=<$r>"
  }
}
}
}
