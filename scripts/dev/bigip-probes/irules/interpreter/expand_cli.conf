cli script probe_expand_cli {
proc script::run {} {
  set l {a b c}
  puts "EXPAND|llength=[llength [list {*}$l]]|elems=[list {*}$l]"
  puts "EXPAND|concat=[llength [list x {*}$l y]]"
  set v [catch {info vartype} e]; puts "INFOVARTYPE|$v|$e"
  puts "INFOCMDS|[llength [info commands]]"
  puts "PLATFORM|[array get tcl_platform]|[array size tcl_platform]"
}
}
