# Settles #2151 for the tmsh context; the same rows as
# character_model_irule.conf. Run with `tmsh run cli script
# __tcl_lsp_probe_character_model_cli` and capture stdout verbatim.
cli script __tcl_lsp_probe_character_model_cli {
proc script::run {} {
    set acc {}
    foreach {row bytes} [list A "\xF0\x9F\x98\x80" B "\xC3\xA9" C "\xE2\x82\xAC"] {
        if {[catch {
            set s [encoding convertfrom utf-8 $bytes]
            list [string length $s] [scan [string index $s 0] %c]
        } r]} {
            lappend acc "$row ERROR: $r"
        } else {
            lappend acc "$row = $r"
        }
    }
    puts "TCLLSPPROBE|character-model|TmshCliScript| [join $acc " ;; "] ;; patchlevel=[info patchlevel]"
}
}
