# Settles #2151 for the iRule context: which character model does TMM's Tcl
# count a supplementary-plane character with?
#
#   4 240     -> BmpCharsElseUtf8Bytes (real Tcl 8.4 / 8.5)
#   2 55357   -> Utf16CodeUnits        (real Tcl 8.6)
#   1 128512  -> one code point        (real Tcl 9.x)
#
# Rows B and C are controls: a 2-byte and a 3-byte sequence count 1 in every
# measured release. The test string has no neighbour: on 8.4 `\x` consumes
# every following hex digit, so "\xF0\x9F\x98\x80B" would end in \x80B.
# Load with `tmsh load sys config merge file`, then capture the /var/log/ltm
# lines verbatim, errors included.
ltm rule __tcl_lsp_probe_character_model {
when RULE_INIT {
    set acc {}
    foreach {row bytes} [list A "\xF0\x9F\x98\x80" B "\xC3\xA9" C "\xE2\x82\xAC"] {
        if {[catch {
            set s [encoding convertfrom utf-8 $bytes]
            list [string length $s] [scan [string index $s 0] %c]
        } r]} {
            lappend acc "$row ERROR: $r"
        } else {
            lappend acc "$row = $r"
        }
    }
    log local0. "TCLLSPPROBE|character-model|TmmIRule| [join $acc " ;; "] ;; patchlevel=[info patchlevel] ;; version=[TMM::version]"
}
}
