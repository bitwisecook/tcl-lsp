# Full proxy path. Pool member must be an off-box host: a self IP is refused
# (01070080) and loopback is refused (01020061). source-address-translation
# automap is required or the return path is asymmetric and the connection hangs.
ltm pool lab_pool {
  members {
    192.168.9.80:8000 { }
  }
}
ltm rule lab_evt2 {
when HTTP_REQUEST {
  log local0. "LAB2 HTTP_REQUEST uri=[HTTP::uri]"
}
when LB_SELECTED {
  log local0. "LAB2 LB_SELECTED server=[LB::server addr]:[LB::server port]"
}
when SERVER_CONNECTED {
  log local0. "LAB2 SERVER_CONNECTED [IP::server_addr]"
}
when HTTP_RESPONSE {
  log local0. "LAB2 HTTP_RESPONSE status=[HTTP::status]"
}
when SERVER_CLOSED {
  log local0. "LAB2 SERVER_CLOSED"
}
}
ltm virtual lab_vs2 {
  destination 192.168.9.241:80
  ip-protocol tcp
  mask 255.255.255.255
  pool lab_pool
  profiles { tcp { } http { } }
  source 0.0.0.0/0
  source-address-translation { type automap }
  translate-address enabled
  translate-port enabled
  rules { lab_evt2 }
}
