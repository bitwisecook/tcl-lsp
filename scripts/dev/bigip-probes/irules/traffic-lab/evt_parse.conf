ltm rule lab_parse {
when HTTP_REQUEST {
  set r2a [list {a}{b}]
  set r2b [list {a}b]
  set r2c [list {*}{a b c}]
  set n1 [list a b
  {c}]
  set brk "no"
  if {1}{set brk "yes"}
  set cnt 0
  while {$cnt < 3}
  {
    incr cnt
  }
  set kr "NOTRUN"
  if {0} {
    set kr "then"
  }
  else {
    set kr "else"
  }
  HTTP::respond 200 content "r2a=<$r2a> r2b=<$r2b> expand=<$r2c> n1=<$n1> nospace=<$brk> whilenl=<$cnt> krelse=<$kr>\n" Content-Type "text/plain"
}
}
