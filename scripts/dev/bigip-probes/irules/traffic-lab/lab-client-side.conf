# Virtual server that is its own backend: iRule answers with HTTP::respond.
# Exercises CLIENT_ACCEPTED / HTTP_REQUEST / CLIENT_CLOSED with no pool.
ltm rule lab_evt {
when CLIENT_ACCEPTED {
  log local0. "LAB CLIENT_ACCEPTED from [IP::client_addr]:[TCP::client_port]"
}
when HTTP_REQUEST {
  log local0. "LAB HTTP_REQUEST uri=[HTTP::uri] method=[HTTP::method]"
  HTTP::respond 200 content "hello from irule\n" Content-Type "text/plain"
}
when CLIENT_CLOSED {
  log local0. "LAB CLIENT_CLOSED"
}
}
ltm virtual lab_vs {
  destination 192.168.9.240:80
  ip-protocol tcp
  mask 255.255.255.255
  profiles { tcp { } http { } }
  source 0.0.0.0/0
  translate-address enabled
  translate-port enabled
  rules { lab_evt }
}
