[project]
name = "tcl-lsp"
version = "1.10.1"
description = "A Tcl Language Server Protocol implementation"
requires-python = ">=3.10"
dependencies = [
    "pygls>=2.0",
    "lsprotocol>=2024.0.0",
    "jinja2>=3.1",
    "argcomplete>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.11",
    "ty>=0.0.24,<0.0.25",
    "wasmtime>=20.0",
    "flask>=3.0",
    # Used by the test-slow TLS / x509 suites that spin up an HTTPS
    # server with a generated self-signed cert and exercise
    # ``url_get`` / ``tls_handshake`` / ``cert_load`` against it.
    # Also unlocks PKCS#12 parsing in ``cert_load``.
    "cryptography>=42.0",
]
# Sphinx + autodoc + furo theme — for building the f5q Python API
# reference (``docs/sphinx/``).  Read the Docs uses this extras
# group via ``.readthedocs.yaml``; locally, build with
# ``uv run --extra docs sphinx-build -b html docs/sphinx docs/sphinx/_build/html``.
docs = [
    "sphinx>=7.0",
    "myst-parser>=2.0",
    "sphinx-autodoc-typehints>=1.25",
    "furo>=2024.1.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lsp", "core", "explorer", "vm", "tclpkg", "f5q"]
exclude = ["explorer/static", "core/bigip/data/scf_port_names.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["editors"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"lsp/features/__init__.py" = ["I001"]  # re-export split across two blocks from same module

[tool.coverage.run]
source = ["lsp", "core", "explorer"]
omit = [
    "lsp/_build_info.py",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "tmp/coverage/python"

[tool.coverage.xml]
output = "tmp/coverage/python/coverage.xml"

[dependency-groups]
dev = [
    "ty>=0.0.24,<0.0.25",
]
